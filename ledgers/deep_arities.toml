# Per-generator tuning for tests/proofs/deep: arity ceilings against each
# module's MAX_ARITY default, and exemptions.  Optional: a generator left out
# gets the default.  Keys are language ids.

[linearity]
# Builds measured in seconds, each set to the lowest arity that still clears
# MIN_RUNGS past its last route change.
# Default H routing starts at eight: three rungs per parity need thirteen (6.8s).
circuit_diagram = 13
# Normalized gates start at nine; both three-rung parity windows need fourteen.
boolfuck = 14
polynomial = 9
streetcode = 10
# Line uses the default twelve: the six-input cap mixed small-tree and tree layouts.

[execution]
# Loading, not command count, sets the measured ceilings below.
addsubjump = 10  # n=6 jumps 39 -> 965 commands; keep MIN_RUNGS above it.
b_tapemark = 7
circuit_diagram = 7  # Loading through n=12 costs 27s.
container = 6
line = 6  # Loading through n=12 costs 99s.
flowchart = 8
polynomial = 7

[workspace]
# language-owners: ["BFStack", "FALSE"]
# Written state is recounted every step, so a rung costs ~4x the last.
# Lowered where a generator's top rung passed ~3s; FALSE and BFStack keep 9,
# since their poly n fit (x1.49, x1.48) is steeper lower down.
addsubjump = 6
b_tapemark = 7
bfstack = 9
circlefuck = 6
# Below its n=8 route change, which leaves no five rungs in budget past it;
# the 9T + 3n - 12 bound holds at n=8 on all ten formula tables.
circuit_diagram = 7
dimensional = 7
false = 9
laserfuck = 9
flowchart = 7
line = 7
polynomial = 8
rotfuck = 6
streetcode = 7
taglate = 7
unlambda = 6

[workspace_step_exempt]
# language-owners: ["SLOW ACV MAMMALIAN", "Vandevelo"]
# poly n rows whose dense increments may grow past STEP_GROWTH at the
# measured arities.  Vandevelo's registers grow ~sqrt(T) until the n*n cap
# binds at n=14: written bits 2450, 3361, 3872, 4419, 4998 at n=13..17,
# increments 911, 511, 547, 579 -- polynomial -- but n=16 alone costs 34s.
# SLOW ACV MAMMALIAN's increments track per-level residues, not T: a command
# adds at most one cell, so its arrays hold 23 + S bytes for S poly n
# commands (dense x1.155); written bits 3077 at n=12, 3216 at 13.
vandevelo = "registers grow ~sqrt(T) until the n*n cap binds at n=14"
slow_acv_mammalian = "increments track per-level residues, not T"
