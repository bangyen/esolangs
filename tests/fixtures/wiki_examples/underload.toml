[[examples]]
id = "binary-counting-tm"
source = '''
(( )S)(^!!)(((~:^~(~)S(^!!)~(^)~:^^)(!~(:^!^)~^^^)(!!~(:^!!^)~^^!^))(
)!(!(~:^~(^!!)~:^^)(!~(:^!^)~^^!^)(!!~(:^!^)~^^^))(!!(~(:^!!^)~^^!!^)(
)!(!(:)S(^!)~:^^)(!!(~)S(^)~:^^))):^^!^!!^'''
