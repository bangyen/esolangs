stop = "steps"
max_steps = 2000
note = "binary with ':' for 0 and '~' for 1"

[[examples]]
id = "reverse-binary-minsky"
source = '''
(((((0)S!:^^^!^)(!:^!^))(!((1)S!:^^^!^)(!::^!!^))(!!(!:^^^^)))(
)!(((0)S)())(!((1)S)(!:^!!^))(!!(!:^!^))):^^(^^^^^^^^^^^^^^^^^^^^^^^^^^^)^!^'''
expected = "11011"
note = "27 carets; 27 = 11011 in binary, which reads the same reversed"

