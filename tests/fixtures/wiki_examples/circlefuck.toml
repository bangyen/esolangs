language = "Circlefuck"
oldid = 156668

[[examples]]
id = "hello-no-comma"
source = "Hello\\ World!\\n\\0[.>]@"
expected = '''
Hello World!
'''

[[examples]]
id = "hello-data-left"
source = "<[.<]@\\0\\n!dlroW\\ ,olleH"
expected = '''
Hello, World!
'''

[[examples]]
id = "hello-self-modifying"
source = "Hello*\\ World!\\n\\0>>>>>++<<<<<[.>]@"
expected = '''
Hello, World!
'''

[[examples]]
id = "quine-short"
source = "{>[.>]@"
expected = "{>[.>]@"

[[examples]]
id = "cat"
source = "{,[.[-],]@"
stdin = "cat"
expected = "cat"

[[examples]]
id = "quine-marker-broken"
source = """\
    ThisIsAQuine---------------------------------[+++++++++++++++++++++++++++++++++.>---------------------------------]+++++++++++++++++++++++++++++++++.@!"""
expected = "ThisIsAQuine---------------------------------"
stop = "steps"
max_steps = 20000
note = """\
    wiki bug (the page says untested): the loop's 33 '-' also hit its own '[', so the \
    closing ']' has no partner and the run suspends after printing the '-' run"""

[[examples]]
id = "narcissist-broken"
source = "[{,>[-<->]<[]}>]{-,+[]}@\\0"
stdin = "[{,>[-<->]<[]}>]{-,+[]}@"
expected = ""
stop = "steps"
max_steps = 20000
note = """\
    wiki bug (the page says untested): the comparison zeroes the program's own first \
    '[', so the outer ']' has no partner and its own source never halts"""
