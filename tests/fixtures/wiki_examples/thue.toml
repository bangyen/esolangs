[[examples]]
id = "kolakoski"
note = "Blank lines between rules."
source = '''
[1>]1::=1[1>]
[1>]2::=2[1>]
[1>]*1::=[<1]1*[a1>]
[1>]*2::=[<1]2*[a1>][a1>]

(1)::=~1
(2)::=~2

1[<1]::=[<1]1
2[<1]::=[<1]2
>[<1]1::=1>[2>](1)
>[<1]2::=2>[2>](2)

[a1>]1::=1[a1>]
[a1>]2::=2[a1>]
[a1>]|::=1|

[2>]1::=1[2>]
[2>]2::=2[2>]
[2>]*1::=[<2]1*[a2>]
[2>]*2::=[<2]2*[a2>][a2>]

1[<2]::=[<2]1
2[<2]::=[<2]2
>[<2]1::=1>[1>](1)
>[<2]2::=2>[1>](2)

[a2>]1::=1[a2>]
[a2>]2::=2[a2>]
[a2>]|::=2|

::=

|>[1>]12*2|

'''
stop = "steps"
max_steps = 3000
expected = "122112122122112112212112122112112122122112122"
