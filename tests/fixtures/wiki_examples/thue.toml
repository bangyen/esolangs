language = "Thue"
oldid = 197217

[[examples]]
id = "hello"
source = '''
a::=~Hello World!
::=
a'''
expected = "Hello World!"

[[examples]]
id = "increment"
note = "Blank lines between rules; the result is the state, which is not output."
source = '''
1_::=1++
0_::=1

01++::=10
11++::=1++0

_0::=_
_1++::=10

::=

_1111111111_'''
expected = ""

[[examples]]
id = "truth-machine-0"
source = '''
*::=:::
1::=1_
_::=~1
0::=~0
::=
*'''
stdin = '''
0
'''
expected = "0"

[[examples]]
id = "truth-machine-1"
source = '''
*::=:::
1::=1_
_::=~1
0::=~0
::=
*'''
stdin = '''
1
'''
stop = "steps"
max_steps = 50
expected = "1111111111"

[[examples]]
id = "multiply"
note = "The product is the state, which is not output."
source = '''
