language = "brainfuck"
oldid = 196617

[[examples]]
id = "nested-hello"
source = """\
    ++++++++[>++++[>++>+++>+++>+<<<<-]>+>+>->>+[<]<-]>>.>---.+++++++..+++.>>.<-.<.+++.------.--------.>>+.>++."""
expected = '''
Hello World!
'''

[[examples]]
id = "below-zero-hello"
source = '''
>++++++++[-<+++++++++>]<.>>+>-[+]++>++>+++[>[->+++<<+++>]<<]>-----.>->
+++..+++.>-.<<+[>[+>+]>>]<--------------.>>.+++.------.--------.>+.>+.'''
expected = '''
Hello World!
'''

[[examples]]
id = "primo-hello"
source = """\
    --<-<<+[+[<+>--->->->-<<<]>]<<--.<++++++.<<-..<<.<+.>>.>>.<<<.+++.>>.>>-.<<<+."""
expected = "Hello, World!"
vm = false
note = """\
    stepping parity skipped: the VM path is ~10x the run; uses four cells left of the \
    start, which the tape grows"""

[[examples]]
id = "ksab-hello"
source = "+[-->-[>>+>-----<<]<--<---]>-.>>>+.>>..+++[.>]<<<<.+++.------.<<-.>>>>+."
expected = "Hello, World!"
note = "uses five cells left of the start, which the tape grows"

[[examples]]
id = "cat-eof-0"
source = ",[.,]"
stdin = '''
ab
'''
expected = '''
ab
'''
stop = "eof"

[[examples]]
id = "cat-never-terminates"
source = "+[>,.<]"
stdin = '''
ab
'''
expected = '''
ab
'''
stop = "eof"

[[examples]]
id = "cell-size"
source = '''
Calculate the value 256 and test if it's zero
If the interpreter errors on overflow this is where it'll happen
++++++++[>++++++++<-]>[<++++>-]
+<[>-<
    Not zero so multiply by 256 again to get 65536
    [>++++<-]>[<++++++++>-]<[>++++++++<-]
    +>[>
        # Print "32"
        ++++++++++[>+++++<-]>+.-.[-]<
    <[-]<->] <[>>
        # Print "16"
        +++++++[>+++++++<-]>.+++++.[-]<
<<-]] >[>
    # Print "8"
    ++++++++[>+++++++<-]>.[-]<
<-]<
# Print " bit cells\n"
+++++++++++[>+++>+++++++++>+++++++++>+<<<<-]>-.>-.+++++++.+++++++++++.<.
>>.++.+++++++..<-.>>-.
Clean up used cells
[[-]<]'''
expected = '''
8 bit cells
'''

