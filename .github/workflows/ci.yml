name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# A newer commit supersedes the previous run for the same branch or PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# `.python-version` pins 3.14, but the jobs below deliberately sync other
# interpreters -- the lint job holds the 3.12 floor `requires-python`
# promises, and the test matrix spans 3.12/3.13/3.14/3.15.  A bare `uv run`
# re-reads that pin, sees the synced `.venv` does not match it, and *deletes
# and recreates* the environment on the pinned interpreter instead of the
# one the job set up.  `UV_NO_SYNC` makes the explicit `uv sync` above each
# run the single authority over the environment.
env:
  UV_NO_SYNC: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v7

    - name: Install uv
      uses: astral-sh/setup-uv@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"

    # `--python` explicitly, though this job also sets up 3.12 above: the
    # repo now commits a `.python-version` pin, and a bare `uv sync` prefers
    # it -- which would quietly move this job to whatever dev is on.  The
    # lint job holds the floor `requires-python` promises, so it says so.
    - name: Install dependencies
      run: uv sync --group dev --python 3.12

    - name: Run pre-commit
      run: uv run pre-commit run --all-files

    # The only mypy run: pre-commit has no mypy hook, because the mirror's
    # isolated env lacks the scripts' imports and could only ever cover
    # src/.  This covers src/ and scripts/ both, from the project env.
    - name: Type-check src/ and scripts/
      run: uv run mypy

    # A generator route that was replaced keeps its own tests green; three
    # sat unread for months.  Reports any tools/ name, or any private name
    # elsewhere in src/, that nothing in src/ or scripts/ reads.  <2s.
    - name: Check for definitions nothing reads
      run: uv run python scripts/check_dead_definitions.py

    # Emitted size and step count for every language on 2-, 3- and 4-input
    # tables, compared exactly against the committed baseline.  They are the
    # numbers the collection's claims are made of, and before this nothing
    # measured them outside a hand-run `just benchmark`.  Generation *time*
    # is not gated here -- see weekly.yml's `timings` job for why.  ~5s.
    - name: Check generator sizes against the baseline
      run: uv run python scripts/check_generator_sizes.py

    # Same scope as the local gate in scripts/verify.py: tests/ is left
    # out because shared test scaffolding is not what this check is for,
    # and including it roughly quadrupled the file pairs the O(files^2)
    # comparison walks (141s of this job's 218s in run 37334678602).
    - name: Check for duplicated code blocks
      run: >
        uv run --with pylint python scripts/check_duplicate_code.py --disable=all
        --enable=duplicate-code --min-similarity-lines=10
        --ignore-imports=yes src/esolangs scripts

    # Every deep proof in the `ci` band and cheaper: the ArrowQueue and BIO
    # lemmas, and the registry-wide battery. ~14s. Which proofs those are is
    # not spelled out here -- each declares its own band, and
    # tests/proofs/test_bands.py holds the bands to their cost budgets, so
    # this step cannot quietly shrink.
    - name: Check the deep proofs that gate
      run: uv run python -m tests.proofs.deep ci

    # --all, not the touched-language default the local gate uses: this is
    # the run that holds exceptions.py's contract across all 60.  68s cold;
    # the cache below carries the last clean sweep's fingerprints forward so
    # a run pays only for the interpreters, examples or machinery that
    # changed since.  The key is per commit and the restore prefix takes the
    # newest, so every run saves and the next run inherits.
    - name: Restore the leak sweep's clean fingerprints
      uses: actions/cache@v6
      with:
        path: .leaksweep-cache.json
        key: leaksweep-${{ github.sha }}
        restore-keys: leaksweep-

    - name: Check that no interpreter leaks a raw exception
      run: uv run python scripts/verify_no_exception_leaks.py --all

  test:
    # The fast band on the non-coverage interpreters, sharded in two.
    # Measured in run 37334678602, the plain legs set the wall clock
    # (3.12: 496s of pytest, 3.13: 353s) while the 3.14 coverage leg
    # below took 297s. Coverage now shards too, combining its branch data
    # before the changed-line gate. The `slow`
    # job's sharder partitions the band; with no recorded durations
    # for this band it balances by test count, which the band limits
    # keep honest (fast <= 1s, medium <= 5s on a local machine).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.15"]
        shard: [0, 1]

    steps:
    - uses: actions/checkout@v7

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        version: "0.13.0"

    - name: Set up Python ${{ matrix.python-version }}
      if: matrix.python-version != '3.15'
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
    # GitHub's runtime catalog lacks 3.15.0; uv 0.13.0 provides the final release.
    - name: Set up Python 3.15 with uv
      if: matrix.python-version == '3.15'
      run: uv python install 3.15.0

    - name: Install dependencies
      run: uv sync --group dev --python ${{ matrix.python-version }}

    - name: Test with pytest (shard ${{ matrix.shard }} of 2)
      run: uv run python scripts/pytest_shard.py --marker "not slow and not weekly" --shard ${{ matrix.shard }} --shards 2 -- -n auto

  # Branch monitoring needs 3.14: local line/branch coverage measured
  # 36.1/119.3s on 3.13 versus 17.81/17.89s on 3.14 (coverage 7.13.4).
  coverage-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    env:
      COVERAGE_FILE: .coverage.shard-${{ matrix.shard }}
    steps:
    - uses: actions/checkout@v7
    - uses: astral-sh/setup-uv@v7
    - uses: actions/setup-python@v7
      with:
        python-version: "3.14"
    - name: Install dependencies
      run: uv sync --group dev --python 3.14
    # Run 37966422522 spent 226s in coverage pytest. Partition the same band;
    # retain branch data from both shards before applying either coverage gate.
    - name: Test one coverage shard
      run: >
        uv run python scripts/pytest_shard.py --marker "not slow and not weekly"
        --shard ${{ matrix.shard }} --shards 2 --
        -n auto --cov --cov-branch --cov-report=
    - uses: actions/upload-artifact@v7
      with:
        name: coverage-${{ matrix.shard }}
        path: .coverage.shard-${{ matrix.shard }}
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 1

  coverage:
    needs: coverage-tests
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: Require every coverage shard to pass
      env:
        SHARD_RESULT: ${{ needs.coverage-tests.result }}
      run: test "$SHARD_RESULT" = success
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - uses: astral-sh/setup-uv@v7
    - uses: actions/setup-python@v7
      with:
        python-version: "3.14"
    - name: Install dependencies
      run: uv sync --group dev --python 3.14
    - uses: actions/download-artifact@v8
      with:
        pattern: coverage-*
        merge-multiple: true
    # Keep the 97% whole-tree drift floor; slow-only paths have slack here.
    # The separate diff gate still requires added lines and branches to pass.
    - name: Combine complete branch coverage and retain the drift floor
      run: |
        test -f .coverage.shard-0
        test -f .coverage.shard-1
        uv run coverage combine .coverage.shard-0 .coverage.shard-1
        uv run coverage report --fail-under=97
        uv run coverage xml
    - name: Check changed-line and changed-branch coverage
      run: uv run python scripts/check_diff_coverage.py --partial --strict


  slow:
    # The `slow` band, sharded round-robin across four jobs so per-PR CI
    # keeps the signal without the wall time: one file holds nearly half
    # the band, so contiguous slices would leave one shard carrying it
    # whole.  `-m "slow and not weekly"`, mirroring verify.py's --full
    # run: the two high-arity probes stay on the weekly sampling interval,
    # and weekly.yml (bare `pytest`) remains their only runner.
    #
    # 3.14 only: the fast suite already covers every promised interpreter
    # on every push; weekly.yml runs the whole suite on each.
    # Recorded durations balance the shards; new tests use the median known
    # duration. Refresh from weekly timing artifacts; the timeout covers CI's
    # slower cores.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # One shard's failure should not cancel the evidence from the others.
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]

    steps:
    - uses: actions/checkout@v7

    - name: Install uv
      uses: astral-sh/setup-uv@v7

    - name: Set up Python 3.14
      uses: actions/setup-python@v7
      with:
        python-version: "3.14"

    # Explicit, like every other sync here: with `.python-version`
    # committed, a bare `uv sync` would follow the pin.
    - name: Install dependencies
      run: uv sync --group dev --python 3.14

    # The certificate's fixed 40-second construction cap aborted alongside
    # xdist workers. Give it the runner alone; retain the same cap.
    # Run 37972025375: shard 0 took 181s including this 54s step; shard 2
    # took 78s. Put the serial step on the lighter shard.
    - name: Check the preserving certificate without competing workers
      if: matrix.shard == 2
      run: uv run python -m pytest tests/proofs/test_brainfuck_preserving.py::test_preserving_certificate -n 0 -p scripts.pytest_durations --duration-output certificate-durations.json

    - name: Test one slow shard
      run: uv run python scripts/pytest_shard.py --marker "slow and not weekly" --durations tests/fixtures/slow_durations.json --shard ${{ matrix.shard }} --shards 4 -- -n auto -k "not test_preserving_certificate" -p scripts.pytest_durations --duration-output test-durations.json

    - name: Retain measured slow-test durations
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: slow-test-durations-${{ matrix.shard }}
        path: |
          test-durations*.json
          certificate-durations*.json
        if-no-files-found: error
        retention-days: 7


  generated-docs:
    # The generated docs are committed, so CI re-runs their generator and
    # fails on a diff: a doc that drifts from the registry is the failure
    # this catches.  It reads only the registry, so it neither needs the
    # suite to have passed nor waits for it -- the `needs: test` this
    # carried was for the coverage artifact the removed badge consumed.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v7

    - name: Install uv
      uses: astral-sh/setup-uv@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"

    # Explicit, like every other sync here: with `.python-version` committed,
    # a bare `uv sync` would follow the pin rather than the 3.12 set up above.
    - name: Install dependencies
      run: uv sync --group dev --python 3.12

    - name: Check generated documentation
      run: uv run python scripts/check_generated_docs.py

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v7

    - name: Install uv
      uses: astral-sh/setup-uv@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: uv sync --group dev --python 3.12

    - name: Run bandit security check
      run: uv run --with bandit bandit -r src -f json -o bandit-report.json

    - name: Audit dependencies with pip-audit
      run: uv run --with pip-audit pip-audit --local

  distribution:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # The floor `requires-python` promises and the newest classifier.
        python-version: ["3.12", "3.15"]
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@v7
    - uses: astral-sh/setup-uv@v7
      with:
        version: "0.13.0"
    - uses: actions/setup-python@v7
      if: matrix.python-version != '3.15'
      with:
        python-version: ${{ matrix.python-version }}
    # GitHub's runtime catalog lacks 3.15.0; uv 0.13.0 provides the final release.
    - name: Set up Python 3.15 with uv
      if: matrix.python-version == '3.15'
      run: uv python install 3.15.0
    - name: Build and install the wheel without extras
      run: |
        uv build --python ${{ matrix.python-version }}
        uv venv --python ${{ matrix.python-version }} .artifact-venv
        if [ "$RUNNER_OS" = "Windows" ]; then
          artifact_python="$PWD/.artifact-venv/Scripts/python.exe"
        else
          artifact_python="$PWD/.artifact-venv/bin/python"
        fi
        echo "ARTIFACT_PYTHON=$artifact_python" >> "$GITHUB_ENV"
        uv pip install --python "$artifact_python" dist/*.whl
        "$artifact_python" -I scripts/smoke_distribution.py
    - name: Install optional extras and exercise Polynomial and PNG I/O
      run: |
        wheels=(dist/*.whl)
        uv pip install --python "$ARTIFACT_PYTHON" "${wheels[0]}[math]"
        "$ARTIFACT_PYTHON" -I scripts/smoke_distribution.py --math
        uv pip install --python "$ARTIFACT_PYTHON" "${wheels[0]}[image]"
        "$ARTIFACT_PYTHON" -I scripts/smoke_distribution.py --math --image

  execution-platform:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        python-version: ["3.12", "3.15"]
    env:
      PYTHONUTF8: "1"
    steps:
    - uses: actions/checkout@v7
    - uses: astral-sh/setup-uv@v7
      with:
        version: "0.13.0"
    - uses: actions/setup-python@v7
      if: matrix.python-version != '3.15'
      with:
        python-version: ${{ matrix.python-version }}
    # GitHub's runtime catalog lacks 3.15.0; uv 0.13.0 provides the final release.
    - name: Set up Python 3.15 with uv
      if: matrix.python-version == '3.15'
      run: uv python install 3.15.0
    - name: Install test dependencies
      run: uv sync --group dev --python ${{ matrix.python-version }}
    - name: Exercise paths, deadlines, output limits and worker cleanup
      run: >
        uv run pytest -q -o addopts=""
        tests/test_run_bounded.py tests/test_memory_budget.py
        tests/test_run_isolated.py::test_output_limit_stops_an_infinite_writer_and_reaps
        tests/test_run_isolated.py::test_capped_timeout_retains_output_and_reaps
        tests/test_run_isolated.py::test_input_error_retains_counts_and_output
