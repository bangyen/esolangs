name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v5

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: uv sync --extra dev

    - name: Run pre-commit
      run: uv run pre-commit run --all-files

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v5

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: uv sync --extra dev --python ${{ matrix.python-version }}

    - name: Lint with ruff
      run: uv run ruff check .

    - name: Format check with black
      run: uv run black --check .

    - name: Type check with mypy
      run: uv run mypy src

    - name: Test with pytest
      run: uv run pytest --cov --cov-report=xml --cov-report=term-missing

    - name: Upload coverage to Codecov
      if: matrix.python-version == '3.12'
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  coverage-badge:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v5

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: uv sync --extra dev

    - name: Regenerate the coverage badge
      run: |
        uv run pytest --cov --cov-report=xml -q
        uv run python scripts/make_coverage_badge.py
        if ! git diff --exit-code coverage-badge.svg; then
          echo "coverage-badge.svg is out of date. Run:"
          echo "  uv run pytest --cov --cov-report=xml"
          echo "  uv run python scripts/make_coverage_badge.py"
          exit 1
        fi

    - name: Regenerate the language capabilities doc
      run: |
        uv run python scripts/make_languages_doc.py
        if ! git diff --exit-code docs/languages.md; then
          echo "docs/languages.md is out of date. Run:"
          echo "  uv run python scripts/make_languages_doc.py"
          exit 1
        fi

  security:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v5

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: uv sync --extra dev

    - name: Run bandit security check
      run: uv run --with bandit bandit -r src -f json -o bandit-report.json

    - name: Audit dependencies with pip-audit
      run: uv run --with pip-audit pip-audit --local

  rust:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Build extra/ Rust implementations
      run: |
        cargo build --manifest-path extra/rust/Cargo.toml
        cargo fmt --manifest-path extra/rust/Cargo.toml --check

    - name: Run extra/ Rust unit tests
      run: |
        cargo test --manifest-path extra/rust/Cargo.toml

    - name: Smoke test extra/ Rust implementations
      run: |
        set -e
        : > /tmp/empty.txt
        ./extra/rust/target/debug/laserfuck /tmp/empty.txt
        ./extra/rust/target/debug/unsquare /tmp/empty.txt
        ./extra/rust/target/debug/kak /tmp/empty.txt
        printf 't3' > /tmp/trash.txt
        [ "$(./extra/rust/target/debug/trash /tmp/trash.txt)" = "5" ]
        printf '0H' > /tmp/74.txt
        [ "$(./extra/rust/target/debug/seventy_four /tmp/74.txt)" = "H0" ]
        printf 'l' > /tmp/pct.txt
        [ "$(./extra/rust/target/debug/pct /tmp/pct.txt)" = "0" ]
        printf '~(' > /tmp/bit_tilde.txt
        ./extra/rust/target/debug/bit_tilde /tmp/bit_tilde.txt >/dev/null
        printf 'F4*5+.' > /tmp/forth.txt
        [ "$(./extra/rust/target/debug/forth /tmp/forth.txt)" = "A" ]
        printf '#basicfuck t=1 r=0~255 o=nearest\n#allocate a\na += 65;\nwrite <- a ;' \
          > /tmp/basicfuck.txt
        [ "$(./extra/rust/target/debug/basicfuck /tmp/basicfuck.txt)" = "A" ]
        printf '/io@' > /tmp/2dfish.txt
        [ "$(./extra/rust/target/debug/two_d_fish /tmp/2dfish.txt)" = "1" ]
        printf 'pyr' > /tmp/painfuck.txt
        ./extra/rust/target/debug/painfuck /tmp/painfuck.txt >/dev/null
        printf '3!' > /tmp/three_x.txt
        [ "$(./extra/rust/target/debug/three_x /tmp/three_x.txt)" = "3" ]
        echo "All extra/ Rust smoke tests passed"

    - name: Verify generator-only languages against the Rust references
      run: |
        PYTHONPATH=src python3 scripts/verify_extra_generators.py

    - name: Differential-test the interpreters against the native cross-checks
      run: |
        PYTHONPATH=src python3 scripts/verify_differential.py --fuzz 50 --seed 1

  assembly:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Build and run the RISC-V reference interpreters
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-riscv64-linux-gnu qemu-user
        for s in extra/assembly/*-riscv.s; do
          base=$(basename "$s" .s)
          riscv64-linux-gnu-gcc -nostdlib -static -march=rv64i -mabi=lp64 \
            -o "/tmp/$base" "$s"
          echo "Built $s"
        done
        # the 123 port must round-trip a generated program through the real
        # qemu-riscv64 (user mode) to verify the interpreter end to end
        PYTHONPATH=src python3 -c \
          "from esolangs.tools.generate import _123; open('/tmp/123.prog','w').write(_123('Hi'))"
        qemu-riscv64 /tmp/123-riscv < /tmp/123.prog > /tmp/123.out
        [ "$(cat /tmp/123.out)" = "Hi" ] || { echo "got: $(cat /tmp/123.out)"; exit 1; }
        echo "RISC-V 123 round-tripped Hi"
        # the other reference interpreters must execute and halt
        qemu-riscv64 /tmp/brainpocalypse-riscv </dev/null >/dev/null
        qemu-riscv64 /tmp/nocomment-riscv </dev/null >/dev/null
        qemu-riscv64 /tmp/stun-step-riscv </dev/null >/dev/null
        printf '\xff' | qemu-riscv64 /tmp/2b1b-riscv >/dev/null
        echo "All extra/ RISC-V interpreters ran natively"

    - name: Run the RISC-V reference interpreters under unicorn
      run: |
        python3 -m pip install -q unicorn
        # the RISC-V port and the Python simulator must both agree with the
        # in-package interpreter on the generated programs
        PYTHONPATH=src python3 scripts/verify_123_differential.py \
          /tmp/123-riscv "Hi" "Hello, World!" "esolangs!"
        # the differential (Python vs the RISC-V references, corpus + fuzz)
        # needs unicorn and the RISC-V compiler, which the rust job lacks;
        # LaserFuck's runs there instead
        PYTHONPATH=src python3 scripts/verify_differential.py --fuzz 50 --seed 1
        # the other reference interpreters must execute and halt
        python3 scripts/riscv_elf_runner.py /tmp/brainpocalypse-riscv \
          </dev/null >/dev/null
        python3 scripts/riscv_elf_runner.py /tmp/nocomment-riscv \
          </dev/null >/dev/null
        python3 scripts/riscv_elf_runner.py /tmp/stun-step-riscv \
          </dev/null >/dev/null
        printf '\xff' | python3 scripts/riscv_elf_runner.py /tmp/2b1b-riscv >/dev/null
        echo "All extra/ RISC-V interpreters ran under unicorn"

    - name: Run the RISC-V compilers and reference interpreters under unicorn
      run: |
        PYTHONPATH=src python3 scripts/verify_riscv_unicorn.py
        echo "All RISC-V compilers and references round-tripped under unicorn"

  lean:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install elan
      run: |
        curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
          -o /tmp/elan-init.sh
        sh /tmp/elan-init.sh -y --default-toolchain none
        echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

    - name: Cache mathlib build
      uses: actions/cache@v6
      with:
        path: extra/lean/esolangs/.lake
        key: lean-esolangs-${{ hashFiles('extra/lean/esolangs/lake-manifest.json') }}-${{ hashFiles('extra/lean/esolangs/lean-toolchain') }}
        restore-keys: |
          lean-esolangs-

    - name: Build the Lean proofs
      run: |
        cd extra/lean/esolangs
        lake build
        echo "Lean proofs built"
