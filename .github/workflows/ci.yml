name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# `.python-version` pins 3.14, but the jobs below deliberately sync other
# interpreters -- the lint job holds the 3.12 floor `requires-python`
# promises, and the test matrix spans 3.12/3.13/3.14.  A bare `uv run`
# re-reads that pin, sees the synced `.venv` does not match it, and *deletes
# and recreates* the environment -- re-syncing without `--extra dev`, which
# drops pre-commit, pytest, and mypy and fails with "Failed to spawn".
# `UV_NO_SYNC` makes the explicit `uv sync` above each run the single
# authority over the environment.
env:
  UV_NO_SYNC: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v7

    - name: Install uv
      uses: astral-sh/setup-uv@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"

    # `--python` explicitly, though this job also sets up 3.12 above: the
    # repo now commits a `.python-version` pin, and a bare `uv sync` prefers
    # it -- which would quietly move this job to whatever dev is on.  The
    # lint job holds the floor `requires-python` promises, so it says so.
    - name: Install dependencies
      run: uv sync --extra dev --python 3.12

    - name: Run pre-commit
      run: uv run pre-commit run --all-files

    # These three each walk a source directory and fail on anything missing
    # from the registry or departing from a signature convention, rather
    # than trusting a hand-written list to be complete -- see verify.py's
    # own docstring check step for why that distinction matters: a category
    # tuple once omitted two of six interpreter directories, and the gate
    # reported "all conventions followed" while silently skipping them.
    - name: Check interpreter docstrings
      run: uv run python scripts/check_docstrings.py

    - name: Check generator conventions
      run: uv run python scripts/check_generators.py

    # pre-commit's mypy hook is scoped to src/ because its isolated env
    # lacks the scripts' imports; this run covers src/ and scripts/ both,
    # using the project env where those imports resolve.
    - name: Type-check src/ and scripts/
      run: uv run mypy

    - name: Check for duplicated code blocks
      run: >
        uv run --with pylint python -m pylint --disable=all
        --enable=duplicate-code --min-similarity-lines=10
        --ignore-imports=yes src/esolangs scripts tests

    - name: Verify the single-interpreter installer
      run: uv run python scripts/verify_install_one.py

    # Re-derives the ZTOALC anchor table and diffs it against the committed
    # file, catching a stale table or a hand-edit.  The pytest suite only
    # looks values up in the table, so it cannot catch either.  Runs here
    # rather than at push time: verify.py leaves it to CI.
    - name: Check the ZTOALC anchor table is reproducible
      run: uv run python scripts/make_ztoalc_table.py --check

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@v7
      with:
        # The changed-line gate below diffs against the merge-base with main.
        # The default shallow clone has no such commit, so the gate would
        # fail open and check nothing at all -- quietly, which is worse than
        # not running it.
        fetch-depth: 0

    - name: Install uv
      uses: astral-sh/setup-uv@v7

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: uv sync --extra dev --python ${{ matrix.python-version }}

    # Coverage is consumed from one leg only (the changed-line gate below),
    # and that leg is now 3.14, because which interpreter measures it
    # decides what it costs.  sys.monitoring cannot measure *branches*
    # before 3.14, so asking for `--cov-branch` there drops coverage onto the
    # old tracer.  Measured locally over the fast subset at -n 4, coverage
    # 7.13.4, the same flags on both:
    #
    #     3.13  --cov (line, sysmon)     36.1s
    #     3.13  --cov --cov-branch      119.3s   <- 3.3x, no-sysmon fallback
    #     3.14  --cov (line, sysmon)     17.81s
    #     3.14  --cov --cov-branch       17.89s  <- free
    #
    # The other legs just run the tests.  3.12 stays in the matrix because
    # `requires-python` promises it -- the floor has to keep being tested even
    # though it is no longer where coverage is measured.
    - name: Test with pytest (with coverage)
      if: matrix.python-version == '3.14'
      # The local default is a fixed, modest worker count so developer laptops
      # keep cores free; CI has the box to itself, so ask for all of them.
      #
      # `--cov-branch` is free on this leg (see the table above) and the gate
      # below needs the arcs.
      run: uv run pytest -n auto --cov --cov-branch --cov-report=xml --cov-report=term-missing

    # Strict here, unlike the local pre-push run: this job runs the whole
    # suite, so an uncovered added line or one-sided added branch cannot be
    # blamed on a deselected test.  The gate is still fail-open about data it
    # does not have -- see its module docstring.
    - name: Check changed-line and changed-branch coverage
      if: matrix.python-version == '3.14'
      run: uv run python scripts/check_diff_coverage.py

    - name: Test with pytest
      if: matrix.python-version != '3.14'
      run: uv run pytest -n auto


  generated-docs:
    # The generated docs are committed, so CI re-runs their generator and
    # fails on a diff: a doc that drifts from the registry is the failure
    # this catches.  It reads only the registry, so it neither needs the
    # suite to have passed nor waits for it -- the `needs: test` this
    # carried was for the coverage artifact the removed badge consumed.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v7

    - name: Install uv
      uses: astral-sh/setup-uv@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"

    # Explicit, like every other sync here: with `.python-version` committed,
    # a bare `uv sync` would follow the pin rather than the 3.12 set up above.
    - name: Install dependencies
      run: uv sync --extra dev --python 3.12

    - name: Regenerate the language capabilities doc
      run: |
        uv run python scripts/make_languages_doc.py
        if ! git diff --exit-code docs/languages.md; then
          echo "docs/languages.md is out of date. Run:"
          echo "  uv run python scripts/make_languages_doc.py"
          exit 1
        fi

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v7

    - name: Install uv
      uses: astral-sh/setup-uv@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: uv sync --extra dev --python 3.12

    - name: Run bandit security check
      run: uv run --with bandit bandit -r src -f json -o bandit-report.json

    - name: Audit dependencies with pip-audit
      run: uv run --with pip-audit pip-audit --local

  line:
    # extra/line's suites also run in the main `test` job (they are under the
    # root testpaths now that they need no image libraries).  This job repeats
    # them for a different reason: `--isolated --no-project` installs *only*
    # pytest, so a green run here is the standing proof that the subtree has
    # no third-party dependencies at all.  The main suite runs with the
    # package installed and so cannot show that.  ~3s, deliberately spent.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v7

    - name: Install uv
      uses: astral-sh/setup-uv@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"

    - name: Run the extra/line suites
      run: |
        cd extra/line
        uv run --isolated --no-project \
          --with pytest --with pytest-xdist \
          pytest . -q

    # Line is not in registry.py (its programs are PNGs), so these __main__
    # blocks are the only way to run it.  The pytest suites import the
    # functions directly and never execute them, so a broken argv index or
    # entry point would otherwise go unnoticed until someone ran it by hand.
    - name: Smoke test the extra/line entry points
      run: |
        set -e
        cd extra/line
        run_line() {
          uv run --isolated --no-project python "$@"
        }
        run_line render.py "+++" /tmp/line_render.png
        [ "$(run_line simulate.py /tmp/line_render.png)" \
          = "final tape (nonzero cells): {0: 3}" ]
        run_line extract.py /tmp/line_render.png >/dev/null
        run_line bf_to_line.py "+++." /tmp/line_bf.png >/dev/null
        [ "$(run_line simulate.py /tmp/line_bf.png)" \
          = "3
        final tape (nonzero cells): {0: 3}" ]
        run_line line_boolean.py 0001 /tmp/line_bool.png >/dev/null
        run_line verify.py >/dev/null
        echo "All extra/line entry points passed"
