name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v7

    - name: Install uv
      uses: astral-sh/setup-uv@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: uv sync --extra dev

    - name: Run pre-commit
      run: uv run pre-commit run --all-files

    - name: Check for duplicated code blocks
      run: uv run --with pylint python scripts/check_duplicates.py

    - name: Verify the single-interpreter installer
      run: uv run python scripts/verify_install_one.py

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v7

    - name: Install uv
      uses: astral-sh/setup-uv@v7

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: uv sync --extra dev --python ${{ matrix.python-version }}

    - name: Test with pytest
      run: uv run pytest --cov --cov-report=xml --cov-report=term-missing

    - name: Upload coverage to Codecov
      if: matrix.python-version == '3.12'
      uses: codecov/codecov-action@v7
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

    - name: Upload coverage report for the badge
      if: matrix.python-version == '3.12'
      uses: actions/upload-artifact@v7
      with:
        name: coverage-xml
        path: coverage.xml
        if-no-files-found: error
        retention-days: 1

  coverage-badge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: test
    steps:
    - uses: actions/checkout@v7

    - name: Download coverage report
      uses: actions/download-artifact@v8
      with:
        name: coverage-xml
        path: .

    - name: Install uv
      uses: astral-sh/setup-uv@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: uv sync --extra dev

    - name: Regenerate the coverage badge
      run: |
        uv run python scripts/make_coverage_badge.py
        if ! git diff --exit-code coverage-badge.svg; then
          echo "coverage-badge.svg is out of date. Run:"
          echo "  uv run pytest --cov --cov-report=xml"
          echo "  uv run python scripts/make_coverage_badge.py"
          exit 1
        fi

    - name: Regenerate the language capabilities doc
      run: |
        uv run python scripts/make_languages_doc.py
        if ! git diff --exit-code docs/languages.md; then
          echo "docs/languages.md is out of date. Run:"
          echo "  uv run python scripts/make_languages_doc.py"
          exit 1
        fi

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v7

    - name: Install uv
      uses: astral-sh/setup-uv@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: uv sync --extra dev

    - name: Run bandit security check
      run: uv run --with bandit bandit -r src -f json -o bandit-report.json

    - name: Audit dependencies with pip-audit
      run: uv run --with pip-audit pip-audit --local

  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v7

    - name: Build extra/ Rust implementations
      run: |
        cargo build --manifest-path extra/rust/Cargo.toml
        cargo fmt --manifest-path extra/rust/Cargo.toml --check

    - name: Run extra/ Rust unit tests
      run: |
        cargo test --manifest-path extra/rust/Cargo.toml

    - name: Smoke test extra/ Rust implementations
      run: |
        set -e
        : > /tmp/empty.txt
        ./extra/rust/target/debug/laserfuck /tmp/empty.txt
        ./extra/rust/target/debug/unsquare /tmp/empty.txt
        printf 'l' > /tmp/pct.txt
        [ "$(./extra/rust/target/debug/pct_squared_minus_one /tmp/pct.txt)" = "0" ]
        printf '~(' > /tmp/bit_tilde.txt
        ./extra/rust/target/debug/bit_tilde /tmp/bit_tilde.txt >/dev/null
        printf 'F4*5+.' > /tmp/forth.txt
        [ "$(./extra/rust/target/debug/forth /tmp/forth.txt)" = "A" ]
        printf '#basicfuck t=1 r=0~255 o=nearest\n#allocate a\na += 65;\nwrite <- a ;' \
          > /tmp/basicfuck.txt
        [ "$(./extra/rust/target/debug/basicfuck /tmp/basicfuck.txt)" = "A" ]
        printf 'pyr' > /tmp/painfuck.txt
        ./extra/rust/target/debug/painfuck /tmp/painfuck.txt >/dev/null
        printf '3!' > /tmp/three_x.txt
        [ "$(./extra/rust/target/debug/three_x /tmp/three_x.txt)" = "3" ]
        echo "All extra/ Rust smoke tests passed"

    - name: Verify generator-only languages against the Rust references
      run: |
        PYTHONPATH=src python3 scripts/verify_extra_generators.py

    - name: Differential-test the interpreters against the native cross-checks
      run: |
        PYTHONPATH=src python3 scripts/verify_differential.py --fuzz 50 --seed 1

  assembly:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v7

    - name: Build and run the RISC-V reference interpreters
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-riscv64-linux-gnu qemu-user
        for s in extra/assembly/*-riscv.s; do
          base=$(basename "$s" .s)
          riscv64-linux-gnu-gcc -nostdlib -static -march=rv64i -mabi=lp64 \
            -o "/tmp/$base" "$s"
          echo "Built $s"
        done
        # the reference interpreter must execute and halt; feed each a valid
        # program (an empty stdin is malformed for some, e.g. BF-PDA, and
        # would exit nonzero under `set -e`)
        printf 'o' | qemu-riscv64 /tmp/nocomment-riscv >/dev/null
        printf '.' | qemu-riscv64 /tmp/bfpda-riscv >/dev/null
        printf 'A' | qemu-riscv64 /tmp/ram0-riscv >/dev/null
        printf '0ox' | qemu-riscv64 /tmp/bio-riscv >/dev/null
        printf '+' | qemu-riscv64 /tmp/minsky_swap-riscv >/dev/null
        echo "All extra/ RISC-V interpreters ran natively"

    - name: Run the RISC-V reference interpreters under unicorn
      run: |
        python3 -m pip install -q unicorn
        # the differential (Python vs the RISC-V references, corpus + fuzz)
        # needs unicorn and the RISC-V compiler, which the rust job lacks;
        # LaserFuck's runs there instead.
        PYTHONPATH=src python3 scripts/verify_differential.py --fuzz 50 --seed 1
        # the reference interpreter must execute and halt; feed each a valid
        # program (an empty stdin is malformed for some, e.g. BF-PDA, and
        # would exit nonzero under `set -e`)
        printf 'o' | python3 scripts/riscv_elf_runner.py /tmp/nocomment-riscv \
          >/dev/null
        printf '.' | python3 scripts/riscv_elf_runner.py /tmp/bfpda-riscv \
          >/dev/null
        printf 'A' | python3 scripts/riscv_elf_runner.py /tmp/ram0-riscv \
          >/dev/null
        printf '0ox' | python3 scripts/riscv_elf_runner.py /tmp/bio-riscv \
          >/dev/null
        printf '+' | python3 scripts/riscv_elf_runner.py /tmp/minsky_swap-riscv \
          >/dev/null
        echo "All extra/ RISC-V interpreters ran under unicorn"

    - name: Compile and run the RISC-V compilers' output
      run: |
        # each assembly compiler's output is assembled and executed under
        # unicorn, so the compilers are verified end to end, not just that
        # they emit assembly
        PYTHONPATH=src python3 scripts/verify_riscv_unicorn.py

    - name: Run the RISC-V compilers and reference interpreters under unicorn
      run: |
        PYTHONPATH=src python3 scripts/verify_riscv_unicorn.py
        echo "All RISC-V compilers and references round-tripped under unicorn"

  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v7

    - name: Install elan
      run: |
        curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
          -o /tmp/elan-init.sh
        sh /tmp/elan-init.sh -y --default-toolchain none
        echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

    - name: Cache mathlib build
      uses: actions/cache@v6
      with:
        path: extra/lean/esolangs/.lake
        key: lean-esolangs-${{ hashFiles('extra/lean/esolangs/lake-manifest.json') }}-${{ hashFiles('extra/lean/esolangs/lean-toolchain') }}-${{ hashFiles('extra/lean/esolangs/lakefile.toml', 'extra/lean/esolangs/Esolangs.lean', 'extra/lean/esolangs/Esolangs/*.lean') }}
        restore-keys: |
          lean-esolangs-

    - name: Build the Lean proofs
      run: |
        cd extra/lean/esolangs
        sources_hash=$(sha256sum lakefile.toml lake-manifest.json lean-toolchain Esolangs.lean Esolangs/*.lean | sha256sum | cut -d' ' -f1)
        if [ -f .lake/build/lean-sources.hash ] && [ "$(cat .lake/build/lean-sources.hash)" = "$sources_hash" ]; then
          echo "Lean sources unchanged; skipping lake build"
        else
          lake build
          echo "$sources_hash" > .lake/build/lean-sources.hash
          echo "Lean proofs built"
        fi
