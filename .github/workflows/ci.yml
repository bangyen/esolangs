name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# `.python-version` pins 3.14, but the jobs below deliberately sync other
# interpreters -- the lint job holds the 3.12 floor `requires-python`
# promises, and the test matrix spans 3.12/3.13/3.14.  A bare `uv run`
# re-reads that pin, sees the synced `.venv` does not match it, and *deletes
# and recreates* the environment -- re-syncing without `--extra dev`, which
# drops pre-commit, pytest, and mypy and fails with "Failed to spawn".
# `UV_NO_SYNC` makes the explicit `uv sync` above each run the single
# authority over the environment.
env:
  UV_NO_SYNC: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v7

    - name: Install uv
      uses: astral-sh/setup-uv@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"

    # `--python` explicitly, though this job also sets up 3.12 above: the
    # repo now commits a `.python-version` pin, and a bare `uv sync` prefers
    # it -- which would quietly move this job to whatever dev is on.  The
    # lint job holds the floor `requires-python` promises, so it says so.
    - name: Install dependencies
      run: uv sync --extra dev --python 3.12

    - name: Run pre-commit
      run: uv run pre-commit run --all-files

    # The only mypy run: pre-commit has no mypy hook, because the mirror's
    # isolated env lacks the scripts' imports and could only ever cover
    # src/.  This covers src/ and scripts/ both, from the project env.
    - name: Type-check src/ and scripts/
      run: uv run mypy

    # A generator route that was replaced keeps its own tests green; three
    # sat unread for months.  Reports any tools/ name, or any private name
    # elsewhere in src/, that nothing in src/ or scripts/ reads.  <2s.
    - name: Check for definitions nothing reads
      run: uv run python scripts/check_dead_definitions.py

    # Emitted size and step count for every language on 2-, 3- and 4-input
    # tables, compared exactly against the committed baseline.  They are the
    # numbers the collection's claims are made of, and before this nothing
    # measured them outside a hand-run `just benchmark`.  Generation *time*
    # is not gated here -- see weekly.yml's `timings` job for why.  ~5s.
    - name: Check generator sizes against the baseline
      run: uv run python scripts/check_generator_sizes.py

    - name: Check for duplicated code blocks
      run: >
        uv run --with pylint python -m pylint --disable=all
        --enable=duplicate-code --min-similarity-lines=10
        --ignore-imports=yes src/esolangs scripts tests

    # Every deep proof in the `ci` band and cheaper: the ArrowQueue and BIO
    # lemmas, and the registry-wide battery. ~14s. Which proofs those are is
    # not spelled out here -- each declares its own band, and
    # tests/proofs/test_bands.py holds the bands to their cost budgets, so
    # this step cannot quietly shrink.
    - name: Check the deep proofs that gate
      run: uv run python -m tests.proofs.deep ci

    # --all, not the touched-language default the local gate uses: this is
    # the run that holds exceptions.py's contract across all 60.  68s cold;
    # the cache below carries the last clean sweep's fingerprints forward so
    # a run pays only for the interpreters, examples or machinery that
    # changed since.  The key is per commit and the restore prefix takes the
    # newest, so every run saves and the next run inherits.
    - name: Restore the leak sweep's clean fingerprints
      uses: actions/cache@v4
      with:
        path: .leaksweep-cache.json
        key: leaksweep-${{ github.sha }}
        restore-keys: leaksweep-

    - name: Check that no interpreter leaks a raw exception
      run: uv run python scripts/verify_no_exception_leaks.py --all

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@v7
      with:
        # The changed-line gate below diffs against the merge-base with main.
        # The default shallow clone has no such commit, so the gate would
        # fail open and check nothing at all -- quietly, which is worse than
        # not running it.
        fetch-depth: 0

    - name: Install uv
      uses: astral-sh/setup-uv@v7

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: uv sync --extra dev --python ${{ matrix.python-version }}

    # Coverage is consumed from one leg only (the changed-line gate below),
    # and that leg is now 3.14, because which interpreter measures it
    # decides what it costs.  sys.monitoring cannot measure *branches*
    # before 3.14, so asking for `--cov-branch` there drops coverage onto the
    # old tracer.  Measured locally over the fast subset at -n 4, coverage
    # 7.13.4, the same flags on both:
    #
    #     3.13  --cov (line, sysmon)     36.1s
    #     3.13  --cov --cov-branch      119.3s   <- 3.3x, no-sysmon fallback
    #     3.14  --cov (line, sysmon)     17.81s
    #     3.14  --cov --cov-branch       17.89s  <- free
    #
    # The other legs just run the tests.  3.12 stays in the matrix because
    # `requires-python` promises it -- the floor has to keep being tested even
    # though it is no longer where coverage is measured.
    - name: Test with pytest (with coverage)
      if: matrix.python-version == '3.14'
      # The local default is a fixed, modest worker count so developer laptops
      # keep cores free; CI has the box to itself, so ask for all of them.
      # `-n auto` is already every vCPU the runner has -- xdist falls back to
      # `os.cpu_count()` because psutil is not a dependency here -- so there
      # is no worker count left to raise.  What made this job slow was the
      # `slow` band: 546 of 10172 tests that measure, locally at two workers,
      # 289s against the 81s the rest take.  The `slow` job below runs
      # them sharded; this runs fast and `medium`.
      #
      # `--cov-branch` is free on this leg (see the table above) and the gate
      # below needs the arcs.
      #
      # `--cov-fail-under` is a drift floor, not a target: this band measures
      # 99% today, and the two points of slack absorb a slow-only path moving
      # under a line the fast band cannot reach.  It lives here rather than in
      # pyproject's `[tool.coverage.report]` because a local `just test` run
      # is scoped -- `verify.py`'s `_scoped_coverage` narrows measurement to
      # the touched files -- and a shared floor would read that subset as a
      # collapse.  The changed-line gate below is the per-PR check; this only
      # catches whole-tree erosion.
      run: uv run pytest -n auto -m "not slow" --cov --cov-branch --cov-report=xml --cov-report=term-missing --cov-fail-under=97

    # The fast suite cannot judge pre-existing lines covered only by a slow
    # test, so `--partial` reports those whole-file gaps without blocking.
    # Added executable lines and branches are still this PR's responsibility
    # and fail the job; the weekly suite retains the expensive evidence.
    - name: Check changed-line and changed-branch coverage
      if: matrix.python-version == '3.14'
      run: uv run python scripts/check_diff_coverage.py --partial

    - name: Test with pytest
      if: matrix.python-version != '3.14'
      run: uv run pytest -n auto -m "not slow"


  slow:
    # The `slow` band, sharded round-robin across four jobs so per-PR CI
    # keeps the signal without the wall time: one file holds nearly half
    # the band, so contiguous slices would leave one shard carrying it
    # whole.  `-m "slow and not weekly"`, mirroring verify.py's --full
    # run: the two high-arity probes stay on the weekly sampling interval,
    # and weekly.yml (bare `pytest`) remains their only runner.
    #
    # 3.14 only: the fast suite already covers every promised interpreter
    # on every push, and weekly.yml keeps the whole suite on all three.
    # Count-balanced, not time-balanced; the timeout has headroom for CI's
    # slower cores.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # One shard's failure should not cancel the evidence from the others.
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]

    steps:
    - uses: actions/checkout@v7

    - name: Install uv
      uses: astral-sh/setup-uv@v7

    - name: Set up Python 3.14
      uses: actions/setup-python@v7
      with:
        python-version: "3.14"

    # Explicit, like every other sync here: with `.python-version`
    # committed, a bare `uv sync` would follow the pin.
    - name: Install dependencies
      run: uv sync --extra dev --python 3.14

    - name: Test one slow shard
      run: uv run python scripts/pytest_shard.py --marker "slow and not weekly" --shard ${{ matrix.shard }} --shards 4 -- -n auto


  generated-docs:
    # The generated docs are committed, so CI re-runs their generator and
    # fails on a diff: a doc that drifts from the registry is the failure
    # this catches.  It reads only the registry, so it neither needs the
    # suite to have passed nor waits for it -- the `needs: test` this
    # carried was for the coverage artifact the removed badge consumed.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v7

    - name: Install uv
      uses: astral-sh/setup-uv@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"

    # Explicit, like every other sync here: with `.python-version` committed,
    # a bare `uv sync` would follow the pin rather than the 3.12 set up above.
    - name: Install dependencies
      run: uv sync --extra dev --python 3.12

    - name: Check generated documentation
      run: uv run python scripts/check_generated_docs.py

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v7

    - name: Install uv
      uses: astral-sh/setup-uv@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: uv sync --extra dev --python 3.12

    - name: Run bandit security check
      run: uv run --with bandit bandit -r src -f json -o bandit-report.json

    - name: Audit dependencies with pip-audit
      run: uv run --with pip-audit pip-audit --local
