name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v5

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: uv sync --extra dev

    - name: Run pre-commit
      run: uv run pre-commit run --all-files

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v5

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: uv sync --extra dev --python ${{ matrix.python-version }}

    - name: Lint with ruff
      run: uv run ruff check .

    - name: Format check with black
      run: uv run black --check .

    - name: Type check with mypy
      run: uv run mypy src

    - name: Test with pytest
      run: uv run pytest --cov --cov-report=xml --cov-report=term-missing

    - name: Upload coverage to Codecov
      if: matrix.python-version == '3.12'
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  coverage-badge:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v5

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: uv sync --extra dev

    - name: Regenerate the coverage badge
      run: |
        uv run pytest --cov --cov-report=xml -q
        uv run python scripts/make_coverage_badge.py
        if ! git diff --exit-code coverage-badge.svg; then
          echo "coverage-badge.svg is out of date. Run:"
          echo "  uv run pytest --cov --cov-report=xml"
          echo "  uv run python scripts/make_coverage_badge.py"
          exit 1
        fi

  security:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v5

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: uv sync --extra dev

    - name: Run bandit security check
      run: uv run --with bandit bandit -r src -f json -o bandit-report.json

    - name: Audit dependencies with pip-audit
      run: uv run --with pip-audit pip-audit --local

  cxx:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install g++
      run: sudo apt-get update && sudo apt-get install -y g++

    - name: Build extra/ C++ implementations
      run: |
        for f in extra/c++/*.cpp; do
          name="$(basename "$f" .cpp)"
          g++ -std=c++11 "$f" -o "/tmp/$name"
          echo "Built $name"
        done

    - name: Smoke test extra/ C++ implementations
      run: |
        set -e
        : > /tmp/empty.txt
        for f in extra/c++/*.cpp; do
          name="$(basename "$f" .cpp)"
          set +e
          "/tmp/$name" /tmp/empty.txt > /dev/null 2>&1
          rc=$?
          set -e
          if [ "$rc" -gt 1 ]; then
            echo "FAIL: $name crashed with exit code $rc on empty input"
            exit 1
          fi
          echo "OK: $name handles empty input"
        done

        # Output checks for languages with simple terminating programs.
        printf 't3' > /tmp/trash.txt
        [ "$(/tmp/trash /tmp/trash.txt)" = "5" ]
        printf 't9' > /tmp/trash.txt
        [ "$(/tmp/trash /tmp/trash.txt)" = "0" ]
        printf 'l' > /tmp/magnitude.txt
        [ "$(/tmp/%^2^-1 /tmp/magnitude.txt)" = "0" ]
        [ "$(/tmp/kak /tmp/empty.txt)" = "0" ]
        echo "All extra/ C++ smoke tests passed"

  rust:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Build extra/ Rust implementations
      run: |
        cargo build --manifest-path extra/rust/Cargo.toml
        cargo fmt --manifest-path extra/rust/Cargo.toml --check

    - name: Smoke test extra/ Rust implementations
      run: |
        set -e
        : > /tmp/empty.txt
        ./extra/rust/target/debug/laserfuck /tmp/empty.txt
        ./extra/rust/target/debug/unsquare /tmp/empty.txt
        echo "All extra/ Rust smoke tests passed"

  extra-languages:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install toolchains
      run: |
        sudo apt-get update
        sudo apt-get install -y r-base nasm

    - name: Check Ruby syntax
      run: |
        for f in extra/ruby/*.rb; do
          ruby -c "$f"
        done

    - name: Check R syntax
      run: |
        Rscript -e 'for (f in list.files("extra/r", full.names = TRUE)) parse(f)'

    - name: Assemble extra/ assembly programs
      run: |
        for f in extra/assembly/*.asm; do
          nasm -f elf32 -o /dev/null "$f"
          echo "Assembled $f"
        done
