name: Weekly full suite

# The whole suite on all three interpreters, on a schedule.  The `slow`
# band also runs per-PR now, sharded across four jobs in ci.yml; what
# keeps this workflow is the `weekly` marker -- the two high-arity probes
# nothing else runs -- plus a weekly full-suite pass at interpreters the
# per-PR legs skip.  The slow tests here are the cheap part of the bill
# next to those probes.
#
# Two things about `schedule:` worth knowing before relying on it.  It only
# fires on the default branch, so this file does nothing until it is on
# `main`.  And GitHub disables scheduled workflows after 60 days with no
# repository activity, then emails the owner -- `workflow_dispatch` is here
# so the suite can always be run by hand, including from a branch.

on:
  schedule:
    # Mondays, 06:00 UTC.  Off the hour would be likelier to start on time --
    # GitHub queues scheduled runs and the top of the hour is the busiest
    # slot -- but nothing here is time-sensitive to the minute.
    - cron: "0 6 * * 1"
  workflow_dispatch:

# Same trap as ci.yml: `.python-version` pins 3.14 and a bare `uv run`
# re-reads it, deletes the synced venv and re-creates it without
# `--extra dev`.  The explicit `uv sync` below is the single authority.
env:
  UV_NO_SYNC: "1"

jobs:
  slow:
    runs-on: ubuntu-latest
    # The band is 7m46s locally at two workers; CI is slower per core, and a
    # timeout that trips on an ordinary run is worse than no timeout.
    timeout-minutes: 45
    strategy:
      # One failing interpreter should not cancel the evidence from the
      # others -- on a weekly run there is no queue to protect.
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@v7

    - name: Install uv
      uses: astral-sh/setup-uv@v7

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: uv sync --extra dev --python ${{ matrix.python-version }}

    # The whole suite, not `-m slow`: running the band alone would leave the
    # fast tests unexercised at these interpreters for a week, and they are
    # the cheap part of the bill.
    #
    # Bare `pytest` is also what makes this the *only* runner that sees the
    # `weekly` marker.  `scripts/verify.py` appends `-m "not weekly"` on a
    # --full run and `-m "not slow"` otherwise, so the two high-arity probes
    # -- the twelve-input escape contract and `%^2^-1`'s thirteen-input fold,
    # 142.6s between them -- reach a machine here and nowhere else.  Deleting
    # this step's plainness silently retires both.
    #
    # No coverage gate here.  `check_diff_coverage.py` is diff-scoped -- it
    # judges the files a *branch* touches -- and a scheduled run on `main`
    # has no merge base, so the gate would skip and print nothing useful.
    # Per-PR CI reports it with `--partial`; the blocking form is the local
    # command that report prints.
    - name: Test with pytest (full suite, including the slow band)
      run: uv run pytest -n auto

  # Generation *time* is the one axis the per-PR gate cannot judge: it is
  # machine- and load-dependent, and a threshold loose enough not to flake on
  # a shared runner is loose enough to miss the regression it is there for.
  # So it is recorded, not gated.  One job, one interpreter, best-of-five:
  # the artifact is the trend, and `just benchmark` is how a suspicion gets
  # checked by hand afterwards.  The exact half of the same sweep -- emitted
  # size and step count -- is gated per-PR by `just test`'s "generator size
  # baseline" step instead.
  timings:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v7

    - name: Install uv
      uses: astral-sh/setup-uv@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.14"

    - name: Install dependencies
      run: uv sync --extra dev --python 3.14

    # `--timings` writes the full sweep; the run still fails if the exact
    # fields drifted, which on `main` would mean the gate was bypassed.
    - name: Sweep every generator
      run: >
        uv run python scripts/check_generator_sizes.py
        --repeat 5 --timings generator-timings.json

    - name: Upload the timings
      uses: actions/upload-artifact@v7
      with:
        name: generator-timings
        path: generator-timings.json
        retention-days: 90
