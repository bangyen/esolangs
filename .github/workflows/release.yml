name: Release

# Publishes to PyPI when a v* tag is pushed.  Authentication is PyPI trusted
# publishing (OIDC): the `id-token: write` permission below lets the upload
# mint a short-lived token from GitHub's identity, so there is no API token
# stored in repository secrets.
#
# The publisher must be registered once at
# https://pypi.org/manage/account/publishing/ with:
#   owner  bangyen      repository  esolangs
#   workflow  release.yml            environment  pypi
#
# Until that registration exists the publish step fails; build and verify
# still run, so a mistagged release is caught before it reaches the index.

on:
  push:
    tags:
      - "v*"
  # Manual dispatch builds and verifies; publishing is tag-only, so a
  # dispatch from a branch (which has no tag to compare) is inert.
  workflow_dispatch:

permissions:
  contents: read

# See ci.yml: a bare `uv run` would honour the `.python-version` pin over the
# 3.12 these jobs set up, recreating the environment on a different
# interpreter than the one the release is checked against.
env:
  UV_NO_SYNC: "1"

jobs:
  # The tag is the only thing that triggers a release, so it is also the only
  # thing that can disagree with the package.  Check it before building.
  check-version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@v7

    - name: Install uv
      uses: astral-sh/setup-uv@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"

    # A manual dispatch from a branch has no tag to compare, so the check is
    # tag-only; branch dispatches still build and verify, but cannot publish.
    - name: The tag must match the version in pyproject.toml
      if: github.ref_type == 'tag'
      run: |
        tag="${GITHUB_REF_NAME#v}"
        pkg="$(uv run python -c 'import tomllib,pathlib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
        echo "tag=$tag  pyproject=$pkg"
        if [ "$tag" != "$pkg" ]; then
          echo "::error::tag v$tag does not match pyproject version $pkg"
          exit 1
        fi

  verify:
    needs: check-version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v7
    - uses: astral-sh/setup-uv@v7
    - uses: actions/setup-python@v7
      with:
        python-version: "3.14"
    - name: Install verification dependencies
      run: uv sync --group dev --python 3.14
    - name: Verify the release commit
      env:
        PYTEST_ADDOPTS: "-n auto"
      run: uv run python scripts/verify.py --full

    - name: Retain worker and verification logs
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: logs-${{ github.job }}-${{ strategy.job-index }}
        path: |
          notes/verification/*.log
          notes/benchmarks/*.log
        if-no-files-found: ignore
        retention-days: 14

  build:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v7

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        version: "0.13.0"

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: |
          3.14
          3.13
          3.12

    - name: Set up Python 3.15 with uv
      run: uv python install 3.15.0

    # Normalize archive metadata, then compare two independent builds.
    - name: Build the sdist and wheel
      run: |
        SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
        echo "SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH" >> "$GITHUB_ENV"
        export SOURCE_DATE_EPOCH
        uv build --python 3.12
        python scripts/ci/release.py normalize dist/*.tar.gz
        uv build --python 3.12 --out-dir /tmp/release-rebuild
        python scripts/ci/release.py normalize /tmp/release-rebuild/*.tar.gz
        for artifact in dist/*; do
          cmp "$artifact" "/tmp/release-rebuild/$(basename "$artifact")"
        done

    # Catches a README that PyPI would reject at upload, after the tag exists.
    - name: Check the distribution metadata
      run: uv run --with twine python -m twine check dist/*

    - name: The built wheel installs and runs with and without optional extras
      run: |
        wheels=(dist/*.whl)
        for version in 3.12 3.13 3.14 3.15; do
          venv="/tmp/relcheck-$version"
          uv venv --python "$version" "$venv"
          uv pip install --python "$venv/bin/python" "${wheels[0]}"
          "$venv/bin/python" -I scripts/ci/release.py smoke
          uv pip install --python "$venv/bin/python" "${wheels[0]}[math]"
          "$venv/bin/python" -I scripts/ci/release.py smoke --math
          uv pip install --python "$venv/bin/python" "${wheels[0]}[image]"
          "$venv/bin/python" -I scripts/ci/release.py smoke --math --image
        done

    - name: Rebuild and test the sdist independently
      run: |
        mkdir /tmp/sdist-source
        tar -xzf dist/*.tar.gz -C /tmp/sdist-source --strip-components=1
        uv build --wheel /tmp/sdist-source --out-dir /tmp/sdist-wheel
        uv pip install --python /tmp/relcheck-3.12/bin/python --reinstall /tmp/sdist-wheel/*.whl
        /tmp/relcheck-3.12/bin/python -I scripts/ci/release.py smoke --math --image

    - uses: actions/upload-artifact@v7
      with:
        name: dist
        path: dist/

  publish:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Scopes the OIDC credential to this environment, so the trusted publisher
    # cannot be used by a workflow run outside it.
    environment:
      name: pypi
      url: https://pypi.org/p/esolangs
    permissions:
      id-token: write  # required to mint the OIDC token; no secret involved
    steps:
    - uses: actions/download-artifact@v8
      with:
        name: dist
        path: dist/

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
