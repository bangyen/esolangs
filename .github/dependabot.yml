# Dependabot keeps the pins in this repo from going stale silently.
#
# The pre-commit ruff hooks run the project env's ruff, so this file's
# uv ecosystem covers them too.
version: 2
updates:
  # pyproject.toml + uv.lock (the uv ecosystem sees dependency groups, pip
  # does not): `ruff` and `mypy` are pinned exactly, so a release of
  # either is invisible without this.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      python:
        patterns:
          - "*"

  # The actions in ci.yml and fuzz.yml.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - "*"
