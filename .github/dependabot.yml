# Dependabot keeps the pins in this repo from going stale silently.
#
# Not covered here: the hook `rev`s in .pre-commit-config.yaml.  Dependabot
# has no pre-commit ecosystem, so those are updated by `pre-commit autoupdate`
# by hand.  Keep the ruff and mypy revs there in step with the exact pins in
# pyproject.toml's dev extra, which this file does watch.
#
# That rule is now enforced: the check-hook-pins hook fails when a rev and a
# pin disagree.  So a Dependabot PR that bumps ruff or mypy here will fail
# its own CI until the matching rev is bumped too -- that is the intended
# workflow, not a broken PR.  A bump often also reformats files; run the
# formatter in the same PR.
version: 2
updates:
  # pyproject.toml: `ruff` and `mypy` are pinned exactly, so a release of
  # either is invisible without this.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      python:
        patterns:
          - "*"

  # The actions in ci.yml and fuzz.yml.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - "*"
