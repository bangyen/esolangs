[package]
name = "esolangs-native"
version = "0.5.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Native accelerators for the esolangs Python package"
repository = "https://github.com/bangyen/esolangs"
include = ["Cargo.toml", "src/lib.rs"]

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29.2", features = ["abi3-py312"] }

[profile.release]
lto = "thin"
strip = true
