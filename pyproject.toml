[build-system]
# The SPDX-string `license` below is PEP 639, which setuptools implements
# from 77.0; older versions reject it as invalid pyproject config.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "esolangs"
version = "0.1.0"
description = "A comprehensive collection of esoteric programming language interpreters and compilers"
authors = [{name = "Bangyen Pham", email = "bangyenp@gmail.com"}]
license = "GPL-3.0-or-later"
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Interpreters",
    "Topic :: Software Development :: Compilers",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
keywords = ["esoteric", "programming", "languages", "interpreters", "compilers", "brainfuck", "esolangs"]
dependencies = [
    "sympy>=1.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=4.0.0",
    "pytest-xdist>=3.8.0",
    "click>=8.3.3",
    "pygments>=2.20.0",
    "urllib3>=2.7.0",
    "unicorn>=2.1.4",
    "ruff==0.16.4",
    "mypy==2.3.1",
    "pre-commit>=3.0.0",
    "types-requests",
    "types-setuptools",
    # Was pinned to 3.3.1 against a class-method selection bug; 3.7.0 does not
    # have it, and fixes one of its own.  See scripts/mutate_one.py.
    "mutmut==3.7.0",
]

[project.urls]
Homepage = "https://github.com/bangyen/esolangs"
Repository = "https://github.com/bangyen/esolangs"
Issues = "https://github.com/bangyen/esolangs/issues"

[project.scripts]
esolangs = "esolangs.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["esolangs*"]
exclude = ["tests*", "examples*", "docs*"]

[tool.setuptools.package-data]
esolangs = ["py.typed"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
    "PT",  # flake8-pytest-style
    "D",   # pydocstyle
    "RET", # flake8-return
    "N",   # pep8-naming
    "FBT", # flake8-boolean-trap
    "A",   # builtin shadowing
    "ARG", # unused arguments
    "SLF", # private member access
]
ignore = [
    "C901",  # too complex
    "D203",  # conflicts with D211 (blank line before class)
    "D213",  # conflicts with D212 (multi-line summary placement)
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"**/__main__.py" = ["E402"]
# The leak sweep imports the package under test, so it has to extend
# sys.path before those imports can resolve.
"scripts/verify_no_exception_leaks.py" = ["E402"]
# The badge is a single multi-line SVG template string; its long lines are
# part of the generated markup and cannot be wrapped without changing it.
"scripts/make_coverage_badge.py" = ["E501"]
# Module filenames match the esolang names and are referenced by the registry.
"src/esolangs/interpreters/**/*.py" = ["N999"]
"src/esolangs/compilers/**/*.py" = ["N999"]
# Test files are exempt from docstring requirements: test method and class
# names are self-documenting, so the D rules would only add boilerplate.
"tests/**/*.py" = ["D", "N802"]
# Parametrized tests share a (program, stdin) battery; some tests only use
# program, but pytest requires the parameter to be declared.
"tests/tools/test_transpilers.py" = ["ARG001"]
# CV(N)(C)'s source code *is* IPA, so the ambiguous-unicode rules fire on
# every command in the language: the fricative is U+03B8 GREEK SMALL LETTER
# THETA, the multiplication plosive U+0261 LATIN SMALL LETTER SCRIPT G, and
# so on.  Here the confusable character is the correct one -- these rules
# catch a homoglyph typed by mistake, and there is no non-IPA spelling to
# prefer -- so they are off for the files that spell the language.  That
# includes tests/samples.py, which is otherwise language-agnostic but
# holds one CV(N)(C) program in its per-language table.
"src/esolangs/interpreters/other/cvnc.py" = ["RUF001", "RUF002", "RUF003"]
"src/esolangs/tools/boolean/cvnc.py" = ["RUF001", "RUF002", "RUF003"]
"tests/interpreters/test_cvnc.py" = ["D", "N802", "RUF001", "RUF002", "RUF003"]
"tests/samples.py" = ["D", "N802", "RUF001", "RUF002", "RUF003"]

[tool.mypy]
strict = true
python_version = "3.12"
# scripts/ is CI infrastructure (the differential, unicorn, and installer
# checks), so it is type-checked alongside the package itself.
files = ["src", "scripts"]
exclude = ["\\.venv/", "build/", "dist/"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = false  # pytest's decorators are untyped
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
# sympy ships no inline types.
module = ["sympy"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# unicorn's bindings are untyped and its __init__ re-exports without
# __all__, so its names look unexported to a strict run.
module = ["unicorn", "unicorn.*"]
ignore_missing_imports = true
implicit_reexport = true

[[tool.mypy.overrides]]
# disallow_untyped_calls is a property of the *calling* module, so it is
# relaxed here rather than on unicorn above: every Uc method (mem_map,
# reg_read, emu_start, ...) is untyped, and this is the only module that
# drives the emulator.  Everything else stays strict.
module = ["riscv_elf_runner"]
disallow_untyped_calls = false

[tool.pytest.ini_options]
# extra/line is collected alongside tests/ even though it is not a package:
# its modules import each other as flat top-level names, which resolves
# because pytest prepends a rootdir-less test file's own directory to
# sys.path.  That does mean names like `png` and `mask` become importable
# package-wide during a test session, so a third-party module of either name
# would shadow -- neither is currently a dependency, and `src/` imports
# nothing by those names.
testpaths = ["tests", "extra/line"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--verbose",
    "--tb=short",
    # Four workers.  Re-measured on the fast run ("-m 'not slow'") on a
    # 10-core machine (8 performance): 33.4s serial, 23.3s at 2, 13.8s at 4,
    # 13.1s at 6, 15.4s at 8.  The suite has grown broader and shorter-tailed
    # than when this was set to 2 -- no single test dominates, so the work
    # divides -- and the curve is flat past 4 and turns back up at 8, where
    # the workers outnumber the performance cores.  Four takes nearly all the
    # available speedup while leaving cores free.
    # Override per-run with "-n auto", "-n 2", or "-n 0" on the command line.
    "-n",
    "4",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "interpreter: marks tests for specific interpreters",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
    "ignore:.*found in sys.modules.*:RuntimeWarning",
]

[tool.coverage.run]
source = ["src/esolangs"]
# Python 3.12's sys.monitoring costs a fraction of what the trace-function
# backend does: measured over this suite, 0.9s of overhead instead of 11.5s,
# reporting the same 15295 statements either way.  coverage falls back to the
# C tracer automatically on older interpreters.
core = "sysmon"
omit = [
    "*/__pycache__/*",
    "*/migrations/*",
    "*/venv/*",
    "*/env/*",
    "*/ENV/*",
    "*/env.bak/*",
    "*/venv.bak/*",
    "*/_template.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
    # Imports guarded by TYPE_CHECKING exist for the type checker and are
    # never executed, so they can only ever read as uncovered.
    "if TYPE_CHECKING:",
    # An `assert_never` arm is the type checker's exhaustiveness proof: mypy
    # only accepts it where it has narrowed the value to `Never`, so reaching
    # it at run time is impossible by the same check that admits it.  Adding a
    # case without dispatching it fails the type check instead.
    "assert_never",
]
