[build-system]
# The SPDX-string `license` below is PEP 639, which setuptools implements
# from 77.0; older versions reject it as invalid pyproject config.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "esolangs"
version = "0.3.0"
description = "A comprehensive collection of esoteric programming language interpreters"
authors = [{name = "Bangyen Pham", email = "bangyenp@gmail.com"}]
license = "GPL-3.0-or-later"
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Interpreters",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
keywords = ["esoteric", "programming", "languages", "interpreters", "brainfuck", "esolangs"]
dependencies = [
    "sympy>=1.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=4.0.0",
    "pytest-xdist>=3.8.0",
    "pytest-timeout>=2.3",
    "click>=8.3.3",
    "pygments>=2.20.0",
    "urllib3>=2.7.0",
    "ruff==0.16.5",
    "mypy==2.3.1",
    "pre-commit>=3.0.0",
    "types-requests",
    "types-setuptools",
    "z3-solver>=4.15.0",
    # Was pinned to 3.3.1 against a class-method selection bug; 3.7.0 does not
    # have it, and fixes one of its own.  See scripts/mutate_one.py.
    "mutmut==3.7.0",
]

[project.urls]
Homepage = "https://github.com/bangyen/esolangs"
Repository = "https://github.com/bangyen/esolangs"
Issues = "https://github.com/bangyen/esolangs/issues"

[project.scripts]
esolangs = "esolangs.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["esolangs*"]
exclude = ["tests*", "examples*", "docs*"]

[tool.setuptools.package-data]
# The example programs ship with the package.  They lived at the repository
# root, which left them out of the wheel, so `describe(...)["examples"]` was
# populated from a checkout and empty from an install, with nothing to say
# which you had.
esolangs = ["py.typed", "examples/*.md", "examples/*.txt"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
    "PT",  # flake8-pytest-style
    "D",   # pydocstyle
    "RET", # flake8-return
    "N",   # pep8-naming
    "FBT", # flake8-boolean-trap
    "A",   # builtin shadowing
    "ARG", # unused arguments
    "SLF", # private member access
]
ignore = [
    "C901",  # too complex
    "D203",  # conflicts with D211 (blank line before class)
    "D213",  # conflicts with D212 (multi-line summary placement)
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
# The leak sweep imports the package under test, so it has to extend
# sys.path before those imports can resolve.
"scripts/verify_no_exception_leaks.py" = ["E402"]
# Test files are exempt from docstring requirements: test method and class
# names are self-documenting, so the D rules would only add boilerplate.
"tests/**/*.py" = ["D", "N802"]
# CV(N)(C)'s source code *is* IPA, so the ambiguous-unicode rules fire on
# every command in the language: the fricative is U+03B8 GREEK SMALL LETTER
# THETA, the multiplication plosive U+0261 LATIN SMALL LETTER SCRIPT G, and
# so on.  Here the confusable character is the correct one -- these rules
# catch a homoglyph typed by mistake, and there is no non-IPA spelling to
# prefer -- so they are off for the files that spell the language.  That
# includes tests/samples.py, which is otherwise language-agnostic but
# holds one CV(N)(C) program in its per-language table.
"src/esolangs/interpreters/other/cvnc.py" = ["RUF001", "RUF002", "RUF003"]
"src/esolangs/tools/cvnc.py" = ["RUF001", "RUF002", "RUF003"]
"tests/interpreters/test_cvnc.py" = ["D", "N802", "RUF001", "RUF002", "RUF003"]
"tests/samples.py" = ["D", "N802", "RUF001", "RUF002", "RUF003"]

[tool.mypy]
strict = true
python_version = "3.12"
# scripts/ is CI infrastructure (the verification and installer checks), so
# it is type-checked alongside the package itself.
files = ["src", "scripts"]
exclude = ["\\.venv/", "build/", "dist/"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = false  # pytest's decorators are untyped
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
# sympy ships no inline types.
module = ["sympy"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--verbose",
    "--tb=short",
    # Four workers.  This was two, on the argument that a higher count
    # saturates a 10-core machine and makes the desktop unusable while the
    # suite runs -- the cost that actually gets paid on an interactive box.
    # Four is the revision of that trade, not its abandonment: it leaves
    # six cores, and the band that pays for it is the whole-suite run.
    # Measured on the same tree and the same test set: `just test-full`
    # spent 363.7s in pytest at two workers and 251.3s at four, 400s of
    # wall against 290s.  Deferring the `weekly` marker took it to 212.9s.
    # The tier split below is what keeps the inner loop cheap either way:
    # it is the `fast` band, 48.7s of test time rather than the 193.8s it
    # was when every execution sweep and subprocess ran on every invocation.
    # CI passes "-n auto" explicitly, so it is unaffected by this default.
    # Override per-run with "-n auto", "-n 8", or "-n 0" on the command line.
    "-n",
    "4",
    # A hang never reaches the duration policy, so every test also carries a
    # hard stop: `tests/conftest.py` sets it per band from
    # `tests/duration_policy.HARD_CEILINGS`.  The thread method, not the
    # signal one: `esolangs.run` owns SIGALRM and ITIMER_REAL and a test
    # asserts the timer is disarmed after it.  A stuck test therefore takes
    # its xdist worker down, and the report names it, rather than the job's
    # 15-minute limit killing the whole run without a name.
    "--timeout-method=thread",
]
markers = [
    # The top tier, and the only one CI deselects.  353 of 10865 tests that
    # cost 289s locally at two workers against the 81s the other 10314 take,
    # so per-PR CI runs `-m "not slow"` and
    # `.github/workflows/weekly.yml` runs the whole suite on a schedule.
    # `just test` and `just test-full` do not deselect it locally.
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    # A tier above `slow`, and a cost tier rather than a kind: two tests are
    # 142.6s of the slow band's ~182s at four workers, and the other 347 are
    # ~40s between them.  Measured with `--durations=0`, not estimated.
    #
    # Each is a high-arity probe of a claim documented elsewhere -- every
    # generator raising only `EsolangError` at twelve inputs, `%^2^-1`
    # reaching a generic thirteen-input table, Factor's thirteen-input
    # program decoding past its retired digit budget -- so they are evidence for
    # `proofs.md` and `limitations.md` and are not deletable.  What they are
    # not is *per-run* evidence: none has ever failed on a change that
    # the rest of the band passed, and each probes an arity nothing else in
    # the suite reaches, so a week is the right sampling interval.
    #
    # `just test-full` and per-PR CI deselect this; `.github/workflows/
    # weekly.yml` runs bare `pytest -n auto` and so picks it up by
    # deselecting nothing.  Run one by hand with `-m weekly`.
    "weekly: the high-arity probes, left to the weekly workflow",
    # The middle tier.  The rule is behavioural, not a stopwatch reading: a
    # test is `medium` if it runs a generated program through an interpreter
    # or drives the CLI (or git) as a subprocess.  That is what costs whole
    # seconds -- the inner loop keeps every generator's structural assertion
    # and every interpreter's own unit tests, and pays for execution once a
    # commit is in sight.  `just test-quick` deselects it; `just test` and CI
    # do not -- CI stops at the `slow` band above.
    "medium: runs a generated program or a subprocess (deselect for the inner loop)",
    "integration: marks tests as integration tests",
    "interpreter: marks tests for specific interpreters",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
    "ignore:.*found in sys.modules.*:RuntimeWarning",
]

[tool.coverage.run]
source = ["src/esolangs"]
# Python 3.12's sys.monitoring costs a fraction of what the trace-function
# backend does: measured over this suite, 0.9s of overhead instead of 11.5s,
# reporting the same 15295 statements either way.  coverage falls back to the
# C tracer automatically on older interpreters.
core = "sysmon"
omit = [
    "*/__pycache__/*",
    "*/migrations/*",
    "*/venv/*",
    "*/env/*",
    "*/ENV/*",
    "*/env.bak/*",
    "*/venv.bak/*",
    "*/_template.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
    # Imports guarded by TYPE_CHECKING exist for the type checker and are
    # never executed, so they can only ever read as uncovered.
    "if TYPE_CHECKING:",
    # An `assert_never` arm is the type checker's exhaustiveness proof: mypy
    # only accepts it where it has narrowed the value to `Never`, so reaching
    # it at run time is impossible by the same check that admits it.  Adding a
    # case without dispatching it fails the type check instead.
    "assert_never",
]

# A condition that is always true where it stands, but whose body is live and
# must stay measured.  `exclude_lines` is the wrong tool for these: it drops
# the whole block, hiding real code.  `partial_branches` retires only the
# untaken arc.
partial_branches = [
    "pragma: no branch",
]
