[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "esolangs"
version = "0.1.0"
description = "A comprehensive collection of esoteric programming language interpreters and compilers"
authors = [{name = "Bangyen Pham", email = "bangyenp@gmail.com"}]
license = "GPL-3.0-or-later"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Interpreters",
    "Topic :: Software Development :: Compilers",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
keywords = ["esoteric", "programming", "languages", "interpreters", "compilers", "brainfuck", "esolangs"]
dependencies = [
    "numpy>=1.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=4.0.0",
    "black==26.3.1",
    "click>=8.3.3",
    "pygments>=2.20.0",
    "urllib3>=2.7.0",
    "unicorn>=2.1.4",
    "ruff>=0.0.280",
    "mypy>=1.0.0",
    "pre-commit>=3.0.0",
    "types-requests",
    "types-setuptools",
]

[project.urls]
Homepage = "https://github.com/bangyen/esolangs"
Repository = "https://github.com/bangyen/esolangs"
Issues = "https://github.com/bangyen/esolangs/issues"

[project.scripts]
esolangs = "esolangs.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["esolangs*"]
exclude = ["tests*", "examples*", "docs*"]

[tool.black]
line-length = 88
target-version = ['py38']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  | extra
)/
'''

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
    "PT",  # flake8-pytest-style
    "D",   # pydocstyle
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
    "E402",  # module level import not at top of file (for __main__ blocks)
    "D203",  # conflicts with D211 (blank line before class)
    "D213",  # conflicts with D212 (multi-line summary placement)
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"**/__main__.py" = ["E402"]
# Docstring presence is enforced on the public modules; the legacy esolang
# implementations, the tests, and the scripts are exempt so they can be
# documented incrementally.
"src/esolangs/interpreters/**/*.py" = ["D"]
"src/esolangs/compilers/**/*.py" = ["D"]
"src/esolangs/tools/*.py" = ["D"]
"tests/**/*.py" = ["D"]
"scripts/*.py" = ["D"]

[tool.mypy]
python_version = "3.10"
files = ["src"]
exclude = ["\\.venv/", "build/", "dist/"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = false  # Relaxed for existing codebase
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

# The legacy esolang implementations are deliberately terse, untyped
# dispatchers; they are grandfathered here so the typing rules apply to the
# public API, tools, tests, and any new code. Annotate them incrementally.
[[tool.mypy.overrides]]
module = [
    "esolangs.interpreters.*",
    "esolangs.compilers.*",
    "esolangs.tools.generate",
    "esolangs.tools.boolean",
    "esolangs.tools._polynomial",
    "esolangs.tools._ztoalc",
    "tests.*",
    "make_coverage_badge",
    "make_ztoalc_table",
    "riscv_elf_runner",
    "riscv_sim",
    "verify",
    "verify_123_differential",
    "verify_123_unicorn",
    "verify_asm_compilers",
    "verify_x86_generators",
    "x86_elf_runner",
]
disallow_untyped_defs = false
ignore_missing_imports = true  # For external dependencies
explicit_package_bases = true  # Handle duplicate module names

# Fully typed legacy modules: listed after the wildcard above so the stricter
# setting wins, keeping the typing work visible and incremental.
[[tool.mypy.overrides]]
module = [
    "esolangs.interpreters.stack_based.bfstack",
    "esolangs.interpreters.tape_based.excon",
    "esolangs.interpreters.register_based.bio",
    "esolangs.interpreters.tape_based.suffolk",
    "esolangs.interpreters.tape_based.minifuck",
    "esolangs.interpreters.register_based.huf",
    "esolangs.interpreters.tape_based.circlefuck",
    "esolangs.interpreters.other.bitdeque",
    "esolangs.interpreters.tape_based.6-5",
    "esolangs.interpreters.register_based.RAM0",
    "esolangs.interpreters.other.keys",
    "esolangs.interpreters.register_based.WII2D",
    "esolangs.interpreters.tape_based.back",
    "esolangs.interpreters.tape_based.ascii-art",
    "esolangs.interpreters.register_based.lightlang",
    "esolangs.interpreters.tape_based.brainif",
    "esolangs.interpreters.stack_based.modulous",
    "esolangs.interpreters.register_based.movesum",
    "esolangs.interpreters.register_based.sophie",
    "esolangs.interpreters.other.clockwise",
    "esolangs.interpreters.register_based.minsky-swap",
    "esolangs.interpreters.stack_based.temporary",
    "esolangs.interpreters.register_based.dig",
    "esolangs.interpreters.register_based.polynomial",
    "esolangs.interpreters.other.container",
    "esolangs.interpreters.register_based.dsdlai",
    "esolangs.interpreters.register_based.dotlang",
    "esolangs.interpreters.tape_based.mammalian",
    "esolangs.interpreters.register_based.qoibl",
    "esolangs.interpreters.other.ztoalc",
    "esolangs.interpreters.stack_based.eval",
    "esolangs.interpreters.other.nevermind",
]
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--verbose",
    "--tb=short",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "interpreter: marks tests for specific interpreters",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
    "ignore:.*found in sys.modules.*:RuntimeWarning",
]

[tool.coverage.run]
source = ["src/esolangs"]
omit = [
    "*/__pycache__/*",
    "*/migrations/*",
    "*/venv/*",
    "*/env/*",
    "*/ENV/*",
    "*/env.bak/*",
    "*/venv.bak/*",
    "*/_template.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
