[build-system]
# The SPDX-string `license` below is PEP 639, which setuptools implements
# from 77.0; pin the measured backend so rebuilding a tag uses the same tool.
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "esolangs"
version = "0.10.0"
description = "A curated collection of esoteric programming language interpreters"
authors = [{name = "Bangyen Pham", email = "bangyenp@gmail.com"}]
license = "GPL-3.0-or-later"
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Software Development :: Interpreters",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
keywords = ["esoteric", "programming", "languages", "interpreters", "brainfuck", "esolangs"]
dependencies = []

[project.optional-dependencies]
image = ["Pillow>=11.3.0"]
math = [
    "sympy>=1.12.0",
]

# PEP 735: development tooling is not an installable extra, so its exact pins
# stay out of the published METADATA.  `uv sync` installs this group by
# default; `uv sync --group dev` says so explicitly.
[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=4.0.0",
    "pytest-xdist>=3.8.0",
    "pytest-timeout>=2.3",
    "click>=8.3.3",
    "pygments>=2.20.0",
    "urllib3>=2.7.0",
    "ruff==0.16.10",
    "mypy==2.4.0",
    # Required by verify.py's duplicate-code check.
    "pylint>=3.0.0",
    "pre-commit>=3.0.0",
    "types-requests",
    "types-setuptools",
    "sympy>=1.12.0",
    "Pillow>=11.3.0",
    "z3-solver>=4.15.0",
]

[project.urls]
Homepage = "https://github.com/bangyen/esolangs"
Repository = "https://github.com/bangyen/esolangs"
Issues = "https://github.com/bangyen/esolangs/issues"
Changelog = "https://github.com/bangyen/esolangs/blob/main/CHANGELOG.md"

[project.scripts]
esolangs = "esolangs.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["esolangs*"]
exclude = ["tests*", "examples*", "docs*"]

[tool.setuptools.package-data]
# The example programs ship with the package.  They lived at the repository
# root, which left them out of the wheel, so `describe(...)["examples"]` was
# populated from a checkout and empty from an install, with nothing to say
# which you had.
esolangs = ["py.typed", "examples/*.md", "examples/*.txt", "examples/*.png"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
    "PT",  # flake8-pytest-style
    "D",   # pydocstyle
    "RET", # flake8-return
    "N",   # pep8-naming
    "FBT", # flake8-boolean-trap
    "A",   # builtin shadowing
    "ARG", # unused arguments
    "SLF", # private member access
]
ignore = [
    "C901",  # too complex
    "D203",  # conflicts with D211 (blank line before class)
    "D213",  # conflicts with D212 (multi-line summary placement)
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
# The leak sweep imports the package under test, so it has to extend
# sys.path before those imports can resolve.
"checks/verify_no_exception_leaks.py" = ["E402"]
# Test files are exempt from docstring requirements: test method and class
# names are self-documenting, so the D rules would only add boilerplate.
"tests/**/*.py" = ["D", "N802"]
# CV(N)(C)'s source code *is* IPA, so the ambiguous-unicode rules fire on
# every command in the language: the fricative is U+03B8 GREEK SMALL LETTER
# THETA, the multiplication plosive U+0261 LATIN SMALL LETTER SCRIPT G, and
# so on.  Here the confusable character is the correct one -- these rules
# catch a homoglyph typed by mistake, and there is no non-IPA spelling to
# prefer -- so they are off for the files that spell the language.  That
# includes tests/support/samples.py, which is otherwise language-agnostic but
# holds one CV(N)(C) program in its per-language table.
"src/esolangs/interpreters/other/cvnc.py" = ["RUF001", "RUF002", "RUF003"]
"src/esolangs/tools/cvnc.py" = ["RUF001", "RUF002", "RUF003"]
"tests/interpreters/test_cvnc.py" = ["D", "N802", "RUF001", "RUF002", "RUF003"]
"tests/support/samples.py" = ["D", "N802", "RUF001", "RUF002", "RUF003"]

[tool.mypy]
strict = true
python_version = "3.12"
# scripts/ is CI infrastructure (the verification and installer checks), so
# it is type-checked alongside the package itself.
files = ["src", "scripts", "checks"]
exclude = ["\\.venv/", "build/", "dist/"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = false  # pytest's decorators are untyped
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
# sympy ships no inline types.
module = ["sympy"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--verbose",
    "--tb=short",
    # Four workers.  This was two, on the argument that a higher count
    # saturates a 10-core machine and makes the desktop unusable while the
    # suite runs -- the cost that actually gets paid on an interactive box.
    # Four is the revision of that trade, not its abandonment: it leaves
    # six cores, and the band that pays for it is the whole-suite run.
    # Measured on the same tree and the same test set: `just test-full`
    # spent 363.7s in pytest at two workers and 251.3s at four, 400s of
    # wall against 290s.  Deferring the `weekly` marker took it to 212.9s.
    # The tier split below is what keeps the inner loop cheap either way:
    # it is the `fast` band, 48.7s of test time rather than the 193.8s it
    # was when every execution sweep and subprocess ran on every invocation.
    # CI passes "-n auto" explicitly, so it is unaffected by this default.
    # Override per-run with "-n auto", "-n 8", or "-n 0" on the command line.
    "-n",
    "4",
    # The schedule, not the worker count, was the band's real bound. The
    # default "load" hands out fixed-size chunks up front, so a worker that
    # draws several of the 8-16s Malbolge probes is still going long after
    # the others have run dry -- the tail is idle workers, not work.
    # Measured on one tree, `-m "not weekly"`, 11752 passing every time:
    # at four workers 193.5s on load against 126.9s on worksteal, and at
    # `-n auto` (ten) 173.7s against 85.6s. Going 4 -> 10 workers buys 11%;
    # changing the schedule at four buys 34%, and keeps the six free cores
    # the comment above is about.
    #
    # Adopting it first needed the bug it found. worksteal only changes
    # which worker gets a test, and that put two tests in one process for
    # the first time: one shrinks `_WORK_BUDGET` to exercise an exhausted
    # build, and `_geometry` is `@cache`d and budgets its reference run
    # from that constant -- so it cached its fallback and every later
    # three-input template came out longer. See
    # `test_an_exhausted_work_budget_is_declined`, which now invalidates
    # the cache and asserts it did.
    "--dist",
    "worksteal",
    # A hang never reaches the duration policy, so every test also carries a
    # hard stop: `tests/conftest.py` sets it per band from
    # `tests/duration_policy.HARD_CEILINGS`.  The thread method, not the
    # signal one: `esolangs.run` owns SIGALRM and ITIMER_REAL and a test
    # asserts the timer is disarmed after it.  A stuck test therefore takes
    # its xdist worker down, and the report names it, rather than the job's
    # 15-minute limit killing the whole run without a name.
    "--timeout-method=thread",
]
markers = [
    "cost_evidence(regression): unique regression bought by a weekly test",
    # Most of the suite's runtime; per-PR CI shards it, local runs skip it.
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    # High-arity probes backing docs/proofs and limitations.md.  Too slow
    # per PR; only the weekly workflow (bare `pytest`) runs them.
    "weekly: the high-arity probes, left to the weekly workflow",
    # Runs a generated program or a subprocess; `just test-quick` skips it.
    "medium: runs a generated program or a subprocess (deselect for the inner loop)",
    "integration: marks tests as integration tests",
    "interpreter: marks tests for specific interpreters",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
    "ignore:.*found in sys.modules.*:RuntimeWarning",
]

[tool.coverage.run]
source = ["src/esolangs"]
# Python 3.12's sys.monitoring costs a fraction of what the trace-function
# backend does: measured over this suite, 0.9s of overhead instead of 11.5s,
# reporting the same 15295 statements either way.  coverage falls back to the
# C tracer automatically on older interpreters.
core = "sysmon"
omit = [
    "*/__pycache__/*",
    "*/migrations/*",
    "*/venv/*",
    "*/env/*",
    "*/ENV/*",
    "*/env.bak/*",
    "*/venv.bak/*",
    "*/_template.py",
    "*/__main__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
    # Imports guarded by TYPE_CHECKING exist for the type checker and are
    # never executed, so they can only ever read as uncovered.
    "if TYPE_CHECKING:",
    # An `assert_never` arm is the type checker's exhaustiveness proof: mypy
    # only accepts it where it has narrowed the value to `Never`, so reaching
    # it at run time is impossible by the same check that admits it.  Adding a
    # case without dispatching it fails the type check instead.
    "assert_never",
]

# A condition that is always true where it stands, but whose body is live and
# must stay measured.  `exclude_lines` is the wrong tool for these: it drops
# the whole block, hiding real code.  `partial_branches` retires only the
# untaken arc.
partial_branches = [
    "pragma: no branch",
]
