repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # The recorded output matches its generator exactly, trailing spaces
      # included -- Alight pads a turn's column and the generator emits it.
      # Both paths: the files live under src/ so they ship in the wheel, and
      # `examples/` at the root is a symlink to them.  While this said only
      # `^examples/` the hook stripped the real files and
      # test_boolean_example_matches_generator caught it.
      - id: trailing-whitespace
        exclude: ^(src/esolangs/)?examples/
      - id: end-of-file-fixer
        exclude: ^(src/esolangs/)?examples/
      - id: check-yaml
        args: ['--unsafe']  # Allow custom YAML tags
      - id: check-added-large-files
        args: ['--maxkb=1000']  # Allow larger files for esolang examples
      - id: check-merge-conflict
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: debug-statements
      - id: check-docstring-first

  - repo: https://github.com/charliermarsh/ruff-pre-commit
    rev: v0.16.5
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  # No mypy hook.  The mirror runs in an isolated env, so it could only ever
  # reach ``src/`` -- ``scripts/`` imports esolangs and urllib3, which are
  # not there -- while ``uv run mypy`` covers ``src`` and ``scripts`` under
  # the same strict pyproject config in the project env.  Keeping both
  # type-checked ``src/`` twice and pinned mypy in two places.

  - repo: local
    hooks:
      - id: check-hook-pins
        name: Check hook revs match pyproject pins
        entry: python3 scripts/check_hook_pins.py
        language: system
        files: ^(\.pre-commit-config\.yaml|pyproject\.toml)$
        pass_filenames: false
      - id: check-interpreter-syntax
        name: Check interpreter syntax
        entry: python3 -m py_compile
        language: system
        files: ^src/esolangs/.*\.py$
        pass_filenames: true
