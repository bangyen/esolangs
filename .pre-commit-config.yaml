repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^examples/  # Generated programs match the generator exactly
      - id: end-of-file-fixer
        exclude: ^examples/  # Generated programs match the generator exactly
      - id: check-yaml
        args: ['--unsafe']  # Allow custom YAML tags
      - id: check-added-large-files
        args: ['--maxkb=1000']  # Allow larger files for esolang examples
      - id: check-merge-conflict
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: debug-statements
      - id: check-docstring-first

  - repo: https://github.com/charliermarsh/ruff-pre-commit
    rev: v0.16.2
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.0
    hooks:
      - id: mypy
        # The mirror's default --ignore-missing-imports would suppress the
        # sympy import-untyped error and trip warn_unused_ignores, so pass no
        # extra flags and rely on the pyproject strict config, scoped to src/.
        # scripts/ is also checked (see `files` in pyproject), but not here:
        # it imports esolangs, unicorn, and urllib3, none of which exist in
        # this hook's isolated env.  The `mypy` step in CI's lint job and
        # `just lint-python` cover it instead.
        args: []
        additional_dependencies: [types-requests, types-setuptools, sympy]
        files: ^src/

  - repo: local
    hooks:
      - id: check-interpreter-syntax
        name: Check interpreter syntax
        entry: python3 -m py_compile
        language: system
        files: ^src/esolangs/.*\.py$
        pass_filenames: true
