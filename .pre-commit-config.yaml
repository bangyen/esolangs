repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # language-owners: ["Alight"]
      # The recorded output matches its generator exactly, trailing spaces
      # included -- Alight pads a turn's column and the generator emits it.
      # Both paths: the files live under src/ so they ship in the wheel, and
      # `examples/` at the root is a symlink to them.  While this said only
      # `^examples/` the hook stripped the real files and
      # test_boolean_example_matches_generator caught it.  Wiki examples are
      # verbatim too (each language's tests/cases.toml): a 2D program's
      # padding and an output's last byte count.
      - id: trailing-whitespace
        exclude: ^(src/esolangs/languages/[^/]+/([^/]+\.(txt|png|gz)$|tests/fixtures/|tests/cases\.toml$)|tests/support/fixtures/)
      - id: end-of-file-fixer
        exclude: ^(src/esolangs/languages/[^/]+/([^/]+\.(txt|png|gz)$|tests/fixtures/|tests/cases\.toml$)|tests/support/fixtures/)
      - id: check-yaml
        args: ['--unsafe']  # Allow custom YAML tags
      - id: check-added-large-files
        args: ['--maxkb=1000']  # Allow larger files for esolang examples
      - id: check-merge-conflict
      - id: check-json
      - id: check-toml
      - id: check-docstring-first

  # Ruff runs from the project env, so its version is pyproject.toml's pin
  # and cannot drift from what `uv run ruff` uses.
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: uv run --frozen ruff check --force-exclude --fix --exit-non-zero-on-fix
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: ruff-format
        name: ruff-format
        entry: uv run --frozen ruff format --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true

  # No mypy hook.  The mirror runs in an isolated env, so it could only ever
  # reach ``src/`` -- ``scripts/`` imports esolangs and urllib3, which are
  # not there -- while ``uv run mypy`` covers ``src`` and ``scripts`` under
  # the same strict pyproject config in the project env.  Keeping both
  # type-checked ``src/`` twice and pinned mypy in two places.

  - repo: local
    hooks:
      - id: check-doc-links
        name: Check internal Markdown links
        entry: python3 checks/check_doc_links.py
        language: system
        files: \.md$
        pass_filenames: false
