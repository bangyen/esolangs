# Language-owned data, one section per dataset; aggregators read
# only their own section and skip this file when it is absent.

[deep_arities]
# Normalized gates start at nine; both three-rung parity windows need
# fourteen.
linearity = 14

[curation]
backlinks = 76
bf_derivative = true

[proof_status]
labels = ["tree"]
qualification = "each input byte's low bit is read onto its own cell and tested in place by a flip-only decision tree, one flag interleaved beside each bit, consuming and emitting complete bytes; repeated residuals use level flags or normalized AND/XOR bodies, and affine tables stream through one accumulator"
scaling = "linear: geometric tree walk; affine tables use O(n) characters"
execution = "poly n: worst 2n^2 + 27n + 8 commands; reads shuttle to scratch"
workspace = "poly n: at most bl(L-1) + max(12, bl(2n-2)+10) + n + Σ_{i<n} bl(i) + bl(2n) + bl(n) bits"
evidence = "docs/proofs/boolfuck-gates.md"

