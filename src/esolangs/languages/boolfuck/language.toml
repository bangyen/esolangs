[ablations.affine_stream]
saving = 84.8
arity = 12
verdict = "kept: an affine table streams through one input and an accumulator instead of the tree. 0.0% on random tables at every arity (a random table is never affine), 75.1% / 78.4% / 79.1% / 84.8% on random affine tables at n=8/9/10/12 and rising; parity at n=10 is 175 chars, and constant tables (affine with no coefficients) save 57.6% at n=8 rising to 68.1% at n=12; plain-rewrite audit 2026-10-27: kept under the named-function rule, every changed program run. Random tables: 0 of 200 change at n=6..8 (1 of 200 at n=4, 0.2%), 0 of 40 / 20 at n=9..14. Parity 50.0 / 54.1 / 55.7 / 57.2 / 59.7 / 61.8% at n=4/6/7/8/10/12; random affine tables (20 per arity) 65.6 / 71.7 / 75.9 / 78.8 / 82.8% at n=6/7/8/10/12, rising"

[ablations.normal_gates]
saving = 29.1
arity = 12
verdict = "kept: two-input cofactors normalize to shared AND/XOR gates behind a prefix tree. Race marginal on random tables 21.5% / 25.7% / 26.9% / 29.1% at n=8/9/10/12 and rising (seed set 2: 26.2% / 29.4% at n=10/12). The comments' 40-table figures (9.6% / 13.1% / 23.3% at n=6/7/8, and 9.2% / 21.2% at n=7/8 in the entry point) measure 11.0% / 8.6% / 22.5% on a seeded 40-table reconstruction: same magnitude, not exact, corpora unstated; the n=5 figure (6.6%) describes a build the shipped code refuses below n=6. 2026-10-20: the race starts at n=4, where the workspace proof does: on 25 tables a size (20 seeded random, Random(1000 + n), plus zeros, AND, parity, majority, one projection) the gates are never larger and save 8.9% / 3.5% at n=4/5, the 200-table five-input sample 85,789 -> 80,762; plain-rewrite audit 2026-10-27: kept, every changed program run. Under the ledger's admission clause (2026-10-27): 13.2 / 14.5 / 18.9 / 21.7% on 200 random tables at n=4/6/7/8, 25.9 / 27.2% on 20 at n=10/12, clearing the bar at every arity. Before it, under the tree's bound: Random tables, 200 at n=4/6/7/8: 5.1 / 9.3 / 9.9 / 21.7% (190 of 200 change at n=8), then 25.4 / 26.6 / 27.7 / 28.8 / 30.2% at n=9/10/11/12/14 (40, 40, 20, 20, 20 tables), still rising. 0% on parity, majority, and, or (the class builds win); 57.8-61.7% on parity with two flipped rows at n=8..12"

[ablations.shared_blocks]
saving = 0.0
arity = 12
seed = "random.Random(20261028000 + 7n)"
tables = "20 random per n=7,8 plus parity/majority/and/or/one-third threshold at n=7..12"
verdict = "retired 2026-10-28 (random + named bar): deferring repeated residuals to unused level flags changes no program on 20 random tables at n=7 and n=8 (0.0% of chars and of balanced area) nor on parity, majority, and, or and a one-third threshold at n=7..12 (0.0%, both metrics). Only guarded affine tables moved (random affine residual under a prefix guard of three bits, 5 per arity: 2.9% / 19.9% / 29.2% at n=8/10/12), an ad-hoc class that keeps nothing. Code deleted: the shared-blocks candidate of boolfuck() and the shared_blocks parameter of _boolfuck_tree (which now returns the program alone); the shared flag-tree helpers stay, others use them. Deleting it exposed the missing ignored-input fold (the catalogue probe failed), shipped with it as essential_projection. Baseline: two pinned tables move (1101001101101101 at n=4, 146 -> 143 commands, 234 -> 245 source units, from the retirement; 00001100, 89 -> 75 commands, 98 -> 80 units, from the projection); the five-input sample total 73,581 -> 73,894 (+0.43%); the n=4 maximum 265 -> 266. Every program ran on all rows (n<=3 exhaustive, 20 random + named n=4..8, 0 mismatches)"

[ablations.essential_projection]
saving = 18.6
arity = 8
verdict = "kept: canonical, exempt; an ignored input is read whole into scratch and the tree and the gates run over the essential inputs only (shipped 2026-10-28 with the shared_blocks retirement: that build had been covering ignored inputs, and the catalogue's ignored-input probe failed without it). A dense seven-input table lifted by one ignored input at n=8: last position 1,403 chars (shared build) -> 1,753 (shared build deleted) -> 1,142 (projection), against 1,134 for the inner table; position 3 1,230 -> 1,230 -> 1,142; position 0 1,177 -> 1,177 -> 1,144. A random seven-input table lifted likewise: last position 1,353 -> 1,963 -> 1,158 (14.4% under the old build), first position 1,193 -> 1,193 -> 1,160. Random and named tables have no ignored input and do not change"

[ablations.command_bound]
saving = 33.5
arity = 7
verdict = "kept: proof machinery and a size win at small arity. Candidates are admitted up to the ledger's execution clause, 4n^2 + 30n + 8 commands (attained by the count build), so the clause holds by construction. Re-measured 2026-10-30 on the current generator (shared builds retired 2026-10-28), lowering the bound to the tree's own 2n^2 + 27n + 8 (the clause stays: the count build sets it): random tables, Random(1000n + s).getrandbits(1 << n), s < 20, grow 12.0 / 14.7 / 10.9 / 33.5 / 7.9% at n=4/5/6/7/8 (14/9/6/12/3 of 20 tables change) and 0% at n=9/10 (0 of 20), balanced area 11.4 / 13.8 / 10.8 / 32.8 / 7.8%; parity, majority, and, or, nand, nor and three thresholds at n=7..12 are byte-identical, default and balanced. Clears the bar at n=7 (33.5%, the peak) on random tables; the saving is gates refused by the tighter bound, so it vanishes by n=9. Every program of both builds run on all rows (random n=4..10, named n=7..10; 0 failures), a flipped table fails the old build. 2026-10-27: raised from 2n^2 + 27n + 8; 2026-10-28: the shared-blocks candidate it also admitted is retired, so the parity-with-flips figures that justified it are gone. The cost is the scaling clause's exactness at n=4..7: the tree's maximum C is no longer reached (n=4, all 65,536 tables: 265 against 337, 266 after shared_blocks retired), so C stands as an upper bound there"

[ablations.constant_fold]
saving = 0.0
arity = 12
verdict = "kept: canonical, exempt, and emission-neutral in this dialect. Disabling the fold test for spans of 2 or more changes random totals by 0.2% at n=8 and 0.0% at n=9/10/12: a constant subtree's halves always agree, so the identical-halves collapse emits it through the same leaf path and the fold is only a descent shortcut. Its independent residue is the fold_zero guarded form, live only in the shared-blocks build: forcing it off costs 1.5-10.9% / 4.5-9.1% / 4.0-10.3% on guarded affine tables at n=8/10/12 (five cells of 20, flat, not rising), 2.0% on 40 random tables at n=8 and 0% at n=10/12, and 4.9-7.4% on parity with two or eight flipped rows at n=8..12 once the shared build is admitted there, flat and below the bar, kept as the canonical fold's residue (re-measured 2026-10-27; the earlier 5.4% / 6.7% on 'noisy affine' at n=10/12 named no corpus). 2026-10-28: the shared-blocks build that carried the fold_zero residue is retired, so the residue is gone with it"

[ablations.identical_halves_collapse]
saving = 32.7
arity = 12
verdict = "kept: canonical, exempt; a subtree whose halves are identical is emitted once, the input skipped for that subtree. Priced jointly with the constant fold (emission-neutral beside it, above) in the plain build: 31.6% / 32.4% / 32.7% on random tables at n=8/10/12, 0.7 / 0.2 / 0.0% on parity with two flipped rows and 2.7 / 0.7 / 0.2% with eight at n=8/10/12 (20 each, plain build; the earlier 69.8% on 'noisy affine' named no corpus and does not reproduce; random tables re-measure 31.1 / 32.3 / 32.7%), 95.7% on affine tables in plain context, 99.4% on constant tables"

[ablations.popcount_stream]
saving = 94.6
arity = 12
verdict = "kept as a class rule, landed 2026-10-21: a symmetric table (its output depends only on the inputs' popcount) streams its bytes into a unary count track and decides from the count alone, raced per table against the other builds. Removing it costs 0.0% on random tables at n=10/12 (seeds 184700 / 777000) -- the class does not occur there, 0 of 600 tables -- and 85.1% / 94.6% within the symmetric class at n=10/12, 19.2% / 18.5% on structured+named; majority falls 26,656 -> 356 chars at n=12. Symmetry is a property of the table, active at every arity, and the within-class share rises with arity. Its executed commands are exact (4n^2 + 30n + 15 worst), past the tree's bound, so the execution formula states the max of the two. Priced from the superoptimizer pilot's Boolfuck review: the miner's finds attacked the I/O shell and died, and this accumulation construction was its unpriced loose thread; plain-rewrite audit 2026-10-27: kept, every changed program run. Random tables: 0 of 200 change at n=4..8, 0 of 40 / 20 at n=9..14. Majority 29.4 / 59.0 / 80.9 / 87.9 / 95.8 / 98.7% at n=4/6/7/8/10/12, and 11.8 / 22.6 / 26.8 / 30.6 / 36.9 / 42.1%, or 30.8 / 43.7 / 48.3 / 52.1 / 58.3 / 63.0%; random symmetric tables (20 per arity) 68.4 / 84.1 / 87.4 / 95.0 / 98.5% at n=6/7/8/10/12"

