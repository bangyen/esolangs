# Language-owned data, one section per dataset; aggregators read
# only their own section and skip this file when it is absent.

[deep_arities]
# Normalized gates start at nine; both three-rung parity windows need
# fourteen.
linearity = 14

[curation]
backlinks = 76
bf_derivative = true

[proof_status]
labels = ["tree"]
qualification = "each input byte's low bit is read onto its own cell and tested in place by a flip-only decision tree, one flag interleaved beside each bit, consuming and emitting complete bytes; repeated residuals use level flags or normalized AND/XOR bodies, affine tables stream through one accumulator, and symmetric tables stream their bytes into a unary population count and decide from the count alone"
scaling = "linear: worst C characters at n = 3, then at most C"
execution = "poly n: worst 4n^2 + 30n + 8 commands past n = 1: the all-ones row of a symmetric count table"
workspace = "poly n: at most bl(L-1) + max(12, bl(2n-3)+11) + n + Σ_{i<n} bl(i) + bl(2n) + bl(n) bits past n = 1"
evidence = "docs/proofs/boolfuck-gates.md"

