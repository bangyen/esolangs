[resource_evidence.execution]
expression = "4n^2 + 30n + 8"
exact = true
arities = [2, 3, 6]
first = 2
unit = "commands"
description = { growth = "poly n", claim = "worst", template = "{claim} {formula} {unit} past n = {previous}: the all-ones row of a symmetric count table" }

[resource_evidence.workspace]
expression = "bl(L-1)+bl(n)+(1-C)*bit_sum(n)+S*(12+bl(n))+13C+(1-S-C)*(max(12,bl(2n-3)+11)+n+bl(2n))"
source_terms = { names = ["C", "S"], provider = "esolangs.languages.boolfuck.proof_formulas:workspace_terms" }
exact = false
arities = [2, 3, 4, 6, 7, 8]
first = 2
unit = "bits"
description = { growth = "poly n", claim = "at most", template = "{claim} {formula} {unit}: C drains, S counts symmetrically" }

[resource_evidence.scaling]
# The finite three-input maximum, then the inherited upper envelopes.
#
# Zero-child pruning lowers the exhaustive n=3 maximum to 162, reached by
# parity with row 6 flipped. Larger arities retain their old nonexact caps;
# the unchanged normalized gate route supplies the envelope from n=9.
cases = [
    { through = 2, expression = "35T/2+2n²+12n-23" },
    { through = 3, expression = "162" },
    { through = 7, expression = "35T/2+2n²+12n-23" },
    { through = 8, expression = "35T/2+2n²+12n-11" },
    { expression = "85T/8+2n²+10n+39" },
]
exact = [3]
arities = [3, 4, 5, 6, 7, 8]
first = 3
unit = "characters"
description = { growth = "linear", claim = "worst", template = "{claim} {formula} (n=3 attained)" }

