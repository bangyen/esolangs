[ablations]
audited = "2026-10-19"

[ablations.essential_drop_tree]
saving = 14.5
arity = 4
verdict = "kept: canonical, exempt from the bar; saving on its ignored-input class (35.9% at n=3)"

[ablations.essential_drop_alternating]
saving = 47.3
arity = 9
verdict = "kept: canonical, exempt; saving on its ignored-input class (44.9% at n=8); 0.0% on random tables"

[ablations.leaf_input_selection]
saving = 43.5
arity = 9
verdict = "kept: canonical, exempt; the leaf-extension component of the alternating drop -- the tree levels' own skips are the residual 6.7%"

[ablations.leading_ignored_wrapper]
saving = 15.5
arity = 9
verdict = "kept: canonical, exempt; saving on its leading-ignored class (37.1% at n=8 -- the share declines at n=9)"

[ablations.constant_folding_tree]
saving = 15.8
arity = 4
verdict = "kept: canonical, exempt; saving on the ignored-input class, 18.8% on random tables at n=3"

[ablations.constant_span_alternating]
saving = 25.4
arity = 9
verdict = "kept: canonical, exempt; saving on the half-constant class (20.0% at n=8)"

[ablations.constant_column_race]
saving = 68.4
arity = 10
verdict = "kept: canonical, exempt; saving on the constant-table class"

[ablations.indexed_leaf_decoder]
saving = 96.8
arity = 12
verdict = "kept: clears on its mosaic class (88.0% at n=10, 200 tables); the execution ledger that refused it is removed: it refused three or more classes at n=8, four at n=9, five at n=10, four at n=11 (395 against 384), eight at n=12, costing 53.2% of area on random tables at n=8, 63.1% at n=9 and 94.6% on eight classes at n=12, to keep a constant of a bound whose growth the decoder keeps -- it runs at n <= 12 only, at most 265, 371, 435, 539, 561 commands"

[ablations.lane_and_parallel_sharing]
saving = 0.0
arity = 10
verdict = "split by decision 2026-10-20 (retirement candidate #2): the parallel route is removed and the lane route kept as the canonical realization -- 0.0% marginal each on every mosaic measured, 0.0-6.5% jointly beyond the indexed route"

[ablations.tree_max_race]
saving = 34.3
arity = 4
verdict = "kept: clears on random tables; the value is the alternating layout's admission at n=4 (the unshared layout alone reproduces the total), not the sharing routes'. Capped at n=4 until 2026-10-20; past it the trees win no random table but tables with one to three essential top inputs: 38.5-85.7% of length at n=5..10 (20 tables per cell, seed random.Random(n)), 0.8-19.8% with four"

[ablations.length_keyed_races]
saving = -2.3
arity = 3
verdict = "retired 2026-10-20: the layout races key by area, then length (_dig_size), as the bar judges grids; 2.2% of area over the 256 n=3 tables (+0.4% length), 0.2% at n=4, ties at n=5..8"

[ablations.banded_default]
saving = 0.0
arity = 8
verdict = "retired 2026-10-21 (plain-rewrite audit): the two-band tree stays a width candidate only; as a default candidate it saved 9.4% of area over the 256 n=3 tables, 0.2% at n=4 (2,000 random), 0.0% at n=5..10 on random and one-to-three-essential tables, and on and/or 19.5% at n=7, 4.5% at n=8, 0.0% at n=9 -- a share in decline"

[ablations.compaction]
saving = 67.4
arity = 16
verdict = "kept: clears on its parity class (58.8% of area at n=13, 65.1% at n=14, 67.4% at n=16, against the same shared build uncompacted); 1.3-1.8% on random repeated-leaf tables at n=12..14, 0.0% at n <= 12 where no lane build wins"

[ablations.width_machinery]
saving = 0.0
verdict = "kept: feasibility -- fit-width candidates, the quarter turn and the two-input XOR stencil; no default-path effect"

[interpreter_ablations]
audited = "2026-10-18"
benchmark = "interp-audit-2026-10-18/tracediff-n3"

[interpreter_ablations.padded_grid_cache]
