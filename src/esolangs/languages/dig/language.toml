# and 55 by 35 at n=8. The indexed decoder is smaller at n=7..9.
expression = "((56-20(n-2⌊n/2⌋))·2^⌊(n-7)/2⌋-1)((36-8(n-2⌊n/2⌋))·2^⌊(n-7)/2⌋-1)"
