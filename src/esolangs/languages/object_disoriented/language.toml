[ablations.constant_table_audit_20261101]
arity = 8
saving = 24.6
seed = 0
tables = "both constants n=1..12; exhaustive all tables/rows n=1..3; six witnesses/all rows n=4..6"
verdict = "kept: canonical whole-constant folding. Save the third MSB-first bit of the first ASCII digit in t: it is one for both legal input bytes. Drain all remaining bits, then print 0011000b using z and t. No helper class or conditional call remains. Exactly 8n+28 chars and 16n+28 commands; written bits 48+2bl(n), including pending input/output bits and caller frames. n=8 zero/one 121/123 -> 92/92 chars; n=12 153/155 -> 124/124. n=3 corpus 57872 -> 57812 chars. Each language passed 5656 paired old/new row executions; all 270 nonconstant programs through n=3 stay byte-identical. Both constants n=1..12 execute in default, width=1 and balanced layouts. All 24 balanced scores per language improve or match; all eight benchmark size/command pins remain unchanged. Owned regressions check resources and every embedded slot or stream read; stream output follows all reads and leaves a sentinel unread."

[ablations.trick_prototype_20261101_read_branch_class]
arity = 8
saving = 29.223
verdict = "kept: class B reads the bit, writes its negation through the caller a place, and returns the bit. A seven-character call replaces the 18-character read/negation prefix; B is excluded from shared names and absent from whole constants. 200 Random(184700+n) tables per n=7,8: reader-only chars 339509->246358 (27.44%) and 560419->396648 (29.22%); no judged table grows. Combined compact spelling gives 215734/345556 (36.46%/38.34%). Larger reader-only probes reach 31.39% n=10, 31.99% n=17, then 31.87% n=18; combined 40.86%/40.75% at n=17/18. Twenty tables per n=9..12, five per n=13..16, two per n=17/18; every emitted program runs four rows through n=16, both endpoint rows thereafter. The conservative 20% bar holds at both fixed judge arities and both final diagnostic arities. First-input projections grow eight chars (16n+80->16n+88); no scattered old-code fallback. Every small table/row and 16 named/random tables per n=4..6 pass 7824 paired runs plus 324 wrong-table controls, including native resource caps. n=3 total 57812->48562 combined. Worst execution 67n+34->76n+34: B adds nine ops per tested level. There is at most one additional live B frame (2n+4 total) and one B object per active branch; include its code/zero members in M and one long frame in H. Six cells per zero-arm level and transient calls still fit 6n+9 cells. Reprice sharing, native exact D and source cap min(24T+56,S). Verification reconstructs the extremal profile so the exact bound is attained; no searched table enters the generator."

[ablations.trick_prototype_20261101_strip_separator_spaces]
arity = 8
saving = 9.0811
verdict = "kept: minimal spelling, exempt. Remove ignored separators and reprice the canonical sharing model (plain-node cost 32, definition overhead six). Alone saves 8.96%/9.08% on the same n=7/8 corpus, no growth; combined with B uses plain-node cost 21. Retain one final space: fully compact multi-dot class source can otherwise be mistaken for a file path by the API. n=8 parity 640->439, n=10 majority 1417->999, AND 789->671. Whole constants unchanged. Owned nonconstant IO checks preserve read-first output and a following token."

