arity = 12
verdict = "kept: canonical, exempt. A branch written as an object at least twice becomes a class written once, named by an estimated cost model. Deleting it (the plain build) costs +138.4% at n=8, +217.4% at n=10 and +302.6% at n=12 on random tables; at n=12, parity +16,251.7%, half-constant +7,689.3%, majority +3,725.1%, sparse +314.5%, dense +302.2%; 0.00% on AND, OR and constant tables, where the shipped build names nothing"

[ablations.halves_agree_skip]
saving = -0.4
arity = 12
verdict = "removed 2026-10-20 (retirement candidate #28): a node whose halves agreed dropped its bit untested and inlined the one child. Forcing the branch makes programs smaller on random tables: -0.66% at n=10 and -0.42% at n=12 (second seed set -0.59 / -0.41), -0.62 / -0.83 / -0.97% on the ignored classes at n=12; exactly 0.00% on parity, AND, OR, majority, half-constant and constant tables. The skip pasted the child into the parent's text, so that use did not count toward the class-naming threshold in _shared_names; both halves are now emitted as objects, so a repeated child is written once and fetched twice"

[ablations.constant_fold]
saving = 0.0
arity = 12
verdict = "recorded: not a separable mechanism. A constant subtable's leaf spelling (read the remaining bytes, print the bit) is exactly the per-level descent summed (measured 2026-10-19, against the then-shipped skip), so removing the leaf case alone changed no length on any corpus (0.00% everywhere). It bites only jointly: the plain build (sharing, skip and fold removed) costs +480.5% at n=12 on random tables"

