tables = "20 random per n=6..8, 6 per n=9..11, plus and/or/parity/majority; Rudin-Shapiro n=5..12"
verdict = "kept: the fold sets the area class (O(T) against the comb's Theta(nT)) and grids are judged by area. Patched off (_FOLD_BASE = 99) it is inert on random tables at every n=6..11 and on parity and majority; it moves only the and table (33.8% at n=8, 7.6% at n=10) and the or table (47.8% at n=6). It is judged on its class, tables whose one-edges share nothing: Rudin-Shapiro saves 9.6% / 12.8% / 17.5% / 22.0% / 26.7% / 30.9% by area at n=7..12, still growing, and spends characters (21% to 157% more). Every changed program ran on every row (64 sampled from n=8), 0 bad; it races by grid_rank, so no area grows"

