[ablations.symmetric_reverse_loader]
saving = 29.7872
arity = 8
seed = "random.Random(1847+n)"
tables = "all tables n=1..3; 20 random plus and/or/parity/majority/threshold-third per n=4..12; Back named to n=18 and popcount functions n=4..7"
verdict = "kept for popcount-symmetric tables: reverse the comb's input cells without changing the table or tree drawing; template substitutions retain stream order and the loader walk shortens. The H-tree still competes by area. n=8 OR/parity/majority/threshold-third: 1,363 -> 957 cells (29.8%), AND unchanged at 902 cells because the H-tree wins. At n=18 those five named functions take 6,313 -> 4,307 cells (31.8%); a load-limited comb's height goes from 6n-1 to 4n+1, approaching one-third saved. Other functions retain identity order. n=3 corpus: 58,575 -> 57,299 chars, 58,319 -> 57,043 cells. Final verification: 28,375 baseline/candidate/width/balanced output checks correct, including all tables n<=3, every popcount function n=4..6 on every row and n=7 on three rows, named boundary rows through n=18; 2,600 complemented controls rejected. Source size and command pins regenerated; unchanged bounds still reached by nonsymmetric witnesses, with a penultimate-zero witness added at n=2"

[ablations.constant_table_audit_20261101]
arity = 8
saving = 92.6
seed = "both constant values; witnesses(n) at n=4..6"
tables = "every table and row n=1..3; six witnesses per n=4..6; constants n=1..12"
verdict = "kept: canonical whole constants. Each uniform (-,+) input run followed by - leaves scratch cell 0 empty; walk n cells to the answer, flip for one, halt and dump. Default is horizontal; an insufficient width turns the same units down one column. Default chars/area 3n+1+bit, worst commands including dump 3n+2+bit (one fewer per set input), workspace n+1+bl(3n+bit)+bl(n). At n=8 zero/one 330/363 -> 25/26 cells; n=12 686/735 -> 37/38. Every filled source retains the template length and all n placeholders. All 24 balanced scores n=1..12 improve or match the old candidates; a vertical-only prototype had worsened several, so the horizontal default removes that regression. Generic envelopes and eight benchmark pins unchanged. n=3 corpus chars 57299 -> 57123, area 57043 -> 56869. Each language passed 5656 paired before/after row executions; all 270 nonconstant programs through n=3 are byte-identical. Both constants n=1..12 execute in default, width=1 and balanced layouts within their resource bounds."
