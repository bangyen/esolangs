[proof_status]
labels = ["parameterized tree"]
qualification = "an ignored input's run lands on the cell the next load fills, and a `-` after it leaves the cell empty"
scaling = "linear: worst F cells to n = 12, then at most: H-tree fold"
execution = "linear: worst max(R,6n-1) + R + 3n + 6 commands to n = 9, then at most; R = 3T/4+1"
workspace = "poly n: worst n + 5 + bl(max(6n-2,2^n-1)) + bl(3n+4) + bl(n) bits"

