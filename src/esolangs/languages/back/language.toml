# Language-owned data, one section per dataset; aggregators read
# only their own section and skip this file when it is absent.

[curation]
backlinks = 1

[proof_status]
labels = ["parameterized tree"]
qualification = "an ignored input's run lands on the cell the next load fills, and a `-` after it leaves the cell empty"
scaling = "linear: leaf moves sum geometrically, sparse row render"
execution = "linear: worst max(R,6n-1) + R + 3n + 6 commands, R = 3T/4+1 rows: load column, then all-ones path"
workspace = "poly n: worst n + 5 + bl(max(6n-2,2^n-1)) + bl(3n+4) + bl(n) bits"

