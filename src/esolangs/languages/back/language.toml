[ablations.fall_through_sharing]
saving = 23.3
arity = 12
verdict = "kept: canonical sharing, exempt, and clears the bar outright — a node whose one-subtree equals the next node's zero-subtree draws nothing, earning 19.8% by area on random tables at n=6 rising to 23.3% at n=12 (15.2% by chars), 51.4% / 50.8% on eight-block tables at n=9/10 and 98.3% on parity at n=12. It also absorbs the projection's weak classes: a trailing ignored input prices -0.3% for the projection because the fall already draws the projected shape"

[ablations.wrap_race]
saving = 0.0
arity = 12
seed = "random.Random(20261028000 + 7n)"
tables = "20 random per n=7,8 plus and/or/parity/majority/one-third threshold at n=7..12"
verdict = "retired 2026-10-28 (random + named bar): the wrap build (the level's last node falls onto its first, admitted from 8 nodes down) saves 0.0% of chars, grid area and balanced area on 20 random tables at n=7 and n=8 (no table smaller) and on every named function at n=7..12 (0.0%, both metrics, the fold takes the large ones). Only its two-block class (eight blocks drawn from two random ones, the earlier 15.8% at n=9) moved -- deleting it costs +7.5% area and +3.1% chars (1,537 -> 1,653 cells) on the one n=8 test table -- and an ad-hoc class keeps nothing. Code deleted: back(wrap=), _WRAP_ROWS, the ring in the landing plan. Every program ran on all rows (n<=3 exhaustive, 20 random and named at n=4..8, 0 mismatches); bounds hold, generator sizes unchanged"

[ablations.constant_fold]
saving = 13.1
arity = 12
verdict = "kept: canonical, exempt; a constant span emitting its leaf at once earns 13.1% on random tables at n=11/12, 20.1% on constant-half tables at n=8 and 56.1% / 58.0% on constants at n=8/10. On and/or its marginal alone is exactly 0.0% — the fall covers the same spans — and ablating both costs 81.6% at n=8, the joint-coverage shape recorded in the batch 8 report"

[ablations.essential_projection]
saving = 52.6
arity = 10
verdict = "kept: canonical, exempt; building the tree over the essential inputs earns 53.2% / 52.6% with a mid ignored input at n=8/10 and 66.1% / 71.1% with two scattered, but only 6.6% / 5.4% with a leading one and -0.3% / -0.0% with a trailing one — the fall-through sharing already absorbs exactly those redundancies. Constant tables restore the full weights, as the loads are the interface"

[ablations.htree_fold]
saving = 30.9
arity = 12
seed = "random.Random(184700 + n)"
tables = "20 random per n=6..8, 6 per n=9..11, plus and/or/parity/majority; Rudin-Shapiro n=5..12"
verdict = "kept: the fold sets the area class (O(T) against the comb's Theta(nT)) and grids are judged by area. Patched off (_FOLD_BASE = 99) it is inert on random tables at every n=6..11 and on parity and majority; it moves only the and table (33.8% at n=8, 7.6% at n=10) and the or table (47.8% at n=6). It is judged on its class, tables whose one-edges share nothing: Rudin-Shapiro saves 9.6% / 12.8% / 17.5% / 22.0% / 26.7% / 30.9% by area at n=7..12, still growing, and spends characters (21% to 157% more). Every changed program ran on every row (64 sampled from n=8), 0 bad; it races by grid_rank, so no area grows"

[ablations.parity_accumulator]
