language = "Back"
oldid = 75747

[[examples]]
id = "reflect-once"
note = "Stated to halt; the tape dump is this interpreter's."
source = '''
\\
 *'''
expected = "0"

[[examples]]
id = "reflect-twice"
note = "Stated to halt; the tape dump is this interpreter's."
source = '''
//
 *'''
expected = "0"

[[spec_triggers]]
program = ""
stdin = ""
expect = "ProgramError"
claim = "an empty program"

[[spec_triggers]]
program = "*"
stdin = ""
expect = "output"
output = "0"
claim = "* halts, printing the tape"

[[spec_triggers]]
program = "-*"
stdin = ""
expect = "output"
output = "1"
claim = "- flips the current bit"
