# Language-owned data, one section per dataset; aggregators read
# only their own section and skip this file when it is absent.

[deep_arities]
# Default H routing starts at eight: three rungs per parity need
# thirteen (6.8s).
linearity = 13
# The pool races first, unceilinged, and a rival replaces it only when
# smaller, so cells <= F (tests/formulas.py), linear.  Chars per dense entry
# climb toward it (623 at n = 9, 809 at 15; F/T ~ 4.4k): ratio 4.476 on
# 9, 11, 13, 4.49 on 10, 12, 14.
linearity_exempt = "area at most the H-tree pool's F, linear in T"
# Loading through n=12 costs 27s.
execution = 7
# Below its n=8 route change, which leaves no five rungs in budget past
# it; the 9T + 3n - 12 bound holds at n=8 on all ten formula tables.
workspace = 7

