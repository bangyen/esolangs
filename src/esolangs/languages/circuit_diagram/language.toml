kind = "archive"
arity = 8
saving = 93.8
seed = "both constant values"
tables = "both constants n=1..12; every table and row n<=3; six structured/random witnesses n=4..6"
verdict = "kept: canonical native constant source after n isolated input-port dashes. Input loading precedes sources and generations; the program still reads every input before printing. Both constants use 2n+3 characters, 3(n+1) cells, exactly two generations, and n+2 written bits (discarded port/source events plus halt). Area n=7 357 -> 24 cells; n=8 437 -> 27; n=12 837 -> 39. The width floor is three. Native sources also win all 24 old balance scores at n=1..12; return the native default for constants instead of constructing unused H lattices (the n=12 regression otherwise took 2.92s). All 270 nonconstant programs through n=3 are byte-identical; n=3 corpus chars 183838 -> 183742, area 359684 -> 359474 cells. Default, width=1 and balanced constants n=1..12 execute, with sentinel and read-before-output regressions."

[ablations.mux_function_block]
kind = "archive"
saving = 62.3043
arity = 8
verdict = "kept 2026-11-02: full muxes in complete natural/complement folds call one derived native M definition (330 chars,23 rows,width 31); its full area and characters participate in existing model ranks. Copied H atoms/forests retain the primitive basis, dimensions, selector needs, and pool F; this necessary class boundary preserves O(T) construction/source and every old proof rung. Fixed 200 Random(184700+n), sequential choice('01'), area 14955054 ->5799357 /34454122 ->12987713 (61.2214/62.3043%). Five tables each n=9/10/11/12 give 62.3231/61.6353/52.9616/23.2409%, observed peak followed by decline, fixed 7/8 both exceed stricter 20%. Native 346 public programs/10498 rows pass: all 276 tables through 3,10 sampled 4..6,20 full-allrow tables 7/8, selected balanced and both complementary roots; exact production/prototype bytes except intentional parity, old E/W/read-order/trailing-sentinel controls. Standalone n=3 source 183742 ->145854, outer generations 11448 ->9496; fixed header grows 72n=3 areas/36 character counts, no slower row, so admission is source at 7/8 rather than 5% execution; final M+parity totals 144382/9480. Exhaustive n=1 source stays 16; n=2 old/M/final totals 1656/1752/872, so the named ladder also removes the small-parity header growth. Atomic nested evaluation is materially slower in wall time: allrow medians at n=4/6/8 .000941/.017544/.239707 ->.002780/.070423/.949617 s, while outer steps 112/832/4352 ->96/512/2560. Warm 5-build medians at n=8/10/12 improve 11.567/130.938/597.067 ->7.670/114.154/538.244 ms. Fixed 20 balanced grid_area at 7/8 (all emitted rows, including definitions)1048720 ->440615 /2402840 ->946201."
complexity = "One builder flag distinguishes self-contained atomic folds from copied primitive canvases; one layout prefix records the single required definition. Render, area and character ranks share that prefix. Full-node three-gate spelling and unused complemented-selector requests disappear from atomic folds; primitive emission remains only for the fixed definition and copied class basis. No search, table cache, new model race or old-whole-program minimum. Atomic CPU work is not an outer snapshot bit/generation claim. Three native tests intrinsically 7.65/8.06/8.10 s move to slow with all rows/arities retained and explicit precommit reruns."

[ablations.davio_xor_fold_prototype]
kind = "archive"
saving = -30.6666
arity = 8
verdict = "generic rejected, named parity kept 2026-11-02: n=3 E 11448 ->15352 with 1872 slower rows and max 9>7, source 183742 ->181660 with 104 larger areas/118 larger character counts; free outer XOR is not synchronized because lo is an ancestor of its gated term. The executable generic repair uses a native outer XOR; fixed 20 Random(184700+n) areas 1486980 ->1852875 /3431392 ->4483684 (growth 24.6066/30.6666%), and three gates per level do not preserve 2n+1. Exhaustive 2120 small rows plus 120 boundary rows of 40 judge tables execute. For strict full parity/negation, every residual lo XOR hi=1, directly yielding an XOR ladder: after admitted M, n=7/8 area 9222 ->124 /12120 ->144 (98.6554/98.8119%). Old input-bus geometry is Omega(n^2), new area 20n-16 is O(n), so marginal saving tends 100%. n=2 flat area 18 beats folded 24; n=3 folded 44 beats flat 48: genuine geometric crossover, no source-min race. Existing affine width helper now emits this ladder for full parity; general nonparity affine support is retained. No independent DAG/race/state added. Native both polarities n=2..6 all rows, selected 7/8, wrong-bias mutants, balanced and old E/W controls pass."

