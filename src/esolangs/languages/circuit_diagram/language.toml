# Language-owned data, one section per dataset; aggregators read
# only their own section and skip this file when it is absent.

[deep_arities]
# Default H routing starts at eight: three rungs per parity need
# thirteen (6.8s).
linearity = 13
# Loading through n=12 costs 27s.
execution = 7
# Below its n=8 route change, which leaves no five rungs in budget past
# it; the 9T + 3n - 12 bound holds at n=8 on all ten formula tables.
workspace = 7

[curation]
backlinks = 5

[proof_status]
labels = ["tree"]
qualification = "complete residual folds or a strictly smaller emitted fallback"
scaling = "linear: at most F cells past n = 8: H-tree pool caps it"
execution = "poly n: at most 2n + 1 commands: the longest gate path, reached to n = 20"
workspace = "linear: at most 7T/2 + 2n - 5 bits, n ≤ 7; 7T + 2n - 9 after: latches, pulses"
evidence = "docs/proofs/circuit-diagram-sharing.md"

