verdict = "kept 2026-10-30: area of the default build with column reuse patched out of _FreeColumns (no group ever reused), 20 tables a size from random.Random(1000 + 100n + j).getrandbits(2**n) plus parity, majority, and, or, nand, nor, thr2, thr3: reuse saves 70.4% / 79.4% of area on random tables at n=7 / 8 (still growing; min 66.3% / 77.7%), and on named functions 28.2% parity, 32.1% majority, 28.1% thr2, 37.3% thr3 at n=7 (17.2% mean of the eight at n=8, up to 41.5%; and / or / nand / nor 0.00%, a plain-rail chain reuses nothing). Balanced area is unchanged within 1.5% (the balanced route bands to a square and reclaims columns itself). 112 programs a size run on all 2^n inputs, a wrong table fails"

