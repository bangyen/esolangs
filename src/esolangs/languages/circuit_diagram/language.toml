# Plain-rewrite audit record: each trick's saving measured in shipped
# context at the largest arity where it runs (area; seeded random
# tables, seed 184700+n, 200 per arity).  Prices are contextual --
# joint removals were measured separately before landing.  Rows for
# removed tricks stay as the record of why they left.
[ablations]
audited = "2026-10-18"

[ablations.column_recycling]
saving = 79.5
arity = 8
verdict = "kept: share grows with arity (71.1% at n=7)"

[ablations.constant_folding]
saving = 53.1
arity = 8
verdict = "kept: canonical, exempt from the bar"

[ablations.subtree_sharing]
saving = 73.4
arity = 8
verdict = "kept: canonical, exempt; on its repeated-subtree class, 8.0% on random tables"

[ablations.projection_wire]
saving = 92.7
arity = 8
verdict = "kept: judged on its class; 0.0% on random tables. Re-priced 2026-10-28 (random + named bar): fires on none of 200 random tables per arity at n=7..12 and on none of parity, majority, and, or, threshold (all n essential), so 0.00% there; 92.7% on its class. Canonical, exempt: it is the ignored-input drop at its extreme -- essential_inputs leaves one input and read_at a literal, whose circuit is no gate, only the wire through the n ports every run still reads; the general build would draw the n^2 + 3n port grid (88 chars at n=8) for zero gates against the wire's 2n (16)"

[ablations.competing_model_race]
saving = 2.1
arity = 9
verdict = "kept: races folds by (area, chars): saves 0.7% / 0.6% of area at n=7 / 8 (200 seeded tables), 3.9% on n=10 parity, 8.1% on n=10 random 1847, at 0.9% more chars"

[ablations.transpose_folds]
saving = 0.0
arity = 9
verdict = "kept: part of the race; 4.3% of area at n=8, 0.0% at n=9 on random tables"

[ablations.bank_candidates]
saving = 0.0
arity = 17
verdict = "retired 2026-10-28 (random + named bar): the folded and sparse class banks, guarded to n >= 17 (mask prefix past eight), build nothing below it and leave the area unchanged at n=17 on 3 seeded random tables and parity, majority, and, or and a threshold (0.00%); they won only on repeated-class tables (14.7% under bundled at 3 classes, n=17), a class drawn to show them, and the pool caps the Scaling class where they built. Kept in the race: the pool (the only candidate at n <= 8) and bundled (leave-one-out 40.74% / 60.74% of area on 20 random tables at n=12 / 14; 0.00% at n <= 10). The residual bank was retired 2026-10-28: area saved on parity 3.87% / 8.31% / 14.40% at n=10 / 11 / 12 then 0.00% at n=13..16 (a peak and a fall to zero, not a share that holds); majority, and, or and a threshold 0.00% at n=10..16; 20 random tables 0.00% at n=8, 10, 11, 12 and 1.16% mean at n=9 (0.8-5.5% on 9 of 20). Its chars were larger on parity (+16.5% at n=12); removing it grows dense n=9 from 258,216 to 298,272 chars and 3-class n=10 tables by up to 17% area, inside the pool's Scaling class; balanced area (max(rows, cols) squared) within 5% across the retiring commit on parity, majority, and, or, thr2, their complements and 10 random tables at n=7, 8, 10"

[ablations.output_polarity]
saving = 68.4
arity = 8
verdict = "kept: one extra fixed-order candidate folds the complement table and negates the root gate for free (``A`` NAND, ``O`` NOR; a bare rail root takes ``~``). NAND / NOR cost 3.2x AND / OR from the complemented rails and mixed gates; the flipped build is area-equal to AND / OR (2,537 vs 8,025 at n=8). Area saved on NAND = NOR over n=7..12: 68.8 / 68.4 / 68.1 / 67.8 / 67.6 / 67.5% (a steady share, 6,045 -> 1,887 at n=7, 18,745 -> 6,097 at n=12); complemented thresholds 5.1-13.5% (n=7..12); AND, OR, parity, majority and thresholds 0.00%; 20 seeded random tables 0.00% at n=7 / 8, none grew; the balanced area of NAND / NOR also falls 16,900 -> 5,476 at n=7 and 22,500 -> 7,396 at n=8"

[ablations.ignored_input_drop]
saving = 0.1
arity = 8
verdict = "kept: canonical, exempt; near-redundant -- the fold's equal-cofactor collapse does the work"

[ablations.width_machinery]
saving = 0.0
verdict = "kept: feasibility -- banding, narrow stride, affine chains; no default-path effect"

[ablations.balance_machinery]
saving = 0.0
verdict = "kept: the squareness contract, not a size optimization"

[ablations.fenwick_allocation]
saving = 0.0
verdict = "kept: performance only -- successor allocation for recycled columns, same columns handed out"

[interpreter_ablations]
audited = "2026-10-18"
benchmark = "interp-audit-2026-10-18/tracediff-n3"

[interpreter_ablations.compile_cache]
price = 65.6
workload = "run"
verdict = "kept: also a memory bound -- retained text capped, so a 30M-char program's topology is never retained sixteenfold"

[ablations.competing_model_floor]
saving = 12.1
arity = 5
seed = "random.Random(1000 + n)"
tables = 25
verdict = "kept 2026-10-20: the competing model (fixed-order folds, prefix H-layouts, shared banks, flat retained) now races from n=4, not n=8, against the claim that it could not beat the direct build below eight. On 25 tables a size (20 seeded random plus zeros, AND, parity, majority, one projection) it is never larger and saves 3.8% / 12.1% / 8.3% / 5.5% of chars at n=4/5/6/7 (13.1% on the random tables at n=5); on 10 tables a size from random.Random(n), 9.8% / 10.8% / 6.2% / 7.2%. It wins no n <= 3 table (0 of 632 corpus programs change), so the floor is 4. Programs stay inside the n <= 7 bounds (2n + 1 commands, 7T/2 + 2n - 5 bits): all n <= 3 tables and 13 a size at n=4..7, every row"

