[ablations.competing_model_race]
kind = "archive"
saving = 2.1
arity = 9
verdict = "kept 2026-10-30: the race is the natural and complement folds against the pool / bundled candidates by (area, chars); without it (pool / bundled only) the area grows 31.6% / 41.8% / 84.3% / 61.4% on n=9 parity / majority / and / thr2, 29.0% / 34.0% on n=10 parity / majority, 25.5% / 51.2% on n=11 parity / majority, 20.6% on n=12 parity (parity 82,124 -> 56,153 at n=9, 129,816 -> 103,037 at n=12). At n <= 8 the pool candidate equals the natural fold (12 n=7 tables), so the race there adds only the complement fold (output_polarity) and the transposes (transpose_folds); the earlier 0.7% / 0.6% at n=7 / 8 priced only that remainder. Balanced area is equal at n=9, 10 except nand / nor (28,900 vs 9,604; the balanced route picks its own width). Every program run on all 2^n inputs (n=9, 10 named, default and balanced; n=11, 12 default)"

[ablations.transpose_folds]
kind = "archive"
saving = 0.0
arity = 9
verdict = "retired 2026-10-30: the two block transposes (last three / four inputs first) saved 9.1% / 4.0% of default area on 20 random tables at n=7 / 8 (random.Random(1000 + 100n + j).getrandbits(2**n); 15 / 13 tables changed, max 28.8% / 17.8%) and 11.3% / 5.3% balanced (declining, below the 10% bar), and 0.00% on parity, majority, and, or, nand, nor, thr2, thr3 at n=7..10 (default and balanced). The constructed Margulis cofactor witness (test_named_orders_avoid_literal_expander_routing_within_existing_bounds) grew 4.9x / 7.9x / 16.1x at n=9 / 12 / 14 (10,114 -> 49,354, 91,312 -> 724,736, 443,276 -> 7,134,540 chars): a constant-factor cost under the pool / bank fallback cap, not a class change; constructed families keep nothing. Dense n=8 / 9 grow 136,120 / 298,272 -> 147,264 / 302,032 chars, the sparse 202-class n=15 table 3,961,697 -> 5,953,673 cells. n=7, 8 programs (56 each, default and balanced) and n=9, 10 named (16 each) run on all 2^n inputs, a wrong table fails"
retirement = { verb = "retired", date = 2026-10-30, balanced = [254, 262] }

