[catalogue]
sharing_local = "_dag"  # hash-consed mux fold
folding_constant = "both constants are one self-fed gate"

# Plain-rewrite audit record: each trick's saving measured in shipped
# context at the largest arity where it runs (area; seeded random
# tables, seed 184700+n, 200 per arity).  Prices are contextual --
# joint removals were measured separately before landing.  Rows for
# removed tricks stay as the record of why they left.
[ablations]
audited = "2026-10-18"

[ablations.column_recycling]
saving = 79.5
arity = 8
verdict = "kept: share grows with arity (71.1% at n=7)"

[ablations.constant_folding]
saving = 53.1
arity = 8
verdict = "kept: canonical, exempt from the bar"

[ablations.subtree_sharing]
saving = 73.4
arity = 8
verdict = "kept: canonical, exempt; on its repeated-subtree class, 8.0% on random tables"

[ablations.projection_wire]
saving = 92.7
arity = 8
verdict = "kept: judged on its class; 0.0% on random tables"

[ablations.competing_model_race]
saving = 2.1
arity = 9
verdict = "kept: races folds by (area, chars): saves 0.7% / 0.6% of area at n=7 / 8 (200 seeded tables), 3.9% on n=10 parity, 8.1% on n=10 random 1847, at 0.9% more chars"

[ablations.transpose_folds]
saving = 0.0
arity = 9
verdict = "kept: part of the race; 4.3% of area at n=8, 0.0% at n=9 on random tables"

[ablations.bank_candidates]
saving = 0.0
arity = 17
verdict = "retired 2026-10-28 (random + named bar): the folded and sparse class banks, guarded to n >= 17 (mask prefix past eight), build nothing below it and leave the area unchanged at n=17 on 3 seeded random tables and parity, majority, and, or and a threshold (0.00%); they won only on repeated-class tables (14.7% under bundled at 3 classes, n=17), a class drawn to show them, and the pool caps the Scaling class where they built. Kept in the race: the pool (the only candidate at n <= 8), bundled (leave-one-out 40.74% / 60.74% of area on 20 random tables at n=12 / 14; 0.00% at n <= 10) and residual (14.40% on n=12 parity, 3.87% at n=10, 0.00% on random and at n=14)"

[ablations.ignored_input_drop]
saving = 0.1
arity = 8
verdict = "kept: canonical, exempt; near-redundant -- the fold's equal-cofactor collapse does the work"

[ablations.width_machinery]
saving = 0.0
verdict = "kept: feasibility -- banding, narrow stride, affine chains; no default-path effect"

[ablations.balance_machinery]
saving = 0.0
verdict = "kept: the squareness contract, not a size optimization"

[ablations.fenwick_allocation]
saving = 0.0
verdict = "kept: performance only -- successor allocation for recycled columns, same columns handed out"

[interpreter_ablations]
audited = "2026-10-18"
benchmark = "interp-audit-2026-10-18/tracediff-n3"

[interpreter_ablations.compile_cache]
price = 65.6
workload = "run"
verdict = "kept: also a memory bound -- retained text capped, so a 30M-char program's topology is never retained sixteenfold"

[ablations.competing_model_floor]
saving = 12.1
arity = 5
seed = "random.Random(1000 + n)"
tables = 25
verdict = "kept 2026-10-20: the competing model (fixed-order folds, prefix H-layouts, shared banks, flat retained) now races from n=4, not n=8, against the claim that it could not beat the direct build below eight. On 25 tables a size (20 seeded random plus zeros, AND, parity, majority, one projection) it is never larger and saves 3.8% / 12.1% / 8.3% / 5.5% of chars at n=4/5/6/7 (13.1% on the random tables at n=5); on 10 tables a size from random.Random(n), 9.8% / 10.8% / 6.2% / 7.2%. It wins no n <= 3 table (0 of 632 corpus programs change), so the floor is 4. Programs stay inside the n <= 7 bounds (2n + 1 commands, 7T/2 + 2n - 5 bits): all n <= 3 tables and 13 a size at n=4..7, every row"

[audits]
plain_rewrite = 2026-10-22
