stdin = ""
expect = "HaltError"
claim = "HaltError: EXE with an empty slot"

[[spec_triggers]]
program = "foo"
stdin = ""
expect = "HaltError"
claim = "HaltError: an unrecognised line when executed"

[[spec_triggers]]
program = "u"
stdin = ""
expect = "InputExhaustedError"
claim = "InputExhaustedError: reading past the end of the input"

