qualification = "a read's 1 arm hops to the far child, short inside a cluster and above it a flight at its own column sharing each window's rung; its 0 arm falls through"
scaling = "linear: worst F characters, n = 3..10; at most beyond"
execution = "linear: worst F commands, n = 3..12; at most F to n = 34"
workspace = "poly n: worst bl(R) + bl(2n) + 543 bits past n = 2: accumulator, line cursor, input cursor, slot and frame bodies"
definitions = ["R = the program's lines"]

