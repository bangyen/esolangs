# Language-owned data, one section per dataset; aggregators read
# only their own section and skip this file when it is absent.

[curation]
backlinks = 4

[proof_status]
labels = ["tree"]
qualification = "a one-line compare read either flies its 1 child down a residue mod 82 through shared rungs or dismounts 85 lines onto its 0 child; a lane is any residue not in the air"
scaling = "linear: each node's scans and dismount span a bounded number of lines"
execution = "linear: at most L commands: every jump lands past its rung"
workspace = "poly n: at most 8 + bl(L) + bl(n) bits: the accumulator, a line cursor, the input cursor"

