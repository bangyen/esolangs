[ablations.constant_table_audit_20261101]
arity = 8
saving = 95.5
seed = "both constant values"
tables = "both constants n=1..12; every table and row n<=3; six structured/random witnesses n=4..6"
verdict = "kept: canonical constants, percentage gate exempt. n u reads followed by nNnN, two @dd, 3+bit @nd, div: 2n+28+4bit chars and exactly n+7+bit commands. At n=7, chars 958/960 -> 42/46; n=8 1022/1024 -> 44/48; n=12 1278/1280 -> 52/56. No slot or frame: workspace bound is 7+bl(R)+bl(2n), measured 16/17 written bits at n=8; generic bounds remain unchanged. Default, width=1 and balanced constants n=1..12 execute; sentinel regressions cover n=1,3,7,8,12. All 270 nonconstant programs through n=3 are byte-identical; n=3 corpus chars 341506 -> 340172."

[ablations.trick_prototype_20261102_wider_parity]
arity = 8
saving = 24.5835
verdict = "kept only full-input parity and its complement. A three-level cluster is52 lines, so use the smallest band holding it (period138) from n=3. At n=1/2 it only adds24chars: retain40 there. At n=32 the floor52+n-3 is81; its zero-length body cannot fit under ceiling80 (the unguarded prototype picks negative column-175). Thus the named construction stops at31, retaining the generic layout beyond; this cap follows geometry, not diminishing savings. Actual column/reach controls cover3..31. n=7/8 emitted parity chars23850->17732 (25.65%) /47304->35675 (24.58%), both complements identical. Both verdict parities execute every row; 22096 paired old/live executions include all tables/rows through3 and16 seeded tables plus both parities per n=4..8. Twelve changed templates,354 byte-identical controls; n=3 total340172->339776. Every print follows n reads and leaves a sentinel line unread; a one-bit-wrong table fails. Exact max-plus parity recurrence agrees with all row counts through8; n=3 commands140->188 (global maximum166->188), n=7 2393->1460,n=8 4704->2927. Add a single-flipped-parity generic witness to retain old maxima at n=9/10; native exact checks pass. Workspace expression unchanged and still attained. Generation timings for20 parity tables n=7/8/9 are15.24/29.84/59.59ms ->11.57/21.92/43.44ms; generic12.77/24.65/48.55 ->12.97/24.53/49.17ms. No production search, global mutation or per-table race."

[ablations.trick_prototype_20261102_wider_generic]
