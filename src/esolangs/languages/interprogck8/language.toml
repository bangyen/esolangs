saving = -2.0686
verdict = "rejected generic variants: fixed52 on20 seeded tables5150+n gives409123->402908 chars at n=7 (1.52%),798471->814988 at n=8 (2.07% growth);8/20 and16/20 tables grow. All thresholds and complements at n=8 grow with52. The proposed variable band min(76,80-n) gives409123->355388 (13.13%) /798471->708822 (11.23%), declining below20%; its AND also grows at8. Actual small fixtures and four rows per seeded/named table execute. The named parity rule qualifies separately; no failed generic layout is retained."

[ablations.trick_prototype_20261102_acc_compare_read]
arity = 2
saving = 0.0
verdict = "not retained: an isolated short comparator{values/=u/=/=} with accumulator0 printsT on both0/1, while a49 load givesT/Q as intended. Positive control proves the comparator works at its claimed state. Replacing the existing zeroing slot by nNnN,@dd,@nt*6 loads49 but makes the zero-arm rung jump49 instead of falling into the near child. The complete slot-stage mutant on table0100,row00 printsU+0010 instead of0; baseline prints0. A bit0 comparison would instead need48. No complete placement/known-state construction repairs these hops in the proposal; reject the tested stage, not all accumulator comparisons."

[ablations.trick_prototype_20261102_tail_in_open_window]
arity = 1
saving = 0.0
verdict = "rejected tested placement: move the tail from last-window+1 to the open window at column82. The last code band is below82 and no stop occupies82..90, yet table01 printsB on row0 andQ on row1 instead of0/1. Leaf rungs land partway through the arithmetic tail; the old closing rung is needed to align Q/T entries. All baseline fixture rows execute correctly. This rejects the proposed eligibility condition and placement, not every possible tail redesign; no speculative saving or bundled fallback ships."

