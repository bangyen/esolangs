[ablations]
audited = "2026-10-27"
# Source figures that match a verdict but measure something else (the greedy input order, not equal_halves_skip; the share-gain fit, not top_tracking).
unrelated = ["2.2%", "12.6%"]

[ablations.key_assignment]
saving = 50.9
arity = 10
seed = "random.Random(1000 * n + s)"
tables = 5
verdict = "kept 2026-10-27: the cheapest key goes to the most-read name in _key_pieces; structural (kind, depth) order instead costs 19.3% / 33.7% / 37.1% / 44.7% / 50.9% / 53.0% at n=4/6/7/8/10/12 on random tables, rising at every arity, and 33.7% on parity, 24.8% on majority at n=10"

[ablations.column_copy]
saving = 12.0
arity = 12
seed = "random.Random(1000 * n + s)"
tables = 200
verdict = "kept 2026-10-27: a span equal to a bit under it is one copy write; with it off the random tables grow 5.0% / 9.0% / 8.9% / 11.2% / 11.7% / 12.0% at n=4/6/7/8/10/12 (5 tables), 10.1% at n=7 and 10.9% at n=8 over 200 tables, still rising past n=8, and 6.2-7.0% on parity at n=7..12. Borderline at n=7 (10.1%), cleared by the rise"

[ablations.block_sharing]
saving = 66.4
arity = 10
verdict = "kept 2026-10-27: canonical sharing, exempt; a repeated aligned block of at least four rows is written once behind a flag, chosen by _gain and raced against the plain tree. 0.0% on random tables, 55.2% / 66.4% on two-block 16-row tables at n=9/10, 79.9% on parity at n=10 and 90.3% at n=12"

[ablations.equal_halves_skip]
saving = 16.7
arity = 10
verdict = "kept 2026-10-27: canonical, exempt; a node whose halves agree is its first half. 2.2% / 2.3% on random tables at n=9/10, 12.9% / 16.7% on two-block tables; jointly with the constant fold it earns 21.7% on random tables at n=10 where each alone prices 0.0% / 2.3%"

[ablations.constant_fold]
saving = 0.0
arity = 10
verdict = "kept 2026-10-27: canonical, exempt; its marginal alone is 0.0% on every corpus measured, constants included, because the equal-halves skip and the column copy emit the same spans. Jointly with the skip it earns 21.7% on random tables at n=10, 56.5% on constant-half tables at n=10 and 94.4% on AND at n=10: the pair covers each other, neither price is a failure"

[ablations.value_tracking]
saving = 56.2
arity = 12
seed = "random.Random(1000 * n + s)"
tables = 200
verdict = "kept 2026-10-27: the emitter tracks the result's and flags' values and skips writes that would repeat them; 0.7% on random tables at n=7..8 over 200 tables, but 10.3% on majority at n=7, 16.7% at n=8, 33.3% at n=10 and 56.2% at n=12, rising, which keeps it under the named-function rule, and 8.7-9.4% on AND"

[ablations.essential_projection]
saving = 0.0
arity = 10
verdict = "kept 2026-10-27: canonical, exempt; its size price is 0.0% at every arity and the emitted program is byte-identical with and without it on all 200 ignored-input tables at n=8 — the tree folds an ignored input anyway. It is build-time machinery, as its comment states (0.115 s against 0.972 s at n=12 with two ignored inputs), not a size mechanism"

[ablations.complement_copy]
saving = 7.7
arity = 14
seed = "random.Random(1000 * n + s)"
tables = 30
verdict = "retired 2026-10-27 (plain-rewrite audit): a span equal to a bit's complement was one copy of a stored complement (_COMPLEMENT, the NOT keys); it saved -14.1% / -6.2% / 1.7% / 4.1% / 6.1% / 7.3% / 7.7% / 7.5% at n=4/6/7/8/10/12/14/16 on random tables (5 tables; 7.4% over 30 at n=12), peaking under the 10% bar, and 3.3-4.2% on parity at n=12..16, 0.0% on and, or and majority; at n <= 6 it cost more than it saved. Removing it shrinks the n=4 and n=6 corpora and grows n=10 random 6.5% (43,114 to 45,922 characters over 5 tables)"

[ablations.top_tracking]
saving = 12.9
arity = 12
seed = "random.Random(1000 * n + s)"
tables = 200
verdict = "kept 2026-10-27: a guard closes on its known stack top, so a nested guard's close is a bare ) where a clean stack costs 333x); with it off, random tables grow 10.9% at n=7 and 11.7% at n=8 over 200 tables, 12.6% at n=10 over 100, 12.9% at n=12 and 13.0% at n=14 over 5, still rising (7.1% at n=4, 9.8% at n=6); named: 6.2-6.7% on and, 7.7-8.1% on parity, 1.7% on or. Unrecorded before the audit"

[ablations.key_family]
saving = 11.2
arity = 12
seed = "random.Random(1000 * n + s)"
tables = 200
verdict = "kept 2026-10-27: key k is the closed-form wrapped-zero family (4 + 3 (bl(k) - 1) characters, the shortest grammar lengths) rather than the plain linear key, 3 wrapped k times (1 + 3k); linear keys grow random tables 10.6% at n=7 and 11.1% at n=8 over 200 tables, 11.2% at n=10 and n=12 over 5, and 19-40% on parity, and, or and majority at n=7..12. Borderline at n=7 (10.6%), flat near 11"

[audits]
plain_rewrite = 2026-10-27
