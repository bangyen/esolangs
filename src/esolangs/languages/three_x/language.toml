[proof_status]
labels = ["tree"]
qualification = "—"
scaling = "linear: O(1) constant-span tests over canonical residual IDs"
execution = "linear: worst L commands: the all-ones row enters every guard, no loop repeats"
workspace = "linear: at most n·bl(L) + 3T/2 + 2n + 16 + bl(2n-1) + 2K(2n+1) + Σ_{i≤2n+1}(K(i)+3) bits: guard residues, keys"
definitions = ["K(i) = 2bl(2^(i-1)·3^(2i-1)) + 1, a bound on the ith key's bits"]

