[resource_evidence.execution]
expression = "L"
exact = true
arities = [1, 2, 3, 5]
first = 1
unit = "commands"
description = { growth = "linear", claim = "worst", template = "{claim} {formula} {unit}: the all-ones row enters every guard, no loop repeats" }

[resource_evidence.workspace]
# One guard leaves a three-bit item. Shared blocks admit at most floor(T/24) flag names.
expression = "n*bl(L)+bl(2n-1)+3G+2n+2K+6bl(n+min(G,floor(T/24)))+9+S+3(1+n+min(G,floor(T/24)))"
source_terms = { names = ["G", "K", "S"], provider = "esolangs.languages.three_x.tests.formulas:workspace_terms" }
exact = false
arities = [1, 2, 3, 5]
first = 1
unit = "bits"
description = { growth = "linear", claim = "at most", template = "{claim} {formula} {unit}. G counts guards, K is the last key width and S sums the admitted key widths" }

[resource_evidence.scaling]
# A split costs more than a leaf under the fixed assignment. The
# rank-r key uses 1+3bl(r) characters, and each input read/scaler adds
# 23 more. Summing over the tree weights each key by its level width.
expression = "13T+24n+3((n+1)bl(n)-2^bl(n)+1)+3weighted_bit_sum(n)+2"
exact = false
arities = [1, 2, 3, 4, 5, 6, 7, 8, 9]
first = 1
unit = "characters"
description = { growth = "linear", claim = "at most", template = "{claim} {formula} {unit}: the plain tree under fixed keys" }

