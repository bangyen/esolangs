[ablations.input_projection]
kind = "archive"
saving = 0.0
arity = 12
verdict = "kept: canonical, exempt. Near-inert in this spelling: an ignored input's drop read (,0*+) costs the same 5 chars as a real read, so deleting the projection costs +0.00% on random tables at every arity and at most +0.34 / +0.12 / +0.04% on two-ignored tables at n=8/10/12. Its real effect rides on the constant fold"

[ablations.subtree_sharing]
kind = "archive"
saving = 255.9
arity = 12
verdict = "kept: canonical, exempt. A repeated subtree is emitted once; a later scope subtracts its distance back and calls the twin. Deleting every twin call costs +132.46% at n=8, +187.82% at n=10 and +255.92% at n=12 on random tables, +14,911.36% on parity and +3,310.39% on majority at n=12"

[ablations.constant_fold]
kind = "archive"
saving = 39.3
arity = 12
verdict = "kept: canonical, exempt, and load-bearing for the sharing. A constant span carries subtree id 0/1 at every depth, so with the fold off a constant span twin-calls a dispatching scope emitted for a different depth (976 wrong of 2,048 gate executions). Priced in the share-off context where removal is defined: +39.29 / +39.18 / +39.30% on random tables at n=8/10/12 over the no-share build, +135.62% on majority and +99,853.66% on constant tables at n=12"

[ablations.input_order]
kind = "archive"
saving = 0.0
arity = 12
verdict = "recorded: the tree tests the last bit first because each scope is entered with its bit below its index; the order is a property of the construction, not a choice. Dropping the permutation computes wrong functions (623 wrong of 2,048 gate executions). Correctness machinery; no price"

[ablations.constant_table_audit_20261101]
kind = "archive"
arity = 8
saving = 67.7
seed = 0
tables = "both constants n=1..12; exhaustive all tables/rows n=1..3; six witnesses/all rows n=4..6"
verdict = "kept: a fixed-output path with empty-scope input discards. No scopes are defined, so each comma reads one input byte and semicolon consumes its key by calling the defined empty fallback; test_an_unstored_key_calls_an_empty_scope covers that language rule. Push 48 as 68* or 49 as 77*, then print. L=2n+4 chars, E=2n+5 steps, W=8L+10-b+2bl(2n)+bl(n) written bits: mutable frame/code, at most seven stack bits, input progress and read count. n=7 57 -> 18 chars (68.4%); n=8 62 -> 20 chars (67.7%), 56 -> 21 steps, 661 -> 184/183 written bits; n=12 82 -> 28 chars. Both evaluation arities exceed the declining-savings gate. n=3 corpus 24418 -> 24364 chars; the scaling bound now charges the native constant route. Final stack and scope table are empty, with no abort. Each language passed 5656 paired old/new row executions; 270 nonconstant default programs through n=3 stay byte-identical. Both constants n=1..12 execute in default, width=1 and balanced layouts. Separate 1120-run native probes per language include every row through n=8. All 24 balanced scores per language match or improve; all 24 benchmark size/command pins across the batch remain unchanged. Owned regressions check reads before output, no EOF probe and a preserved following record, without adding collected cases."

[ablations.bit_arith_bottom]
kind = "archive"
arity = 8
saving = 2.7
seed = 1854
tables = "200 seeded random tables per n=7,8; exhaustive all tables/rows n=1..3; ten tables/all rows n=4..6; two random tables/all rows n=7,8; parity/and/majority four rows n=3,7,8,10,12"
verdict = "kept for execution: n=3 all 256 tables/2048 rows use 118848 -> 94704 commands (20.3% fewer), no row slower and no table larger; source 24364 -> 17344 chars. At the last essential bit, v68*+ or v77*v- replaces dispatch plus children; existing twins still share it. Random n=7/8 source 183832 -> 175660 / 319403 -> 310779 chars (4.45/2.70%), below the size gate. The old scaling, execution and workspace envelopes remain upper bounds: the body costs at most six commands versus seven for dispatch, defines no children, and uses no larger operands. Native checks preserve all input reads and a following record; reversed polarity is detected. No regression on sampled later arities or named families. shortest_constant fails size (5.11/5.11%) and execution (3.42% n=3) and proposes prohibited production search; cheapest_twin alone is byte-identical because base-15 spelling length is monotone in positive distance. Their joint n=7/8 saving is 5.13/5.22%; all three save 8.60/7.33%, below gate. DP prototype is scratch only."

