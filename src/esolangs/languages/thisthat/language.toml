[ablations]
audited = "2026-10-27"

[ablations.essential_drop]
saving = 49.7
arity = 10
verdict = "kept: canonical, exempt from the bar; saving on its trailing-ignored class (45.1% mid-ignored, 2.8% leading-ignored, where the same-halves descent covers the root); 0.0% on random tables, whose area is a fixed stencil per arity"

[ablations.same_halves_prune]
saving = 0.0
arity = 10
verdict = "removed 2026-10-20 (Bangyen's decision): 0.0% by area on every corpus at n>=8 (0.2-0.9% by chars on random and ignored classes, 5.6-7.5% by chars on mosaic/tiled) -- failed the bar as a separate mechanism. Removal verified on 4,068 corpus records (155,440 executions, 0 mismatches): area identical except two stencil-edge records at +3.4%, shipped chars +0.85% at most per class. A second seeded corpus found one tiled n=9 table at +17.8% area (2,295 -> 2,703) and +20.5% chars over the 256 three-input tables (area unchanged). The width path's streaming tree keeps its own copy, unpriced and untouched"

[ablations.constant_span_fold]
saving = 13.7
arity = 10
verdict = "kept: canonical, exempt; saving on the half-constant class (13.1% at n=8, share flat; 0.0% on random tables)"

[ablations.shared_dag]
saving = 92.8
arity = 12
verdict = "kept: canonical sharing, exempt; saving on its mosaic-2 class (88.0% at n=10, 92.3% at n=11, 200 tables); parity 98.7% at n=12, tiled 32.7% at n=11; 0.0% on random tables; mosaic-4 admission earns 0.0% at n=9/10 and 28.7% only at n=12"

[ablations.dag_equal_halves]
saving = 0.0
arity = 10
seed = 184700
tables = "40 each of tiled, mosaic-2, mosaic-4 and equal-halves mosaic-2 at n=7, 8 and 10, plus parity, and, or, majority"
verdict = "removed 2026-10-27: the DAG's single-arm router (⬒, one wire when a node's halves share a child) saves 0.00% by area on every class at n=7..10 (the grid's rectangle is set by columns and 8 rows per node, not by the second wire) and at most 0.08% by chars, on the equal-halves class built to exercise it; it never fired on parity, and, or or majority. Every program that changed (28, 28 and 26 equal-halves tables at n=7, 8, 10; 13 mosaic-2 at n=10) was executed on every row against the plain two-wire router, 0 wrong"

[ablations.dag_column_banks]
saving = 51.6
arity = 16
seed = 184700
tables = "parity, and, or, majority n=8..16; 40 each of mosaic-2 and equal-halves mosaic-2 at n=7, 8 and 10"
verdict = "kept: alternating column banks (a layer reuses the columns of the layer two above) against one column per node. Judged on its class, the tables the DAG is admitted for: majority 83.0% at n=8, 88.8% at n=9, then 40.0% (n=11) growing to 51.6% (n=16) once the plain build is also a DAG; parity 32.9% at n=9 growing to 40.0% at n=16; equal-halves mosaic-2 37.0%, 48.6% and 46.5% at n=7, 8, 10; mosaic-2 30.0% at n=10; 0.0% on random tables and on and/or, where no DAG is admitted. Share grows with arity (the plain width is linear in the node count, the banked width in the widest layer); no table grows; every changed program through n=12 executed on every row, 0 wrong"

[ablations.width_machinery]
saving = 0.0
verdict = "kept: feasibility -- rotation, the strip and streaming trees, the narrowest-grid race and the native-XOR case serve explicit widths only; no default-path effect"

[ablations.balance_flat_tree]
saving = 74.4
arity = 8
seed = "random.Random(s), s = 0..19, n = 7, 8"
tables = "20 random per n=7,8 plus and/or/nand/nor/parity/majority/threshold-3/threshold-n/2 at n=7..10"
verdict = "kept, balanced: the balance hook raced the default and the narrowest grid, so an even-arity H-tree stayed a cell square (243 x 241 at n=8, side 486). Halving the vertical pitch (vertical spans 4 * 2^k - 2) makes it 2:1 (123 x 241, side 246): balanced area (score squared) off 74.4% on random tables at n=8, 0.0% at n=7 (odd arities were already 2:1); named at n=8 parity 17.0%, majority and threshold-n/2 50.6%, threshold-3 44.0%, and/or/nand/nor 74.2%; n=9 0.0%; n=10 and/or/nand/nor 74.6%, majority 3.1% (the shared DAG wins the rest). Flat ~74% over even n, not declining. The default is byte-identical on all 72 tables; every balanced program ran on every row (72 tables, n=7..10, 0 bad). Soundness is no cell shared by two wires, checked on all 65,812 tables n<=4, and execution of every n<=3 table plus 1,500 random n=4; halved-everywhere spans fail to produce an answer"

