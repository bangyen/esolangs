[resource_evidence.execution]
expression = "C*(n+4+Q)+U*(290n+312+H+W+96max(0,2-n))+(1-C-U)*(5T/2+110n+108+min(1,max(0,n-7))*(T-96n+544))"
source_terms = { names = ["C", "Q", "U", "H", "W"], provider = "esolangs.languages.streetcode.proof_formulas:execution_terms" }
exact = true
arities = [2, 3, 4, 5, 6, 8]
first = 2
unit = "steps"
description = { growth = "linear", claim = "worst", template = "{claim} {formula} {unit} for n≥{first}. C constant with Q carets. U selects the H×W tree" }

[resource_evidence.workspace]
# Long rooms exceed the 51-cell floor from the seventh level. Sum their widths geometrically.
expression = "C*(27+bl(n+4+Q))+(1-C)*(nT+2n+25+bl(2T+57+51(n-1)+min(1,max(0,n-7))*(T/2+272-48n)))+2bl(n)"
source_terms = { names = ["C", "Q"], provider = "esolangs.languages.streetcode.proof_formulas:workspace_terms" }
exact = false
arities = [6, 7]
first = 6
unit = "bits"
description = { growth = "T log T", claim = "at most", template = "{claim} {formula} {unit}. C marks direct constants and Q counts carets in their fill row" }

[resource_evidence.scaling]
# n <= 3: the tree alone, 4 rows a leaf, every leaf distinct (parity), 8n + 20
# columns.  From 4 the flat street, 7 rows of T + m + 108 + G columns with m
# the minority entries marked (at most T/2: the zeros are marked when they are
# fewer than the ones by two), races the tree: the worst is a balanced
# table the tree does not beat. G charges 51 columns per level through
# level six, then 2^(k-1)+3 columns.
cases = [
    { through = 3, expression = "(32n+80)T" },
    { expression = "7(3T/2+108+51min(n-1,6)+max(0,T/2-64)+3max(0,n-7))" },
]
exact = true
arities = [2, 3, 4, 5, 6, 7, 8, 9, 10]
first = 2
unit = "cells"
description = { growth = "linear", claim = "worst", template = "{claim} {formula}: tree, then the flat street" }

