[ablations.mouth_overlap]
kind = "archive"
saving = 13.3
arity = 8
seed = "random.Random(1000*n+i), i<20"
tables = 20
verdict = "kept 2026-10-30: gap to the next mouth is max(read run, room reach), the plain build their sum. Default area random n=6/7/8 9.2/11.9/13.3% (4,105/5,410/7,736 vs 4,519/6,139/8,924 cells; min 11.8, max 13.4 at n=7), balanced 17.7/19.1/20.9%; parity=majority 11.8/13.2% default at n=7/8 and 16.0/21.5% balanced, thr2 12.8/15.0%, thr3 12.4/14.6%; share falls past n=8 (parity 11.7/8.9/6% at n=9..11, 4% at n=12) while balanced stays 4-27%. Constants/and/or/nand/nor 0%. 336 programs, 55,552 rows run, a wrong table fails"

[ablations.shared_lap_populate]
kind = "archive"
saving = 16.7
arity = 5
seed = "random.Random(1000*n+i), i<20"
tables = 20
verdict = "kept 2026-10-30 for the tree's family: the shared lap against the per-input hallway loops (plain build: hallway only). and/or/nand/nor, whose tree folds, 39.2/31.0/27.6/28.8% default at n=5..8 (1,440 vs 2,370 at n=5; 3,024 vs 4,248 at n=8) and 42.3-49.3% balanced; random n=3/4 43.1/22.0% (balanced 40.0/1.9%) but n=5 0.7%, n=6..7 0% (the flat street wins every random table), parity/majority/thr 0%. Random misses the 10% bar from n=5; the folding family carries it. 277 programs, 17,792 rows run, a wrong table fails"

