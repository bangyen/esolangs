# Language-owned data, one section per dataset; aggregators read
# only their own section and skip this file when it is absent.

[deep_arities]
linearity = 10
workspace = 7

[curation]
backlinks = 2

[proof_status]
labels = ["linear lookup"]
qualification = "the street writes one cell per entry, then each essential input's mouth forks on its bit (an ignored one is a lone read) and its side room walks the cell pointer left by that bit's weight, leaving the car over the indexed entry"
scaling = "linear: nine rows of street, ~1.8T columns"
execution = "linear: worst 3T + 110n + 106 steps for n = 6, 7, then 4T + 14n + 650: one zero"
workspace = "T log T: worst nT + 2n + 25 + bl(2T+57+G) + 2bl(n) bits past n = 5, G = Σ_{0<k<n} max(51,2^(k-1)+3)"

