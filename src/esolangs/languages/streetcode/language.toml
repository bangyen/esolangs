[proof_status]
labels = ["linear lookup"]
qualification = "the street writes one cell per entry, then each essential input's mouth forks on its bit (an ignored one is a lone read) and its side room walks the cell pointer left by that bit's weight, leaving the car over the indexed entry"
definitions = ["F = 5T/2 + 110n + 108 to n = 7, then 7T/2 + 14n + 652: the flat street"]

