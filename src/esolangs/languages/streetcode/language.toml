[ablations.shared_kerb_default]
kind = "archive"
saving = 22.2222
arity = 8
seed = "random.Random(1847+n)"
tables = "20 random plus parity/majority/and/or per n=7,8; representative n=3 executions"
verdict = "Kept: use the existing narrow-layout shared kerb in the default lookup, removing two of nine rows at fixed width. Random n=7: 108360 -> 84280 cells; n=8: 154719 -> 120337 (22.22% both; 20 tables per arity). Parity and majority share the saving; and/or keep their smaller tree. The n=3 corpus stays byte-identical: 227776 characters and 228946 cells total. The lookup now races at n=4 and is canonical from n=5. Exhaustive tables n=1..3 plus 20 random and named tables per n=4..8: 7024 baseline/candidate output checks, 110 changed programs; 40 independently generated complemented-program controls across the five audited languages rejected. A second candidate, folding the original nine-row lookup into the default, saves 0% on the random and named n=7/8 corpus. Bounds remain valid: shared kerbs remove road travel, with no new tape cells or larger coordinates. Prototype notes are ignored; pins and Size anchors update with the generator."

[ablations.shipped_cost_audit_20261101]
kind = "archive"
arity = 8
seed = "random.Random(6100+n)"
tables = "2 random plus parity/majority/and/or per n=3,5,7,8"
baseline = "f2e356b11^"
verdict = "measured with the interpreter/helpers at 567f2cb18. At n=8: cells 36738 -> 29918, sampled commands 34001 -> 33809, largest sampled written-state peak 1109 -> 1109 bits. Sum of seven-repeat cold generation medians: 8488332 -> 8682291 ns. All rows at n=3; rows 0,floor(T/3),T-1 otherwise. 204 correct executions, 24 wrong-table controls. Peaks and timings describe this corpus. The shared kerb leaves the sampled workspace peak unchanged. Current resource bounds pass where their stated domains apply"

[ablations.constant_table_audit_20261101]
kind = "archive"
arity = 8
saving = 69.6
seed = "both constant values"
tables = "both constants n=1..12; every table and row n<=3; six structured/random witnesses n=4..6"
verdict = "kept: a whole constant needs only an enclosed two-lane corridor. Read n characters into cell 0, move to fresh cell 1, increment 48+bit times, print and halt. No wall-free extension or junction convention is used. Default area is 4(n+54+bit) cells, chars 4n+219+4bit, commands n+52+bit, workspace 27+bl(n+52+bit)+2bl(n). At n=7 area 812/819 -> 244/248; n=8 819/826 -> 248/252; n=12 847/854 -> 264/268, sustaining about 70% savings. A clockwise turn gives a four-column constant floor. Balance retains the old loop shapes for their squarer small constants (side 29/33/38/43/48 at n=1..5); without those candidates the new corridor grew the side to 49/49/49/49-50/50. No measured balanced constant grows at n=1..12. All 270 nonconstant programs through n=3 are byte-identical; n=3 totals 227776 -> 227464 chars and 228946 -> 228570 cells. Both constants n=1..12 ran with default, width=1 and balance=True; sentinels cover n=1,3,4,5,6,8,12."

[ablations.fill_hairpin_room_prototype]
kind = "archive"
arity = 8
saving = -1.2683
seed = "Random(184700+n),20 sequential choice('01') tables each7/8"
tables = "native cycle and baseline controls;fixed20 two rows each;named families;allsmall default byte equality"
verdict = "rejected: the seven-row shared-kerb fill room enters a zero-valued merge incorrectly. Forced flat table01101001,input000 cycles atCP0 before any read (drive states9 and13 repeat); its unmodified baseline prints0. A two-bit room happens to work, so the probe is not universally blocked. Keeping the unshared nine-row stalk repairs the tested corpus but grows public grid area84217->92583 /120316->121842 cells (-9.934/-1.268% saving) at fixed7/8. Each measured program executes both endpoint rows; no invalid seven-row size is claimed as an optimization. No fill room, new height/cut policy or fallback ships; other possible room geometries are not ruled out."

[ablations.read_run_room_prototype]
kind = "archive"
arity = 8
saving = 6.2835
seed = "same fixed20 corpus as fill_hairpin_room_prototype"
tables = "fixed7/8,namedand/or/parity/majority/threshold2/3,last-input identity and ignored-last parity"
verdict = "rejected: a24-column room runs47 decrements, rejoins nonzero, then one street decrement normalizes the bit. Separating it from the preceding level room requires the next mouth gap max(32+ignored, nextroom+29), not simply replacing49 by30. Actual public area84217->72877 /120316->112756 grid cells (13.465/6.283%), clearly declining below20%. Named ordinary families fail; identity16.239/16.102% and ignored-last parity20.000/13.344% also decline and fail. No named window shift, read-room state or reflow path retained."

[ablations.tail_lift_room_prototype]
kind = "archive"
arity = 8
saving = 2.0654
seed = "same fixed20 corpus; explicit negated-table wrong-digit control"
tables = "same native corpus and names as read_run_room_prototype"
verdict = "rejected: one pre-mouth increment does not ensure nonzero under negated fill: answer-1 becomes0, bypassing the room and printingNUL instead of0. The fixed-corpus n8 first table exhibits this; the repaired room uses two pre-mouth increments when negated and47 inside, retaining the original48/49 total. Actual public area84217->81767 /120316->117831 grid cells (2.909/2.065%), fixed-width savings below20% declining. Last-input identity14.530/14.407% also declines below20%. All three repaired layouts jointly pass320 fixed native endpoint runs and128 named runs with read-before-output, exact read counts, sentinels and opposite-answer controls; all1104 small generated programs are byte-identical, with2120 baseline row executions. No new tail, band-room constructor or state retained. Generator/proof code, scopes, pins, Size anchors and example remain unchanged; balanced/width variants are not claimed verified for these rejected prototypes."

