verdict = "kept 2026-10-30: the flat street joins the n=5 race (plain build: tree only). Random n=5 33.1% mean, 34.5% aggregate default (3,203 vs 4,891 cells; 19/20 tables differ, max 44.1%), balanced 0%; parity 57.8%, majority 32.5%, thr3 32.5%, thr2 12.3%, and/or 0%. n=4 and n>=6 identical (from n=6 flat is the canonical shape). 219 programs, 15,840 rows run, a wrong table fails"

