[ablations.alternating_counter_rounds_trick]
kind = "archive"
arity = 8
saving = 6.4
seed = 7000
tables = "same fixed200 generic corpus per n=7/8; all tables/rows n=1..3"
n3_source_units = 56108
n3_commands = 75152
verdict = "kept 2026-11-02 by execution admission: n3 source65984->56108 (-14.97%), commands88320->75152 (-14.91%), no larger table or slower row. Generic size197716->180118 (8.90%) /312520->292498 (6.40%) is declining and independently fails20%. Keep c=2, e=Q-1; quotient/counter alternate i/d, bit=X-2floor(X/2), divisor1+bit*e (mirror:e-bit*e+1), and e*(e+2)=Q^2-1. Ignored rounds divide the current counter once; only essential rounds swap registers. Every divisor is positive until the final deliberate zero divide; i still receives the low table bit and consumes one positive row-number input. A retained final divisor Q implies b was divided by Q; otherwise the retained value is1, so the even-copy overlap stays within2T+6 register bits. No extra clear is needed. If leading inputs are ignored, their remaining counter fits the full-table versus projected-table slack. Generic table construction remains byte-identical: two signed-carry states now use backpointers instead of quadratic prefix copying, restoring O(T) construction. The unsigned table path bounds its code by floor(T/2)+ceil(T/3)+3 instructions (a flipped minority saves its extra correction); unmirrored lookup costs at most8n+6, yielding the new E/source caps. Its instruction-pointer bound has the same bit width at E and E-3 for n>=3 (finite n3..9; thereafter the bound lies strictly between T/2 and T). Old source/E arities1/2/3/5 and W3/5 retained with tighter caps; the derived nonparity witness 1+parity[1:] retains n5 exact maxima after the named parity repair. 10784 raw-variant native rows plus40416 forced mirror/flip and named rows and3200 judge rows passed; IO consumes exactly one token, leaves a second unread, halts at the last instruction, and prints the exact bit. Wrong bit subtraction and wrong Q-1 squaring controls fail. Some individual memory peaks grow (AND3:21->28 bits), within unchanged leading2T workspace bound; no memory-reduction claim."

[ablations.parity_radix16_trick]
kind = "archive"
arity = 8
saving = 17.5
seed = 0
tables = "full-input parity and negation, n=3..10,12,14,16; compared with alternating-counter baseline"
verdict = "kept 2026-11-02: no-search repair of raw digit-register proposal, parity and negation only. Existing O(T) parity recognizer selects from n=4, the genuine crossover: n3 grows239->245 chars, n4 parity ties323 and negation329->323. Each four-bit group is0110 or1001, hence reversed hex6 or9; fixed registers1,3,6,16 emit +6 or +(6+3), no signed-term or family search. Exactly5T/8+8n+12 commands and15T/4+48n+71 chars. Independent parity savings1031->887 (13.97%) /1715->1415 (17.49%) at fixed n7/8; n9/10/12/14/16 3047->2423 /5651->4391 /21107->16007 /82643->62183 /328499->246599, tending to25%. Negation has the same new sizes (alternating baseline can be six chars longer). Limit proof: Thue-Morse consists of16-bit parity blocks or complements. For all eight triples (48bits,16 octal digits), all four entry/exit signed-carry costs are24 terms, and unsigned cost is24; leftover boundary is O(1). Thus old signed octal cost5T/6+O(1), new5T/8+O(1), lookup O(n): limiting source saving25%. Executable finite recurrence and1048 native public rows through n16 check both polarities, exact emitted counts and the genuine low-arity loss. Same O(T) source/build and global bounds; all old proof arities retained. No race against old whole programs, arbitrary upper cap or searched/frozen parity code. All eight pins, Size anchors and balanced example updated and executed."

