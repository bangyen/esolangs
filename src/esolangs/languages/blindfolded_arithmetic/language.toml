# Language-owned data, one section per dataset; aggregators read
# only their own section and skip this file when it is absent.

[curation]
backlinks = 19

[proof_status]
labels = ["linear lookup"]
qualification = "the table read at its essential inputs is one integer built by Horner's rule in base 8, and each essential bit of the row divides it by 1 or by 2^2^m, squared up from 2, so its low bit is the answer"
scaling = "linear: at most four instructions an octal digit, 10n of lookup"
execution = "linear: worst T + ⌈(T-1)/3⌉ + 10n + 9 commands: all ones but the last row, run once"
workspace = "linear: at most 2T + n + 13 bits: the table, and Q in two registers"

