[ablations.projection]
kind = "archive"
saving = 93.9
arity = 12
verdict = "kept: canonical, exempt. The table integer is built from the table read at the essential inputs only, and an ignored input's bit is divided out of the row unused. Building the integer from the full table and dividing by every input instead costs +82.54% at n=10 and +93.87% at n=12 on one-ignored tables, +215.37 / +267.04% on two-ignored tables, and 0.00% on random tables"

[ablations.register_reuse]
kind = "archive"
saving = 0.6
arity = 12
verdict = "historical removal (retirement candidate 34, before 2026-11-02): the divisor 2 was rebuilt into c at every lookup round; the two flag that kept it across rounds until an essential input's divisor computation overwrote it is gone. The audit measured rebuilding at +1.58% at n=10 and +0.57% at n=12 on tables ignoring the three low inputs, +0.65 / +0.21% on two-low-ignored and scattered-ignored tables, 0.00% on random tables: one fixed 6-char instruction per firing, declining everywhere. See RETIREMENT-CANDIDATES entry 34"

[ablations.complement_table]
kind = "archive"
saving = 97.6
arity = 12
verdict = "kept: the table integer is built from whichever of the table and its complement has fewer set bits (one instruction each), the complement's low bit negated by one closing `i=a-i` (6 chars). 0.98-1.65% on random tables at n=7..8 (20 seeded), parity and and 0.00%, majority 0.0-2.1%; or 66.8% / 78.5% / 92.3% / 97.6% at n=7 / 8 / 10 / 12 (2,585 -> 557 chars at n=8, 8,849 -> 677 at n=10), nand 50.0% / 58.6% / 69.2% / 73.2%, popcount>=2 54.4% / 66.2% / 80.0% / 85.2% (share rising with n); nor was already cheap (and was still 1,061 chars at n=8, its single set bit being the top one, which costs Horner digits, not bits; now 551, see mirror_lookup). Measured 2026-10-28 chars, every program executed (n<=3 exhaustive, 150-300 samples at n=4..5, named tables to n=10)"

[ablations.mirror_lookup]
kind = "archive"
saving = 75.3
arity = 10
verdict = "kept: the table integer is also built from the reversed table (and its complement) and the lookup divides by Q - bit*(Q-1) (`c=e-c` for `c=c+a`, same length), reading every input negated; the shortest of the four is emitted. and/nand 33.9% / 48.1% / 62.5% / 75.3% at n=7 / 8 / 9 / 10 (1,061 -> 551 chars at n=8, 2,717 -> 671 at n=10), majority 0.5% / 4.1% / 0.2% / 2.5%, random 0.08% / 0.17% at n=7 / 8 (20 seeded); or, nor, parity, thresholds unchanged. Measured 2026-10-28 chars, every program executed (n<=3 exhaustive, 20-40 random + named at n=4..8)"

[ablations.signed_digits]
kind = "archive"
saving = 17.1
arity = 10
verdict = "kept: each octal digit of the table integer is added as v or as v - 8 carrying one up (terms +-1, +-2, +-4, +-8, at most two a digit, the registers already hold them), a two-state pass choosing the fewer terms; the unsigned build is the carry-free path, so no table grows. Random 9.3% / 12.3% / 14.9% / 17.1% at n=7 / 8 / 9 / 10 (200 / 200 / 40 / 40 seeded; share rising with n), majority 20.9% / 18.6% / 32.1% / 27.6%, thresholds 0.3-1.4%, parity, and, or 0.00% (parity digits are already two-term). Measured 2026-10-30 chars, every program executed (n<=3 exhaustive, 300 random at n=4, 8-40 random + named at n=5..8, named rows sampled at n=9..10)"

[ablations.constant_table_audit_20261101]
kind = "archive"
arity = 8
saving = 85.1
seed = 0
tables = "both constants n=1..12; exhaustive all tables/rows n=1..3; six witnesses/all rows n=4..6"
verdict = "kept: canonical fixed-output spelling. i=i-i or i=i/i sets zero or one from the positive input, then i=i/a divides by the untouched zero register to halt and print. Exactly 11 chars and two commands; written workspace at most n+8 bits. n=8 zero/one 71/77 -> 11/11 chars, 12/13 -> 2 commands, 24 -> 16 written bits. Same sizes at n=7 and n=12; n=3 corpus 66110 -> 65984 chars. Input is consumed before execution. Each language passed 5656 paired old/new row executions; 270 nonconstant programs through n=3 remain byte-identical. Both constants n=1..12 execute in default, width=1 and balanced layouts; a separate 1120-run probe includes every row through n=8. All 24 balanced scores improve or match; all eight benchmark size/command pins remain unchanged."

