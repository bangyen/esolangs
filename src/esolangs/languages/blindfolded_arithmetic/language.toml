[ablations]
audited = "2026-10-19"

[ablations.projection]
saving = 93.9
arity = 12
verdict = "kept: canonical, exempt. The table integer is built from the table read at the essential inputs only, and an ignored input's bit is divided out of the row unused. Building the integer from the full table and dividing by every input instead costs +82.54% at n=10 and +93.87% at n=12 on one-ignored tables, +215.37 / +267.04% on two-ignored tables, and 0.00% on random tables"

[ablations.register_reuse]
saving = 0.6
arity = 12
verdict = "removed (retirement candidate 34): the divisor 2 is rebuilt into c at every lookup round; the two flag that kept it across rounds until an essential input's divisor computation overwrote it is gone. The audit measured rebuilding at +1.58% at n=10 and +0.57% at n=12 on tables ignoring the three low inputs, +0.65 / +0.21% on two-low-ignored and scattered-ignored tables, 0.00% on random tables: one fixed 6-char instruction per firing, declining everywhere. See RETIREMENT-CANDIDATES entry 34"
