language = "Blindfolded Arithmetic"
oldid = 170630

# The page has no whole program with a stated output; these join two of its
# sequences: the empty-second-stack test (`a` is 1 iff `i` is 1) and the halt.
[[examples]]
id = "empty-test-then-halt-1"
note = "the page's empty-stack test and halt sequence, joined"
source = "a = i / i; a = a / i; b = i / i; a = a - b; a = a / a"
stdin = "1"
expected = "1"

[[examples]]
id = "empty-test-then-halt-2"
note = "a is 0, so the halt sequence divides -1 by -1 and the program cycles"
source = "a = i / i; a = a / i; b = i / i; a = a - b; a = a / a"
stdin = "2"
stop = "steps"
max_steps = 200
expected = ""

[[spec_triggers]]
program = "x = a + b"
stdin = "1"
expect = "ProgramError"
claim = "a statement over a name outside a-e and i is a ProgramError"

[[spec_triggers]]
program = "a = a + b"
stdin = ""
expect = "InputExhaustedError"
claim = "no input integer is an InputExhaustedError"

[[spec_triggers]]
program = "a = a + b"
stdin = "0"
expect = "ArgumentError"
claim = "an input that is not positive is an ArgumentError"

[[spec_triggers]]
program = "a = a + b"
stdin = "x"
expect = "ArgumentError"
claim = "an input that is not an integer is an ArgumentError"

[[spec_triggers]]
program = "c = i / i; c = c + c; a = b - i; i = a / c; d = d / d"
stdin = "7"
expect = "output"
output = "-3"
claim = "division truncates toward zero"

[[spec_triggers]]
program = "i = i + i; i = i / a"
stdin = "5"
expect = "output"
output = "10"
claim = "the division by zero is not executed and i is printed"

[[spec_triggers]]
program = "b = i / i; a = a + b; i = i + b; c = a - b; c = c - b; c = c - b; c = c / c"
stdin = "1"
expect = "output"
output = "4"
claim = "the list runs cyclically until a division by zero"

[[spec_triggers]]
program = "a=i/i ;\n\n  i = i+a\n;b=b/b"
stdin = "1"
expect = "output"
output = "2"
claim = "newlines and semicolons separate instructions, mixed, with optional whitespace"
