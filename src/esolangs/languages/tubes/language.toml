[resource_evidence]
version = 2
construction = "esolangs.languages.tubes.generator:tubes_request"
witnesses = "esolangs.languages.tubes.tests.resource_witnesses:resource_tables"

[resource_evidence.execution]
# Row 0 enters at most 2T - 1 cells. Weights sum to at most T - 1.
# The longest gadget takes w + 5 commands, a bare read one. The entry
# to row 1 and the exit take seven. The single-zero witness attains
# all maxima with every input zero.
expression = "3T + 5n + 5"
exact = true
arities = [1, 2, 3, 6]
first = 1
unit = "commands"
description = { growth = "linear", claim = "worst", template = "{claim} {formula} {unit}" }

[resource_evidence.workspace]
# Table cells write one bit each, with coordinates 0..T-1. Removing
# one minimum-width cell leaves (n+1)T-1 bits in row zero.
# On row one, the all-ones input walks widths n,n-1,...,1,1.
# Otherwise the first zero fixes the width of all later addresses.
# A leading zero then all ones maximizes this case: n cells of n+2
# bits, at least the all-ones total for n>=3. Tables with at most
# T/2 lookup entries save more in row zero than row one can gain.
# The same leading-zero run attains pointer peaks n+3, 2 and n+1,
# since it takes the rightmost detour. Small arities are exhaustive.
cases = [
    { through = 1, expression = "19" },
    { through = 2, expression = "33" },
    { through = 3, expression = "62" },
    { expression = "(n+1)T+n²+4n+5+bl(2n-1)" },
]
exact = true
arities = [1, 2, 3, 4, 6]
first = 1
unit = "bits"
description = { growth = "T log T", claim = "worst", template = "{claim} {formula} {unit}; table and index cells" }

[resource_evidence.scaling]
# Three rows by the longer of row 0, T_k + 1 + ones <= 2T, and row 1,
# T_k + 2k + n + 4 <= T + 3n + 4 for k essential inputs. Both widths
# are attained by the single-zero witness.
expression = "3max(2T, T + 3n + 4)"
exact = true
arities = [1, 2, 3, 4, 5, 6, 7, 8]
first = 1
unit = "cells"
description = { growth = "linear", claim = "worst", template = "{claim} {formula} {unit}" }

