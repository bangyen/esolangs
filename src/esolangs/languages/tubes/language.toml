[resource_evidence.execution]
# Row 0 enters at most 2T - 1 cells, a gadget w + 6, the end at most 10.
expression = "3T + 6n + 9"
exact = false
arities = [1, 2, 3, 6]
first = 1
unit = "commands"
description = { growth = "linear", claim = "at most", template = "{claim} {formula} {unit}" }

[resource_evidence.workspace]
# At most T written table cells and n read cells, each an x of at most n
# bits, a 1-bit row and a 2-bit value; the pointers, heading and cursor.
expression = "(n + 3)T + 2n^2 + 8n + 64"
exact = false
arities = [1, 2, 3, 6]
first = 1
unit = "bits"
description = { growth = "T log T", claim = "at most", template = "{claim} {formula} {unit}" }

[resource_evidence.scaling]
# Three rows by the longer of row 0, T_k + 1 + ones <= 2T (attained when
# every entry but one is 1), and row 1, T_k + 3k + n + 4 <= T + 4n + 4.
expression = "3max(2T, T + 4n + 4)"
exact = false
arities = [1, 2, 3, 4, 5, 6, 7, 8]
first = 1
unit = "cells"
description = { growth = "linear", claim = "at most", template = "{claim} {formula} {unit}" }

