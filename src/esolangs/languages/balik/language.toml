verdict = "kept: canonical root folding/minimal spelling, exempt. Read every input at cell zero, then move right once to the fresh output cell; omit the former leading right and closing left moves. Chars/cells and commands n+2+b: n=7 10/11->9/10 (9.5% combined), n=8 11/12->10/11 (8.7%), n=12 15/16->14/15. n=8 workspace unchanged at 12 written bits. n=3 corpus area 74501->74499, chars 68083->68081. Executed 1120 candidate/native row runs and 5656 paired old/new executions per language; 270 nonconstant n<=3 sources identical. Both constants execute default, width=1 and balanced layouts through n=12; all 24 balanced scores match or improve. All eight benchmark size/command pins and global resource caps unchanged. Owned raw IO/template checks preserve exact input use, following records and no EOF probe."

[ablations.trick_prototype_20261102_leaf_pair_compaction]
arity = 8
saving = 14.7040
verdict = "kept: when both children are one-row leaves, place the bottom child on the splitter row. That branch is known nonzero, so its eastward crossing of @ does not turn; both leaves restore the tested cell. Existing clockwise routing then fits three rows instead of four, with no new candidate race or search. All small tables/rows execute; n=3 chars68081->56163. On200 Random(184700+n) tables per fixed judge arity, n=7 chars1724227->1477128 (14.33%), n=8 3687354->3145164 (14.70%). Four rows per old/new table execute. Larger diagnostics20 tables n=9..12, five13/14, two15..17: the latest observed local peak is15.91% n=16 then15.79% n=17, without an arity cap; neither implies a vanishing saving. A bottom box has height3 and path excess10 instead of12. Exact worst E is19 at n=1; otherwise34*2^(n/2)+7n-40 for even n, 44*2^((n-1)/2)+7n-38 for odd. Full parity attains the geometry; native formulas3..5 pass. Whole constants stay byte-identical. Owned IO checks consume all digits before output and preserve the next token."

