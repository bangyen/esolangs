[catalogue]
sharing_exempt = "clockwise turns and a cell test only, no jump: a box runs where it is drawn"

[proof_status]
labels = ["tree"]
qualification = "nested boxes test one input cell each with a splitter that also merges, since the tested cell is unchanged; a constant subtable is one leaf"
scaling = "linear: about 84.5T characters, mostly vertical boxes, every other one side by side"
execution = "linear: worst 38·2^(n/2) + 7n - 44 for even n, 50·2^((n-1)/2) + 7n - 42 for odd past n = 1"
workspace = "poly n: at most 2bl(L) + 2n + 3bl(2n + 4) + 6 bits"

