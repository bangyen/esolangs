# Language-owned data, one section per dataset; aggregators read
# only their own section and skip this file when it is absent.

[curation]
backlinks = 1

[catalogue]
sharing_exempt = "clockwise turns and a cell test only, no jump: a box runs where it is drawn"

[proof_status]
labels = ["tree"]
qualification = "nested boxes test one input cell each with a splitter that also merges, since the tested cell is unchanged; a constant subtable is one leaf"
scaling = "linear: about 88T characters, alternating vertical and horizontal boxes"
execution = "linear: at most 48·2^⌈n/2⌉ + n^2 + 20n commands: one path down the boxes"
workspace = "poly n: at most 2bl(L) + 2n + 3bl(2n + 4) + 6 bits"

[ablations]
audited = "2026-10-27"

[ablations.essential_inputs]
saving = 29.0
arity = 10
seed = 2026
tables = "20 random and 20 with a random proper subset of inputs essential, n=8 and n=10"
verdict = "kept: a table ignoring inputs tests only the essential cells; 26.1% at n=8 and 29.0% at n=10 on those tables beyond the constant-leaf fold, 0.0% on random ones"

