[ablations.digit_borrow]
kind = "archive"
saving = 0.0
arity = 12
verdict = "recorded: a decimal 6 in a literal is spelled 16 with a borrow from the next digit. 6 is the one digit with no letter, so a 6-containing literal is unspellable without the borrow; there is no correct removal to price. Correctness machinery"

[ablations.packing_race]
kind = "archive"
saving = 0.06
arity = 10
verdict = "replaced 2026-10-29 by a rule: the min-length race over four packings (index complemented or direct x answer stored or negated) saved 0.82% n=2, 0.11% n=8, 0.06% n=10, 0.01% n=12 on random tables (20 per arity n<=10, 8 at n=11,12), under the bar; on named functions it saved 30.6-61.9% n=10 on or/and/thr2 and complements (parity and majority 0.0%, majority' 2.15% n=8). The rule picks the smallest packed integer (ties: stored before negated, complemented before direct) only when its bit length is within 3/4 of the table width, else the plain complemented build: byte-identical to the race on every or/and/thr2 and complement table n=4..12 measured, identical to plain on random tables n>=5, +1-2 chars on parity/majority/thr2 complements n<=8 and random n=3 (+0.6%). No bespoke search left; characters only, the generator has no balanced route"

[ablations.constant_table_audit_20261101]
kind = "archive"
arity = 8
saving = 46.7
seed = 0
tables = "both constants, n=1..12"
verdict = "kept: canonical constant folding and minimal spelling, exempt. Read/drop each input line, then push and print the answer literal using the selected integer-conversion dialect. Default chars and commands 2n+4: n=7 35/36->18/18 (49.3%), n=8 37/38->20/20 (46.7%), n=12 45/46->28/28. n=8 written workspace 363/371->217/217 bits. Both integer-conversion dialects execute both constants n=1..12. n=3 corpus chars 18136->18101. Executed 1120 candidate runs and 5656 paired old/new row runs; 270 nonconstant n<=3 sources identical. Both constants execute default, width=1 and balanced layouts through n=12; all 24 balanced scores match or improve. All eight benchmark size/command pins unchanged and global resource caps unchanged. Owned raw read-first checks verify exact read count and preserve the following input record."

[ablations.trick_prototype_20261101_ord_quotient_read]
kind = "archive"
arity = 8
saving = 0.0
verdict = "rejected: replacing the documented A-versus-any-other-line normalization by ord(line[0])//25 changes B from false to true and makes an empty line halt with division by zero. Both dialects reproduce these counterexamples; shipped controls print 0. All truth-table rows through n=3 execute on the normal %/A alphabet for both quotient and seed prototypes, 8480 runs, so the counterexamples are not vacuous. Forced direct packing also grows AND: n=8 156->169 chars, n=10 190->419, n=12 224->1361; all-ones witnesses execute correctly. Owned tests pin B, empty, 0 and 1 lines as false in both dialects. No contract weakening or old-candidate fallback."

[ablations.trick_prototype_20261101_seed_first_read]
kind = "archive"
arity = 8
saving = 2.575
verdict = "kept after completeness recheck 2026-11-03: source alone misses admission (fixed200 at7/8 chars35530->34330,46602->45402;3.38/2.57%), but the independent exhaustive n3 execution gate gives144808->132616 commands (-8.4194%),18101->16577 chars, no growing table or slower row. Seed the first essential factor directly, removing initial one, first square and multiply-by-one; six default characters/commands, ten in the prose conversion dialect. Constants unchanged. No added helper, runtime state, candidate, search or old-source fallback; the first-input branch replaces the superseded identity operations. Ignored prefixes/suffixes still read/drop in physical order. Native12960 small/sample runs and440 EOF/nonalphabet/layout controls pass both dialects, with exact read-before-print and sentinel checks; wrong first factor is caught. Paired seven-repeat cached-program native n3 median .227066->.209918 seconds (-7.55%). Exact source/E17n+15+d; workspace frame loses48bits and literal-PC term becomes bl(17n+d), all other terms unchanged. Original exact arities3/5 retained; native attainers2/3/5 yield E/W51/488,69/646,110/1079. All pins/byrow/lastrow, anchors and example updated together. O(T) source/build unchanged."

