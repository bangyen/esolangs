# Language-owned data, one section per dataset; aggregators read
# only their own section and skip this file when it is absent.

[curation]
backlinks = 3

[proof_status]
labels = ["linear lookup"]
qualification = "the whole table is one int-mode literal read in base 10, and each `W` squares an accumulator and doubles it on a 0, which is Horner's rule for the complemented index, so the accumulator is exactly the power of two that `R` shifts the wanted entry down to bit 0"
scaling = "linear: bounded dependency scan, one table literal, n read blocks"
execution = "linear: worst 14n + 32 + d commands, d the digits of 2^T: one per program character"
workspace = "linear: worst 16d + 112n + 312 + bl(14n+d+17) + 2bl(10^(d+1)+2^T-1) + bl(2n) + bl(n) bits, d the digits of 2^T"

