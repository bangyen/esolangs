[ablations.key_store]
saving = 1.7
arity = 12
verdict = "removed 2026-10-20 (retirement candidate #31): 65 is spelled inline at each read (WFEFFMFSBT); the key-9 store (FEFFMFS pushed once, loaded by every read as WFIFDBT) netted 3 chars per essential input less the 11-char store block -- deletion cost +3.95% at n=10 and +1.74% at n=12 on random tables, linear in n against a 2^n program, so the share declines toward zero; where nothing reads the value the block was pure waste (constant tables: the removal is 19.30-24.44% smaller at every arity). Removed with no conditional-store repair"

[ablations.table_lift]
saving = -0.15
arity = 12
verdict = "removed 2026-10-20 (retirement candidate #32): _grapheme_table now lifts by the smallest multiple of 2^k whose sum with the packed value leads with 1, replacing the fixed target [10^(d+1), 10^(d+1) + 2^k) that made the literal always d+2 digits. The minimal lift was execution-gated clean in the audit and smaller on every corpus measured: -0.35% at n=10 and -0.15% at n=12 on random tables, -1.89 / -1.75% on constant tables; the fixed target overshot by a fixed ~2 letters a program, a fixed amount whose share tends to zero. The workspace proof formula still states the fixed lift's bound -- restatement pending the corpus pass"

[ablations.digit_borrow]
saving = 0.0
arity = 12
verdict = "recorded: a decimal 6 in a literal is spelled 16 with a borrow from the next digit. 6 is the one digit with no letter, so a 6-containing literal is unspellable without the borrow; there is no correct removal to price. Correctness machinery"

[ablations.packing_race]
saving = 0.06
arity = 10
verdict = "replaced 2026-10-29 by a rule: the min-length race over four packings (index complemented or direct x answer stored or negated) saved 0.82% n=2, 0.11% n=8, 0.06% n=10, 0.01% n=12 on random tables (20 per arity n<=10, 8 at n=11,12), under the bar; on named functions it saved 30.6-61.9% n=10 on or/and/thr2 and complements (parity and majority 0.0%, majority' 2.15% n=8). The rule picks the smallest packed integer (ties: stored before negated, complemented before direct) only when its bit length is within 3/4 of the table width, else the plain complemented build: byte-identical to the race on every or/and/thr2 and complement table n=4..12 measured, identical to plain on random tables n>=5, +1-2 chars on parity/majority/thr2 complements n<=8 and random n=3 (+0.6%). No bespoke search left; characters only, the generator has no balanced route"

