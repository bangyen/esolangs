[proof_status]
labels = ["linear lookup"]
qualification = "the whole table is one int-mode literal read in base 10, and each `W` squares an accumulator and doubles it on a 0 (or a 1), which is Horner's rule for the complemented (or direct) index, so the accumulator is exactly the power of two that `R` shifts the wanted entry down to bit 0"
scaling = "linear: at most 17n + 21 + digits(2^T) characters from n=2"
execution = "linear: at most 17n + 21 + d commands from n=2, d the digits of 2^T: one per program character"
workspace = "linear: at most 16d + 136n + 203 + bl(17n+d+6) + max(T+14, 2bl(λ)+2) + bl(2n) + bl(n) bits from n=2"
definitions = ["λ = the largest lift of d + 1 digits, d those of 2^T"]

