[resource_evidence.execution]
# The largest lift needs at most one more digit than 2^T. A modulus
# residue of 10^(d-1)-1 needs all of them when d is the width of 2^T.
expression = "17n+15+digits(2^T)"
exact = true
arities = [2, 3, 5]
first = 2
unit = "commands"
description = { growth = "linear", claim = "at most", template = "{claim} {formula} {unit} from n=2: one per program character" }

[resource_evidence.workspace]
# D is the decimal width of the modulus and B the largest lift's
# bit width. Frame text peaks at the final literal digit. The stack
# peaks at the final read or at the tail's [lift, 2, lift].
expression = "16D+136n+155+bl(17n+D)+max(T+14,2B+2)+bl(2n)+bl(n)"
source_terms = { names = ["B", "D"], provider = "esolangs.languages.grapheme.proof_formulas:workspace_terms" }
exact = true
arities = [2, 3, 5]
first = 2
unit = "bits"
description = { growth = "linear", claim = "at most", template = "{claim} {formula} {unit} from n=2" }

