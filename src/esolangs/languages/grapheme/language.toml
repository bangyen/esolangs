qualification = "the whole table is one int-mode literal read in base 10, and after the seeded first factor each `W` squares an accumulator and doubles it on a 0 (or a 1), which is Horner's rule for the complemented (or direct) index, so the accumulator is exactly the power of two that `R` shifts the wanted entry down to bit 0"
definitions = ["B = bit width of the largest minimal leading-one lift modulo 2^T", "D = digits(2^T)"]

