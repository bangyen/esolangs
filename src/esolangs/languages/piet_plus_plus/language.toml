arity = 4
seed = "random.Random(20261028), n = 4..10 drawn in turn"
tables = 20
verdict = "kept under the random bar: the program builds the bit position from the last k inputs for k = 2, 3, 4 and keeps the narrowest image. Fixing k = 4 (16 of a pixel's 24 bits; k = 5 would need a 2^31 power, not a pixel) costs +34.78% area at n = 4 (93.0 against 69.0 codels, mean of 20), +14.81% at n = 5, +6.06% at n = 6, +5.41% at n = 7 and nothing from n = 8, where the pixels dominate; every build is executed, exhaustive through n = 3 and parity, and, or, majority and 20 random tables at n = 4..8 (balanced area is the default area: there is no other layout)"
