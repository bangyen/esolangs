# Language-owned data, one section per dataset; aggregators read
# only their own section and skip this file when it is absent.

[curation]
backlinks = 8

[proof_status]
labels = ["finite lookup"]
qualification = "the leading essential inputs fold into a pixel address, Read loads the pixel holding 2^k table bits, and the last k inputs square up the power of two that selects the bit"
scaling = "linear: at most 3T/16 + 12n + 62 codels"
execution = "linear: at most 6n + 5 steps"
workspace = "linear: at most bl(T/16 + 4n + 21) + bl(n) + bl(2n-1) + 37 bits"

[catalogue]
sharing_exempt = "pixels are packed 2^k rows apiece; a repeated subtable is not drawn twice, only addressed"
folding_constant_local = "essential_inputs"  # no essential input: pushes the constant, no pixels

