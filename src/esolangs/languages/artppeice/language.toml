[resource_evidence.execution]
# c = ceil(n/4) entries a pass.  A pass replays at most 3n + 5 setup lines
# and 2 closing ones, an entry takes 10, and the copy after the indexed
# one halts on its third line: at most floor(T/c) + 1 passes start.
expression = "(3n + 7)⌊T/⌈n/4⌉⌋ + 10T + 3n + 8"
exact = false
arities = [1, 2, 3, 6]
first = 1
unit = "commands"
description = { growth = "linear", claim = "at most", template = "{claim} {formula} {unit}" }

[resource_evidence.workspace]
# One-character words of 8 bits: at most T in the counter, 2T in the
# table queues, T + 3c in the sink (emptied every pass), n + c + 2 in E,
# one per input queue, five in P and D; 8 + n one-letter names; the line
# index and the input cursor.
expression = "32T + 32n + 192"
exact = false
arities = [1, 2, 3, 6]
first = 1
unit = "bits"
description = { growth = "linear", claim = "at most", template = "{claim} {formula} {unit}" }

[resource_evidence.scaling]
# One table queue, m essential inputs of weights summing to 2^m - 1 <= T - 1
# and c = ceil(n/4) entry copies: 2T + 2(2^m - 1) + 27n + 32m + 207c + 181
# characters, reached at m = n (input names are one letter below n = 26).
expression = "4T + 59n + 207⌈n/4⌉ + 179"
exact = false
arities = [1, 2, 3, 4, 5, 6, 7, 8]
first = 1
unit = "characters"
description = { growth = "linear", claim = "at most", template = "{claim} {formula} {unit}" }

