[proof_status]
labels = ["linear lookup"]
qualification = "the first pass routes w counter words per set input of weight w into a counter queue closed by P, beside a queue holding the essential inputs' table, a word an entry; each pass dequeues both in step, and only the closing P puts a word ahead of the entry's digit in the printed queue, whose first word is then dropped; an ignored input is a bare read"

