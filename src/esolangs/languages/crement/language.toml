[ablations.constant_table_audit_20261101]
arity = 8
saving = 53.4
seed = 0
tables = "both constants n=1..12; exhaustive all tables/rows n=1..3; six witnesses/all rows n=4..6"
verdict = "kept: canonical whole-constant folding. Keep every uniform PAIR slot unreachable behind one control instruction: jump to the end for zero, or to itself for one. This removes the unused testers and the other two header instructions. n+1 instructions; one step halts or repeats the initial state. Workspace is zero for one; zero uses 11n+10+2bl(n+1) bits because the snapshot groups the read-only program with its changed cursor. n=8 zero/one 133/133 -> 62/62 chars; n=12 189/189 -> 91/90. n=3 default corpus 37120 -> 37050 chars; area 36312 -> 36252. n=2 corpus 1330 -> 1274. Each language passed 5656 paired old/new row executions; all 270 nonconstant programs through n=3 stay byte-identical. Both constants n=1..12 execute in default, width=1 and balanced layouts. All 24 balanced scores per language improve or match; all eight benchmark size/command pins remain unchanged. Owned regressions check resources and every embedded slot or stream read; stream output follows all reads and leaves a sentinel unread."

[ablations.trick_prototype_20261102_preset_named]
arity = 8
saving = 29.8869
verdict = "kept for parity, thresholds and their complements over essential inputs. Initialize each tester to its first node and name an unchanged node by that tester directly; other nodes patch only differing targets. No modal search, table race or reordered input slots. Every threshold and complement at n=7/8 executes all rows; worst saving 502->341 chars (32.07%) and 619->434 (29.89%). Parity 435->272 (37.47%) and 501->314 (37.33%). AND/OR and complements 283->122 and322->137; actual direct chain programs through n=80 execute controls and match public templates through12. Their savings approach75% from below, with no finite global maximum. Named templates use uniform data-only setters; generic PAIR and constants stay unchanged. Global source maximum becomes5 lines at n=1,13 at n=2; higher generic maxima remain. Execution bounds concern halting rows; divergent programs repeat the canonical loop, not a finite runtime."

