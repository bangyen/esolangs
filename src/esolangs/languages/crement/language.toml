[proof_status]
labels = ["parameterized tree"]
qualification = "each input is the data of one jump in a two-line tester; a node patches the tester's two targets to its children and jumps in, a folded subtree targets the shared self-jump or the line past the end, and a subtree already emitted at its level is targeted, not repeated; parity and thresholds reuse initial tester targets without revisiting a level"
definitions = ["P = Σ_{k<n} min(2^k, 4^s - 2^s), s = 2^(n-k-1), the shared nodes per level", "N = 5 at n=1, 13 at n=2, otherwise 3P+2n+3"]

