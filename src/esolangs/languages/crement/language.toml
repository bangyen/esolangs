verdict = "kept: canonical, exempt. A subtree equal to one already emitted at its level is named by its first line, not re-emitted; a parent patches its own tester's targets on every entry, so naming is sound. With the halves-agree skip kept, removing the naming costs 52.1% at n=8 rising to 61.7% at n=10 and 70.0% at n=12 on random tables, 97.6% / 99.3% on parity at n=10/12; removing both costs 57.4% / 66.1% / 73.5%"

