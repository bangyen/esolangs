language = "Modulous"
oldid = 143648

[[examples]]
id = "cat"
source = "[INP STR][PRT STR][JMP B 1 NIF 0][JMP B 3]"
stdin = "abc"
stop = "eof"
expected = "abc"

[[examples]]
id = "truth-machine-0"
source = """\
    [INP INT][JMP F 3 IF 0][JMP F 4 IF 1][RST][PRT INT][END][DUP][PRT INT][JMP B 2]"""
stdin = "0"
expected = "0"

[[examples]]
id = "truth-machine-1"
source = """\
    [INP INT][JMP F 3 IF 0][JMP F 4 IF 1][RST][PRT INT][END][DUP][PRT INT][JMP B 2]"""
stdin = "1"
stop = "steps"
max_steps = 500
expected = "1111111111"

[[examples]]
id = "counter"
source = "[PSH INT 0][DUP][PRT INT][ADD 1][JMP B 3]"
stop = "steps"
max_steps = 500
expected = "0123456789101112"

[[spec_triggers]]
program = "[POP]"
stdin = ""
expect = "HaltError"
claim = "An operation on an empty stack."

[[spec_triggers]]
program = "[RND 0]"
stdin = ""
expect = "HaltError"
claim = "RND with a bound below 1."

[[spec_triggers]]
program = "[PSH INT 1][SWP]"
stdin = ""
expect = "HaltError"
claim = "SWP with fewer than two values."

[[spec_triggers]]
program = "[PRT VAR9]"
stdin = ""
expect = "HaltError"
claim = "an undefined variable (any name but VAR1-VAR4)."

[[spec_triggers]]
program = "[INP INT]"
stdin = ""
expect = "InputExhaustedError"
claim = "INP at EOF."

[[spec_triggers]]
program = "[PSH STR hello]"
stdin = ""
expect = "ProgramError"
claim = "PSH STR with no quoted string."

[[spec_triggers]]
program = "x[END]"
stdin = ""
expect = "ProgramError"
claim = "Text outside any [command]."

[[spec_triggers]]
program = "[PSH INT 99999999][PRT]"
stdin = ""
expect = "ProgramError"
claim = "a PRT character out of range."

[[spec_triggers]]
program = "[PSH INT]"
stdin = ""
expect = "ProgramError"
claim = "a missing required argument."

[[spec_triggers]]
program = "[PRTINT]"
stdin = ""
expect = "ProgramError"
claim = "an unknown command."
