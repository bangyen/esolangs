[ablations.trick_prototype_20261102_pair_packed_literal]
arity = 8
saving = 3.8095
verdict = "rejected tested complete decoder: pack00/11/01/10 as digits0/1/2/3, halve higher weights, read the selector last, then branch to SUB2 for the zero arm or SUB1/SUB3 for the one arm. Keep trailing ignored reads before printing. All small rows and four rows per20 judge/named tables execute actual generated programs. Generic chars11120->11860 at7 (6.65% growth),14700->14140 at8 (3.81% saving), failing the fixed gate; racing old at7 would give zero gain there. Named symmetric builds also grow. Three-input chars58634->83678, so it fails the no-larger-table execution admission too. This rejects this explicit branch decoder, not every pair encoding."

[ablations.trick_prototype_20261102_variable_counter_via_prt]
arity = 2
saving = 0.0000
verdict = "rejected tested counter replacement: weighted one bits update VAR1 while the stack counter remains0. On table0001,row11 the actual mutant prints0 instead of1; baseline prints1. A direct PSH INT7,PSH VAR1,POP,PSH INT0 control leaves VAR1=7 and stack(0), proving PSH VAR1 stores rather than loads. PRT VAR1 prints without pushing a stack counter. No complete variable-to-stack walk was supplied; hypothetical size savings are not measurements and no interpreter change is admitted."
