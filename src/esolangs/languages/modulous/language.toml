[resource_evidence.execution]
expression = "4D+7J+P*(2n+3)+(1-D-J-P)*(T+3n+2+min(1,max(0,n-4))*(4-T/2)+min(1,max(0,n-5))*(2T+2n-37)+min(1,n-1)*max(0,S-1))"
source_terms = { names = ["D", "J", "P", "S"], provider = "esolangs.languages.modulous.proof_formulas:execution_terms" }
exact = true
arities = [1, 2, 3, 5]
first = 1
unit = "commands"
description = { growth = "linear", claim = "worst", template = "{claim} {formula} {unit}. D, J and P mark the direct, branch and discard readers. S counts literal pushes" }

[resource_evidence.workspace]
expression = "A*(9+bl(M))+P*(7+bl(2n+3)+bl(2n-1)+bl(n))+(1-A-P)*(13max(0,2-n)+min(1,n-1)*(6T+2-3T*min(1,max(0,n-4))+(n-1)*min(1,max(0,n-5))+bl(max(M,T+3n+2+min(1,max(0,n-4))*(12-T/2)+min(1,max(0,n-5))*(3n+3-T/2)))+bl(2n-1)+bl(n)))"
source_terms = { names = ["A", "P", "M"], provider = "esolangs.languages.modulous.proof_formulas:workspace_terms" }
exact = true
arities = [1, 2, 3, 4, 6]
first = 1
unit = "bits"
description = { growth = "linear", claim = "worst", template = "{claim} {formula} {unit}. A selects the one-input integer reader, P the discard reader and M counts tokens" }

[resource_evidence.scaling]
# The full-essential pair reader writes powers of two in decimal.
cases = [
    { through = 1, expression = "68" },
    { through = 4, expression = "6T+28n+21" },
    { through = 5, expression = "3T+28n+144" },
    { expression = "T/2+48n+157+power2_digits_sum(n-1)" },
]
exact = true
arities = [1, 2, 3, 4, 5, 8]
first = 1
unit = "characters"
description = { growth = "linear", claim = "worst", template = "{claim} {formula}" }

