[ablations.constant_table_audit_20261101]
kind = "archive"
arity = 8
saving = 29.2
seed = "both constant values; witnesses(n) at n=4..6"
tables = "every table and row n=1..3; six witnesses per n=4..6; constants n=1..12"
verdict = "kept: canonical whole constants. Each input is read and popped, then push ASCII 48/49, print and halt; no packed table, index or discard walk. Exactly 14n+26 chars, 2n+3 commands and 7+bl(2n+3)+bl(2n-1)+bl(n) written bits. At n=8 both bits 195 -> 138 chars; n=12 251 -> 194. Existing bracket/token wrapping serves narrow layouts; constants need no table-chunk balance candidates. n=3 corpus 58748 -> 58634 chars, width=1 100836 -> 100682. Generic envelopes past n=1 and all eight benchmark pins unchanged. The unchanged one-input lookup exposed a pre-existing workspace overrun, 22 > 21 bits; direct identity/complement base cases use at most 13 bits and seven commands, preserving the old envelope. Each language passed 5656 paired before/after row executions; 268 nonconstant programs through n=3 are byte-identical; only the two one-input projections also change. Both constants n=1..12 execute in default, width=1 and balanced layouts; all 24 old balanced constant scores improve or match. Owned regressions enforce all reads before output, preserve a sentinel and check resource bounds."

[ablations.trick_prototype_20261102_tail_reads]
kind = "archive"
arity = 3
saving = 54.6562
verdict = "kept independently by execution gate. Tail a cheap final input-order suffix: a zero only pops its bit; a one pops its bit and weight entries. Ignored reads stay in that suffix, never move past output. Weight1/2/4 blocks save16/11/1 chars; weight8 grows19, so4 is the local crossover (the raw proposal incorrectly stopped at2). With four essential inputs unrolling8 additionally removes the counter/walk: the generic program266->229 chars and67->30 commands; at five, unrolling16 grows332->354, giving the actual whole-counter cutoff. With no prefix the counter is zero: omit it and its dead walk; symmetric weight1 builds become entirely direct reads. Across every three-input table/row commands67008->30384 (54.66%), no slower row or larger table; chars58634->37030,width1 100682->71908. Even retaining the zero counter/walk gives36480 commands (45.56%), no slower row or larger table: no bundling with other failed rules. Generic20 seeded tables6060+n n=7 chars11120->10560 (5.04%), n=8 14700->14140 (3.81%); these declining size gains do not admit the rule. Named parity/AND/OR/majority chars433->265 and483->299. All-small,16 seeded plus named/ignored tables per n=4..8 and exact resource controls give10972 generated-program runs, preserving a sentinel and checking reads before output. Exact E at2..4 is T+3n+2; thereafter5T+5n-33. W separates no-prefix n=2..4 from indexed prefixes, using the actual cursor length6n+8. Native boundary witnesses attain E/W at2..6; n4 newW109. The old program actually used114 bits against its old113 cap because6n+5 omitted the cursor crossing; the new accounting fixes that boundary. Wrong-table control fires. Constants and scalar fast paths unchanged."

