[proof_status]
labels = ["linear lookup"]
qualification = "pair literal for asymmetric inputs; O(n)-source symmetric count reader retained; default exact maxima, split literals pay extra pushes/cursor bits"
definitions = ["S = 6T+28n+21 at n=2..4; 3T+28n+144 at n=5; otherwise T/2+48n+157+sum(digits(2^k),k=0..n-2)", "E = T+3n+2 at n=2..4; T/2+3n+6 at n=5; otherwise 5T/2+5n-31", "P = T+3n+2 at n=2..4; T/2+3n+14 at n=5; otherwise 6n+17 default commands", "W = 6T+2+bl(P)+bl(2n-1)+bl(n) at n=2..4; otherwise 3T+(2 if n<=5 else n+1)+bl(P)+bl(2n-1)+bl(n)", "H = number of table-literal pushes"]

