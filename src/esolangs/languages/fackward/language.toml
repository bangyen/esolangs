# Language-owned data, one section per dataset; aggregators read
# only their own section and skip this file when it is absent.

[curation]
backlinks = 0

[proof_status]
labels = ["tree"]
qualification = "a level is a block whose quiet pass reads the bit; `/ c 49` makes it 0 or 1, that many `~` swap the two child blocks, `!` drops one and `)` runs the other; equal halves fold"
scaling = "linear: one block a node; a subtable repeated under two parents is copied"
execution = "poly n: worst 40n + 4 steps: 40 a level, then print and halt"
workspace = "linear: at most 8L bits: the two stacks hold the program's tokens"

