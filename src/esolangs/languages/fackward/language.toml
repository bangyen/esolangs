[ablations.equal_halves_skip]
saving = 45.56
arity = 12
verdict = "kept: canonical, exempt. A level whose halves agree drops its character with ! c and emits the one child (14 chars) instead of the 37-char node template with both children copied. Removing the skip costs +45.59% at n=10 and +45.56% at n=12 on random tables (second seed set +45.66 / +45.50%), and at n=10/12: one ignored input +153.65 / +149.31%, three +678.79 / +678.51%, half-constant +188.17 / +188.61%, majority +95.41 / +109.08%. The skip chain is also the constant fold: a constant costs O(n) shipped against the plain build's +49,711.84 / +168,256.67%. Parity measures 0.00% (it has no equal halves; shipped parity is the plain build, exactly 37T - 31). The plain build is this removal itself; the memo in _contents is build-time only and changes no emitted char"

[ablations.last_level_forms]
saving = 25.4
arity = 12
seed = "random.Random(184700 + n)"
tables = 200
verdict = "kept: a last level with leaves 01 prints the character it reads, )[[H])], and with 10 prints 2352 / c, )[2352/[H])], against the 37-char node and two 3-char leaves: 28.2% on random tables at n=4, 25.7% at n=5..6, 25.4% at n=7, 8, 10 and 12 (20 tables at 12), flat; parity 41.4%, majority 22.1%, and 6.6% at n=8. Exhaustive n<=3: 254 tables change, none grows, every changed program executed; random samples executed at n=4..10. Re-audited 2026-10-29 (20 random tables per n, balanced area side^2 at n<=8): random chars 27.0 / 26.3 / 26.0 / 25.7 / 25.4 / 25.6 / 25.5% at n=4..10, area 27.8 / 25.6 / 25.1 / 25.4 / 25.3% at n=4..8; parity 41.2%, majority 21.5%, and/or 4.8%, thr3 15.6% at n=10 (complements 4.1-18.2%); 552 builds n<=3 execute, control fails. The only bespoke trick; the equal-halves skip is canonical and the memo changes no emitted char"

