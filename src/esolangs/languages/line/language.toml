arity = 8
seed = "random.Random(1847+n), successive getrandbits(2**n)"
tables = "200 random per n=7,8, three per n=9,10; native small tables and random/named/ignored controls through n=8"
verdict = "Kept by the 25% proved-command-bound route: projected inline reads replace both large fallback trees. Small n<=5 and legacy balanced layouts are unchanged; balance also admits a better default raster. The default bound falls 5n→3n+4 for n>=6 (26.7% at n=6, tending to 40%); the inline tree alone uses 3n+2. Emitted unit-20 random area n=7 2596315200→2377265600 pixels (8.4369% smaller), n=8 3227955200→4794571200 (48.5328% larger). Three-table follow-ups cost 21.90% area at n=9 and 54.86% at n=10; four native rows pass per first table. Generic n=8 native maximum 40→26 commands; parity reaches 27 under the 28 bound. Old projected tail-ignored trees reach 38, so they are replaced, not raced. All reads precede output in physical order; workspace coefficients are unchanged. Balanced feasibility layouts retain 5n: OR n=8 keeps its 900×1880 layout rather than the default 260×5200."

