[resource_evidence.execution]
# Keep small trees within 5n; inline trees and folds within 3n+4.
cases = [
    { through = 5, expression = "5n" },
    { expression = "3n+4" },
]
exact = [3, 5]
arities = [1, 2, 3, 5, 6, 8]
first = 1
unit = "commands"
description = { growth = "poly n", claim = "at most", template = "{claim} {formula} by default, with balanced layouts retaining the first bound" }

[resource_evidence.workspace]
# The tape widths sum to n·bl(n-1)-2^bl(n-1)+2: zero costs one bit.
expression = "2n+1+bl(3n-2)+bl(n-1)+bl(2n-1)+(n·bl(n-1)-2^bl(n-1)+2)"
exact = true
arities = [5]
first = 5
unit = "bits"
description = { growth = "poly n", claim = "at most", template = "{claim} {formula} {unit} from n=5" }

