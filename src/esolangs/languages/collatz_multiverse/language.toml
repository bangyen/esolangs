[catalogue]
sharing_exempt = "indexed packed cells, one line each, with no subtable branch; only its at most 15 cell decoders are shared (B C C B 0.72x at n=6, 0.93x at n=8)"
folding_constant_local = "_cm_constant_program"  # reads followed by literal output

[schemes]
folds_without_tree = true

[ablations]
audited = "2026-10-19"

[ablations.essential_projection]
saving = 32.3
arity = 10
verdict = "kept: canonical, exempt; building over the essential inputs earns 17.8% with one ignored input at n=8 and 32.3% at n=10, 52.0% / 71.5% with half ignored, 7.5% / 34.2% with two scattered. One negative cell, measured: a trailing ignored input at n=8 prices -26.7% (941,695 shipped against 743,375 full build over 200 tables), because the trailing input is a cell-select input and the unprojected chunk alphabet collapses to {0, 3, 12, 15}; at n=10 the same class is +10.1% and shipped never races the two builds"

[ablations.constant_program]
saving = 94.6
arity = 12
verdict = "kept: canonical fold realization, exempt; a constant table read-and-print earns 73.8% at n=8, 85.9% at n=10 and 94.6% at n=12 against the plain cell build (numbered=False, the only plain build that takes the all-zero table: with codes on, _cm_codes' ranked list empties when 0 is the only distinct cell, and shipped never routes constants into the coded build)"

[ablations.coded_cells]
saving = 0.2
arity = 12
verdict = "retirement candidate (batch 8): storing codes instead of values in the cells, with the decoder spanning the codes, prices 0.36% / 0.20% on random tables at n=11/12, 9.7% -> 3.2% on the few-distinct class it is built for, and declines through the bar on majority, and and or; parity holds 22.2% / 20.4%, recorded as the dispute in the candidates file. Inside the assignment, the top-code choice prices 0.27% / 0.16% on random tables and the empty-cell code-0 preference is negative on every corpus (-0.6% to -1.6%): the most frequent cell beats the empty cell for code 0 whenever they differ"

[ablations.aliases]
saving = 4.0
arity = 12
verdict = "retirement candidate (batch 8): one-letter aliases for stored constants price 1.05% / 2.73% / 3.96% on random tables at n=10/11/12, under the bar at both judged arities but rising about a point an arity (the dispute in the candidates file); -0.06% at n=9, where the profitability test does not charge an alias its constant's build lines"

[ablations.trailing_pad_drop]
saving = 0.2
arity = 12
verdict = "retirement candidate (batch 8): dropping a block's trailing pad lines is a fixed saving (at most a few lines, ~74 chars a program at n=12), 3.15% at n=4 diluting to 0.36% / 0.21% at n=11/12 and 0.0-0.06% on the few-distinct class — the genuine-percentage case"

[ablations.referenced_constants]
saving = 47.7
arity = 12
verdict = "kept: building only the referenced constants (plus their plan chain) earns 23.4% on random tables at n=8, 33.2% at n=10 and 47.7% at n=12 (building every k1..k512 is the ablated cost), 52.2% on the few-distinct class and 50.1-61.5% on named functions at n=12"
