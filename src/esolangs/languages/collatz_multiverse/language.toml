[ablations]
audited = "2026-10-19"

[ablations.essential_projection]
saving = 32.3
arity = 10
verdict = "kept: canonical, exempt; building over the essential inputs earns 17.8% with one ignored input at n=8 and 32.3% at n=10, 52.0% / 71.5% with half ignored, 7.5% / 34.2% with two scattered. One negative cell, measured: a trailing ignored input at n=8 prices -26.7% (941,695 shipped against 743,375 full build over 200 tables), because the trailing input is a cell-select input and the unprojected chunk alphabet collapses to {0, 3, 12, 15}; at n=10 the same class is +10.1% and shipped never races the two builds"

[ablations.constant_program]
saving = 94.6
arity = 12
verdict = "kept: canonical fold realization, exempt; a constant table read-and-print earns 73.8% at n=8, 85.9% at n=10 and 94.6% at n=12 against the plain cell build (numbered=False, the only plain build that takes the all-zero table: with codes on, _cm_codes' ranked list empties when 0 is the only distinct cell, and shipped never routes constants into the coded build)"

[ablations.coded_cells]
saving = 0.2
arity = 12
verdict = "kept by the split decision on candidate #15: storing codes instead of values in the cells, with the decoder spanning the codes, prices 0.36% / 0.20% on random tables at n=11/12, 9.7% -> 3.2% on the few-distinct class it is built for, and declines through the bar on majority, and and or; parity holds 22.2% / 20.4%, the named-function case that keeps it. Inside the assignment, the top-code choice prices 0.27% / 0.16% on random tables. Re-priced 2026-10-28 (20 seeded tables, seed 1000n + i; chars / balanced area): without codes random +5.9% / +13.7% at n=7 and +1.1% / +0.8% at n=8, parity +44.1 / +38.3 / +34.4 / +32.2 / +31.1 / +30.6% chars at n=7..12 (+103.6% falling to +6.9% balanced), majority +42.7% falling to +5.2%, threshold >= n//3 +21.9% to +4.2%, and/nand +30.8% to +2.4%: clears 10% on parity at every arity, kept for that family. The empty-cell code-0 preference is removed: it priced -0.6% to -1.6% on every corpus, so code 0 now follows the frequency ranking among the cells that do not take the top code"

[ablations.aliases]
saving = 5.14
arity = 14
verdict = "removed (retirement candidate #16): one-letter aliases for stored constants re-price at 4.71% / 5.14% on random tables at n=13/14, level at the second judged arity and capped near 6% by the fixed fifteen-name pool, under the 10% bar"

[ablations.trailing_pad_drop]
saving = 0.21
arity = 12
verdict = "removed (retirement candidate #17): dropping a block's trailing pad lines saved a fixed ~74 chars a program at n=12, 3.15% at n=4 diluting to 0.36% / 0.21% at n=11/12 -- a fixed amount that tends to zero, not a genuine percentage"

[ablations.referenced_constants]
saving = 47.7
arity = 12
verdict = "kept: building only the referenced constants (plus their plan chain) earns 23.4% on random tables at n=8, 33.2% at n=10 and 47.7% at n=12 (building every k1..k512 is the ablated cost), 52.2% on the few-distinct class and 50.1-61.5% on named functions at n=12. Re-priced 2026-10-28 (20 seeded tables, seed 1000n + i): building every constant up to the largest costs +35.2% / +30.4% chars and +68.9% / +59.3% balanced area on random tables at n=7/8, +55% to +160% chars on every named table at n=7..12"

[ablations.complement_build]
saving = 63.8
arity = 12
verdict = "kept 2026-10-28: the complemented table is also built (printing 49 - bit) and the shorter kept, since an empty cell is a pad line. Without it: random +0.16% / 0.00% chars at n=7/8 and 0.0% balanced area; or +22.1 / +30.7 / +40.7 / +50.3 / +58.2 / +63.8% chars at n=7..12, threshold >= n//3 +14.0 / +23.3 / +22.2 / +35.6 / +48.4 / +43.1%, nand +3.3% falling to +0.3%, and, parity, nor, majority 0.0%. Clears 10% on or and the thresholds at every arity, kept for those families; balanced area 0.0% (the width sets the side)"

[ablations.zero_spelling]
saving = 0.05
arity = 8
verdict = "retired 2026-10-28: the constants phase spelled the zero register `z` (the shortest never-written name) instead of `zero`: 0.07% / 0.05% chars on 20 seeded random tables at n=7/8, 0.13% falling to 0.01% on named tables at n=7..12 (a fixed ~3 chars a constant line), 0.0% balanced area. The constants now spell it `zero`, the rest keep `z`. Executed: 680 default and balanced programs (every n<=3 table, random n=7/8, named n=7..9) all correct, a wrong table fails"

[ablations.balance_candidates]
saving = 5.55
arity = 8
verdict = "kept 2026-10-28 by contract: the balance hook rebuilds the program at the default's own width and from the narrow builds, each in its original, compact, aliased and renamed spellings. Priced against balance = default on 20 seeded random tables (seed 1000n + i): 5.55% / 1.08% balanced area at n=7/8; named tables 0.0% except or and nor, 9.6% / 12.3% at n=7 then 54.4 / 37.0 / 23.1 / 13.7 / 7.8% at n=8..12, a share falling from its n=8 peak under the 10% bar. Alone, the narrow builds and the spellings each price 0.0% (the width-limited rebuild carries it). Fails the bar, but tests/generators/test_balance_remaining.py requires every native-width generator to balance within 5% of the best width layout and the default misses that on or/nor, so it stays; an invariant, not a size trick"

