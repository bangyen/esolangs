[proof_status]
labels = ["finite lookup"]
qualification = "an array subscript may name `lineNumber`, so a cell is addressed by the number of the line that writes it"
scaling = "linear: at most N characters past n = 2: a line per cell"
execution = "linear: at most T/4 + 3n + 4m + 2K + 10 lines past n = 2: one step per line"
workspace = "T log T: at most end-state registers, arrays A and D, ip, input counter bits past n = 2: top code repeated"
definitions = ["m = min(16, T/4), the distinct four-row cells", "K = the constants closure: 30 for n = 6..8, 2n + 14 past n = 8", "A = the cell array, an (index, value) pair per entry", "D = the decoder array, one entry per set bit of the m cells"]

