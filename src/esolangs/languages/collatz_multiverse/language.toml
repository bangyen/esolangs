# Language-owned data, one section per dataset; aggregators read
# only their own section and skip this file when it is absent.

[curation]
backlinks = 2

[proof_status]
labels = ["finite lookup"]
qualification = "an array subscript may name `lineNumber`, so a cell is addressed by the number of the line that writes it"
scaling = "linear: one line per four rows, a 64-cell decoder, 3n index lines"
execution = "linear: at most T/4 + 3n + 130 lines to n = 8: one step per line, no branching"
workspace = "T log T: at most ⌈T/4⌉(bl(⌊L/17⌋)+6) + 64(bl(⌊L/17⌋)+1) + (n²+168)(8n+bl(L)+9)/2 + 2bl(L) + 115 bits: arrays, registers"

