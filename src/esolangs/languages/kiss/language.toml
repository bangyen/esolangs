# Language-owned data, one section per dataset; aggregators read
# only their own section and skip this file when it is absent.

[curation]
backlinks = 3
admitted = 2026-10-21T23:43:42-04:00

[proof_status]
labels = ["tree"]
qualification = "a node is S over its two halves, which S reads a bit to choose; a node whose halves agree reads it through SS(SKK)"
scaling = "linear: worst 7T-5 characters: 5 a node, 2 a leaf"
execution = "poly n: worst 4n rewrites past n = 1: four a skip level, then the constant's print, two reads and the halt"
workspace = "linear: worst 24T + 2bl(n) + 17 bits past n = 1: a root skip holds its half twice"

[ablations]
audited = "2026-10-29"

[ablations.halves_agree_skip]
saving = 6.6
arity = 12
seed = "random.Random(184700 + n)"
tables = 200
verdict = "kept: canonical, exempt; SS(SKK)X above the leaves against S(X)(X): 6.6% on random tables at n=8, 10 and 12, 43.3-45.4% one-ignored, 96.0-99.6% on constants; never larger once leaf pairs stay written twice (84 of 200 random n=8 tables grew when the skip also covered them). Plain-rewrite audit 2026-10-29: skip vs plain S(A)(B) build, random chars 6.4-6.9% n=3..10 (area 2.4-13.8%), maj 14.9% n=8 and 19.3% n=10, thr2 59.9-80.5%, and/or 83.4-93.6%, parity 0%, never larger; no other bespoke tricks (plain build is the shipped one minus the skip); equal subtrees cannot be shared without abstraction, whose S and K would wrap every node above"

[ablations.constant_print_first]
saving = 11.7
arity = 8
seed = "random.Random(184700 + n)"
tables = 200
verdict = "kept: a constant over the last one or two bits prints first and then reads, K(SKK) (6 chars, 9 as a pair of leaves) and S(SS)K(SKK) (11, 18 as a skipped pair); random chars 11.7% at n=6, 7 and 8 (10.3% with a generic k-bit reader at every depth; 9.8% with the one-bit form alone), and/or 15.2% n=8, maj 16.6%, thr2 17.6%, parity 0% (no constant subtree); every row of all 200 n=3..8 tables and every n<=3 table executed, the wrong table fails; a deeper constant keeps the skip chain over S(SS)K(SKK), which fails at 3 bits (S(SS)V(R) with R a 2-bit reader computes the wrong table); a brute force of every term up to 8 atoms for one bit and 9 for a reader finds nothing shorter than K(SKK) and S(SKK) for one-bit constants; the program reads after it prints, so a constant's execution bound rises from 4n-1 to 4n rewrites"

[catalogue]
sharing_exempt = "no names: an SK term can bind a repeated subtree only by abstraction, whose S and K wrap every node above it"
folding_ignored_read = "a read is itself the branch: S reads on every path, so an ignored input keeps a read node per path below it, and an SK term cannot name the subtree they share"

