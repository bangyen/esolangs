[proof_status]
labels = ["linear lookup"]
qualification = "one pass over collocated nodes: the table read at its essential inputs is split onto the buffer as decimal chunks of 2^m bits (m <= 4, shortest among safe indexes); the high inputs double an index in the dataspace, REMOVE THIS POSITION loads its chunk, each low input divides it by 1 + bit(2^w - 1), and v - 2floor(v/2) is printed; wide indexes use a pairwise buffer reduction on Boolean leaves. For parity, sum essential inputs and print the remainder modulo two"

