[resource_evidence.execution]
# Two moves; SPLIT, a read, the index's 3 commands an input, REMOVE and
# PRINT (3n + 3); a low input adds at most one command and the remainder 4.
cases = [
    { through = 31, expression = "3n + 11" },
    { expression = "7T+3n+11" },
]
exact = false
arities = [1, 2, 3, 6]
first = 1
unit = "commands"
description = { growth = "linear", claim = "at most", template = "{claim} {formula}" }

[resource_evidence.workspace]
# The buffer, 8 bits a one-bit chunk at worst; pending and held node sets
# over at most 4n + 9 nodes; the index in the dataspace; tracer floats,
# three variables and the input cursor.
# The wide tree has up to 7T+n+2 pending nodes and n+2 small variables.
cases = [
    { through = 31, expression = "8T + 2(4n+9)bl(4n+9) + 2bl(2n) + n + 400" },
    { expression = "2(7T+n+5)bl(7T+n+5)+8T+8n(bl(n)+4)+1024" },
]
exact = false
arities = [1, 2, 3, 6]
first = 1
unit = "bits"
description = { growth = "T log T", claim = "at most", template = "{claim} {formula}" }

[resource_evidence.scaling]
# Widest chunks, 7 characters a command line and a 35-character header.
# k >= 5 kept: <= 6*2^(k-4) chunk characters (five digits and a space),
# 55 a high input, 269 the four low inputs, 89 remainder and print, 14 an
# ignored input: 171 + 6*2^(k-4) + 41k + 14n. k = 4: 355 + 14n, attained
# by n = 4 parity (411); k < 4 is smaller.
# A height-h variable costs at most 1+h letters; T/2^h nodes use it.
cases = [
    { through = 31, expression = "3T/8 + 55n + 185" },
    { expression = "160T+(55+bl(n))n+64" },
]
exact = false
arities = [1, 2, 3, 4, 5, 6, 7, 8]
first = 1
unit = "characters"
description = { growth = "linear", claim = "at most", template = "{claim} {formula}: packed buffer or bounded-value tree" }

