[resource_evidence.execution]
# start, two lines an input, then output and stop.
expression = "2n + 3"
exact = true
arities = [1, 2, 3, 6]
first = 1
unit = "commands"
description = { growth = "linear", claim = "worst", template = "{claim} {formula} {unit}" }

[resource_evidence.workspace]
# X, the line index (n + 1 bits for O(T/n) lines) and the input cursor.
expression = "2n + 100"
exact = false
arities = [1, 2, 3, 6]
first = 1
unit = "bits"
description = { growth = "poly n", claim = "at most", template = "{claim} {formula} {unit}" }

[resource_evidence.scaling]
# At most sum_k min(2^k, 2^2^(n-k)) nodes, O(T/n), of 25 chars plus two
# offsets of O(n) digits; that count stays under 17T + 64 for n <= 63 and
# its ratio to T only falls after.  Random tables measure 3.6T at n = 18.
expression = "17T + 64"
exact = false
arities = [1, 2, 3, 4, 5, 6, 7, 8]
first = 1
unit = "characters"
description = { growth = "linear", claim = "at most", template = "{claim} {formula} {unit}" }

