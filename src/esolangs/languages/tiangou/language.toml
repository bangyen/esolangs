# Language-owned data, one section per dataset; aggregators read
# only their own section and skip this file when it is absent.

[curation]
backlinks = 4

[catalogue]
folding_constant_local = "essential_inputs"  # no essential input: a one-row walk

[schemes]
folds_without_tree = true

[proof_status]
labels = ["linear lookup"]
qualification = "one pass marks each true row's site; a computed backward jump returns to the input's row"
scaling = "linear: exactly 6T + 4w + 34n + 57 characters, w marked rows"
execution = "linear: worst 8T + 17n + 32 commands"
workspace = "T log T: at most 2(n+5)T + 40 bits: T markers of a key and a position, the stack"

