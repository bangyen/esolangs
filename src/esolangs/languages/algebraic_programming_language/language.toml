[ablations]
audited = "2026-10-19"

[ablations.halves_agree_rule]
saving = 55.7
arity = 10
verdict = "kept: canonical, exempt from the bar; a node whose halves agree is that half -- 12.2% on random tables at n=10, 55.7% on ignored-input classes at n=10, 77.5% on single-block tilings; it is also the essential drop, since the reads prefix binds every input and a dropped test drops no read"

[ablations.complement_twin_rule]
saving = 39.3
arity = 10
verdict = "kept: canonical sharing; re-measured 2026-10-30 by disabling only the twin lookup (the _Ref negation kept): parity grows 68.5 / 73.7 / 77.7 / 64.8 / 66.9 / 68.6% at n=7..12 (n=10: 270 -> 445 chars; balanced area +78-96%), majority, and, nor unchanged; random tables (20 an n, seed random.Random(5150 + 100n + s)) +1.8 / +3.0 / +1.7 / +0.0% at n=4 / 7 / 8 / 10, balanced -1.0 to -2.7% from n=7. The former verdict (disabling it shrinks parity 2.5%, random 1.7% at n=10) did not reproduce"

[ablations.subtree_interning]
saving = 0.0
arity = 10
verdict = "kept: canonical substrate, text-neutral alone -- with both reduction rules off, the reduced build reproduces the plain tree's totals digit for digit on every corpus measured; the reduction's whole price is the agree rule's minus the twin rule's drag (jointly 10.6% on random tables at n=10)"

[ablations.constant_fold]
saving = 65.7
arity = 10
verdict = "kept: canonical, exempt; priced jointly with the constant-arm forms inside the tree build -- 65.7% on random tables at n=10, 82.7% on half-constant and 88.6% on sparse corpora, 99.4% on and; the reduced build emits the same shapes"

[ablations.repeated_expressions]
saving = 48.5
arity = 10
verdict = "kept: clears the bar on random tables and rises with arity (35.7% at n=7, 43.6% at n=9, 48.5% at n=10); 97.5% on parity and 85.8% on majority at n=10; the in-code figure of 32-33% at n=7..9 (40 random tables) prices higher on the audit's 200-table corpus -- a stale-low sample figure, flagged in the batch 6 report"

