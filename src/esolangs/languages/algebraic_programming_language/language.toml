[ablations.minimal_parentheses]
kind = "archive"
saving = 20.3
arity = 10
verdict = "kept: `&` binds tighter than `|`, so the default drops the spaces and every parenthesis the precedence makes redundant (`!a&X|a&Y`, `a|b|X`; parentheses stay on an `|` form under `&` or `!`), the reads prefix loses its pair and a shared definition its outer pair; random tables (20 an n, seed random.Random(5150 + 100n + s)) -28.2 / -23.8 / -22.0% at n=7 / 8 / 9, -20.3% at n=10 (10 tables), -26.0 / -28.8% at n=11 / 12 (4 tables); parity -21.4 / -21.6 / -21.8 / -28.9%, majority -31.1 / -32.3 / -32.7 / -33.1%, threshold 3 -30.1 / -30.3 / -29.9 / -29.0%, and and or -51.1 / -52.0 / -52.7 / -53.3% at n=7..10; balanced area unchanged (the default is not the width route's minimum); all rows of 20 / 20 / 5 random tables at n=7 / 8 / 9 and the five named at n=7..9 run through esolangs.run and compute their tables, every n<=3 table and 90 random n=4..6 as well, a last-bit-flipped table fails"

[ablations.constant_table_audit_20261101]
kind = "archive"
arity = 8
saving = 47.1
seed = 0
tables = "both constants, n=1..12"
verdict = "kept: canonical constant folding and minimal spelling, exempt. Native constants omit the unused NOT definition; zero ends at the zero-valued ordered reads prefix, one adds |1. Default chars 2n+1/3, commands 4n+3/7: n=7 32/32->15/17 (50.0%), n=8 34/34->17/19 (47.1%), n=12 42/42->25/27. n=8 commands 40/40->35/39, workspace 791/791->786/790 bits. A requested width that cannot fit the native line retains the established definition/operator layout; fitting widths retain the native line. n=3 corpus chars 9215->9183. Executed 1120 candidate runs and 5656 paired old/new row runs; 270 nonconstant n<=3 sources identical. Both constants execute default, width=1 and balanced layouts through n=12; all 24 balanced scores match or improve. All eight benchmark size/command pins unchanged and global resource caps unchanged. Owned raw read-first checks verify exact read count and preserve the following input record."

[ablations.arithmetic_xor_twin_20261102]
kind = "archive"
arity = 3
saving = 5.3
seed = "all 256 three-input tables; Random(5150 + 100*n + i), i=0..199 for fixed 7/8"
tables = "all tables/rows through 3; fixed 200 each 7/8; samples 4..6; extension 20 each 9..12"
verdict = "kept by 5% execution gate after canonical unused-NOT baseline: n 3 source 8988->8592, commands 82488->78116 (-5.3002%), zero growing tables or slower rows in 4096 paired native runs. Raw arithmetic alone versus original gives source 9183->8907/E 82592->78284 (-5.216%). Replace complementary full Shannon arms by (selector+child)%2, adding 1 for a complemented result; one child is emitted once into the flat list. No helper/frame/runtime field, searched table or old-whole-program fallback is added. Superseded twin guard/duplicate-child emission is removed, and unused NOT state is separately removed below. Primary syntax/operators: https://esolangs.org/wiki/Algebraic_Programming_Language. Fixed 200 at 7/8 source 75470/143220->74307/143214 (+1.54/+0.004% saving), 40/95 larger tables; size admission is not claimed. Exact analytic fixed-corpus E 3238624/7697284->3154815/7526530 saves 2.59/2.22%, declining from the n 3 gate; the model is checked against all 2120 current small native rows and 36 large controls. Extension 20 at 9..12 source 27476/50964/93737/166066->27562/51139/94025/167263, with 1/3/1/2 slower sampled rows; disclosed beyond the n 3 execution gate. Balanced 20 grid_area 17740/33257 unchanged, as are parity/and/or/majority/threshold 3 balanced areas. Old O(T) build/source and numerical E/W caps/arities remain: flat emission, no extra frame, at most 3 pending binary nodes a level, integer temporaries 0..3. 2260 native WrittenState rows cover every old proof arity; final 3410 public rows and read/sentinel/EOF/modulus controls pass."

