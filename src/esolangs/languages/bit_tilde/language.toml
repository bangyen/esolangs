[proof_status]
labels = ["linear lookup"]
qualification = "one tape cell an entry, and each input's one-shot loop jumps the pointer left by that input's weight, so the reads chain into a Horner index and a self-erasing walk carries the landed bit to one of two print windows"
scaling = "linear: bounded dependency scan and canonical residual IDs"
execution = "linear: worst 7T + 17n + 92 commands past n = 1: row 0 walks the odd lane"
workspace = "linear: worst 2T + 49 + bl(2T+41) + bl(5T+18n+74) + bl(n) bits: 2T + 49 tape cells"

