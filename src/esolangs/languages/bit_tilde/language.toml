[schemes]
folds_without_tree = true

[ablations]
audited = "2026-10-19"

[ablations.input_projection]
saving = 9428.6
arity = 12
verdict = "kept: canonical, exempt. The planted table is the one read at the essential inputs (a constant's is one entry, which is also the fold). Planting the full table instead costs 0.00% on random tables at every arity; on its classes the deletion costs at n=10/12: one ignored input +90.78 / +97.16%, two +250.97 / +283.74%, three +504.92 / +629.69%, constant tables +2636.48 / +9428.57% (all-zero) and +3259.38 / +11701.70% (all-one)"

[ablations.xor_window]
saving = 98.8
arity = 8
seed = "named and random affine tables"
tables = 8
verdict = "kept under the named-function rule: an affine table (an XOR of inputs plus a bias) XORs each counted input byte into one window, flips cells 2 and 3 back for an even count and cell 7 for the bias, and prints it, about n + 9 chars, raced by length against the planted lookup. Parity 94.1% at n=4, 96.8% at n=6, 99.0% at n=7, 98.8% at n=8, 99.6% at n=10 (21 chars at n=12); random affine tables 23-76% at n=4..10. Random tables: 0 of 200 change at n=5..8; majority, and, or and thresholds unchanged. Exhaustive n<=3: 28 tables change, none grows, every changed program executed; named and affine tables executed through n=12"

[ablations.minority_planting]
saving = 17.0
arity = 8
seed = "random.Random(184700 + n) and named tables"
tables = 200
verdict = "kept under the named-function rule: a planted entry costs a ~ more than a skipped one, so a table with more ones than zeros plants its zeros and swaps the two print windows (0 at 1..8, 1 at 10..17). Or and nand 12.4% at n=6, 15.0% at n=7, 17.0% at n=8, 19.0% at n=10, rising; 90%-ones tables 10.1-15.1% and 80%-ones 7.4-11.3% at n=6..10; random tables 0.17-0.70%. Unconditional, and nothing grows: exhaustive n<=3 (96 change, every changed program executed) and every random table at n=6..10. Random samples executed through n=10, named tables through n=8"
