[ablations.constant_table_audit_20261101]
arity = 8
saving = 79.4
seed = 0
tables = "both constant tables n=1..12; exhaustive all tables/rows n=1..3; six witnesses/all rows n=4..6"
verdict = "kept: canonical whole-constant folding. XOR every read into the same scratch window, then move eight cells right and plant ASCII in a fresh window. Exactly n+17+9b characters and commands, b the answer. Written bits 23+4b+bl(n+17+9b)+bl(n): 19/23 tape cells, four pointer bits and both cursors. n=8 zero/one 143/143 -> 25/34 chars; n=12 175/175 -> 29/38. n=3 corpus 39288 -> 39208 chars. Each language passed 5656 paired before/after row executions; all 270 nonconstant programs through n=3 stay byte-identical. Both constants n=1..12 execute in default, width=1 and balanced layouts. All 24 balanced constant scores improve or match; all eight benchmark size/command pins remain unchanged. Owned regressions check exact resources and every input slot; stream readers preserve an unread sentinel and read before output."

[ablations.split_first_input_20261102]
arity = 8
saving = 15.417
seed = "random.Random(184700+n+1000*i).getrandbits(1<<n), i<200"
tables = "400 generic tables n7/8; all276 tables/rows n1..3;23 tables each n4..6;200 each n9..16"
verdict = "kept: source135360/228324 ->119360/193124 at7/8, sustained11.820%/15.417%, clears10%. Lower half planted first; first input reads at S-1 and lands at g=S+6. A six-cell gap keeps ASCII garbage above the lower half. Inverted input guards upper-half planting shifted+6, ending at its top+6; shared left6 lands either path on its own sentinel. All ignored prefix bytes read at origin; their fixed flips fold into planting and their variable cell7 clears en route. Prefix p costs p+3, not20p. Source bound3T+19n+115; full-essential saving3T/4-16. Ascending pair emission needs no sorting, O(T) build/source. Full76800 production rows pass65.78s, exact reads and sentinel preserved; whole corpus commands15889591/53118637 (no full old command claim). Small/sample9584 runs and forced variants/ignored12771 rows pass. Final production466 tables/2944 rows including odd/even ignored prefixes, every ignored position and width/balance pass. Exact worst witnesses n5..9 attain E=19T/4+18n+123 and W=3T/2+50+bl(3T/2+42)+bl(3T+19n+115)+bl(n); worst E grows27, tape12 cells versus old block. Exact caps extend to n4; original proof arities6/8 retained and4/5 added. Balanced grid_area7/8 136992/230424 ->121108/194832; trailing rows counted. Source extension9..16 saves17.908,19.463,20.365,20.869,21.137,21.278,21.353,21.390%; n16 lower-branch native passes after pricing n14. Full-essential deterministic asymptotic savings lie20-25%; for uniform random tables the ratio of expected source totals tends3/14, since E[P]=T/2-(T/4)*C(T/2,T/4)/2**(T/2). No limit of the fixed PRNG sequence is claimed. Fixed judging remains7/8; no old-block source race."

