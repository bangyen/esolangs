[ablations.input_projection]
saving = 9428.6
arity = 12
verdict = "kept: canonical, exempt. The planted table is the one read at the essential inputs (a constant's is one entry, which is also the fold). Planting the full table instead costs 0.00% on random tables at every arity; on its classes the deletion costs at n=10/12: one ignored input +90.78 / +97.16%, two +250.97 / +283.74%, three +504.92 / +629.69%, constant tables +2636.48 / +9428.57% (all-zero) and +3259.38 / +11701.70% (all-one)"

[ablations.xor_window]
saving = 98.8
arity = 8
seed = "named and random affine tables"
tables = 8
verdict = "kept under the named-function rule: an affine table (an XOR of inputs plus a bias) XORs each counted input byte into one window, flips cells 2 and 3 back for an even count and cell 7 for the bias, and prints it, about n + 9 chars, raced by length against the planted lookup. Parity 94.5% at n=4, 96.7% at n=6, 98.9% at n=7, 98.6% at n=8, 99.5% at n=10 (re-measured on the block lookup 2026-10-30); random affine tables 25-96% at n=4..10. Random tables: 0 of 200 change at n=5..8; majority, and, or and thresholds unchanged. Exhaustive n<=3: 28 tables change, none grows, every changed program executed; named and affine tables executed through n=12"

[ablations.minority_planting]
saving = 11.0
arity = 8
seed = "random.Random(184700 + n) and named tables"
tables = 200
verdict = "kept under the named-function rule: a planted e0 costs a ~ more than a skipped one, so a table with more e0 ones than zeros plants its zeros and swaps the two print windows (0 at 1..8, 1 at 10..17). Or and nand 6.9% at n=6, 9.1% at n=7, 11.0% at n=8, 13.2% at n=10, rising; 90%-ones tables 4.6-10.2% at n=6..10; random tables 0.3-0.5% (re-measured on the block lookup 2026-10-30). Unconditional, and nothing grows: exhaustive n<=3 (78 change, none grows, every changed program executed) and every random table at n=6..10. Random samples executed through n=8, named tables through n=8"

[ablations.block_lane]
saving = 16.3
arity = 8
seed = "random.Random(184700 + n + 1000 * s), s < 200"
tables = 200
verdict = "kept: a zero sentinel and the two cells e0, e0 ^ e1 make a stride-3 block, 1.5 cells an entry where the stride-2 lane spent 2; plant walk and read jumps both shrink by a quarter. The last input is read into the sentinel (flipped first, so it holds not x) and clears e0 ^ e1 for x = 0, then both cells XOR into it; one input read, no conditional read. Random tables 12.4% at n=7, 16.3% at n=8, 18.8% at n=9, rising; and 13.6 / 18.0 / 21.0%, or 13.4 / 17.9 / 20.9%, majority 15.3 / 18.9 / 22.5%, threshold-3 12.0 / 16.5 / 19.7%, threshold-2 12.8 / 17.4 / 20.6% at n=7 / 8 / 9; parity is the xor window, unchanged. Alone it grows at n<=4 (12.0% at n=3, 5.9% at n=4) and at n=5 (16 of 200), so up to five essential inputs the stride-2 lane races it by length: no table grows at any n (exhaustive n<=4, 200 random at n=5..9, named tables), n=3 and n=4 totals unchanged, n=5 saves 0.9%, n=6 7.0%. With T entries the stride-2 build is 4T + 18w + 75 + P_s chars and the block 3T + 19w + 99 + P_b over w essential inputs; P_b - P_s <= T/4, so the stride-2 build wins only if 3T/4 <= 24 + w, never at w >= 6 (1309 tables match both closed forms). Executed through the interpreter: every row of every n<=3 table, named and 50 random tables at n=7..8, width-<=6 tables at n=7..8, a wrong table caught"

