verdict = "diagnostic only: grouping selector alone saves 13.01%/10.60% at n=7/8; grouping column alone saves 13.01%/13.91%, and declines to 7.07% by n=12. Each misses the 20% declining gate. No alternative race or fallback ships: the admitted single grouped-reader construction is applied uniformly to both indices."
