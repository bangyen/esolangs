[proof_status]
labels = ["linear lookup"]
qualification = "constants read n inputs unprinted, then print the bit in n + 3 commands and characters; otherwise the table is one string literal; from n = 4 a character packs eight rows and `ind` indexes it with decimal groups of at most three reads modulo 8, joined in radix 8 (below, one row a character)"
definitions = ["G = 20q+r+6[r>1], H = 12q+r+4[r>1]; q=floor((n-4)/3), r=n-3-3q"]

[catalogue]
folding_constant = "n unprinted reads followed by the bit in parentheses: n + 3 characters"
folding_ignored = "the string holds every row; an ignored input is still read into the index"

