[ablations.constant_table_fold]
arity = 12
tables = "both constants at n=1..12; every row through n=4, four rows thereafter"
verdict = "kept: canonical constant fold, percentage gate exempt. Constants shrink 151 -> 11 characters at n=8 and 679 -> 15 at n=12; commands 56 -> 11 and 80 -> 15, sampled written-state peaks 395 -> 90 and 4244 -> 126 bits. Unprinted reads precede the literal output, retaining all inputs without constructing an index or table string. Both generators together passed 496 old/new executions; all nonconstant programs through n=3 are byte-identical. Sentinel tests cover both bits and three input patterns at every n=1..12. Existing generic worst-case bounds and eight size pins remain unchanged."

[ablations.trick_prototype_20261101_decimal_group_reads]
arity = 8
saving = 24.5033
verdict = "kept: decimal abc modulo 8 is 4a+2b+c; ab modulo 8 is 2a+b. Group at most three input-order reads, joining full groups in radix eight, for both bit selector and column. Standalone programs check all eight three-bit groups, including leading zeros. 200 Random(77+n) tables at each fixed judge arity: n=7 chars 123->91 (26.02%), n=8 151->114 (24.50%), no growth. Ten-table diagnostics n=9..12: 24.62,17.71,12.90,9.43%; no arbitrary later cap. Both old/new variants run four rows per diagnostic table. Grouping moves the packing breakeven to n=4: 69->57 chars; a real n=3 constant-index packed program executes but costs 56 vs the retained scalar 49. All tables/rows n<=3 stay byte-identical; n=3 total12458. All small rows plus 16 named/random tables per n=4..6 pass 7824 paired runs and 324 wrong-table controls, including native resources. With q=floor((n-4)/3), r=n-3-3q, column chars G=20q+r+6[r>1], ops H=12q+r+4[r>1]. Packed size is T/8+54+G, exact execution25+H; n=10 parity/random271->223. Workspace cap stays valid, now covering packed n=4 too. Whole constants unchanged; reads precede output and preserve the next token."

[ablations.trick_prototype_20261101_grouped_read_ablation]
