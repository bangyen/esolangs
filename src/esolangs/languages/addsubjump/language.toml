[ablations]
audited = "2026-10-19"

[ablations.packed_decoder]
saving = 86.0
arity = 10
verdict = "kept: clears the bar on random tables and rises steeply (17.7% at n=6, 65.8% at n=8, 86.0% at n=10 against the tree candidate). On named functions the unrated tree candidate is smaller (and/or 889 against 1,547-1,609 at n=8) -- the route cutoff at 32 essential rows left that on the table until 2026-10-20, when the tree began racing at every n: and 1,547 -> 889 and parity 1,609 -> 1,267 at n=8, and 1,847 -> 1,107 at n=10; random tables unchanged (0/20 tree wins at n=6..10)"

[ablations.residual_tree_route]
saving = 21.5
arity = 8
verdict = "kept: clears the bar on its class -- racing the tree/shared candidate where essential rows number 32 or fewer earns 19.9% on five-essential tables at n=6 rising to 21.5% at n=8 over the packed build alone (in-code figures 18.7% / 20.6%, the same measurement on a different sample). The plain tree alone contributes only 0.5-1.1% of it; the shared build carries the route"

[ablations.shared_residuals]
saving = 20.7
arity = 8
verdict = "kept: canonical sharing, exempt; its marginal within the candidate is 19.5% on five-essential tables at n=6 rising to 20.7% at n=8, 20.9% on random tables at n=4, and 18.7% against the packed build alone at n=5 (in-code figure 18.9%)"

[ablations.constant_fold]
saving = 43.9
arity = 7
verdict = "kept: canonical, exempt. Its top-level deletion marginal is 0.0% on every corpus -- in the shared build a constant span's residuals agree, so the descent prints the same instruction (deleting the fold changes the five-essential total by exactly 0) -- but in the plain-tree build, its home, it earns 24-25% on random five-essential tables, 43.9% on half-constant tables and 70.4% on and/or at n=7"

[ablations.essential_descent]
saving = 21.5
arity = 8
verdict = "kept: canonical, exempt; skipping levels no node tests earns 20.0-21.5% on scattered five-essential tables at n=7/8 (trailing 11.4-14.4%), 4.8-4.9% on random tables at n=4/5 where the tree routes run, and 69.5-72.0% on constants, where it is the whole construction"

[ablations.essential_projection]
saving = 10.7
arity = 8
verdict = "kept: canonical, exempt; the packed build's projection onto essential inputs earns 6.1% at build level with one ignored input at n=8 and 10.7% with two (4.4% / 8.7% at n=6); the full-table build it replaces never won its race (0 of 322 tables, in-code record) and survives only as a balance candidate"
