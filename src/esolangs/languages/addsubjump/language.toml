verdict = "near miss, not shipped: race the existing build against a shared tree in reversed input order, with the table permuted into that frame and reads still in stream order. Random n=7/8 totals unchanged at 29,218/31,885 chars; and/or/parity/majority/threshold-third unchanged through n=12. Positive control: the candidate changes 85 corpus programs and cuts the exhaustive n=3 total 96,084 -> 93,874 chars (2.30%). All-row n=3 commands 41,544 -> 41,512 (0.077%); 28 tables get slower, so the execution bar fails too. 5,110 baseline/candidate output checks correct, exhaustive n<=3 and boundary rows of random/named tables through n=8 plus named through n=12; 2,555 complemented controls rejected. Prototype stays in ignored notes; generator, bounds and pins unchanged"

[ablations.constant_table_audit_20261101]
kind = "archive"
arity = 8
saving = 21.1
seed = 0
tables = "both constants n=1..12; exhaustive all tables/rows n=1..3; six witnesses/all rows n=4..6"
verdict = "kept: canonical whole-constant folding. Read all bytes into one accumulating scratch cell, then print a literal and halt. Cell zero holds the positive scratch address, so reads subtract into scratch; no tree header or auxiliary data blocks remain. Exactly n+1 commands and 4n+6 cells. Workspace is initial sparse address/value bits plus bl(4n+4)+bl(49n)+1+max(5,bl(4n))+bl(n), attained by all-one input. n=8 128 -> 101 chars; n=12 172 -> 145. n=3 corpus 96084 -> 96030 chars. Each language passed 5656 paired old/new row executions; all 270 nonconstant programs through n=3 stay byte-identical. Both constants n=1..12 execute in default, width=1 and balanced layouts. All 24 balanced scores per language improve or match; all eight benchmark size/command pins remain unchanged. Owned regressions check resources and every embedded slot or stream read; stream output follows all reads and leaves a sentinel unread."

[ablations.packed_reader_20261102]
kind = "archive"
arity = 8
saving = 23.3
seed = "random.Random(1847+n)"
tables = "20 random tables per n=7/8; two per n=7..10,12,14; all tables/rows n<=3"
verdict = "kept, two independent declining marginals: fixed six hot slots in two skipped data words save 23.963/23.313% at n7/8 (29212/31914 -> 22212/24474 chars); raw-byte Horner plus one bias subtraction saves a further 22.511/23.290% (->17212/18774). Hot savings fall through n14 to 6.15%; reader peaks near n8 and falls to 6.45%, both limit zero: removed O(n log n) spelling against Theta(T) chunk digits. Minimal one-word constants fail: fixed200 292094/319017 ->235694/260217, 19.309/18.432%. Direct branch selection executes four commands just as the old six-word trampoline does; 9.52/8.71% standalone source saving, rejected. Canonical dead ignored-read clearing is subsumed. Two aligned skipped words are needed for six one-digit hot cells; spare cells10/11 stay zero. INDEX/OUT move into hot slots, TABLE receives ignored bytes until its existing clear; TMP and separate normalizer disappear. No added candidate, cache, layout state or whole-program fallback. Exact source scopes6..9, exact E6, all eight size/row-command pins and old W envelope retained. 2156 paired public rows plus5416 private controls; n3 chars96030 and commands41528 unchanged. Native source-formula controls through n14; projected reads preserve physical order, sentinel and output-after-read."

