[ablations.data_blocks]
kind = "archive"
saving = 21.9
arity = 5
verdict = "kept: bespoke, passes the bar. The two instruction-width data blocks at fixed low addresses (U=6 the zero cell, 48/49 the output digits, -48 the bit normaliser) give every tree operand a one-digit address; the plain build names them and places them after the instructions. Removing the blocks (d = -7) costs +21.86% on 40 random tables at n=5, the last arity where the tree ships on random tables (+25.49% / +32.55% at n=3 / 4 with d = a named zero cell, 10 tables each), and parity +25.6 / +26.1 / +26.6%, AND/OR +19.1 / +19.5 / +20.0%, majority +24.6 / +25.8 / +15.3% at n=5 / 6 / 7 -- per instruction, so a share not a fixed saving. Every changed program ran on all rows (n<=8)"

[ablations.conditional_cell]
kind = "archive"
saving = 0.0
arity = 8
verdict = "recorded: the d operand is cell 7 (the block's last word, never written, so the instruction adds). It saves 8.77% on 40 random tables at n=5 over the special zero -7, but the plain choice inside the blocks is d = U (cell 6, also a zero, same digit count): 0.00% on every class at n=3..8 (26-45 programs per arity differ in bytes, all ran on every row to n=8). A one-digit address pick, not a trick to price against -7"

