[ablations.xor_chain]
saving = 91.0
arity = 8
seed = "named and random affine tables"
tables = 8
verdict = "kept under the named-function rule: an affine table (an XOR of inputs plus a bias) folds each counted input cell into the next one down with [*...*...], ending in cell 2, and flips it for the bias, raced by length against the banded tree. Parity 74.8% at n=4, 85.9% at n=6, 89.4% at n=7, 91.0% at n=8, 93.0% at n=10, 94.3% at n=12; random affine tables 70-86% where the chain wins. Random tables: 0 of 200 change at n=5..8; majority, and, or and thresholds unchanged. Exhaustive n<=3: 13 tables change, none grows, every changed program executed; named and affine tables executed through n=10; plain-rewrite audit 2026-10-27: parity 74.8/85.9/89.4/91.0/92.1/93.0/93.7/94.3% at n=4/6/7/8/9/10/11/12, 0 of 5 random tables change at every n"

[audits]
plain_rewrite = 2026-10-27

[ablations.four_level_band_prototype]
saving = 0.0
arity = 8
seed = "random.Random(1847+n)"
tables = "all tables n=1..3; 20 random plus and/or/parity/majority/threshold-third per n=4..12"
verdict = "near miss, not shipped: add the four-level result-band build beside existing three/five-level builds, retaining all polarity and sharing choices. Random n=7: 34,970 -> 34,875 chars (0.272%); n=8 unchanged at 66,426, and random n=9..12 unchanged. Majority n=7 853 -> 837 (1.88%), n=11 4,950 -> 4,119 (16.8%), but n=12 unchanged at 5,555; an isolated arity win does not sustain the size share and does not authorize a cap. Other named functions unchanged through n=12. Positive control: 25 corpus programs change. n=3 total unchanged at 20,237 chars. 5,110 baseline/candidate output checks correct, exhaustive n<=3 and boundary rows of random/named tables through n=8 plus named through n=12; 2,555 complemented controls rejected. Prototype stays in ignored notes; generator, bounds and pins unchanged"

[ablations.constant_table_audit_20261101]
arity = 8
saving = 20.7
seed = 0
tables = "both constants, n=1..12"
verdict = "kept: canonical constant folding and minimal spelling, exempt. Zero constants already contain only input setters. For one at n>=3 set answer cell 2 before the input walk, instead of returning to it afterwards; keep the old shorter path at n=1/2. Default chars zero 4n, one min(7n-1,4n+5), commands chars+1 including final dump. n=7 28/48->28/33 (19.7% combined), n=8 32/55->32/37 (20.7%; one alone 32.7%), n=12 48/83->48/53. n=8 one commands 56->38 and workspace 66->48 bits; zero unchanged at 33 commands and 43 bits. Narrow layouts preserve the new prefix before shrinking the setter slots. n=3 corpus chars 20237->20234. Executed 1120 candidate runs and 5656 paired old/new row runs; 270 nonconstant n<=3 sources identical. Both constants execute default, width=1 and balanced layouts through n=12; all 24 balanced scores match or improve. All eight benchmark size/command pins unchanged; global resource caps unchanged. Owned raw IO checks preserve all input reads and following record; Smallfuck retains fixed-width slots, executes straight-line setters and dumps only after the program."
