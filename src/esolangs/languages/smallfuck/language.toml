[resource_evidence.scaling]
# The band-five prefix prices every continuation cell. The ordered
# suffix crosses the tape twice. Its 27 non-move commands give at most
# 15n+30 from n=4; the larger bound also covers the n=2/3 flag kernels.
cases = [
    { through = 1, expression = "P" },
    { expression = "P+20n+100" },
]
source_terms = { names = ["P"], provider = "esolangs.languages.smallfuck.tests.formulas:scaling_terms" }
exact = false
arities = [1, 2, 3, 4, 5, 6, 7, 8, 9]
first = 1
unit = "characters"
description = { growth = "linear", claim = "at most", template = "{claim} {formula}: coefficient prefix and Davio tail" }

