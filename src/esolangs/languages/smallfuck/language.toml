# Source figures that match a verdict but measure something else (the per-level plan, not band_race).
unrelated = ["10.4%"]

[ablations.deferred_level_residuals]
saving = 72.3
arity = 10
verdict = "kept: canonical sharing, exempt from the bar; saving on the parity table (34.6% at n=8); 0.0% on random tables"

[ablations.same_level_bank]
saving = 58.9
arity = 10
verdict = "kept: canonical sharing, exempt; saving on the mosaic-4 class (18.8% at n=8); 14.2% on majority at n=10, 0.0% on random tables; jointly with the level residuals 81.4% on parity and 64.0% on mosaic-4 at n=10"

[ablations.paired_roots]
saving = 23.8
arity = 11
verdict = "kept: clears on random tables (15.8% at n=9, 20.5% at n=10, share rising); plain-rewrite audit 2026-10-27, 5 seeds each, every program run: 0.0% at n=4..7, 4.4% at n=8, 15.7/21.0/23.8/25.2% at n=9/10/11/12 -- growing past the verdict arity to its peak; its complement-shared three-bit code and free-cell high bit are the construction, not separable"

[ablations.band_race]
saving = 10.3
arity = 11
verdict = "kept: clears on random tables; the band-(3,5) race's saving over band 3 alone is flat at 9.8-10.4% from n=9 to n=11; plain-rewrite audit 2026-10-27, every program run: 0.0% at n=7, 5.5% at n=8 (200 tables), growing, so measured to its peak on 200 tables: 10.38/9.86/10.31/10.63% at n=9/10/11/12, the race winning all 200 at each -- at its largest arity it clears the bar and still rises, so kept"

[ablations.constant_folding]
saving = 14.7
arity = 8
verdict = "kept: canonical, exempt; the constant-half split's saving on the half-constant class (the span>=2 fold's is 10.6%); both marginals fade to 0.2-1.0% at n=10 because the paired form wins on that class and prices the constant half itself"

[ablations.agreed_halves]
saving = 46.0
arity = 10
verdict = "kept: canonical, exempt; saving on the leading-ignored class (40.0% mid-ignored, 7.1% trailing-ignored, where the sharing plans pick up the repeats)"

[ablations.tail_trim]
saving = 0.0
arity = 11
verdict = "removed 2026-10-20 (retirement candidate #7): a fixed ~5 chars per program (0.1% at n=8, 0.0% at n=10/11 on random tables) -- fails the bar and the genuine-percentage stipulation; the tail is now the builder's own text, moves among the closing brackets included"

[ablations.width_machinery]
saving = 0.0
verdict = "kept: feasibility -- the width layouts and the balance hook serve explicit widths only; no default-path effect"

[ablations.xor_chain]
saving = 91.0
arity = 8
seed = "named and random affine tables"
tables = 8
verdict = "kept under the named-function rule: an affine table (an XOR of inputs plus a bias) folds each counted input cell into the next one down with [*...*...], ending in cell 2, and flips it for the bias, raced by length against the banded tree. Parity 74.8% at n=4, 85.9% at n=6, 89.4% at n=7, 91.0% at n=8, 93.0% at n=10, 94.3% at n=12; random affine tables 70-86% where the chain wins. Random tables: 0 of 200 change at n=5..8; majority, and, or and thresholds unchanged. Exhaustive n<=3: 13 tables change, none grows, every changed program executed; named and affine tables executed through n=10; plain-rewrite audit 2026-10-27: parity 74.8/85.9/89.4/91.0/92.1/93.0/93.7/94.3% at n=4/6/7/8/9/10/11/12, 0 of 5 random tables change at every n"

[audits]
plain_rewrite = 2026-10-27
