# Language-owned data, one section per dataset; aggregators read
# only their own section and skip this file when it is absent.

[curation]
backlinks = 66
bf_derivative = true

[proof_status]
labels = ["parameterized tree"]
qualification = "each level owns a bit, branch flag, and result cell; a child transfers its result three cells upward, so the depth-first pointer walk crosses each tree edge only a constant number of times"
scaling = "linear: six characters an input, approaching 48.5T characters"
execution = "poly n: at most 9n^2 + 100n + 20 commands, one tree path"
workspace = "linear: worst L + bl(L) + bl(3n) bits: one tape bit per source character"

