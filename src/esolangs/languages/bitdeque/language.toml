[resource_evidence.execution]
expression = "7n + 8"
exact = true
arities = [5, 6]
first = 3
unit = "commands"
description = { growth = "poly n", claim = "worst", template = "{claim} {formula} {unit} past n = {previous}: prelude, load 2n, four a level, leaf n + 6" }

[resource_evidence.workspace]
# The post-halt dump and register add two bits to the deque and token cursor.
expression = "n+2+bl(C*(3n+2+I)+(1-C)*(4n+25+2S))"
source_terms = { names = ["C", "I", "S"], provider = "esolangs.languages.bitdeque.proof_formulas:workspace_terms" }
exact = true
arities = [3, 4, 5, 6]
first = 3
unit = "bits"
description = { growth = "poly n", claim = "worst", template = "{claim} {formula} {unit}. C marks constants, I marks their inversion and S is the shared tree count" }

[resource_evidence.scaling]
# S counts the general nodes and repeated zero-edge pointers.
# The largest GOTO operand fits the digit width of 4n+26+2S.
expression = "79+20n+digits(4n+26+2S)+2max(37,23+2digits(4n+26+2S))+(13+digits(4n+26+2S))S"
source_terms = { names = ["S"], provider = "esolangs.languages.bitdeque.proof_formulas:scaling_terms" }
exact = false
arities = [1, 2, 3, 4, 5, 6, 7]
first = 1
unit = "characters"
description = { growth = "linear", claim = "at most", template = "{claim} {formula} {unit}: shared-tree token bound" }

