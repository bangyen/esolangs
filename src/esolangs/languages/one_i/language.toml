[proof_status]
labels = ["tree"]
qualification = "a node pushes its two children as function literals, reads its bit with `B` and `?` invokes one; constant subtables read their remaining bits unbranched"
scaling = "linear: worst 25T/4 - 6 characters past n = 1: six a node"
execution = "poly n: worst 4n + 3 steps: four a level, seven to print 1 - b"
workspace = "poly n: worst W bits, n = 2..27: frame, stack and input position"
definitions = ["W = 2n^2 + 36n - 23 + bl(2n-1); 104 at n = 3"]

