verdict = "raw three-input-library search rejected as supplied: no enumeration or searched256-case library. Kept only a named parity alternative: sum all inputs, raise -1 to that exact integer, compare x with2x. At7/8 direct-reader source570/1146 ->22/24 (96.14/97.91%), E32/36 ->22/24, W44/48. Extension n10/12/16 source4602/18426/294906 ->28/32/40 proves saving tends100%; pattern recognition doubles/complements a string in O(T). n1 arithmetic genuinely loses10 vs2/7 chars, so existing leaf stays; n2 is identical12 chars. All reads precede print. Non-parity OR/XOR trees still attain global source bounds, and constant-tail variants attain W; append these witnesses without dropping old corpus. Canonical ignored-input extension uses essential_inputs/read_at, B$ drains, and direct single-input projections; final n3 source4945 and commands23080;496 rows slower by atmost6 commands, zero growing tables. All3282 projected-parity/projection native rows pass, including every essential subset throughn8. Balanced generic old/direct areas116264/232855 ->83785/168513; named parity578/1152 ->24/24."

