[ablations]
audited = "2026-10-20"

[ablations.constant_fold]
saving = 43.96
arity = 12
verdict = "kept: canonical, exempt. A constant subtable prints its literal at once and drains the remaining bits with bare B, instead of descending to its rows. Removing the fold costs +43.97% at n=10 and +43.96% at n=12 on random tables, +187.91 / +207.73% on AND at n=10/12 and +453.33 / +470.59% on constant tables"

[ablations.equal_halves_sharing]
saving = 6.65
arity = 12
verdict = "kept: canonical, exempt. A node whose halves agree reads its bit and drops it (B$, then the child), so the bit is never tested; measured with the earlier ':'-ing spelling [$$child]:B?. Removing the sharing costs +6.67% at n=10 and +6.65% at n=12 on random tables, and on the ignored-input classes at n=12 +10.75% (one), +9.40% (two), +11.15% (three); it is 0.00% on parity, where no halves agree"

[ablations.last_level_forms]
saving = 39.8
arity = 12
verdict = "kept: a last-level node prints Bp or 1 - b (Biic+>p) instead of pushing two leaf literals for B? to choose between (measured with the earlier spelling ici*Bii**+p for 1 - b). Removing the short forms costs +39.88% at n=10 and +39.80% at n=12 on random tables and +81.92 / +81.84% on parity — above the bar outright, no exemption needed"

[ablations.bare_b_drain]
saving = 3.39
arity = 12
verdict = "recorded: the fold's drain spelling. After the constant prints, nothing reads the stack, so bare B replaces B$ — the Decisions figure (2n+5 -> n+5 a table) is the constant root's emission, verified: a constant table costs exactly n+5 chars. The B$ variant is execution-gated clean, so the price is real: spelling the drain B$ costs +3.60 / +3.44 / +3.41 / +3.39 / +3.39% on random tables at n=4/6/8/10/12 (one char per drained bit; the share is flat) and +70.59% on constant tables at n=12, where the program is nearly all drain. Part of the fold's realization, not a separate device"

[ablations.literal_leak]
saving = 25.9
arity = 9
seed = 20261030
tables = 20
verdict = "kept: `?` leaves both literals and nothing returns to them, so a child no longer opens with `$$` (2 chars a literal). Removing it costs +34.7 / +34.8 / +34.9% on 20 seeded random tables at n=7 / 8 / 9 (11,326 -> 15,258 / 22,844 -> 30,800 / 45,544 -> 61,432 chars; share flat); n=9 parity +38.0%, majority +37.1%, thr3 +34.4%, and/or +25.4%. Costs workspace: the stack grows two literals a level, so the exact bit worst goes from linear in n to 2n^2 + 36n - 23 + bl(2n-1) (poly n still). Every row of every table n<=3, 300 random n=4, named n=5..8, random n=5..8 and sampled rows at n=9 execute; wrong-table control fails"

[ablations.compare_negate]
saving = 9.8
arity = 9
seed = 20261030
tables = 20
verdict = "recorded: 1 - b is `Biic+>p` (b > 0, 0 built as i + conj i; 7 chars), not `ici*Bii**+p` (11). A spelling of the last-level negation: removing it costs +11.0 / +10.9 / +10.9% on random tables at n=7 / 8 / 9 (flat) and +19.1% on parity at n=8 and 9; 0.0% on and, or, majority and thr3, which have no last-level (1,0) node. Same execution gate as literal_leak"

[ablations.constant_pair]
saving = 6.9
arity = 9
seed = 20261030
tables = 20
verdict = "kept: canonical, exempt. A depth n-2 node of two different constants ignores its last input: it prints b (`Bp`) or 1 - b and drains the last bit (`BpB`, 3 chars) instead of branching between two constant drains (18). Removing it costs +7.5 / +7.7 / +8.4% on random tables at n=7 / 8 / 9 and 0.0% on parity, and, or, majority and thr3 at n=7..9; it is what keeps an ignored last input under half a real one (catalogue test)"

