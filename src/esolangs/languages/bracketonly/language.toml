notes = "One outer numeric output shares the output code. The input digit modulo two selects the lazy arm. Multiplication by zero consumes ignored characters before an addition forwards the bit. The generator keeps one lazy tree and writes no cells. On 64 random tables at each of n=7/8 (seed 1847 + arity), source fell 53.78%/53.86%. Arity-3 totals fell from 379988 to 175196 chars and from 852768 to 536880 commands."

[resource_evidence]
version = 2
construction = "esolangs.languages.bracketonly.generator:bracketonly_request"

[resource_evidence.execution]
# A call of ID k costs 3(k+1) steps before its arguments. Tests cost 90,
# equal-arm reads cost 45, and a constant suffix of r reads costs at
# most 24r+27. The outer output costs 27 and a bare zero leaf costs 6.
expression = "90n+33"
exact = true
arities = [1, 2, 3, 4, 5]
first = 1
unit = "steps"
description = { growth = "poly n", claim = "worst", template = "{claim} {formula}; all-zero parity visits n tests and a zero leaf" }

[resource_evidence.workspace]
# The full tree has fewer than 32T call IDs. At most n+4 frames are
# live. Outside their IDs, the output frame costs six, resolved tests
# cost seven each, and the active test costs 26 with MOD and TWO live.
# A suffix draining r inputs uses at most 7r+19 bits outside its IDs.
# All-zero parity fills the n+4 frames with (n+5)-bit IDs at the last TWO.
expression = "(n+4)(n+5)+7n+26+bl(n)"
exact = true
arities = [1, 2, 3, 4, 6]
first = 1
unit = "bits"
description = { growth = "poly n", claim = "worst", template = "{claim} {formula} {unit}; parity reaches the last remainder with every test live" }

[resource_evidence.scaling]
# A test costs 120 chars and a final split has one four-char and one
# eight-char leaf. Pruning costs at most 60 per unary node or 36+32r
# to drain a constant suffix of r>=1 inputs. The outer output costs 36.
expression = "126T-84"
exact = true
arities = [1, 2, 3, 4, 6]
first = 1
unit = "characters"
description = { growth = "linear", claim = "worst", template = "{claim} {formula}; parity reaches a full tree" }

