[resource_evidence.execution]
# Each frame costs a push, ID resolution and return, besides its selected child frames.
expression = "135n+102"
exact = true
arities = [1, 2, 3, 4, 5]
first = 1
unit = "steps"
description = { growth = "poly n", claim = "worst", template = "{claim} {formula}; 135 per test, then at most 102 for output" }

[resource_evidence.workspace]
# At most n+5 frames. Forwarded sums cost bl(49(n+1)) bits. A draining frame holds up to n ASCII digits.
expression = "(n+5)(n+34+bl(49(n+1)))+6n+bl(n)+1"
exact = false
arities = [1, 2, 3, 4]
first = 1
unit = "bits"
description = { growth = "poly n", claim = "at most", template = "{claim} {formula}; lazy evaluation frames and the input cursor" }

[resource_evidence.scaling]
# Internal nodes take 180 characters. A leaf takes 124 or 136 (for one).
expression = "316T-180"
exact = false
arities = [1, 2, 3, 4, 6]
first = 1
unit = "characters"
description = { growth = "linear", claim = "at most", template = "{claim} {formula}; folding prunes tests and their arms" }

