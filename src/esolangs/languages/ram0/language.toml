[ablations.subtree_sharing]
saving = 72.9
arity = 12
verdict = "kept: canonical, exempt. A repeated subtree is emitted once and jumped to; an already-emitted one-subtree costs nothing, a zero-subtree one goto. Removing the sharing costs 56.7% at n=8 rising to 72.9% at n=12 on random tables, 99.0% on parity at n=12"

[ablations.jump_entry]
saving = 10.7
arity = 10
seed = "random.Random(1000n + k)"
tables = 20
verdict = "kept: a taken `C` leaves z = 1, so a node's leading reset-and-count is one token short when entered by a jump, and the zero-subtree fall-through already has z = 0; the leaf one is `A 2` and the zero leaf `Z 2`, and cell 0 drops its second `Z`. A rule on the entry point, not a search. 11.2/10.4/10.7/10.7% at n=7/8/9/10 on 20 random tables (11.1/10.4% on 200 at n=7/8), balanced area 10.9/9.8/10.4/10.6%; named functions parity 7.7/7.2/6.7/6.4%, majority 8.4/7.5/7.3/7.1%, and 6.3 to 5.1%, or 6.6 to 5.5%, threshold 8.3 to 6.9%, every program run"

[ablations.halves_agree_skip]
saving = 1.8
arity = 12
verdict = "kept: canonical, exempt. A test whose halves agree is passed over for its surviving half. 3.6% at n=8 declining to 1.8% at n=12 on random tables, 3.0% / 1.7% with one ignored input, and 0.0% on parity, AND, OR and constant tables, where the agreeing tests sit at the leaves"

[ablations.nand_circuit]
saving = 0.0
arity = 3
seed = "exhaustive"
tables = 276
verdict = "kept: feasibility -- the width-1 unary-address NAND circuits (n<=3) are the only RAM0 layout whose tokens are one character, so a one-column template exists; the shared tree wrapped at width 1 has multi-digit gotos (2 columns, test_one_column_layout fails). Plain-rewrite audit 2026-10-28: the circuit is 5-12x longer than the shared tree (mean 137.0 vs 27.5 chars at n=1, 469.2 vs 54.1 at n=2, 1209.4 vs 95.9 at n=3, 0 of 276 tables shorter), explicit width=1 only; default and balanced routes never use it, so 0.0% balanced area"

[ablations.test_address_order]
saving = 30.4
arity = 12
verdict = "kept: the deepest, most repeated test sits in cell 0 and the root test in cell n-1, so the unary addresses make the frequent tests the cheap ones. Reversing the assignment costs 16.3% at n=8 rising to 30.4% at n=12 on random tables, 20.5% with one ignored input at n=12, 2.7% on parity, 0.0% on AND/OR. A numbering choice; the shipped order wins on the random corpus at the largest arities; plain-rewrite audit 2026-10-28, seed random.Random(1000n + k), 20 tables, every program run: 12.2/16.4% at n=7/8 default and 11.7/15.6% balanced; named functions within -1.1..+3.0% default, so it keeps on the random class"

