# Language-owned data, one section per dataset; aggregators read
# only their own section and skip this file when it is absent.

[curation]
backlinks = 6

[proof_status]
labels = ["parameterized tree"]
qualification = "the inputs are stored once and each node loads its bit with `L`; a subtree already emitted is reached by `goto`, so only the distinct subtables are laid out, and the straight-line lookup is kept as a candidate"
scaling = "linear: O(T/n) distinct subtables, O(n) commands each"
execution = "poly n: worst n^2 + 8n + 5 commands, one root-to-leaf path"
workspace = "poly n: worst n + bl(S) + 2max(1,bl(n-1)) + Σ_{a<n} max(1,bl(a)) bits, S the token count"

