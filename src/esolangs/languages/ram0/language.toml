[ablations.constant_table_audit_20261101]
arity = 8
saving = 76.4
seed = 0
tables = "both constant tables n=1..12; exhaustive all tables/rows n=1..3; six witnesses/all rows n=4..6"
verdict = "kept: canonical whole-constant folding. Execute all fixed-width Z/setter pairs, then reset z and optionally increment it. No RAM cells are touched. Exactly 4n+1+2b chars and 2n+2+b commands including the post-halt dump, b the answer; written bits at most 1+bl(2n+1+b), reached by a row with a one. n=8 zero/one 144/144 -> 33/35 chars; n=12 261/261 -> 49/51. n=3 default corpus 22318 -> 22258 chars; width-one 309606 -> 309490. Each language passed 5656 paired before/after row executions; all 270 nonconstant programs through n=3 stay byte-identical. Both constants n=1..12 execute in default, width=1 and balanced layouts. All 24 balanced constant scores improve or match; all eight benchmark size/command pins remain unchanged. Owned regressions check exact resources and every input slot; stream readers preserve an unread sentinel and read before output."

[ablations.complement_cell_swap_trick_20261102]
seed = "random.Random(1000*n+k).choices"
arity = 8
saving = 0.0
tables = "20 random each n=7/8; all tables/rows n<=3; ten samples and projections n=4..8; five named families and complements n=7/8"
verdict = "rejected: the executable complement store lives above the input cells. Every eligible swapped head adds at least three unary A tokens (six characters), while removing one goto saves at most five characters at n=7/8, even before the constant pair/complement prologue. A full unshared-tree token ceiling keeps every original goto below10000 in this fixed window; swapping preserves emission order and increases subsequent addresses, so digit shortening cannot repay the extra heads. Fixed20 chars14593/25052 ->18682/30064, with20/19 tables growing; a gain guard therefore admits no swap. Native small/sample controls cover78 firing n3 tables and actual high-cell complement loads, with input setter order unchanged. This rejects the supplied high-cell construction at the fixed gate, not every possible complemented representation. No production path, cells or bound change."

[ablations.low_address_deep_block_trick_20261102]
seed = "random.Random(1000*n+k).choices"
arity = 8
saving = 2.6864
tables = "same fixed20, small/sample and named corpus; every row of all40 fixed judging tables"
verdict = "rejected: prelay bottom levels behind a root goto, taking the deepest block that ends below address100. Diagnostic level trials are scratch only. Actual fixed7/8 source14593/25052 ->14352/24379 (1.65/2.69%), below either bar. n3 source22258->25258 and commands63712->69264;2032 rows slow. Full judging-row commands245289/598409 ->248007/603729, and every judging row slows, so neither execution route qualifies. Majority and threshold3 source savings remain below1.8%; parity/AND/OR grow. No new candidate, layout state or old-program fallback ships."

[ablations.known_zero_entry_reset_trick_20261102]
seed = "random.Random(1000*n+k).choices"
arity = 8
saving = 0.0
tables = "all small tables/rows; sampled/ignored n=4..8; all7680 rows of fixed20 n=7/8; eight wrong-entry controls"
verdict = "rejected: shared zero leaves and cell0 heads still need their physical Z for one-entry C references. A correct zero-entry copy can jump one token past it; retain the original target when crossing a decimal boundary would grow its spelling. This changes no emitted character count. Exhaustive n3 commands63712->63442 (0.424%, below5%), with142 firing tables and no slower rows; fixed7/8 commands245289/598409 ->244195/596225 (0.446/0.365%). Treating C entries as zero is wrong: eight native wrong-entry controls fail. Complete small/sample native sweep9760 executions plus23040 full judging executions passes all real variants, including exact fixed-length input setters in physical order and final state dumps. No source-size, command-bound or execution admission; generator/proof scopes/pins/examples remain unchanged."

