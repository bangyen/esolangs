[[spec_triggers]]
program = "b"
stdin = ""
expect = "HaltError"
claim = "b with no open loop."

[[spec_triggers]]
program = "i"
stdin = "x"
expect = "HaltError"
claim = "i on a non-integer line."

[[spec_triggers]]
program = "i"
stdin = ""
expect = "InputExhaustedError"
claim = "i reads at EOF."

[[spec_triggers]]
program = "j"
stdin = ""
expect = "InputExhaustedError"
claim = "j reads at EOF."
