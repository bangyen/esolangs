[ablations]
audited = "2026-10-19"

[ablations.shared_residuals]
saving = 15.9
arity = 12
verdict = "kept: canonical, exempt. Repeated residuals share through level flags or banks, raced over the inline tree under a command bound. Deleting the whole race (the inline tree alone) costs +18.4% at n=8, +17.2% at n=10 and +15.9% at n=12 on random tables; at n=12, parity +4,237.6%, half-constant +2,417.5%, majority +1,026.8%"

[ablations.complement_tree]
saving = 38.6
arity = 10
verdict = "kept: the tree is also built for the complement, with the result preset to 1 (`rpsll`) and cleared at each leaf, and the shorter kept, so OR costs what NOR does. Plain-rewrite audit 2026-10-28 (20 random tables at n=7 / 8, 3 at n=10, Random(1000n+s)): random 3.91% / 2.35% / 0.60% (balanced 4.52% / 2.21% / 0.46%), under the bar and declining; or 24.6% / 27.5% / 32.2% and nand 33.3% / 35.3% / 38.6% at n=7 / 8 / 10 (balanced or 19.0% / 25.4% / 28.4%, nand 33.1% / 31.8% / 34.8%), share rising; popcount>=2 5.1% / 8.2% / 12.7%; parity, majority, and, nor, popcount>=3/4 0.0%. Kept for the or/nand family"

[ablations.bank_plans]
saving = 4.3
arity = 12
verdict = "kept: the two repeated_bank plans and the mixed bank are the sharing family's working member. Race marginal +3.7 / +3.8 / +4.3% on random tables at n=8/10/12; on classes at n=10/12, majority +83.0 / +159.2%, parity +24.0 / +21.4%, ignored classes +16.6..+19.7%, half-constant +24.2 / +21.9%. Plain-rewrite audit 2026-10-28 (20 random tables at n=7 / 8, 3 at n=10, Random(1000n+s)): random 4.21% / 6.15% / 3.05% (balanced 4.78% / 5.54% / 2.76%) at n=7 / 8 / 10, under the bar; majority 36.6% / 44.0% / 69.5%, popcount>=2 29.1% / 36.5% / 47.8%, popcount>=3 38.5% / 49.2% / 59.2%, popcount>=4 36.6% / 50.6% / 66.5%, share rising with n and balanced area alike; or, and, nand, nor, parity 0.0%. Kept for the majority and threshold family"

[ablations.one_residual_form]
saving = 0.0
arity = 12
verdict = "removed 2026-10-28 (retirement candidate #29): the second tree built over the single repeated_block residual and entered in the form race. Plain-rewrite audit: 0.00% on 20 random tables at n=7 and n=8 (Random(1000n+s).getrandbits(1<<n)) and on 3 at n=10, and on parity, majority, and, or, nand, nor, popcount>=2/3/4 at n=7, 8, 10, in size and balanced area, so no measured table is one where it wins; the banks cover its ground"

[ablations.levels_plan]
saving = 0.0
arity = 12
verdict = "removed 2026-10-20 (retirement candidate #30): the repeated_blocks plan entered in the form race on every table. Audit deletion cost was 0.00% on every corpus except mosaic at n=10 (+1.02%). Re-priced 2026-10-20 on fleet-canonical classes: fleet-corpus tiled +5.09% at n=8 (one table), +0.00% at n=10 and +0.83% at n=12; fleet tiled draws +0.30/+0.27/+0.14% at n=8/10/12; random and all other classes +0.00%. At the two largest arities it earns ~nothing, and its one real win fades with arity. The -77% parity figure once credited to it in the generator's comment belongs to the mixed bank (F25). Re-priced 2026-10-28: random 0.01%/0.00%; parity, majority, and, or, popcount>=2 0.00% at n=7..12; popcount>=3 peaks 8.3% at n=16; popcount>=4 9.2/10.4/11.4% at n=14/15/16 only; stays retired (one threshold at the cap is a chosen class)"

[ablations.restart_move]
saving = 0.0
arity = 12
verdict = "removed 2026-10-28: _move emitted the shorter of walking to the target and a d-restart per move. Plain-rewrite audit (20 random tables per arity at n=7 / 8, 3 at n=9..12, Random(1000n+s)): random 1.07% / 0.59% / 0.34% / 0.18% / 0.10% / 0.06% at n=7 / 8 / 9 / 10 / 11 / 12, a share in decline; and 7.4 / 7.6 / 7.8 / 7.9 / 8.0%, or 5.1 / 5.5 / 6.6%, nand 7.2 / 7.4 / 7.8%, nor 5.2 / 5.7 / 6.7%, popcount>=2 3.5 / 3.6 / 3.7%, majority 4.9 / 3.6 / 3.0% at n=7 / 8 / 10 (and 12 for and, or, nor), every named function under 10%; balanced area is quantised noise around the same figures (and 0.0 / 19.0 / 8.9% at n=7 / 8 / 10). With the complement tree in place OR costs what NOR does, which removed the +26.8% / +29.6% it once showed on OR"

[ablations.command_bound]
saving = 0.0
arity = 12
verdict = "recorded: forms over the command bound (3n^2+3)//4 + 20n + 4 are excluded from the race. Deleting the bound changes no output on any corpus measured (0.00% everywhere, parity and majority included; re-measured 2026-10-28 on 20 random tables at n=7 / 8, 3 at n=10 and 12, and the named tables, size and balanced): it never binds as shipped. It is the execution formula's premise, not a size mechanism"

[ablations.parity_sum]
saving = 83.4
arity = 8
seed = "named and random affine tables"
tables = 8
verdict = "kept under the named-function rule: an affine table (an XOR of inputs plus a bias) sums its counted bits two cells a step, halves a copy and subtracts the half twice, printing the sum mod 2, raced by length against the flag tree. Parity 69.7% at n=4, 77.9% at n=6, 81.0% at n=7, 83.4% at n=8, 86.9% at n=10, 89.2% at n=12; random affine tables 41-67% where the sum wins. Random tables: 0 of 200 change at n=5..8; majority, and, or and thresholds unchanged. Exhaustive n<=3: 10 tables change, none grows, every changed program executed; named and affine tables executed through n=10. Plain-rewrite audit 2026-10-28 (after the complement tree): parity 81.0% / 83.4% / 86.9% / 89.2% at n=7 / 8 / 10 / 12 (balanced 80.9% / 80.2% / 86.3% / 89.3%), the 20 random tables at n=7 / 8 and 3 at n=10 / 12 unchanged, majority, and, or, nand, nor and thresholds 0.0%"

[audits]
plain_rewrite = 2026-10-28
