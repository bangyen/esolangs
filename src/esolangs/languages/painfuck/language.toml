[ablations]
audited = "2026-10-19"

[ablations.shared_residuals]
saving = 15.9
arity = 12
verdict = "kept: canonical, exempt. Repeated residuals share through level flags or banks, raced over the inline tree under a command bound. Deleting the whole race (the inline tree alone) costs +18.4% at n=8, +17.2% at n=10 and +15.9% at n=12 on random tables; at n=12, parity +4,237.6%, half-constant +2,417.5%, majority +1,026.8%"

[ablations.bank_plans]
saving = 4.3
arity = 12
verdict = "kept: the two repeated_bank plans and the mixed bank are the sharing family's working member. Race marginal +3.7 / +3.8 / +4.3% on random tables at n=8/10/12; on classes at n=10/12, majority +83.0 / +159.2%, parity +24.0 / +21.4%, ignored classes +16.6..+19.7%, half-constant +24.2 / +21.9%"

[ablations.one_residual_form]
saving = 0.0
arity = 12
verdict = "candidate: the second tree built over the single repeated_block residual and entered in the form race. Its deletion cost is 0.00% on every corpus measured (1,000 random tables at n=8/10/12, both seed sets, and all 28 structured tables): the banks cover its ground, and it costs a full extra tree build on every table. It is the race's only single-block form, but no measured table is one where it wins. See RETIREMENT-CANDIDATES entry 29"

[ablations.levels_plan]
saving = 0.0
arity = 12
verdict = "removed 2026-10-20 (retirement candidate #30): the repeated_blocks plan entered in the form race on every table. Audit deletion cost was 0.00% on every corpus except mosaic at n=10 (+1.02%). Re-priced 2026-10-20 on fleet-canonical classes: fleet-corpus tiled +5.09% at n=8 (one table), +0.00% at n=10 and +0.83% at n=12; fleet tiled draws +0.30/+0.27/+0.14% at n=8/10/12; random and all other classes +0.00%. At the two largest arities it earns ~nothing, and its one real win fades with arity. The -77% parity figure once credited to it in the generator's comment belongs to the mixed bank (F25)"

[ablations.restart_move]
saving = 0.05
arity = 12
verdict = "kept: _move emits the shorter of walking to the target and a d-restart, per move; a spelling choice that cannot lose. +0.59% at n=8, +0.18% at n=10 and +0.05% at n=12 on random tables; on OR +26.8% at n=10 and +29.6% at n=12. Its comment figures reproduce (OR shares 17.77 / 18.90 / 20.12% at n=7/8/9 against the claimed 17.8/18.9/20.1; random 0.6% at n=8)"

[ablations.command_bound]
saving = 0.0
arity = 12
verdict = "recorded: forms over the command bound (3n^2+3)//4 + 20n + 4 are excluded from the race. Deleting the bound changes no output on any corpus measured (0.00% everywhere, parity and majority included): it never binds as shipped. It is the execution formula's premise, not a size mechanism"

[ablations.parity_sum]
saving = 83.4
arity = 8
seed = "named and random affine tables"
tables = 8
verdict = "kept under the named-function rule: an affine table (an XOR of inputs plus a bias) sums its counted bits two cells a step, halves a copy and subtracts the half twice, printing the sum mod 2, raced by length against the flag tree. Parity 69.7% at n=4, 77.9% at n=6, 81.0% at n=7, 83.4% at n=8, 86.9% at n=10, 89.2% at n=12; random affine tables 41-67% where the sum wins. Random tables: 0 of 200 change at n=5..8; majority, and, or and thresholds unchanged. Exhaustive n<=3: 10 tables change, none grows, every changed program executed; named and affine tables executed through n=10"
