[ablations.read_ladder]
saving = 6.86
arity = 8
verdict = "kept 2026-10-30 (named-function bar, as IEBEL fall_through): each answer's constant blocks at depth > 0 share one ladder, an entry label per block with 8 reads to the next entry, all falling into one printer, so a block no longer spends 7+8(n-d) reads of its own; the answer with fewer blocks goes first, which leaves no table larger. 200 seeded random tables (Random(n)): chars fall 10.92% at n=7 (175,417 -> 156,261) and 6.86% at n=8 (306,488 -> 285,454), 15.4% / 22.4% / 21.4% / 18.1% / 15.0% at n=2..6; named and 60.8 / 63.8%, or 61.9 / 64.7%, thr2 42.9 / 45.8%, majority 34.0 / 34.8%, parity 0% at n=7 / 8; 0 of the 16 + 256 tables at n=2, 3 and 0 of 200 per n=4..8 grew. Executed through esolangs.run: every row of every table at n<=3, of the five named functions and of 50 random tables at n=7 and n=8; the wrong-table control (or program against the and table) fails"

