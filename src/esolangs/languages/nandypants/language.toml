verdict = "kept: canonical fixed-output spelling. Read all 8n bits first with a still zero, make b a NAND toggle partner at its current cell, then emit the chosen literal byte. No pointer move, startup branch state or final label is needed. Exactly L=8n+11+2b chars and commands; workspace 15+bl(L-1)+bl(n), one bit below the prior envelope. n=8 zero/one 82/82 -> 75/77 chars; n=12 114/114 -> 107/109. n=3 corpus 26446 -> 26434 chars. A positive-control unary read-loop candidate executes the correct n=8 zero answer at 46 chars, but uses 45 workspace bits against its unchanged bound of 26: rejected rather than weakening the invariant. Each language passed 5656 paired old/new row executions; all 270 nonconstant programs through n=3 stay byte-identical. Both constants n=1..12 execute in default, width=1 and balanced layouts; CARP owned checks reach its n=14 cap. All 24 balanced scores per language improve or match; all eight benchmark size/command pins remain unchanged. Owned regressions check resources, every read before output and an unread following record. Existing tests expanded without new cases."

