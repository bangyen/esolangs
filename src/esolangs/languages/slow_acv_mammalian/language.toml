# only their own section and skip this file when it is absent.

[deep_arities]
# SLOW ACV MAMMALIAN's increments track per-level residues, not T: a
# command adds at most one cell, so its arrays hold 23 + S bytes for S
# poly n commands (dense x1.155); written bits 3077 at n=12, 3216 at 13.
workspace_step_exempt = "increments track per-level residues, not T"

[curation]
backlinks = 1
admitted = 2026-08-14T22:09:07-04:00

[proof_status]
labels = ["linear lookup"]
qualification = "a read chain banks each bit on array 16 and the dispatch's `DIGEST LEAPFROG` reads that sum as the leaf address; the five lightest weights are CONSUMEd from planted cells, so they never read the sum and need not be multiples of 256, which puts the stride at an eight-token leaf"
definitions = ["E = first jump, prologue, per-level prefix, node and arm, tail: each list at its residue maximum", "B = 8 bits a cell on arrays 0 and 16, pool zeros, heads, counters"]

