[resource_evidence.workspace]
# Span widths cover the four halving delimiters per level and the rewritten input blocks.
expression = "C*(64n+144+bl(n+7)+bl(n+1)+bl(n+3)+bl(n+4)+bl(n+6))+(1-C)*(8T+512n+184+16R+bl(12n+10)+bit_stride(n+1,2,4n)+bl(9n+1)+bl(9n+3)+bl(9n+4)+bl(9n+6)+bl(9n+7)+bl(9n+9)+bit_stride(9n+10,3,n)+bit_stride(9n+12,3,n))+bl(2n)+bl(n)"
source_terms = { names = ["C", "R"], provider = "esolangs.languages.inject.proof_formulas:workspace_terms" }
exact = true
arities = [5]
first = 5
unit = "bits"
description = { growth = "linear", claim = "worst", template = "{claim} {formula} {unit}. C marks the literal tail and R counts halving regex characters" }

[resource_evidence.scaling]
# R counts the halving regex widths. Label names gain letters after
# 49 one-letter names, then after 52² two-letter and 52³ three-letter names.
expression = "T+71n+29+2R+3(max(0,n-49)+max(0,n-2753)+max(0,n-143361))+2(max(0,3n-49)+max(0,3n-2753)+max(0,3n-143361))"
source_terms = { names = ["R"], provider = "esolangs.languages.inject.proof_formulas:scaling_terms" }
exact = true
arities = [5, 6, 17]
first = 5
unit = "characters"
description = { growth = "linear", claim = "worst", template = "{claim} {formula} {unit} past n = {previous}" }

