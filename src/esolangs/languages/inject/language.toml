verdict = "kept on random tables: the tree builds n<=4 and the halving lookup builds above. Ordered-tree vs halving totals on 200 seeded random tables: ratio 0.836 at n=4 (tree wins), 1.009 at n=5, 1.227 at n=6 (halving wins by 22.7% of its build) -- the shipped split sits at the measured crossover. The Decisions' 1.04x at n=5 measures 1.009x on this corpus; the corpus behind 1.04 is unstated. Plain-rewrite 2026-10-28: the tree saves 16.1% of the halving total on 200 random tables at n=4 (26.9% at n=3), so it clears the bar at its cap; but the cap is set by random tables alone. On 30-table classes the tree stays far smaller than halving past n=4: or/and halving is 3.6x the tree at n=8 (parity 2.4x, majority 1.95x), two-block 1.95x, dense 1.57x, half-constant 1.40x at n=5 but halving 2.4% smaller at n=8, mid-ignored 1.29x at n=5 but halving 18% smaller at n=8; on random tables the tree is 1.51x / 1.72x halving at n=7 / 8. Left as is: extending the cap is a new race, not a retirement. Two constant tables at n=4 are 3.3% shorter under halving"

