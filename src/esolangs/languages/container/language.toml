[catalogue]
sharing_exempt = "the shared tree races a threshold sum, one line per table step with no subtable drawn, which wins most tables from n=3 (repeated B C C B tables included)"

[ablations]
audited = "2026-10-19"

[ablations.prune]
saving = 13.4
arity = 6
verdict = "kept: canonical, exempt from the bar; the halves-agree settle earns 15.4% on random tables at n=5 and 49.2% on and at n=6"

[ablations.sharing]
saving = 29.8
arity = 6
verdict = "kept: canonical sharing, exempt; rises with arity on random tables (16.5% at n=5), 68.2% on parity at n=6; jointly with the prune, 53.1% at n=6"

[ablations.zero_leaf_inversion]
saving = 35.5
arity = 6
verdict = "kept: under the bar on random tables (0.9% at n=6) and dense-ones tables (1.6%), it stays under the named-function rule on the or family (31.4% at n=4 rising to 35.5% at n=6); the docstring's 12.7% figure prices a pre-prune build and is flagged in the audit report"

[ablations.mirror_race]
saving = 0.9
arity = 12
verdict = "removed 2026-10-20 (retirement candidate #12): the mirrored step order earned 2.6% on random tables at n=7 falling to 0.9% at n=12, a winner's-curse shape, and 0.4-3.4% on the two-block tilings it was kept for -- the in-code claim of 15-44% there never reproduced; the threshold build now always takes the plain order"

[ablations.essential_projection]
saving = 49.1
arity = 12
verdict = "kept: canonical, exempt; the threshold's projection is the identity on random tables (0.0%) and earns 49.1% on mid-ignored tables at n=12 (lead 3.4%, trail 3.7%, two ignored 8.2%)"

[ablations.tree_threshold_race]
saving = 56.4
arity = 6
seed = "random.Random(n)"
tables = 200
verdict = "kept 2026-10-20: the shared tree races the threshold sum and the shorter ships (ties keep the tree, two ticks faster). Against the tree alone, 41.1% / 50.4% / 56.4% at n=4/5/6 on 200 seeded random tables, 110,437 -> 82,208 over the 256 n=3 tables; the tree keeps 41 of them (constants, projections). Before the race the n <= 6 gate shipped the tree unconditionally. The race was capped at n <= 6 until the workspace bound went per-program (2026-10-20); past it the tree wins no random table (0/200 at n=7..10) but structured ones at n=10: parity 7,593 -> 2,241, constants 829 -> 245, x0 756 -> 317, halfconst 4,255 -> 2,083"
