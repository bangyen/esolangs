verdict = "removed 2026-10-27 (plain-rewrite audit): summing a dense table from its zero leaves (OUT starting at 49, each zero leaf subtracting one) is size-neutral on the shipped program on 100 random tables at n=4..8 and on the or, majority and dense-ones families at n=6..10, because the threshold ships there; inside the tree alone it earned 28.5% of the OR family but that tree never ships past n=4. Shipped: 0.75% over the 256 n=3 tables (16 change; 82,208 -> 82,827 with it gone), 0.01% over all 65,536 at n=4 (57), const-1 tables 3.8 / 3.5 / 3.2 / 2.8% at n=6 / 7 / 8 / 10, threshold-of-half 1.2% at n=10 -- under 10% everywhere. The earlier 31-35% on the or family priced a pre-race build. Every changed program ran on all rows (all of n<=3, the 130 tree-shipped n=4 tables, samples to n=10)"

