[ablations.trick_prototype_20261102_bidirectional_sibling]
kind = "archive"
arity = 8
saving = 21.6232053912
verdict = "kept as one direction-pair construction, including literal half-toggle base cases. Intern each emitted block backward function from child ids. A single *{A}* selects F(A) on1 and B(A) on0; use one child when its backward id matches the other sibling. The backward map is an involution: constants are fixed, literals swap, ignored inputs lift the map, matched pairs swap and unmatched pairs apply it to both children. Hence B(one)=zero iff B(zero)=one; always choose the one child, with no source-reflection machinery. Otherwise retain the three-brace conditional. No program search, cost race or frozen table: O(T) ids/plans, one bottom-up pass and explicit chunk tasks. Each replacement removes5 chars plus the omitted child; the14T+4n-13 source cap remains valid. For m remaining inputs, a literal costs2m+5, a generic parent adds at most8 and a paired parent at most6, so block cost is at most8m-1 in either entry direction. Setters, root positioning and dump cost4n+1; the initial inverse move pair removes2, giving exact12n-2; AND/all-ones witnesses reach it through8, and the all-small maxima are10,22,34. Workspace n+bl(L)+bl(n+1)+16 is unchanged. On200 seeded Random(1000*n+k).choice tables, n7 source214319->167788 (21.7111%),n8 423212->331700 (21.6232%); both clear even the declining20% bar with the required near-bar200 tables. Additional200 per9..12 save21.742..21.885%. Full live verification runs200784 old/new native executions: all small tables/rows,20 seeded plus7 named per4..6,200 plus7 named with ALL rows at7/8,20 plus7 named per9..12 with all parity rows and boundary/random samples. 6984 fresh-parser controls match reused brace skeletons, which uniform one-character setters leave unchanged. All final pointers/directions/input bits, untouched stdin/sentinel and sampled WrittenState bounds pass; no source grows. n3 chars16081->12399,commands58768->57672. 19905 row pairs slow, so this is source admission, not a universal runtime win. Twenty-table11-build median generation times n7/8/9:3.59/6.67/13.22ms ->4.94/9.55/19.01ms; still linear. After removing the redundant source-reflection branch, all879 full-live-corpus templates remain byte-identical. All276 small truth functions have an involutive backward map; the structural cases above prove it at larger arities. 33600 isolated block executions cover forward/backward entry, both initial answer bits and all suffix rows through3; computed F/B ids agree. The raw global-reflection assertion is false:0010 has B=0001, not0100; explicit B ids fix it. Independent ablation default matches live and disabling this rule matches the frozen old emitter;10600 small ablation runs and216 default/width1/balanced adapter runs pass. Swapping the leaf half-toggle fires the wrong-answer control."

