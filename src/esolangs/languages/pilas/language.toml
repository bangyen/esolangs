[resource_evidence]
version = 2
construction = "esolangs.languages.pilas.generator:pilas_request"
witnesses = "esolangs.languages.pilas.tests.resource_witnesses:resource_tables"

[resource_evidence.execution]
# The inverted one-bit leaf takes 15 main commands and 14 idle commands.
cases = [
    { through = 1, expression = "29" },
    { expression = "46n - 21" },
]
exact = true
arities = [1, 2, 3, 6]
first = 1
unit = "commands"
description = { growth = "poly n", claim = "worst", template = "{claim} {formula}" }

[resource_evidence.workspace]
# An inverted span tops out at three ASCII bytes, plus its zero
# residues and the idle bit. Constant roots instead keep K bytes.
cases = [
    { through = 1, expression = "25" },
    { through = 2, expression = "29" },
    { through = 3, expression = "32" },
    { expression = "bl(n)+max(2n+25,6K+12+P)" },
]
source_terms = { names = ["K", "P"], provider = "esolangs.languages.pilas.proof_formulas:workspace_terms" }
exact = true
arities = [1, 2, 3, 4, 5, 6, 8]
first = 1
unit = "bits"
description = { growth = "poly n", claim = "worst", template = "{claim} {formula} {unit}, K retained constant bytes and P peak pointer bits" }

[resource_evidence.scaling]
# Including the caller add, 10 and 11 both cost 14 after cancellation.
# A full branch adds 26 to its two charged children. Constants, literal
# spans and ignored tests are cheaper. Repeatedly join the two distinct
# maximizers in both orders. The root trades its add for a five-char tail.
cases = [
    { through = 1, expression = "20" },
    { expression = "20T-22" },
]
exact = true
arities = [1, 2, 3, 6]
first = 1
unit = "characters"
description = { growth = "linear", claim = "worst", template = "{claim} {formula} {unit}" }

