tables = "both constants n=1..12; exhaustive all tables/rows n=1..3; six witnesses/all rows n=4..6"
verdict = "kept: root-only fixed output with a closed byte-retention budget. ASCII 0/1 costs six bits and is nonzero, so comma/empty braces discard a byte without leaving a flag; the root needs no zero residue for a caller. Keep k=min(n,max(0,floor((3n+10-bl(3n+10)-bl(n))/6))) initial bytes and discard the rest, then print. L=3n+13-2k+2b chars; E=4n-2k+15+4b steps. W<=6k+14+bl(3n+10)+bl(n)<=3n+24: retained bytes, ten literal-stack bits, one idle-stack bit, two bits for its pointer, turn, and code/input cursors. The published cap is unchanged. Retaining every byte is shorter but n=8 reaches 71 bits against 48 allowed; the budget keeps four and reaches 47. n=7 zero/one 42/44 -> 28/30 chars (32.6% combined); n=8 46/48 -> 29/31 (36.2%), 81/85 -> 39/43 steps, workspace 33 -> 47 bits within 48; n=12 62/64 -> 37/39 chars. The root keeps its unused bytes; all nested leaves retain their old zero-residue interface. n=3 corpus 25650 -> 25634 chars. Both evaluation arities exceed either numerical size bar. Extra native checks cover pointer boundaries at 24 arities through n=512 without truth-table allocation, including exact steps and preserved following input. Each language passed 5656 paired old/new row executions; all 270 nonconstant defaults through n=3 stay byte-identical. Both constants n=1..12 execute default, width=1 and balanced. Separate 1120-run native probes per language cover every row through n=8. All 24 balanced scores per language match or improve; all 24 benchmark size/command pins across the batch remain unchanged. Owned checks enforce all reads before output, no EOF probe and a preserved following record. No new collected cases."
