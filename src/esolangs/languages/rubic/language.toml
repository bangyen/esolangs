[ablations.constant_fold]
saving = 0.0
arity = 12
verdict = "recorded: a constant subtable reads the remaining inputs and prints. Removing the fold alone changes no byte at any arity (byte-identical on 168 corpus tables): the equal-halves descent emits the same reads one level at a time and prints at the leaf. The fold is the base case of the descent and is priced jointly there; on constant tables the joint deletion costs +48552.15% at n=10 and +166069.11% at n=12"

[ablations.equal_halves_descent]
saving = 46.1
arity = 12
verdict = "kept: canonical, exempt. A node whose halves are the same subtree reads its bit and descends into one child instead of branching. Branching on equal halves instead costs +11.50% at n=10 and +11.32% at n=12 on random tables (second seed set +11.43 / +11.29%). Removing the whole descent (the plain build) costs +46.17 / +46.09% on random tables and at n=10/12: AND +5453.43 / +16809.06%, OR +5552.39 / +17083.70%, majority +94.88 / +112.00%, one ignored input +146.91 / +151.96%, two +372.69 / +331.83%, three +650.34 / +666.88%, half-constant +182.86 / +188.25%, sparse +149.75 / +151.57%"

[ablations.undo_in_branch]
saving = 12.5
arity = 8
seed = "random.Random(1847 + n), random.Random(5150 + n)"
tables = "200 random per seed at n=7,8 vs the prior build (test, then undo-and-test branches), plus parity, and, or, majority, threshold-3"
verdict = "kept: the 1 branch undoes the store as its first command, so every subtree runs on X and the closing test-and-undo (and the per-parity P/Q swap) goes. Random tables -12.48 / -12.50% at n=7 / 8 (second seed -12.47 / -12.50%); parity -13.49 / -13.52%, majority -12.93 / -11.34%, threshold-3 -10.70 / -10.33%, and -8.28 / -8.12%, or -6.65 / -6.31% (named functions reported apart; leaf-heavy and/or under the bar). A fixed 4.5 tokens of 20.5 a differing node, so the share holds across n. Commands 85 -> 71 at n=4 parity. Every row of all tables n<=3, 3000 random n=4, and random plus named n=5..8 (all rows) ran through the interpreter, a wrong-table control fails. A further 4.7 points (17.2% on random) comes from an opening r' d' u2, store l2, P = .wg, Q = .gw' (both one token), found by a search over openings of up to three turns; not shipped, a searched constant"

