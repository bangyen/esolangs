[resource_evidence]
version = 2
construction = "esolangs.languages.nybbleist.generator:nybbleist_request"

[resource_evidence.execution]
# For m >= 3, P=2^(m-2) packed nybbles cost P-1 deque operations
# and at most 2(m-2) branch commands. The final pop, two tests, three
# shifts and five answer commands cost at most 11. With m=2, loading
# Y directly replaces the pop. Affine tables take at most 3n+4 steps.
expression = "T/4+4n+6"
exact = true
arities = [2, 3, 4, 5]
first = 2
unit = "steps"
description = { growth = "linear", claim = "worst", template = "{claim} {formula} steps; the all-zero row of conjunction reaches it" }

[resource_evidence.workspace]
# For m>=3 essential bits, the first branch loads 2^(m-3) deque entries.
# All parsed instructions total 2n+2^(m-1)+2m+5, including untaken arms.
# NAND attains four bits per entry and both registers at width four
# once a trim leaves a nybble in X and the survivor is popped into Y.
# Either half-byte buffer is at most two bits. Small arities are exhaustive.
cases = [
    { through = 1, expression = "9" },
    { through = 2, expression = "14" },
    { through = 3, expression = "19" },
    { expression = "T/2+10+bl(T/2+4n+5)+bl(n)" },
]
exact = true
arities = [1, 2, 3, 4, 5, 8]
first = 1
unit = "bits"
description = { growth = "linear", claim = "worst", template = "{claim} {formula} {unit}; packed deque, registers and cursors" }

[resource_evidence.scaling]
# Each early selector uses four labels of width d(i), the hex width of
# 2i. The last two use three each, with two more labels of width d(n).
# Adding an essential input grows the payload and can only increase
# the final two selector indices. NAND attains the full-arity count.
# For q=d(n-1), sum(d(i), i<n)=nq-(16^q-16)/30 by the width thresholds.
cases = [
    { through = 1, expression = "14" },
    { expression = "3T/4+9n+13+(4n-1)ceil(bl(2n-2)/4)-2(16^ceil(bl(2n-2)/4)-16)/15-max(1,ceil(bl(2n-4)/4))+2ceil(bl(2n)/4)" },
]
exact = true
arities = [1, 2, 3, 4, 5, 6, 7, 8]
first = 1
unit = "characters"
description = { growth = "linear", claim = "worst", template = "{claim} {formula} {unit}; exact hex widths for packed selectors" }

