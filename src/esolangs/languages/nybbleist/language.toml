[resource_evidence]
version = 2
construction = "esolangs.languages.nybbleist.generator:nybbleist_request"

[resource_evidence.execution]
# For m >= 3, P=2^(m-2) packed nybbles cost P-1 deque operations
# and at most 2(m-2) branch commands. The final pop, two tests, three
# shifts and five answer commands cost at most 11. With m=2, loading
# Y directly replaces the pop. Affine tables take at most 3n+4 steps.
expression = "T/4+4n+6"
exact = true
arities = [2, 3, 4, 5]
first = 2
unit = "steps"
description = { growth = "linear", claim = "worst", template = "{claim} {formula} steps; the all-zero row of conjunction reaches it" }

[resource_evidence.workspace]
# At most T/8 four-bit deque elements, two nybble registers and at
# most two bits in the active half-byte buffer. The parsed code has
# 2n+2P+2m+5 instructions for m>=3 and 2n+11 for m=2.
expression = "T/2+10+bl(T/2+4n+5)+bl(n)"
exact = false
arities = [1, 2, 3, 4]
first = 1
unit = "bits"
description = { growth = "linear", claim = "at most", template = "{claim} {formula} bits; packed deque, registers and cursors" }

[resource_evidence.scaling]
# Let d bound the hex label width. For m>=3 the deque payload costs 3P-2,
# the m-2 selectors cost at most 5+4d each, and the final pop, shifts
# and output cost at most 25+8d. With m=2, the direct load adds one char
# over the pop and replaces the deque payload.
expression = "floor(3T/4)+9n+4n*ceil(bl(2n)/4)+13"
exact = [2, 3, 4, 5, 6, 7]
arities = [1, 2, 3, 4, 5, 6, 7, 8]
first = 1
unit = "characters"
description = { growth = "linear", claim = "worst", template = "{claim} {formula} characters, n=2..7; at most otherwise; packed nybbles and selectors" }

