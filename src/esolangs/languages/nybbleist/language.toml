[resource_evidence.execution]
# 2n reads, at most 2n branch commands, and n-1 rounds of deletion
# after loading the first half (T-1 deque operations). Finish in 4 steps.
expression = "T+4n+3"
exact = true
arities = [2, 3, 4, 5]
first = 2
unit = "steps"
description = { growth = "linear", claim = "worst", template = "{claim} {formula} steps; the all-zero row of conjunction reaches it" }

[resource_evidence.workspace]
# At most T/2 one-bit cells, two nybble registers, and two half-byte buffers
# holding an input bit or the output high nybble. The rest is two cursors.
expression = "T/2+10+bl(2T+4n+2)+bl(n)"
exact = false
arities = [1, 2, 3, 4]
first = 1
unit = "bits"
description = { growth = "linear", claim = "at most", template = "{claim} {formula} bits; selected half table and cursors" }

[resource_evidence.scaling]
# The literal halves take T+2 chars and later deletions cost at most
# 2T-4 across both branches. Each stage has four labels of at most n digits.
expression = "3T+9n+4n^2+4"
exact = false
arities = [1, 2, 3, 4, 6, 8]
first = 1
unit = "characters"
description = { growth = "linear", claim = "at most", template = "{claim} {formula} characters; half-table selectors and labels" }

