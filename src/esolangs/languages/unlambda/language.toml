[ablations.subtree_binding]
kind = "archive"
saving = 21.9
arity = 12
verdict = "kept: canonical, exempt. A repeated subtree within _REACH levels is bound once and referenced by i inside the nodes built around it. Deleting every binding candidate costs +21.84% at n=8, +21.68% at n=10 and +21.85% at n=12 on random tables, and on structured classes at n=12: parity +336.44%, majority +280.35%, threshold-3 +144.07%"

[ablations.halves_agree_fold]
kind = "archive"
saving = 13.9
arity = 12
verdict = "kept: canonical, exempt. A node whose halves agree reads and runs the one half; it is also the projection's realization (no separate projection step). Deleting the collapse costs +13.47 / +13.91 / +13.89% on random tables at n=8/10/12 and +131.63% on one-ignored tables at n=10; 0.00% on parity, majority and threshold-3, whose halves never agree"

[ablations.binding_race]
kind = "archive"
saving = 1.9
arity = 12
verdict = "kept: bound races every repeated subtree within reach and keeps the shortest binding. Taking the first candidate instead costs +1.84 / +1.83 / +1.87% on random tables at n=8/10/12, but +51.64 / +50.26 / +70.04% on majority and +24.70 / +16.45 / +14.93% on threshold-3. The race takes a min over a superset, so it cannot lose. Its comment figures reproduce under the share-of-the-first-candidate reading (majority 34.1 / 33.4% at n=8/10 against the claimed 33-34%)"

[ablations.leaf_pair]
kind = "archive"
saving = 10.0
arity = 8
verdict = "kept 2026-10-30 (named-function clause, as Nandypants read_ladder): a last-level node over leaves 0 and 1 is the echo `|``si`kv (13 chars with the read, against ~31); over 1 and 0 it is ``s``?0i``s.1e.0 (print 1 and exit on a 0 read, else print 0; the exit is safe because that read is the last). 200 seeded random tables (Random(1000n+s)): chars fall 10.13% at n=7 (408,679 -> 367,266), 9.98% at n=8 (820,997 -> 739,058), 9.92% at n=9; parity 21.04 / 20.81 / 20.36%, majority 9.63 / 10.13 / 9.16%, threshold-3 9.21 / 8.59 / 7.69%, and/or 4.64 / 3.83 / 3.22% (a fixed 16 chars) at n=7 / 8 / 9; 0 of 600 random tables grew. Executed through esolangs.run: every row of every table at n<=3 (2,120 rows), of the five named functions and of 50 random tables at n=7 and n=8; the wrong-table control (or program against the and table) fails on 6 rows. The scaling bound 169T/8 - 21 still holds but is no longer reached: the exhaustive worst is now 62 / 136 / 284 chars at n = 2 / 3 / 4 (37T/2 - 12 there only: annealing tops out at 552 at n = 5 against 580, and finds 1129 at n = 6), so its 315-character-halves witness is stale; a tight bound is open"

[ablations.constant_table_audit_20261101]
kind = "archive"
arity = 8
saving = 39.3
seed = 0
tables = "both constants n=1..12; exhaustive all tables/rows n=1..3; six witnesses/all rows n=4..6"
verdict = "kept: root-only constant promise chain. Each @ forces the next delayed read; the last read flag applies the literal printer, and outer success flags finish as identities. Nested leaves retain their old absorbing value. L=4n+2 chars; E=14n+2 machine steps. Written bits are 16n+17+max(16n+3,8n+8+sum(bl(i),i=1..n+1))+bl(n): task peak 16n+8, continuation peak at depth 2 or n+1, character/done/input 9+bl(n). The depth term matters at n=512: 7170 executed steps, 16440 bits, component peaks 8200/8221/8/1/10; a small-arity linear extrapolation would miss 26 bits. That diagnostic raised only the Python snapshot-counter recursion limit, not language semantics. Native formulas also execute at 22 arities through n=128 without truth-table allocation. n=7 50 -> 30 chars; n=8 56 -> 34 (39.3%), 145 -> 114 steps, 494 -> 280 written bits; n=12 80 -> 50 chars. Both evaluation arities exceed the declining gate. n=3 corpus 28115 -> 28091 chars. Owned checks preserve following input, output after every read, and the full continuation-depth bound. Each language passed 5656 paired old/new row executions; 270 nonconstant defaults through n=3 stay byte-identical. Both constants n=1..12 execute default, width=1 and balanced. Separate 1120-run native probes per language include every row through n=8. All 24 balanced scores per language match or improve, with 72 old balanced row executions per language as controls; all 24 benchmark size/command pins across the batch stay unchanged. No new collected cases."

