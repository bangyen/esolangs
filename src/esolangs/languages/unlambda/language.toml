[proof_status]
labels = ["tree"]
qualification = "each half is a `d` promise, forced by the `?` test that selects it, since an argument spelled inline would be evaluated before the application; the shipped node instead returns `s` over its selected promises, so a repeated subtree bound once as a promise reaches every half below, and the plain tree stays a candidate"
scaling = "linear: at most 169T/8 - 21 characters past n = 3: 315-character halves"
execution = "poly n: at most max(77n + 12, 84n - 9) steps: 77 a split level, 7 a bound node"
workspace = "T log T: at most 16(P + n·S) + (3n+9)bl(3n+9) + 9 + bl(n) bits: a copy of the shared subterm per read"
definitions = ["P = the program's leaves, each k and s counted twice", "S = the same count for its largest X in an @-node's `N`dX"]

