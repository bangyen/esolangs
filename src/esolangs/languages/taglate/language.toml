[ablations.paired_inputs]
saving = 27.3
arity = 8
seed = "random.Random(1847 + n)"
tables = "5 random per n=7..8, 3 for balance; parity, and, or, majority and threshold (size does not depend on the table)"
verdict = "superseded 2026-11-02 by packed leaves with six-cell input groups; historical measurements follow. Previously kept: each input travels with a ghost cell, so the group ahead of the value slots is even at every level and every reduce is the cheap even one (the odd reduce's full-queue j/swap passes, 14P against 4P, are gone, and with them the odd-n spare cell, the j fold and its rotation); the read converts 48-bit to 0/1 with one b per input. Against the odd/even build it saves 27.0% / 27.3% / 28.7% / 29.0% at n=7 / 8 / 9 / 10 (2,918 to 2,131; 5,499 to 4,000; 10,760 to 7,669; 21,025 to 14,930), identical on parity, and, or, majority and threshold; balance area 1.4% / 1.0% at n=7 / 8 (the bootstrapped seed dominates it). The 2n ghost constants cost the smallest arities: n=2 grows 121 to 130, 10 of 16 tables, 30 of 256 at n=3 and 60 of 65,536 at n=4 (at most +13). Exhaustive n <= 4 (65,536 tables at n=4) ran on every row, 0 bad; random and projected tables at n=5..9 ran on every row, 0 bad; a wrong table fails"

