[ablations.essential_projection]
saving = 64.6
arity = 12
seed = "random.Random(184700 + 100n + k)"
tables = "6 random tables per cell at n=8..11, 2 at n=12, k essential inputs at random positions, against the full layout at the same n"
verdict = "kept: canonical, exempt. A table is built over its essential inputs only and the rest are read and discarded. One ignored input saves 39.0% / 40.8% / 40.6% / 39.7% / 44.6% at n=8..12 and two ignored 65.0% / 64.7% / 67.2% / 64.3% / 64.6%; three essential inputs save 91.7% / 95.5% / 97.8% / 98.7% / 99.3% and five essential 77.5% / 87.0% / 93.3% / 96.2% / 98.0%"

[ablations.constant_shortcut]
saving = 100.0
arity = 12
verdict = "kept: canonical, exempt. A constant table is one seed char, one read per input, and the print: 99.94% at n=10 and 99.98% at n=12 against the full layout it would otherwise pay. The docstring's 451 -> 7 is the n=4 full layout against the shortcut; 11110000 goes 278 -> 16 chars at n=3"

[ablations.paired_inputs]
saving = 27.3
arity = 8
seed = "random.Random(1847 + n)"
tables = "5 random per n=7..8, 3 for balance; parity, and, or, majority and threshold (size does not depend on the table)"
verdict = "kept: each input travels with a ghost cell, so the group ahead of the value slots is even at every level and every reduce is the cheap even one (the odd reduce's full-queue j/swap passes, 14P against 4P, are gone, and with them the odd-n spare cell, the j fold and its rotation); the read converts 48-bit to 0/1 with one b per input. Against the odd/even build it saves 27.0% / 27.3% / 28.7% / 29.0% at n=7 / 8 / 9 / 10 (2,918 to 2,131; 5,499 to 4,000; 10,760 to 7,669; 21,025 to 14,930), identical on parity, and, or, majority and threshold; balance area 1.4% / 1.0% at n=7 / 8 (the bootstrapped seed dominates it). The 2n ghost constants cost the smallest arities: n=2 grows 121 to 130, 10 of 16 tables, 30 of 256 at n=3 and 60 of 65,536 at n=4 (at most +13). Exhaustive n <= 4 (65,536 tables at n=4) ran on every row, 0 bad; random and projected tables at n=5..9 ran on every row, 0 bad; a wrong table fails"

[ablations.crossing_bracket]
saving = 0.98
arity = 6
verdict = "removed 2026-10-28: balance_taglate's second width (crossing + 1) saved 0.42% of balanced area at n=2, 0.98% / 0.70% at n=6/7, 0.71% / 0.50% at n=9/10 and nothing elsewhere (seed 4242, 24 tables an n, random plus parity/and/or/majority; changed programs executed at n<=7). The literal/bootstrapped race stays: retiring it costs 66% at n=6 to 2550% at n=10"

