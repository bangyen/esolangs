[resource_evidence.execution]
# Nibble 15 at offset zero adds fourteen parity turns.
expression = "5T/2+12n^2+7n+69-4max(0,3-n)-75max(0,2-n)+B"
source_terms = { names = ["B"], provider = "esolangs.languages.taglate.proof_formulas:execution_terms" }
exact = true
arities = [3, 4, 5]
first = 3
unit = "commands"
description = { growth = "linear", claim = "worst", template = "{claim} {formula} {unit} past n = {previous}, with B bootstrap commands before the first read" }

[resource_evidence.workspace]
# Bootstrap cells are seven bits. The optional affine rebuild peaks below the literal seed.
expression = "max(floor(7T/4)+17n+20-6max(0,2-n),7B)+bl((1-C)*(5T/2+12n^2+7n+13-27max(0,2-n))+C*R)+bl(n)"
source_terms = { names = ["B", "C", "R"], provider = "esolangs.languages.taglate.proof_formulas:workspace_terms" }
exact = true
arities = [3, 4, 5]
first = 3
unit = "bits"
description = { growth = "linear", claim = "worst", template = "{claim} {formula} {unit}. C marks bootstrap layouts, B counts setup commands and R counts their tokens" }

[resource_evidence.scaling]
expression = "3T+12n²+17n+12"
exact = true
arities = [3, 5]
first = 3
unit = "characters"
description = { growth = "linear", claim = "worst", template = "{claim} {formula} {unit} past n = {previous}: nibble leaves" }

