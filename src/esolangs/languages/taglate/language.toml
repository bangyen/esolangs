[catalogue]
sharing_exempt = "indexed table reduction, with no subtable branch"
folding_constant_local = "_taglate_raw"  # smallest valid constant table

[ablations]
audited = "2026-10-19"

[ablations.essential_projection]
saving = 64.6
arity = 12
seed = "random.Random(184700 + 100n + k)"
tables = "6 random tables per cell at n=8..11, 2 at n=12, k essential inputs at random positions, against the full layout at the same n"
verdict = "kept: canonical, exempt. A table is built over its essential inputs only and the rest are read and discarded. One ignored input saves 39.0% / 40.8% / 40.6% / 39.7% / 44.6% at n=8..12 and two ignored 65.0% / 64.7% / 67.2% / 64.3% / 64.6%; three essential inputs save 91.7% / 95.5% / 97.8% / 98.7% / 99.3% and five essential 77.5% / 87.0% / 93.3% / 96.2% / 98.0%"

[ablations.constant_shortcut]
saving = 100.0
arity = 12
verdict = "kept: canonical, exempt. A constant table is one seed char, one read per input, and the print: 99.94% at n=10 and 99.98% at n=12 against the full layout it would otherwise pay. The docstring's 451 -> 7 is the n=4 full layout against the shortcut; 11110000 goes 278 -> 16 chars at n=3"

[ablations.spare_cell]
saving = 46.9
arity = 7
seed = "random.Random(184700 + n)"
tables = "200 random per n=3..8, 20 at n=9..10, 5 at n=11"
verdict = "kept: the strided reduces need an even count of input cells ahead of the value slots, so odd n carries one spare cell after the last input instead of a ghost input that doubled the table. Against the ghost build it saves 46.9% at n=7 (5,499 to 2,918 chars) and 48.8% / 49.6% at n=9 / 11 (21,025 to 10,760; 82,659 to 41,670), and 0.0% at even n, whose layout is unchanged. Exhaustive n <= 4 (65,536 tables at n=4) ran on every row, 0 bad; 181 random and projected tables at n=5..11 ran on every row, 0 bad; no table through n=4 grows"

