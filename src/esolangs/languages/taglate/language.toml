[ablations.constant_table_audit_20261101]
kind = "archive"
arity = 8
saving = 0.0
seed = 0
tables = "both constants, n=1..12"
verdict = "retained: already canonical read-then-literal paths. A one-character seed is the answer, h reads every input behind it and i prints the seed. Chars n+3 and commands n+1: n=7 10 chars, n=8 11 chars/9 commands/62 written bits, n=12 15 chars. Removing the seed prints the first input instead: opposite-valued witnesses fail for both answers. Native read-first controls pass. n=3 corpus chars 53146 unchanged. These controls reject the stripped candidates, not every possible construction. 1120 native row runs and 5656 paired old/new executions per language; 270 nonconstant n<=3 sources identical. Both constants execute default, width=1 and balanced layouts through n=12; all 24 balanced scores and eight benchmark size/command pins unchanged. Global resource caps unchanged. Extend existing raw IO/template cases to verify exact reads, following records and no EOF probe without adding cases."

[ablations.trick_prototype_20261102_packed_leaves]
kind = "archive"
arity = 16
saving = 78.23696377108129
verdict = "kept: four low-first truth bits per printable 32+v cell; select reversed leaf slots with the first n-2 inputs, then divide by 1+3A and 1+B and take parity in at most15 native iterations. Six-cell input groups keep every power-of-two stride off other input cells; two-cell repair fails n3 table00000001 row6. No search, frozen programs, old-source race or cutoff. Full source3T+12n²+17n+12 vsold14T+4n²+17n+24; generation/source O(T). Commands <=5T/2+12n²+11n+63 and written workspace <=3T+42n+24+bl(n)+bl(L); both remain linear in T.20 seeded Random(1000*n+k).choice tables plus parity/and/or/threshold run all rows through8 and boundary rows9/10:28768 old/new native runs including bootstraps;4840 more verify full snapshots, exact reads, following7 and print-after-input. Native peaks7/8:376/619 written bits.396 independent default/disabled byte comparisons pass. N3 source53146->46242; commands278864->302304 (+8.406%). Generic source7:2131->1103 (48.2403%),8:4000->1684 (57.9%). Measure rising savings through16:78.2370%; fresh native boundary rows9..16. The exact saving fraction increases for n>=3 to11/14=78.5714%, so there is no later finite peak or declining tail. Three-run median native all-row20-table batches n7/8/9:2.13884/11.9428/81.4734s ->0.314570/0.890285/2.43186s. Eleven-build generation medians20tables0.392/0.653/1.308ms ->0.571/1.079/2.002ms (1.5-1.7x slower).42 width1/balanced native controls pass; parity balanced areas7:40755->1210,8:79600->1800 text cells. Swapped leaf bit order fires wrong-answer controls. Raw eight-bit literal seeds can contain structural LF; printable nibble packing is the working repair."

