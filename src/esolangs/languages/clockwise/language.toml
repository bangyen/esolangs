[ablations.constant_table_audit_20261101]
arity = 8
saving = 0.0
seed = 0
tables = "both constants n=1..12; exhaustive all tables/rows n=1..3; six witnesses/all rows n=4..6"
verdict = "retained: the existing read-first constant ring is already folded. Its straight command sequence has 7n reads, seven output bits, two parity changes and one accumulator clear (one extra parity change for answer one). Three turns and even two-column area give 2*ceil((7n+13+b)/2) cells; this is a bound for this straight rectangular-ring construction, not all Clockwise programs. n=7 zero/one 62/64 cells; n=8 70/70 cells and commands, 507 written bits; n=12 98/98 cells. Positive control: coordinate rings and all nonconstant rows in the paired corpus execute; the current constant path itself executes all rows through n=8. n=3 corpus unchanged at 81106 cells. Each language passed 5656 paired old/new row executions; 270 nonconstant programs through n=3 remain byte-identical. Both constants n=1..12 execute in default, width=1 and balanced layouts; a separate 1120-run probe includes every row through n=8. All 24 balanced scores improve or match; all eight benchmark size/command pins remain unchanged."

