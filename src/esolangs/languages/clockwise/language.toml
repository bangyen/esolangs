[ablations.essential_drop]
saving = 50.9
arity = 10
verdict = "kept: canonical, exempt from the bar; the projection onto essential inputs earns 47.6% of area on one-ignored tables at n=8 rising to 50.9% at n=10 (trailing 39.9% to 43.8%, two trailing 60.5% to 66.4%); 0.0% on random tables at n>=5, where the layout is a fixed stencil and every input is essential"

[ablations.constant_ring]
saving = 99.9
arity = 10
verdict = "kept: canonical constant fold, exempt; a constant table's ring is 84 cells of area at n=10 against the lookup stencil's 74,900 (70 against 18,166 at n=8)"

[ablations.coordinate_ring]
saving = 95.2
arity = 10
verdict = "kept: clears the bar on its class -- a one-essential table's ring is 85 cells of area at n=10 against an average 1,774 for the projected lookup build over the same input (94.6% at n=8), the share rising with arity. Re-priced 2026-10-28 (random + named bar): fires on none of 200 random tables per arity at n=7..12 and on none of parity, majority, and, or, threshold (all n essential), so 0.00% there. Canonical, exempt: the ignored-input drop at its extreme, the ring being the one-literal counterpart of the constant ring (essential_inputs leaves one input; its seven reads are the only coordinate, and the rest are read past it); the projected lookup over the same input is 1,774 cells at n=10 against the ring's 85"

[ablations.trailing_rail]
saving = 0.0
arity = 10
verdict = "kept: not priced -- layout machinery. Trailing ignored inputs are read on the return rail after printing, the grid shifted down to separate the rail from the entry descent; both plain placements fail -- reads appended to the last head compute wrong functions (240 of 896 gated runs mismatch on trailing-ignored tables), and the unshifted left column is blocked by the corridor turn. The separation costs about 13% of area with one trailing input and 26% with two, against the (illegal) head-append box"

[ablations.flat_band]
saving = 55.5
arity = 8
seed = "random.Random(184700 + n)"
tables = 200
verdict = "kept: the one-band lookup races the stacked one by area and wins every random table, 54.9% at n=7, 55.5% at n=8, 58.3% at n=10 -- the same on parity, and, or and majority, since a table's bits move no cell; it wins every two-or-more-essential table through n=3. The race is live: stacked wins on few essential inputs with many trailing ones, whose reads the band takes down a tall rail (62 of the probed projections; essential (0, 1) at n=9 is 1,848 cells against 2,120)"

[ablations.table_rows]
saving = 16.7
arity = 9
seed = "random.Random(184700 + n)"
tables = 20
verdict = "kept: a four-row table (the one's `?` turns where the zero's `!` does, the return row's gaps `S` before a `?` and `+` before a `!`) drops the `S` row and the flat band from six rows to five; area 5(5T + 8n + 4) against 6(5T + 8n + 4), 16.67% on random tables at n=7, 8 and 9 (84,000 to 70,000, 161,760 to 134,800, 316,320 to 263,600 over 20 tables) and on parity, and, or, majority, threshold at every n=3..9 -- a fixed share, not falling with n. balance=True is 0.00% there: its banded strips keep the five-row table and win"

