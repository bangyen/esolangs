# Language-owned data, one section per dataset; aggregators read
# only their own section and skip this file when it is absent.

[curation]
backlinks = 2

[proof_status]
labels = ["finite lookup"]
qualification = "the essential input bits double a unary row index in one rewrite each, and each index unit strips one entry of the table read at them"
scaling = "linear: the projected table plus 4n + 101 chars"
execution = "linear: worst T + n + 3 steps: a doubling an input, a strip a row"
workspace = "linear: worst 16T + 10 bits: the string at its longest, an index of T - 1 units beside the table"

[ablations]
audited = "2026-10-21"

[ablations.essential_projection]
saving = 48.3
arity = 12
seed = "random.Random(184700 + n)"
tables = 200
verdict = "kept: canonical, exempt; one projection rule keeping the essential bits against doubling for every input over the full table: 0.0% on random tables, 33.4-48.3% one-ignored at n=8-12, 69.7-97.0% on constants; never larger. Plain-rewrite audit: no other bespoke tricks; pairwise halving of the table instead is the collected rewriting construction, and one-rewrite doubling (_U_U) is what that construction cannot do"

[catalogue]
folding_constant_local = "_RULES"  # no essential input: the setup rule leaves @#c

