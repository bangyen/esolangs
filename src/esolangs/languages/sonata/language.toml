verdict = "rejected 2026-11-02: one char per quad plus explicit decoder costs 112947 / 130209 chars at n=7/8 versus pair baseline 45600 / 59200 (+147.69/+119.95%); every one of the 400 random programs grows. No old-program min fallback or shifted evaluation window. Below the existing pair threshold it is byte-identical, so it cannot qualify for n=3 execution savings. Forced decoder checks execute all 2112 rows of all two/three-input functions, including all sixteen quad patterns; no semantic failure. No generator change."
