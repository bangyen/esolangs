# Language-owned data, one section per dataset; aggregators read
# only their own section and skip this file when it is absent.

[curation]
backlinks = 2
admitted = 2026-10-21T23:43:42-04:00

[proof_status]
labels = ["finite lookup"]
qualification = "the essential input bits double a unary row index in one rewrite each, and each index unit strips one entry of the table read at them"
scaling = "linear: worst T + 4n + 101 characters: projected table plus reads"
execution = "linear: worst T + n + 3 steps: a doubling an input, a strip a row"
workspace = "linear: worst 16T + 10 bits: the string at its longest, an index of T - 1 units beside the table"

[ablations]
audited = "2026-10-29"

[ablations.essential_projection]
saving = 48.3
arity = 12
seed = "random.Random(184700 + n)"
tables = 200
verdict = "kept: canonical, exempt; one projection rule keeping the essential bits against doubling for every input over the full table: 0.0% on random tables, 33.4-48.3% one-ignored at n=8-12, 69.7-97.0% on constants; never larger. Plain-rewrite audit: no other bespoke tricks; pairwise halving of the table instead is the collected rewriting construction, and one-rewrite doubling (_U_U) is what that construction cannot do"

[ablations.symmetric_count]
saving = 64.5
arity = 8
seed = "named symmetric tables"
tables = 5
verdict = "kept under the named-function rule: a table depending only on how many essential inputs are 1 counts them, one u a 1, and appends m + 1 entries, a rule, not a race: the count build is never longer (byte-identical to the former length race on all 65,812 tables n<=4 and 168 tables n=5..10). Parity, majority, and, or and exactly-2 all 11.3% at n=4, 32.3% at n=6, 48.2% at n=7, 64.5% at n=8, 87.3% at n=10; a symmetric table with an ignored input 47.9% at n=8. Random tables: 0 of 200 change at n=5..8. Exhaustive n<=3: 38 tables change, none grows, every changed program executed; named tables executed through n=10"

[ablations.pair_table]
saving = 23.9
arity = 8
seed = "random.Random(184700 + n * 1000 + s), s < 200"
tables = 200
verdict = "kept: one char per row pair (0/1 for 00/11, a for 01 = the last bit, b for 10 = its negation), the last essential bit after the table, from m = 7 essential bits (m = 6: larger on 300 of 300). Random tables 11.3% at n=7, 23.9% at n=8; named symmetric tables 0.0% (they take the count build); one-ignored n=8 tables take it at m = 7. Never larger from m = 7. Executed: every row of 60 random n=7, 30 n=8, 3 n=9 tables, all 8 one-ignored n=8 shapes, and the named tables n=7..8; a wrong-table control fails. No balance (text)"

