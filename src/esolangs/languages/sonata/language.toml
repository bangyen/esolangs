[resource_evidence.execution]
# Row rules through n=3: one rewrite, then the halt.
cases = [
    { through = 1, expression = "T+n+2" },
    { through = 3, expression = "2" },
    { expression = "T+n+2+min(1,floor(n/55041))" },
]
exact = true
arities = [1, 2, 3, 5]
first = 1
unit = "steps"
description = { growth = "linear", claim = "worst", template = "{claim} {formula}: row rules to n=3, then index, strips, halt" }

[resource_evidence.workspace]
cases = [
    { through = 1, expression = "16T+10" },
    { through = 3, expression = "8n+2" },
    { expression = "16T+10+16min(1,floor(n/55041))" },
]
exact = true
arities = [1, 2, 3, 5]
first = 1
unit = "bits"
description = { growth = "linear", claim = "worst", template = "{claim} {formula}: the input, or an index beside the table" }

[resource_evidence.scaling]
# Full-support nonsymmetric doubling attains through six inputs.
# The n=1 identity stays on doubling: count lookup requires m>=2.
# A projection costs 2**m+2n+2m+80. Pair packing from m=7 instead
# costs <=2**(m-1)+2n+2m+115, below this ceiling. Row rules take
# n=2, 3. The mask layout uses at most T+n+1724 characters from n=55041.
cases = [
    { through = 1, expression = "T+4n+80" },
    { through = 3, expression = "(n+5)T-1" },
    { expression = "T+4n+80" },
]
exact = [1, 2, 3, 4, 5, 6]
arities = [1, 2, 3, 5]
first = 1
unit = "characters"
description = { growth = "linear", claim = "worst", template = "{claim} {formula}: exact n=1..6, upper bound thereafter" }

