[proof_status]
labels = ["finite lookup"]
qualification = "the essential input bits double a unary row index in one rewrite each, and each index unit strips one entry of the table read at them"
scaling = "linear: at most T + 4n + 101 - 21min(1,(n-2)^2) characters"
execution = "linear: worst T + n + 3 - min(1,(n-2)^2) steps: index, strips, halt"
workspace = "linear: worst 16T + 10 bits: the string at its longest, an index of T - 1 units beside the table"

