[ablations.constant_table_audit_20261101]
arity = 8
saving = 82.2
seed = 0
tables = "both constants n=1..12; exhaustive all tables/rows n=1..3; six witnesses/all rows n=4..6"
verdict = "kept: canonical whole-constant folding. One whole-string rule consumes n distinct s-vars; only n=2 needs two rules guarded by a literal first bit, preventing the two-character result =b from matching again. Wrong lengths stay unanswered. Exactly 2n+5 chars (16 at n=2), two commands, 8max(n,2)+2 written bits. n=8 118 -> 21 chars; n=12 126 -> 29. n=3 corpus 30508 -> 30314 chars, area 43358 -> 43070. Each language passed 5656 paired old/new row executions; all 270 nonconstant programs through n=3 stay byte-identical. Both constants n=1..12 execute in default, width=1 and balanced layouts. All 24 balanced scores per language improve or match; all eight benchmark size/command pins remain unchanged. Owned regressions verify exact resources and input/output framing."

[ablations.setup_mvar_prefix]
arity = 8
saving = 8.1
seed = "random.Random(184700 + n * 1000 + s), s < 200"
tables = "200 random tables per n=7,8; all tables/rows n=1..3; ten tables/all rows n=4..6; two random tables/all rows n=7,8; every one-ignored shape n=4,7,8; named families sampled n=3,7,8,10,12"
verdict = "rejected 2026-11-02: n=7/8 source 45600 -> 41600 / 59200 -> 54400 chars (8.77/8.11%), declining below 20%; zero execution saving on the n=3 corpus. Projected programs stay byte-identical. The m-var setup also breaks documented wrong-length rejection: table 00110110 on 00 or 0000 answers =0, while the baseline leaves %00 or %0000 unanswered. Native wrong-pair-symbol control fails 64/128 rows. No generator change."

[ablations.drop_input_marker]
arity = 8
saving = 7.1
seed = "random.Random(184700 + n * 1000 + s), s < 200"
tables = "200 random tables per n=7,8; all tables/rows n=1..3; ten tables/all rows n=4..6; two random tables/all rows n=7,8; every one-ignored shape n=4,7,8; parity/and/majority four rows n=3,7,8,10,12"
verdict = "kept 2026-11-02 for execution: exactly n=3 all 256 tables/2048 rows use 20112 -> 18080 commands (10.10% fewer), no slower row or larger table; source 30314 -> 24980 chars. Remove the once-only marker except at n=2, whose setup can match the two-character answer. After setup, remaining bits match the earlier index rules; with no bits, a nonempty index matches strip and an empty index matches a final rule. Setup therefore cannot reenter; its exact n s-vars cannot match the two-character result when n!=2. All four n=1 tables/eight rows execute; the two nonconstant programs also drop the marker. Wrong-length binary input has neither @ nor n characters, so no rule matches and it stays unanswered. Each changed nonconstant program loses 21 chars and one rewrite; n=7/8 totals 45600 -> 41400 / 59200 -> 55000 (9.21/7.09%), declining below the size bar. No sampled later-arity or named-family command/source regression. The workspace bound stays unchanged: the longest indexed string is unchanged. Each of four variants passed 7076 native rows with whole-stream input framing, plus 2112 forced quad rows; setup-hit controls observe exactly one setup for every nonconstant unmarked run."

