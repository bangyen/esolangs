[ablations.constant_table_audit_20261101]
arity = 8
saving = 0.0
seed = 0
tables = "both constants, n=1..12"
verdict = "retained: already canonical read-then-literal paths. One empty production deletes n embedded inputs then the literal answer; the post-halt step prints the last deletion. Chars and commands n+2 including dump: n=7 9, n=8 10 with 81 written bits, n=12 14. Removing the answer bit prints the final input: opposite-valued witnesses fail for both answers. Owned coverage verifies every queue deletion precedes rendering. n=3 corpus chars 6732 unchanged. These controls reject the stripped candidates, not every possible construction. 1120 native row runs and 5656 paired old/new executions per language; 270 nonconstant n<=3 sources identical. Both constants execute default, width=1 and balanced layouts through n=12; all 24 balanced scores and eight benchmark size/command pins unchanged. Global resource caps unchanged. Extend existing raw IO/template cases to verify exact reads, following records and no EOF probe without adding cases."

[ablations.trick_prototype_20261102_minority_named]
arity = 8
saving = 31.9745
verdict = "kept only AND and NOR over essential inputs. Marker10 leaves zero last unless the row appends1, which fires two slots later. AND needs two trailing empty rules; NOR already has an empty row there. Exact saved chars T-3-g, g=2 for AND and0 for NOR, so retain the old marker where this loses (AND below3 essential inputs, NOR below2). n=7/8 AND399->276 /785->534 (30.83%/31.97%); NOR399->274 /785->532 (31.33%/32.23%). Emitted source through n=16 and contrasting boundary rows execute. Saving (T-3-g)/(3T+2n+1) increases strictly to1/3 from below: no finite peak. Generic minority with min(old,new) saves only0.61%/0.68% on20 seeded tables (77+n), so no generic histogram race ships. All tables/rows through3 and20 seeded plus both named functions per n=4..8 give26064 paired old/live runs;16 changed templates,370 byte-identical controls. n=3 chars6732->6721; n=2 212->211. A wrong-answer constant and the missing second AND guard both fail the allones control. Global source maximum unchanged (an interior single one attains it). Worst execution grows one command from n=3; queue workspace grows8 bits from n=2, both exactly checked with native snapshots."

[ablations.trick_prototype_20261102_pair_packed_rows]
arity = 3
saving = 0.0
verdict = "not retained: the supplied marker-position invariant fails before any pair encoding is chosen. With selector input0 appending1 and remaining weights halved, the re-appended marker reaches n+1+k+x0, not n+1+k. Actual two-input heads for rows00/01/10/11 are3/4/4/5 instead of3/4/3/4. Trace all rows at n=2/3 using the actual interpreter with a complete probe program; baseline XOR and complement controls execute every row correctly. The claimed fixed production n+1 overlaps the first row-pair slot as well. No complete pair code or repaired phase control was supplied. This rejects this sketch and invariant, not all pair-packed encodings; no speculative size saving or universal lower bound."

[ablations.trick_prototype_20261102_cascade_padding]
arity = 3
saving = 0.0
verdict = "rejected tested two-stage expander: replace highest weight4 by11 and put00 in its two reachable expansion productions. On table00000001,row111 the literal mutant11;00;0;1;00;00;0;0;0;0;0;,1111 prints0 instead of1: expansion zeros queued behind the marker are deleted after its answer. All baseline rows of AND and parity execute correctly; their mutant failures retain full queue/head traces. The proposed repair has no complete phase or answer-preservation rule. This is a concrete failing construction, not a universal cascade impossibility claim."

