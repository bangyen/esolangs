[ablations]
audited = "2026-10-20"

[ablations.input_projection]
saving = 99.76
arity = 12
verdict = "kept: canonical, exempt. input_weights gives an ignored input weight 0 (an empty rule, its symbol deleted unread) and reads the answers off the reduced table, so the walk is sized by the essential inputs alone. Building with full positional weights and the full answer list instead costs 0.00% wherever every input is essential (the programs are identical), and on its class at n=10/12: one ignored input +99.19 / +99.76%, two +295.16 / +298.54%, three +677.76 / +693.23%"

[ablations.constant_root]
saving = 114.29
arity = 12
verdict = "kept: canonical, exempt. A constant table is one empty production and the literal answer (n + 2 chars): the inputs are deleted unread. Taking the general walk instead costs +116.67% at n=10 and +114.29% at n=12 on constant tables, and jointly with the projection removed +42,741.67 / +146,364.29% (the full walk over a table with no essential inputs). Every other class measures 0.00%: the size is a function of n and the essential count alone (5,141 chars at n=10, 20,505 at n=12 when all inputs are essential), so the plain build is the shipped build there"
