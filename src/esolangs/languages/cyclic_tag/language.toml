[ablations.input_projection]
saving = 99.49
arity = 12
verdict = "kept: canonical, exempt. input_weights gives an ignored input weight 0 (an empty rule, its symbol deleted unread) and reads the answers off the reduced table, so the walk is sized by the essential inputs alone. Building with full positional weights and the full answer list instead costs 0.00% wherever every input is essential (the programs are identical), and on its class at n=10/12: one ignored input +98.31 / +99.49%, two +290.13 / +297.02%, three +654.71 / +686.04%"

[ablations.constant_root]
saving = 107.14
arity = 12
verdict = "kept: canonical, exempt. A constant table is one empty production and the literal answer (n + 2 chars): the inputs are deleted unread. Taking the general walk instead costs +108.33% at n=10 and +107.14% at n=12 on the constant 0 table (+100.00% on the constant 1), and jointly with the projection removed +25,683.33 / +87,857.14% (the full walk over a table with no essential inputs). Every other class measures 0.00%: the size is a function of n and the essential count alone (2,570 chars at n=10, 10,255 at n=12 when all inputs are essential), so the plain build is the shipped build there"

[ablations.single_stride]
saving = 49.2
arity = 8
seed = "77+n"
tables = 200
verdict = "kept: one production a row and one zero a unit of weight, where the old build spent two of each. A row's production is empty for a 1 (the marker is then the last bit deleted) and `0` for a 0 (it appends the 0 that is deleted last), so no empty rule follows the answer. Total characters on 200 seeded random tables fall 46.2% at n=5, 47.9% at n=6, 48.7% at n=7, 49.2% at n=8; at n=8 parity 49.3%, and 39.5%, or 59.1%, majority 46.6%, threshold-3 56.3%; balance=True at n=8 (20 tables) 48.8%. Every row of those 200 tables at n=5..8, the named functions at n=7..8 and 30 tables at each n<=4 executed through the interpreter; a one-bit wrong table fails. Steps 2T+n+1 become T+n+2"

