# Language-owned data, one section per dataset; aggregators read
# only their own section and skip this file when it is absent.

[curation]
backlinks = 91

[proof_status]
labels = ["parameterized lookup"]
qualification = "weighted zero padding advances the cyclic rule pointer to the indexed answer; the next empty rule deletes it; AND/NOR use a two-bit marker and a single one continuation"
scaling = "linear: worst 3T + 2n + 1 characters, weighted padding"
execution = "linear: worst E steps: indexed marker and at most one named continuation"
workspace = "linear: worst W bits: queue, production pointer and output latch"
definitions = ["E = T+n+2 below n=3, otherwise T+n+3", "W = 8T+9+bl(T+n) at n=1, otherwise 8T+17+bl(T+n)"]

