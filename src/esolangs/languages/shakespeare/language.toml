qualification = "parity sums retained inputs modulo two; otherwise the table is one number packed by Horner's rule; each input multiplies a running power of two by 1 + bit * (2^w - 1), and the answer is the number divided by that power, mod 2"
definitions = ["K = ceil(T/64), E = 6 for n=1, otherwise 2n+K+6"]

