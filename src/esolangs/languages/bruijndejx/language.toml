[resource_evidence.execution]
# A two-way read is 10 transitions (2 pushes, the Q lookup, 2 binds, 3
# pushes, the ?, the chosen index), an ignoring read 8; a named residual
# adds its lookup, never at the root; the leaf's /, push and * add 3.
expression = "11n + 2"
exact = false
arities = [1, 2, 3, 6]
first = 1
unit = "commands"
description = { growth = "poly n", claim = "at most", template = "{claim} {formula} {unit}" }

[resource_evidence.workspace]
# Peak at ? inside Q: three argument cells, each holding Q's two-cell
# environment; term ids are below K <= 2L (':' alone makes two terms).
expression = "9*bl(2L) + bl(n) + 5"
exact = false
arities = [1, 2, 3, 6]
first = 1
unit = "bits"
description = { growth = "poly n", claim = "at most", template = "{claim} {formula} {unit}" }

[resource_evidence.scaling]
# The race never exceeds the inline tree: 3T leaf + 2(T - 1) branch chars
# + 14-char Q header; a fold saves >= 3 and the I header costs 12.
expression = "5T + 23"
exact = false
arities = [1, 2, 3, 4, 5, 6, 7, 8]
first = 1
unit = "characters"
description = { growth = "linear", claim = "at most", template = "{claim} {formula} {unit}" }

