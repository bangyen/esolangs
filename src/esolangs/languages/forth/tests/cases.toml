language = "Forþ"
oldid = 189084

[[examples]]
id = "cat"
source = "1{,0o[.]1+}[;]"
stdin = "abc"
stop = "eof"
expected = "abc"

[[examples]]
id = "hello"
source = "0F2*3+F6*A+F7*3+F7*9+F7*6+F7*E+F2*2+F2*E+F7*6+F7*3+F7*3+F6*B+F4*C+[.]"
expected = "Hello, world!"

[[spec_triggers]]
program = "1+"
stdin = ""
expect = "HaltError"
claim = "a binary op under two values aborts the top-level scope as a HaltError"

[[spec_triggers]]
program = "~"
stdin = ""
expect = "HaltError"
claim = "an empty-stack pop is a HaltError"

[[spec_triggers]]
program = ","
stdin = ""
expect = "InputExhaustedError"
claim = ", raises at EOF"

[[spec_triggers]]
program = "1{+};A."
stdin = ""
expect = "output"
output = "\n"
claim = "an invalid operation in a called scope aborts only that scope"
