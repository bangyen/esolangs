verdict = "retired: recursive doubling is an alternative arithmetic construction, not omission of redundant syntax or a no-op. Its marginal is0.00% on random and every named family at both fixed n7/8. Positive controls before/after removal: AND n10 356 ->362 chars, n12 481 ->526; OR372 ->388 and492 ->556. The old class reason was false: both builds have a sqrt(T) spelled stride, while unary count also costs sqrt(T) and binary count O(n); binary's limiting saving can approach50%, not zero, but future gains do not change the fixed corpus. Remove _count and _COUNT_DOUBLE; the existing stride loop now receives a direct unary count, no replacement path/state. Maximal zero-run-nine witnesses and all old proof scopes/exactness remain; the global source cap still follows from the unchanged min with bare painting. Source IP remains within that cap, coordinate workspace cannot grow, and unary initialization executes no more steps. Small pins and example unchanged; n10 AND anchor362."

