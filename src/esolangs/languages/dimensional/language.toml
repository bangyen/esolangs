verdict = "kept: canonical, exempt. An ignored input weighs 0 in the doubled-bit index (read bare, overwritten) and the painted table is the projected one. 0.00% on random tables at n=6..12; with one ignored input 83.1% at n=10 and 94.2% at n=12, with two ignored inputs 216.8% at n=10 and 268.1% at n=12"

[ablations.constant_path]
kind = "archive"
saving = 9.4
arity = 12
verdict = "kept: canonical, exempt. A constant table is spelled as a literal program and never painted. Solo price 11.5% / 9.7% on constant tables at n=10 and 11.1% / 9.4% at n=12; most of a constant table's saving is the projection's (it has no essential inputs) — jointly with projection removed a constant table costs +3,680% at n=10"

[ablations.zero_run_loops]
kind = "archive"
saving = 1614.7
arity = 12
verdict = "kept: a zero run of nine or more is spelled as a counter loop at a balanced stride instead of bare steps. 0.02-0.07% on random tables; on the long-run classes it is the build: AND 514.4% at n=10 and 1,614.7% at n=12, half-constant 66.8% / 85.4%, sparse 26.3% / 30.6%, majority 15.6% / 20.6%. The in-code shares (83.7% on AND at n=10, 73% on a threshold, 13.5% on majority, share of the plainer build) all reproduce. Plain-rewrite audit 2026-10-28 (20 random tables per n, Random(1000n+s)): random 0.07% / 0.06% at n=7 / 8, balanced 0.00%; and/nor 42.5% / 60.4% / 83.7% at n=7 / 8 / 10, or/nand 40.1% / 58.9% / 83.2%, popcount>=2 26.4% / 42.9% / 72.7%, majority 2.0% / 8.2% / 13.5%; balanced area follows (and 40.1% / 60.9% / 83.0%)"

[ablations.count_doubling]
kind = "archive"
saving = 12.9
arity = 12
verdict = "historical measurements, retired 2026-11-02: inside a counted loop the count was spelled by whichever of unary and doubling through the spare dimension is shorter, so it never makes a program larger. 0.00% on random tables and most named tables; on AND, the longest-count class, 4.3% at n=10 rising to 12.9% at n=12 and 25.9% at n=14. The in-code shares (11.4% at n=12 and 20.6% at n=14 on AND, 13.4% on a threshold at n=14, share of the plainer build) all reproduce. Plain-rewrite audit 2026-10-28: 0.0% on 20 random tables and every named function at n=7 / 8 (and/nor 4.1% / 6.7% / 11.4% / 20.5% at n=10 / 11 / 12 / 14, balanced 6.8% / 6.0% / 11.4% / 18.1%; popcount>=2 0.9% / 2.8% / 5.4% / 13.3%). The historical O(n)-versus-sqrt(T) class rationale was false: the spelled stride is sqrt(T) either way. Fixed n7/8 fails admission; the current build uses unary counts"

[ablations.complement_paint]
kind = "archive"
saving = 93.7
arity = 12
verdict = "kept: the table or its complement is painted, whichever paints shorter, and a complement is read out through a fresh dimension-4 cell as 49 - c (`[->4-<4]>4` and one more `+`, 11 chars). Zero runs loop and ones cost two characters each, so or/nand paid per one. 0.00% on random tables (20 seeded) at n=7 and n=8, parity, majority, and, nor 0.0%; or/nand 40.1% / 58.9% / 83.2% / 93.7% at n=7 / 8 / 10 / 12 (730 -> 300 chars at n=8, 2,306 -> 388 at n=10), popcount>=2 26.4% / 42.9% / 72.7% / 88.4%, popcount>=3 8.8% / 23.4% / 54.6% / 77.3%, popcount>=4 0.0% / 5.5% / 31.7% / 58.5% (share rising with n). Balanced area follows (or at n=10 4,624 -> 841). Measured 2026-10-28 chars, every program executed (n<=3 exhaustive, 60-300 samples at n=4..6, named tables to n=10). Plain-rewrite audit 2026-10-28 (20 random tables per n, Random(1000n+s).getrandbits(1<<n), plus named tables): balanced area or/nand 40.1% / 55.6% / 81.8% at n=7 / 8 / 10, popcount>=2 29.7% / 40.8% / 72.0%, popcount>=3 6.3% / 24.0% / 54.2%; random 0.00% size and balanced; kept for the or/nand and threshold family"

[ablations.pair_packing]
kind = "archive"
saving = 17.7
arity = 12
verdict = "kept: from n=7 two entries share one painted cell when that is shorter (values 0-3 for (low, high); the last input is not read into the index but decoded by `[->4+<4[->5+<5[->4-<4]]]` onto dimension 4 or 5 and stepped onto by `d++++>`). Random tables (Random(1000n+s), 200 at n=8, 20 at n=7 / 9 / 10 / 11, 10 at n=12) 7.5% / 11.6% / 13.6% / 15.7% / 17.2% / 17.7% at n=7..12, rising toward the cap; 0 of 300 random tables lose from n=7 and 8 of 300 at n=6, which is why it starts at 7 (n=7 misses the bar, n=8 clears it). Balanced area 7.6% / 11.3% / 13.2% / 15.1% at n=7 / 8 / 9 / 10. Named: parity 4.8% / 7.4% / 9.4% / 10.7% / 11.9% and majority 1.1% / 4.8% / 3.9% / 6.7% / 7.3% at n=7 / 8 / 9 / 10 / 12, and/or/threshold 0-5% (they loop their runs; the plain build stays shorter on their looped runs). Every changed program executed through the interpreter: all rows of 200 random tables at n=8 and 20 at n=7 plus parity and majority, 0 wrong; a complemented-table program fails all rows"

[ablations.constant_table_audit_20261101]
kind = "archive"
arity = 8
saving = 81.5
seed = 0
tables = "both constants n=1..12; exhaustive all tables/rows n=1..3; six witnesses/all rows n=4..6"
verdict = "kept: fixed character literal after every input. Read into the origin, overwrite it with :0 or :1, print; no fresh plane or 48/49 increments are needed. L=n+3 chars, E=n+2 steps, W=6+bl(n+3)+bl(2n-1) written bits in the default. A literal cannot fit one column, so width=1 at n<=2 retains the one-column contract with clear/increment at the origin; all nonconstant layouts remain unchanged. n=7 zero/one 58/59 -> 10/10 chars (82.9% combined); n=8 59/60 -> 11/11 (81.5%), 58/59 -> 10/10 steps, 23 -> 14 written bits; n=12 63/64 -> 15/15 chars. Both evaluation arities exceed the declining-savings gate. n=3 corpus 33035 -> 32938 chars. Owned checks retain exact width floors and written-state bounds even with layout newlines. Each language passed 5656 paired old/new row executions; 270 nonconstant default programs through n=3 stay byte-identical. Both constants n=1..12 execute in default, width=1 and balanced layouts. Separate 1120-run native probes per language include every row through n=8. All 24 balanced scores per language match or improve; all 24 benchmark size/command pins across the batch remain unchanged. Owned regressions check reads before output, no EOF probe and a preserved following record, without adding collected cases."

