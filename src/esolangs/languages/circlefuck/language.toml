[ablations]
audited = "2026-10-19"

[ablations.constant_fold]
saving = 3118.8
arity = 12
verdict = "kept: canonical, exempt, and load-bearing. A constant table reads its inputs and prints the literal after the @, n + 4 chars. The strict removal has no buildable plain route: the general path indexes places[0] of an empty list when no input is essential. Priced against the nearest buildable route, constants as a two-entry lookup on input 0: +2,992.9% at n=10 and +3,118.8% at n=12 (14 to 433 and 16 to 515 chars)"

[ablations.projection]
saving = 72.8
arity = 12
verdict = "kept: canonical, exempt. The tape tail is the table read at the essential inputs only, and the base-128 index folds only those bits. Emitting the full table and folding every input instead costs +44.04% at n=10 and +72.76% at n=12 on one-ignored tables, +85.62 / +172.24% on two-ignored tables, and 0.00% on random tables"

[ablations.symmetric_count]
saving = 44.9
arity = 8
seed = "named symmetric tables"
tables = 7
verdict = "kept under the named-function rule: a table depending only on how many essential inputs are 1 adds each banked bit into one index digit and deletes that many of n + 1 entries, raced by length against the base-128 Horner index. Parity, majority, and, or, at-least-2 and exactly-1 all 6.0% at n=4, 13.5% at n=6, 21.5% at n=7, 44.9% at n=8, 65.6% at n=10, 85.2% at n=12; a symmetric table with an ignored input 19.9% at n=8. Random tables: 0 of 200 change at n=5..8. Exhaustive n<=3: 38 tables change, none grows, every changed program executed; named tables executed through n=10"

