[resource_evidence.execution]
expression = "(2n+13)T + 68n + 232 + 2U + min(1,max(0,3-n))*(26n-143)"
source_terms = { names = ["U"], provider = "esolangs.languages.circlefuck.proof_formulas:execution_terms" }
exact = true
arities = [1, 2, 3, 5]
first = 1
unit = "commands"
description = { growth = "linear", claim = "worst", template = "{claim} {formula} {unit} to n=7, with U the reader tally" }

[resource_evidence.workspace]
# On bit inputs each writable bank loses five bits before the index can grow.
expression = "B+bl(R-1)+bl(A)+bl(n)+1"
source_terms = { names = ["B", "R", "A"], provider = "esolangs.languages.circlefuck.proof_formulas:workspace_terms" }
exact = true
arities = [1, 2, 3, 5]
first = 1
unit = "bits"
description = { growth = "linear", claim = "worst", template = "{claim} {formula} {unit}. B is initial tape bits, R its extent and A the data origin" }

[resource_evidence.scaling]
# Each index cell after the first adds a deleter. The batch uses ceil(n/7) cells.
cases = [
    { through = 2, expression = "T+52n+10" },
    { expression = "T+34n+27+(⌈n/7⌉-1)(149(⌈n/7⌉-2)+4(n-7⌈n/7⌉+79))/2" },
]
exact = true
arities = [1, 2, 3, 5, 8, 9]
first = 1
unit = "characters"
description = { growth = "linear", claim = "worst", template = "{claim} {formula}: table, clamped reads, digit-cell walks" }

