[resource_evidence.workspace]
# Each input number and its one-letter name take 15 bits. The column
# reaches L-4, and both input cursors reach n. After 25 inputs, a0, a1,
# ... add their decimal digits to the names; each extra byte costs 8 bits.
expression = "15n+19+bl(L-4)+2bl(n)+8digits_sum(max(0,n-25))"
exact = true
arities = [1, 2, 3, 5]
first = 1
unit = "bits"
description = { growth = "poly n", claim = "worst", template = "{claim} {formula} {unit}" }

