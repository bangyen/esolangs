saving = 0.2671
arity = 8
seed = "random.Random(1847+n)"
tables = "20 random per n=3..12; and/or/parity/majority plus every threshold n=7..12; exhaustive n<=3"
verdict = "near miss, not shipped: fill only the interval from the first one through the last, then punch its internal zeros, competing with singles, run loops and whole-block fill. Random n=7/8: 24,762 -> 24,762 / 40,806 -> 40,697 chars (0.00% / 0.267%); n=12 0.462%. Majority n=8: 1,169 -> 1,135 (2.91%); every threshold n=7..12 stays below 10%, peaking at 7.34% (n=9, >=5), then majority falls to 2.78% at n=12. and/or/parity unchanged. All 256 n=3 programs byte-identical (78,262 chars). 10,162 baseline/candidate output checks correct, including every row through n=6 and three boundary rows through n=12; 342 complemented controls rejected. Positive control: the 64-row table 0^8 1^23 0 1^24 0^8 shrinks 597 -> 566 chars and both builds execute correctly. A further 5,888 VM runs count every row of all thresholds at n=7/8: no command savings, changed cases cost 11.0%-546.1% more commands. Prototype stays in ignored notes; generator, bounds and pins unchanged"

[ablations.constant_table_audit_20261101]
arity = 8
saving = 20.8
seed = "both constant values; witnesses(n) at n=4..6"
tables = "every table and row n=1..3; six witnesses per n=4..6; constants n=1..12"
verdict = "kept: canonical whole constants; these are historical 2026-11-01 measurements before trailing_value_drop. A Char scratch receives all n reads, then charPut prints the literal and the function returns zero; no array or index registers. Existing literal conversion, token wrapping and balancing also serve this path. At n=7 both bits 201 -> 157 chars; n=8 212 -> 168; n=12 259 -> 215. Exactly n+3 commands; default written workspace 159+bl(n+2)+2bl(n), measured 171 bits at n=8. All 24 old balanced scores improve or match. n=3 corpus 78262 -> 78174 chars, commands remain 48216. Generic envelopes and all eight benchmark pins unchanged. Each language passed 5656 paired before/after row executions; all 270 nonconstant programs through n=3 are byte-identical. Both constants n=1..12 execute in default, width=1 and balanced layouts within their resource bounds. Owned regressions require all reads before output and retain a following record; both Packlang literal policies execute."


[ablations.input_polarity_relabel]
arity = 8
saving = 1.6533385664524336
seed = "random.Random(1847+n), sequential choice('01')"
tables = "20 fixed random each n=7,8; and/or/parity/majority and every threshold n=7..10; exhaustive tables/rows n<=3; five random n=4..6"
verdict = "rejected: raw greedy input-mask race is search and O(T log T) construction, not an admissible named rule. Scratch-only actual emit-and-execute audit against canonical trailing-value removal: 24722->24309 / 40766->40092 characters (1.6706/1.6533%), far below the fixed-window size bar; no 200-table escalation needed. Parity/majority unchanged; every named threshold remains below 2.3% through n=10. Positive AND7 relabelling shrinks 569->568 and passes every row; restoring the original input test while retaining relabelled paint fails. All small and sampled programs preserve output, input order and sentinel. No production mask, search, remapping path or state added."

[ablations.split_index_offset]
arity = 8
saving = 0.9910219300397372
seed = "random.Random(1847+n), sequential choice('01'); parity timing rows random.Random(99)"
tables = "same fixed 20 n=7,8; same named n=7..10; small and sampled native controls; one whole-table generic pilot each n=7,8; twelve parity rows n=10..13, median three runs"
verdict = "rejected unbounded: XOR q^5 is not an additive offset and offers no shorter absolute write. Valid cap6 refinement emits 25001/40394 characters versus canonical 24722/40766 (-1.1285/+0.9125%); adding it to the old source race gains only 0.1658/0.9910%. Positive table13 at n=7 shrinks 1276->1260 and all 128 rows run. Command-only lead is real: whole-table pilot sums 68672->35136 /178560->87808, with lower native wall time. A coarse cap6 ceiling 7B+629-n, B=2^(n-6), improves the old fixed7/8 ceilings by more than 25%, but cannot justify an unbounded keeper: native parity n=12 source 6421->16517 and twelve-row median wall .0561->.0880s; n=13 commands 7603->7778 and wall .1047->.1995s. AND8 row128 rises 27->31 commands (not itself a whole-table rejection). No 44-second broad all-row sweep launched after this slowdown. A bounded rule remains future work: an analytical generic crossover is unproved; a global cap 10 inferred only from parity 11 would be arbitrary. It is not admitted, and no new block candidate, cutoff, registers or fallback ships."

[ablations.trailing_value_drop]
arity = 8
saving = 0.09802480027446944
seed = "same fixed random corpus; exhaustive n<=3; both literal policies and constant values n=1..12"
tables = "276 small tables, all rows for old/canonical/polarity/cap6; five random n=4..6 and 20 each n=7,8 sampled; constants default/width1/balanced"
verdict = "kept: CONTRIBUTING minimal-spelling exemption explicitly includes a trailing no-op. Remove the final 0; from both painted and constant main bodies. No other generated statement sets the implicit result, so it remains zero; main has no caller, output and ordered reads are unchanged. No new path/state; one obsolete VALUE command removed. Default n3 78174->77662 characters and 48216->46168 commands, maximum 38->37; each row is exactly one command shorter. Fixed20 n7/n8 24762->24722 /40806->40766 characters (0.1615/0.0980%), tending to zero; percentage admission is not used. Constants now n+2 commands and default W=159+bl(n+1)+2bl(n); generic E envelopes subtract one, generic W in actual L is unchanged, source ceiling subtracts two. All original False flags and E 3/7, W 3/5, source 3..10 rungs retained. Eight size pins use last-row commands, all by-row entries refreshed; Size anchors and the packaged balanced AND2 example regenerated."

