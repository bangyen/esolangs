[ablations.essential_projection]
saving = 40.1
arity = 12
verdict = "kept: canonical, exempt. The table is painted over its essential inputs only; an ignored input is read and dropped in the counters. One ignored input saves 36.8% at n=10 and 40.1% at n=12, two ignored inputs 50.7% / 55.9%"

[ablations.block_aliasing]
saving = 72.8
arity = 12
verdict = "kept: canonical sharing, exempt. A block equal to an earlier one is remapped onto it instead of repainted. On tables whose 128-row blocks take two distinct values (chosen by block-index parity, so every input stays essential): 37.2% at n=9, 61.1% at n=10, 72.8% at n=12 and rising — the comment's -38.5% / -62.0% at n=9/10 reproduces. On periodic tilings it prices about 0%: those tables project first and the repeats leave with the dropped inputs"

[ablations.smaller_block_offers]
saving = 23.2
arity = 10
verdict = "kept: the block race is offered each smaller block size whose level repeats, which is what lets the aliasing above reach repeats below the top block size. On blocks built from two identical halves: 31.9% at n=9 and 23.2% at n=10, then 0.0% at n=12, where top-level aliasing absorbs the same repeats and the race ignores the offers. The offers never cost anything (the race takes the minimum), so the canonical exemption stands; the fall at n=12 is absorption by the sibling route, not a shrinking win. The comment's tiled figures (-16..-18% at n=7, -22..-35% at n=8, 12 seeded tables) were not reproduced: periodic tilings project below the size range where offers exist, and the construction is unstated"

[ablations.fill_punch]
saving = 55.1
arity = 10
verdict = "kept: a block with more ones than zeros past the fill cost is filled by one loop and its zeros punched out. On random tables 2.4% at n=8, 2.9% at n=10, 3.2% at n=12 (the comment's +2.4% drop cost at n=8 reproduces exactly); on dense tables 40.4% at n=8 with 80% ones and 55.1% at n=10 with 90% ones. The comment's +66% / +125% for the dense classes are growth over the shipped size: measured 67.8% / 122.8%, so they reproduce under their own convention. Re-priced 2026-10-28 (random + named bar), chars, deleting the branch beside the run loops: random 3.00% / 3.30% / 2.08% / 2.64% / 3.41% / 2.92% at n=7..12 (20 tables); named at n=7..12: threshold >= n//3 17.1% / 15.1% / 13.6% / 17.5% / 14.2% / 9.8%, majority 2.0% / 4.4% / 8.0% / 6.1% / 9.6% / 6.0%, or 1.6% to 0.4%, and and parity 0.00%. Other thresholds: >= 2 15.1% at n=8, >= 3 17.5% at n=10 and 11.1% at n=12, >= 4 17.3% and >= 7 15.0% at n=14, so some threshold clears 10% at every arity measured: kept as a rule for the threshold family, not for random tables"

[ablations.run_loops]
saving = 27.3
arity = 12
verdict = "kept: the race also builds each block from one loop per run of ones. On random tables 1.2-1.6% (the comment says 0%); on threshold tables — one long run of ones per block, every input essential — 16.5% at n=9, 24.3% at n=10, 27.3% at n=12 and rising. The comment's -19.9% / -32.7% / -35.8% at n=7/8/9 on constant-leaf tables measures 6.4% / 4.8% / 16.5% on the threshold reconstruction: the construction is unstated and the small-arity figures do not reproduce, but the mechanism clears the bar at the verdict arities"

[ablations.complement_paint]
saving = 29.2
arity = 10
verdict = "kept: the race also paints the complement table and prints 49 ^ t, keeping the shorter (one input setter pair either way). or: 12.2% at n=8 (751 -> 659), 29.2% at n=10 (1,124 -> 796); threshold >= 2 20.8% at n=10 (1,196 -> 947); random 2.6% / 2.1% at n=7/8. An earlier 5-input race gained only 2.5-2.7% and was dropped; the dense classes were what it missed. Execution bound is now at most, not worst: exhaustive max steps 38 at n=3, 131 at n=4 against 69 and 144"

[ablations.refold_body]
saving = 51.2
arity = 10
verdict = "kept: balanced area on seed 4242 (20 random plus parity/and/or/majority/nor an n; 9 at n=11/12) falls 11.2% at n=5, 19.6% at n=6, 3.3% at n=8, 29.1% at n=9, 51.2% at n=10, 50.9% at n=11, 59.7% at n=12; no table grows at n=1..12. The default folds statements at 72 columns and a balance fit can only narrow a line, so rows grew with T (74x105 at n=10); the body is now cut after ; { } and repacked at the balanced width. Default byte-identical; balanced programs n<=8 all executed, 4 at n=9..10, complement control 0 matches"

[ablations.block_cap]
saving = 2.9
arity = 10
verdict = "kept: _BLOCK = 7 caps the painted block at 128 rows, which is termination machinery (a 512-row array did not terminate in 30 s; the Char index wraps). The value is flat as the comment claims: block sizes 5/6/8 against 7 on random tables at n=10 measure +1.2% / -1.2% / +3.0% (claimed +1.2% / -1.2% / +2.7%). Six would win random by 1.2% but loses 14.9% on 90%-dense tables at n=10; eight is the reverse, so seven is a measured compromise, not a leftover"

