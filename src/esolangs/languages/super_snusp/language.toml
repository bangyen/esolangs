[ablations]
audited = "2026-10-19"

[ablations.input_projection]
saving = 42.7
arity = 12
verdict = "kept: canonical, exempt. Ignored inputs are dropped by input_weights and the decimal literal is built over the essential inputs only; an ignored input is read into cell 1 and left for the next read or the literal's first digit to overwrite. 0.00% on random tables at n=8/10/12; with one ignored input 21.6% at n=8 rising to 32.7% at n=10 and 42.7% at n=12, with two ignored 35.4% / 50.5% / 64.5%, and on constant tables 73.6% / 75.5% / 76.8% (10 tables each, seed 1)"

[ablations.two_input_short_forms]
saving = 19.7
arity = 2
verdict = "kept: five fixed short forms at n=2 reuse 48 to decode each input and encode the answer, keeping the literal at the bottom of the stack. Over all 16 two-input tables they save 19.7% (668 against 832 chars), and 72 against 236 chars on the five tables themselves; both recorded figures reproduce exactly. The forms fire only at n=2 and cost nothing at any other arity"

[ablations.plain_build]
saving = 42.7
arity = 12
verdict = "recorded: the plain build is the projection removed plus the lookup at n=2 (42.7% at n=12 on the one-ignored corpus, 0.00% on random tables). The decimal literal itself -- the table as its binary integer written in base ten, 0.30103 digits an entry -- is the construction; the folded and vertical layouts are width paths chosen by the balance hook, not the default sized path, and a fold cannot split the digit run, so a literal wider than the fold is laid out whole"

[ablations.decimal_literal]
saving = 63.6
arity = 9
seed = "random.Random(1)"
tables = 40
verdict = "kept: the table is written as one decimal integer in cell 1 (a digit run is cell * 10 + digit) instead of one * per entry plus one ) per rarer entry. Total chars against the former build: random 44.0% n=7, 54.7% n=8, 63.6% n=9 (20 tables); parity 44.4 / 55.2 / 64.0%, majority 45.8 / 53.0 / 64.9%, and 32.0 / 42.0 / 51.0%, or 45.4 / 59.6 / 72.7%, threshold-2 40.2 / 51.7 / 62.2%; balanced area random 35.8% n=7, 33.6% n=8, 37.9% n=9, parity 34.9 / 33.6 / 38.3%, and 21.2 / 15.1 / 17.9%, or 42.3 / 57.0 / 69.6%. A rule, not a race: the literal is int(reversed table, 2) in base ten. Executed through esolangs.run: all 276 tables at n<=3, random tables n=4..7 on the flat, balanced and folded layouts, named functions at n=7..9, random tables at n=10/12/14 (n=14 is past str's 4,300-digit limit); a wrong-table control fails"

[ablations.polarity_rule]
saving = 59.2
arity = 10
seed = "random.Random(1)"
tables = 20
verdict = "kept as a rule (not a race): write the integer or its complement, whichever has fewer digits, encoding with 49 ^ bit for the complement against 48 + bit. Random tables fail the bar (chars 0.7% n=3, 0.1% n=8..10 over 20-40 tables; balanced area 0.1-0.3%), but the rule clears it on named functions: or 30.7% chars, 50.0% area at n=8 and 59.2% / 74.1% at n=10; threshold-2 15.5% / 28.2% n=8, 29.6% / 32.7% n=10; majority 2.0% / 6.2% n=8; parity, and, nand, nor and the complement of majority 0.00%. Never larger; no race, one count. Plain-rewrite audit 2026-10-29: no other bespoke trick (input_projection, two_input_short_forms recorded above; folds are balance layouts); n<=3 exhaustive and n<=7 random and named tables executed on both builds (340 tables), control fails"

[audits]
