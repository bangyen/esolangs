[ablations.constant_table_audit_20261101]
arity = 8
saving = 73.9
seed = 0
tables = "both constants, n=1..12"
verdict = "kept: canonical constant folding, exempt. Native constants read n bytes into one cell, then overwrite it with 48/49 and print. Default area and commands n+4: n=7 43->11 cells (74.4%), n=8 46->12 (73.9%), n=12 58->16; n=8 workspace 35->17 bits. Removed the superseded n=2 zero short form. n=3 corpus area 19712->19664. Executed 5656 paired old/new row runs; 270 nonconstant n<=3 sources identical. Default, width=1 and balanced constants execute through n=12; all 24 balanced scores match or improve. All eight benchmark size/command pins unchanged; global resource caps unchanged. Owned read-first checks cover both constant answers and following-record preservation (whole-stream loading for Codesick)."

[ablations.stacked_two_horner]
arity = 8
saving = 34.83
seed = "random.Random(1847+n), successive getrandbits(1<<n)"
tables = "200 per fixed n=7/8; all tables/rows through3; named/ignored/layout controls4..16"
verdict = "kept by the 20% declining source gate: fixed 200 n=7/8 old38474/49954 ->23274/32554 chars (39.51/34.83%). Push 2 once and reset cell0 with a new digit0; each essential *>,%{<+$ doubles the row, maps ASCII48/49 mod 2 to0/1, pushes/adds/pops that bit and preserves2. Ignored >,< reads leave it intact. Remove the later duplicate2 push; the row/table tail and chunk writer balance their temporary values above the persistent2. Exact standalone lookup D+8m+3(n-m)+22 vs old D+19m+3(n-m)+21, so every changed table saves 11m-1 chars; constants and four fixed two-input forms stay unchanged. Full-input generic curve peaks aroundn5 and falls through16 toward0, with actual emitted old/new programs and native endpoints. No favorable cap, source race, search or wider literal. Balanced area51986/77672 ->35652/57940; all layouts and ignored-input controls execute correctly."

[ablations.deferred_ascii_offset]
arity = 8
saving = 0.0
seed = "random.Random(1847+n), successive getrandbits(1<<n)"
tables = "200 per fixed n=7/8; all tables/rows through3; named/ignored/layout controls4..16"
verdict = "rejected as alternative to the independently admitted persistent2/modulo rule: fixed 200 n=7/8 chars23674/32954,400 more than23274/32554 at each arity (+2 per table). Raw ASCII Horner yields48(2^m-1)+row; subtracting that exact K once is correct, including projected m1/2, but its decimal constant outweighs one saved opcode/input at the fixed window. Standalone vs old it would save38.47/34.03%, but it replaces the same reader and is worse than the stronger admitted baseline. No second reader or favorable later window ships. All small variant rows execute; wider temporary integers are included in diagnostics."

[ablations.stacked_ascii_zero]
arity = 3
saving = 6.35
seed = "random.Random(1847+n), successive getrandbits(1<<n)"
tables = "200 per fixed n=7/8; all tables/rows through3; named/ignored/layout controls4..16"
verdict = "kept independently by the 5% default execution gate after stacked2: all 256 three-input tables/eight rows source 11998->11236,commands 95984->89888 (6.35%), zero larger tables/slower rows. Hoist ASCII48/49 beneath2, then after row-pop/mod 2/pop2 the encoder directly adds/XORs it. Exactly 3 fewer default lookup cells/commands; constants and short forms unchanged. Standalone against old source 19664->19156 and E 157312->153248 gives only 2.58%, rejected alone. No bundle is priced against the old padded baseline. Marginal source fixed7/8 23274/32554->22674/31954 (2.58/1.84%), below size admission; execution admission is the route used. Disclosed marginal balanced-area increase35652/57940->36070/59235 (1.17/2.24%); total balanced area still falls from old51986/77672. Written workspace rises 6 bits versus stacked2 at the same program-counter width (2 above old). Default lookup worst S=E=D+8n+19, actual D=digits(2^(T-1)); the old rounded logarithm is retained only as a docstring upper bound. Old source arities1/2/3/5 and E5/6 retained; E1/2/3 added. New exact flat W=T+2n+14+bl(L)+bl(n) from n=5 retains old5 and adds6: tape peak T+n+2, stack n+8, pointer2,digit/halt2,PC and input. Memory is one snapshot component; ASCII input temporaries do not coexist with the maximal table literal. Every protected stack ends with exactly the chosen48/49. Native 14600 variant/judge rows plus 8796 layout/extended rows and 864 written-state runs pass; Wmax5/6=66/100. Wrong encoder/radix mutants fail. Read-time checks require all n input characters before output and preserve following Q. All 8 pins/Size anchors/actual balanced example updated and executed; no new collected language cases."

