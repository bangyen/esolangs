[ablations.essential_projection]
saving = 49.9
arity = 11
verdict = "kept: canonical, exempt; the table is copied at its essential inputs and an ignored input's stage crosses no |, so position does not matter. 0.0% by area on random tables at n=9/10/11, 49.6% / 49.8% / 49.9% on tables ignoring one input (either end) at n=9/10/11, 74.4% / 74.7% / 74.8% ignoring two; seed set 2 identical at n=10/11"

[ablations.constant_fold]
saving = 100.0
arity = 11
verdict = "kept: canonical, exempt; a constant table is one literal row of 2n+3 chars instead of the copied-table walk. 99.996% by area on constant tables at n=11 (25 cells against 628,218 per program), 99.99% at n=9/10; 0.0% elsewhere, where the branch is never taken"

[ablations.blank_compaction]
saving = 0.0
arity = 11
verdict = "kept: the render drops wholly blank rows and columns, but the wide layout has none to drop: 0.0% by area on every default-path corpus at n=9/10/11. The narrow and folded layouts the default now also takes are rendered the same way; a folded copy wider than its table (c > Te) leaves blank columns only the render removes. Unpriced there"

[ablations.area_default]
saving = 91.0
arity = 10
seed = "random.Random(184700 + n)"
tables = 200
verdict = "kept: the default is the least by area of the wide strip, the narrow staircase and the folded strips balance builds (copy best or 17 best // 20, run 3 copy - 12 or T; one candidate list shared with balance), the strip on a tie; constants keep their direct build. No width sweep: n=10/12/14 build in 18/63/266 ms, linear. Total area over 200 random tables falls 48.1% at n=6, 67.7% at n=7, 79.4% at n=8 and 91.0% at n=10 (52.2% / 56.7% / 53.5% at n=3/4/5, where the staircase wins every table); every chosen program is executed, exhaustively through n=3 and sampled through n=7. Execution bound, derived by tracing the beam (a step is a cell visited; the render only deletes wholly blank rows and columns, so an uncompacted count bounds the run, and equals it when none is deleted). Te = 2^e entries at e essential inputs, w a stage's weight, the all-zero row worst (a 0 costs 2w + 31 or more, a 1 about 30 or 32). Narrow, N = Te entries (n + 1 when Te <= n): copy 9N + 1, climb and descent 4N + 6, stages 30 on a 1 and 2w + 31 on a 0 (35 below w = 2), tail 2n + 4; at most 13N + 2Te + 37n + 9 <= 15T + 37n + 9. Fold, S = ceil(Te/c) strips, k = ceil(w/run) rows: copy (S-1)(5c + 4) + 3c + 3 - r for the r entries of the last strip, climb and descent 4S + 4n - 1, stages 32 + max(0, 2k - 4) on a 1 and 2w + 37 + 4(k - 1) on a 0 (39 at k = 1), tail n + 2; so (S-1)(6c + 4) + 3c + 4S + Te + 42n + 2 + the stages' turn terms. With (S-1)c < Te, c >= 2, 3c <= 18n - 9 + 4T/3 (isqrt <= its radicand's root bound), and run >= 9 whenever a stage folds (c >= 7 from n = 2; at n = 1 w = 1 = run), that is below 13T + 62n. The strip keeps its 4T + 42n + 5. So 15T + 62n + 9 covers all three; measured worst steps 74, 137, 230, 383, 656, 785, 1206 at n=1..7 against the old strip bound 55, 105, 163, 237, 343, 513, 811. Workspace: program cells are 7N + Te + 32n + 4 narrow (copy 7N + 2n + 1, a stage 29 + w, tail n + 4) and at most 6.5Te + 31n + 2 folded, so <= 8T + 32n + 5 with the start marker; every rendered coordinate is below the nonblank rows or columns, so below that count; a pointer moves at most 2 cells a step from a start inside the grid, so a data coordinate is at most 8T + 32n + 5 + 2(15T + 62n + 9); marks are unchanged (T + 4n)"
