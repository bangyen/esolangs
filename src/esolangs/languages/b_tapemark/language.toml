[ablations.area_default]
kind = "archive"
saving = 91.0
arity = 10
seed = "random.Random(184700 + n)"
tables = 200
verdict = "kept (re-priced 2026-10-28: the narrow staircase and the T-run folds left the list, see their verdicts): the default is the least by area of the wide strip and the two folded strips balance builds (copy best or 17 best // 20, run 3 copy - 12; one candidate list shared with balance), the strip on a tie; constants keep their direct build. Without the folds on 20 seeded random tables: default area +159.6% / +384.7% at n=7/8, balanced area +652% / +2,005%; named tables +160% to +2,001% default and +652% to +99,432% balanced at n=7..12. No width sweep: n=10/12/14 build in 18/63/266 ms, linear. Total area over 200 random tables falls 48.1% at n=6, 67.7% at n=7, 79.4% at n=8 and 91.0% at n=10 (52.2% / 56.7% / 53.5% at n=3/4/5, where the staircase wins every table); every chosen program is executed, exhaustively through n=3 and sampled through n=7. Execution bound, derived by tracing the beam (a step is a cell visited; the render only deletes wholly blank rows and columns, so an uncompacted count bounds the run, and equals it when none is deleted). Te = 2^e entries at e essential inputs, w a stage's weight, the all-zero row worst (a 0 costs 2w + 31 or more, a 1 about 30 or 32). Narrow, N = Te entries (n + 1 when Te <= n): copy 9N + 1, climb and descent 4N + 6, stages 30 on a 1 and 2w + 31 on a 0 (35 below w = 2), tail 2n + 4; at most 13N + 2Te + 37n + 9 <= 15T + 37n + 9. Fold, S = ceil(Te/c) strips, k = ceil(w/run) rows: copy (S-1)(5c + 4) + 3c + 3 - r for the r entries of the last strip, climb and descent 4S + 4n - 1, stages 32 + max(0, 2k - 4) on a 1 and 2w + 37 + 4(k - 1) on a 0 (39 at k = 1), tail n + 2; so (S-1)(6c + 4) + 3c + 4S + Te + 42n + 2 + the stages' turn terms. With (S-1)c < Te, c >= 2, 3c <= 18n - 9 + 4T/3 (isqrt <= its radicand's root bound), and run >= 9 whenever a stage folds (c >= 7 from n = 2; at n = 1 w = 1 = run), that is below 13T + 62n. The strip keeps its 4T + 42n + 5. So 15T + 62n + 9 covers all three; measured worst steps 74, 137, 230, 383, 656, 785, 1206 at n=1..7 against the old strip bound 55, 105, 163, 237, 343, 513, 811."

