# Language-owned data, one section per dataset; aggregators read
# only their own section and skip this file when it is absent.

[deep_arities]
execution = 7
workspace = 7

[curation]
backlinks = 2

[proof_status]
labels = ["finite lookup"]
qualification = "the blank grid is the table, one mark per row copied by `*`; a stage per input walks the mark pointer by that input's weight and `+` prints the mark it lands on"
scaling = "linear: 3T copy cells, T pointer steps, one stage per input"
execution = "linear: at most 15T + 33n + 11 steps: the narrow staircase, the largest layout"
workspace = "T log T: at most P + W(8+2c) + 4c + bl(n) + 5 bits: program cells, written data marks"
definitions = ["P = Σ over the program's cells of 8 + max(1,bl(x)) + max(1,bl(y))", "W = the program's * and - cells", "c = 1 + bl(max(w, h) + 15T + 33n + 11), w and h the program's width and height"]

