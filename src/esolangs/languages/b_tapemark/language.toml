# Language-owned data, one section per dataset; aggregators read
# only their own section and skip this file when it is absent.

[deep_arities]
execution = 7
workspace = 7

[curation]
backlinks = 2

[proof_status]
labels = ["finite lookup"]
qualification = "the blank grid is the table, one mark per row copied by `*`; a stage per input walks the mark pointer by that input's weight and `+` prints the mark it lands on"
scaling = "linear: worst A cells past n = 1: the least-area of three layouts"
execution = "linear: worst E steps: the all-zero row of the least-area layout"
workspace = "T log T: worst W bits to n = 8, at most B after: program cells, marks, pointers"
definitions = ["B = 8 + coordinate bits per program cell, plus a widest-coordinate mark per * or - cell"]

