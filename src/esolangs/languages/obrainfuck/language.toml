[resource_evidence.execution]
# Layout 2(T - 1), one step onto the block, 52 per one-bit read plus its
# 2^(n-1-i) moves (T - 1 in all), T back and 49 to print: the all-ones row
# of a table with T - 1 ones.
expression = "4T + 52n + 47"
exact = true
arities = [1, 2, 3, 6]
first = 1
unit = "commands"
description = { growth = "linear", claim = "worst", template = "{claim} {formula} {unit}: all-ones row, one zero in the table" }

[resource_evidence.workspace]
# 2T one-bit cells, one widened to an ASCII byte; the head reaches 2T - 1.
# A constant holds two ASCII bytes at the head's first two cells.
expression = "max(2T + n + 6, 13) + bl(L) + bl(n)"
exact = false
arities = [1, 2, 3, 6]
first = 1
unit = "bits"
description = { growth = "linear", claim = "at most", template = "{claim} {formula} {unit}" }

[resource_evidence.scaling]
# 3T + ones + 52n + 48 with ones <= T - 1; constants n + 50 + b.
expression = "4T + 52n + 47"
exact = false
arities = [1, 2, 3, 4, 5, 6, 7, 8]
first = 1
unit = "characters"
description = { growth = "linear", claim = "at most", template = "{claim} {formula} {unit}" }

