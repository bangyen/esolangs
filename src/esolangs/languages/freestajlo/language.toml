[ablations]
audited = "2026-10-21"

[ablations.essential_projection]
saving = 49.5
arity = 12
seed = "random.Random(184700 + n)"
tables = 200
verdict = "kept: canonical, exempt; the literal holds the table read at the essential inputs and an ignored input is read and dropped (;#): 45.0% with one ignored input at n=8 rising to 49.5% at n=12, 93.4-99.3% on constants, 0.0% where every input is essential. Plain-rewrite audit: no bespoke tricks"

[ablations.constant_read]
saving = 99.3
arity = 12
seed = "random.Random(184700 + n)"
tables = 200
verdict = "kept: canonical constant fold, exempt; a constant pushes 'c, drops every input and prints with no index, against the full literal indexed by every input: 93.4% at n=8, 97.8% at n=10, 99.3% at n=12; fires only on the two constant tables"

[ablations.packed_literal]
saving = 81.9
arity = 12
seed = "random.Random(184700 + n)"
tables = 200
verdict = "kept: six entries a printable character (codes 35-98, skipping the closing quote and DEL), raced by length against the plain literal: 15.1% on random tables at n=5, 56.1% at n=7, 67.5% at n=8, 78.4% at n=10, 81.9% at n=12, tending to 5/6; parity, majority and and at n=8 289 to 94 chars. Never fires through n=4 (exhaustive, no table changes); every random table at n=5..8 executed, 20 at n=9..10, 3 at n=12"
