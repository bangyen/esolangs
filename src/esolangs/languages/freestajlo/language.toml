# Language-owned data, one section per dataset; aggregators read
# only their own section and skip this file when it is absent.

[curation]
backlinks = 1

[proof_status]
labels = ["linear lookup"]
qualification = "the table is one `\"` literal, row 0 on top, and Horner's rule over the essential inputs gives the depth `&` copies; past the crossover the literal packs six entries a character and the row splits into that depth and a bit"
scaling = "linear: a T- or T/6-character literal, four characters an input"
execution = "poly n: at most 4n + 17 commands: the literal, the reads and folds, the decode and print"
workspace = "linear: at most 6T + 4n + 12 bits: the literal's codes on the stack"

[catalogue]
folding_constant_local = "freestajlo"  # one projected table entry, no index

