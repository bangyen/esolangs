construction = "esolangs.languages.freestajlo.generator:freestajlo_request"
witnesses = "esolangs.languages.freestajlo.tests.resource_witnesses:resource_tables"

[resource_evidence.execution]
# 4n plain to n = 4; the packed literal's decode adds 17 from n = 5.
cases = [
    { through = 4, expression = "4n" },
    { expression = "4n + 17" },
]
exact = true
arities = [1, 2, 3, 4, 5, 6, 7]
first = 1
unit = "commands"
description = { growth = "poly n", claim = "worst", template = "{claim} {formula}; includes decode" }

[resource_evidence.workspace]
# The plain literal keeps at most 16 entries. The packed literal
# uses seven bits per full six-entry word, then a length and transient.
cases = [
    { through = 4, expression = "6T+7+bl(T+2)+bl(4n)+bl(2n)" },
    { expression = "bl(2n)+max(108+bl(2n+8),7+7⌊T/6⌋+bl(⌈T/6⌉+4)+max(16,2n+3)+bl(4n+18))" },
]
exact = true
arities = [1, 2, 3, 4, 5, 6, 7]
first = 1
unit = "bits"
description = { growth = "linear", claim = "worst", template = "{claim} {formula}: literal stack" }

[resource_evidence.scaling]
expression = "min(T + 4n + 1, ⌈T/6⌉ + 4n + 19)"
exact = true
arities = [1, 2, 3, 6]
first = 1
unit = "characters"
description = { growth = "linear", claim = "worst", template = "{claim} {formula} {unit}" }

