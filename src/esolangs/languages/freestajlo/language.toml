# Language-owned data, one section per dataset; aggregators read
# only their own section and skip this file when it is absent.

[curation]
backlinks = 1

[proof_status]
labels = ["linear lookup"]
qualification = "the table is one `\"` literal, row 0 on top, and Horner's rule over the essential inputs gives the depth `&` copies"
scaling = "linear: T-character literal, at most four characters an input"
execution = "poly n: worst 4n commands: the literal, the reads and folds, the pick and the print"
workspace = "linear: at most 6T + 4n + 12 bits: the literal's codes on the stack"

[catalogue]
folding_constant_local = "freestajlo"  # one projected table entry, no index

