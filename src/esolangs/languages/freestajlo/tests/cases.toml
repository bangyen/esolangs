language = "Freestajlo"
oldid = 184252

[[examples]]
id = "hello"
source = '"Hello, World!"@{.}'
expected = "Hello, World!"

[[examples]]
id = "truth-machine-0"
source = ";@{$:}:"
stdin = "0"
expected = "0"

[[examples]]
id = "truth-machine-1"
note = "prints 1 forever"
source = ";@{$:}:"
stdin = "1"
stop = "steps"
max_steps = 30
expected = "11111"

[[spec_triggers]]
program = "1 0/"
stdin = ""
expect = "HaltError"
claim = "dividing by zero is a HaltError"

[[spec_triggers]]
program = "1 0%"
stdin = ""
expect = "HaltError"
claim = "% by zero is a HaltError"

[[spec_triggers]]
program = "1 1&"
stdin = ""
expect = "HaltError"
claim = "& past the bottom is a HaltError"

[[spec_triggers]]
program = "1 1_&"
stdin = ""
expect = "HaltError"
claim = "& at a negative depth is a HaltError"

[[spec_triggers]]
program = "1 2~"
stdin = ""
expect = "HaltError"
claim = "~ past the bottom is a HaltError"

[[spec_triggers]]
program = "f"
stdin = ""
expect = "HaltError"
claim = "running an undefined function is a HaltError"

[[spec_triggers]]
program = "55296."
stdin = ""
expect = "HaltError"
claim = "printing a surrogate is a HaltError"

[[spec_triggers]]
program = '"abc'
stdin = ""
expect = "ProgramError"
claim = "an unterminated string is a ProgramError"

[[spec_triggers]]
program = "[abc"
stdin = ""
expect = "ProgramError"
claim = "an unterminated comment is a ProgramError"

[[spec_triggers]]
program = "@{1"
stdin = ""
expect = "ProgramError"
claim = "an unterminated block is a ProgramError"

[[spec_triggers]]
program = "'"
stdin = ""
expect = "ProgramError"
claim = "a ' at the end of the source is a ProgramError"

[[spec_triggers]]
program = "1?2"
stdin = ""
expect = "ProgramError"
claim = "? without a block is a ProgramError"

[[spec_triggers]]
program = "{1}"
stdin = ""
expect = "ProgramError"
claim = "a block with no ?, @ or letter before it is a ProgramError"

[[spec_triggers]]
program = "1}"
stdin = ""
expect = "ProgramError"
claim = "an unmatched } is a ProgramError"

[[spec_triggers]]
program = "1 2 ]"
stdin = ""
expect = "ProgramError"
claim = "a character that is no command is a ProgramError"

[[spec_triggers]]
program = ",:"
stdin = ""
expect = "output"
output = "-1"
claim = ", at EOF pushes -1"

[[spec_triggers]]
program = ";:"
stdin = ""
expect = "output"
output = "0"
claim = "; at EOF pushes 0"

[[spec_triggers]]
program = ";:;:"
stdin = "ab-12c7"
expect = "output"
output = "-127"
claim = "; skips to the next integer and consumes the character ending it"

[[spec_triggers]]
program = "0?{1:}{2:} 1 2 [c] ?{3:}"
stdin = ""
expect = "output"
output = "23"
claim = "an else block may follow after whitespace or a comment, and ? pops"

[[spec_triggers]]
program = "7 3<: 3 7>:"
stdin = ""
expect = "output"
output = "-1-1"
claim = "< is true when the deeper value is the greater"
