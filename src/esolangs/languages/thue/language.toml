[ablations.queued_projection]
saving = 48.4
arity = 10
verdict = "kept: canonical projection, exempt; when an input is ignored the table is laid out at its essential inputs and a queue of K/S rounds (K halves, S reads and deletes) runs one round per input, raced against the plain layout by length. 0.0% on random tables (the layout is never offered and the plain layout is exactly T + 187 chars whatever the table). Re-measured 2026-10-30 against the packed lookup (seed 5 tiled tables): 10.8% / 21.1% with one / two inputs of 8 ignored, 31.0% / 48.4% of 10; the S round reads through M (no J rule), a no-input table keeps only its print and read rules (49 chars at n=1), 46.1% / 80.0% earlier on 16-row tiled tables at n=8/10 before packing; priced by race marginal"

[ablations.constant_half_fold]
saving = 20.4
arity = 10
verdict = "kept: a constant half of the table is stored once, with nine extra rules of about 110 chars restoring it, raced against the unfolded layouts by length; priced by race marginal. Re-measured 2026-10-30 against the packed lookup, which composes with it: 4.8% on constant-half tables at n=9, 20.4% at n=10 and 40.3% at n=12 (and/or 456 vs 479, 585 vs 735, 1,355 vs 2,271 chars); before packing 19.3% / 32.2% at n=9 / 10. The module docstring's balanced figures (-24% / -35%) do not reproduce: the unfolded chunked layout wins every balanced constant-half table (0.0%)"

[ablations.pair_packing]
saving = 20.8
arity = 8
verdict = "kept 2026-10-30 (random + named bar): each entry pair is one symbol of c/d/e/f and R, starting at the right end, expands it on its way left, so four rules (36 chars) replace half the table, in every layout (plain, queued, folded, shared). On 100 seeded random tables (random.Random(1847 + n)) chars fall 8.9% at n=7 (31,500 -> 28,700) and 20.8% at n=8 (44,300 -> 35,100), 15.8% over both; named parity / majority / threshold-3 8.9% / 20.8%, and / or 8.9% / 19.3% at n=7 / 8; n=7 is under the 10% bar alone, the 36-char rule block being fixed. Balanced area 0.0% on 30 random tables and the five named functions at n=7 and n=8 (the chunked layout's 27 rules push its side to 60 against 58). Executed: every row of the five named functions and 15 random tables at n=7 and n=8, balanced and not, plus width-limited builds, compute their tables; the wrong-table control fails on all 128 rows"

