[ablations.constant_table_audit_20261101]
arity = 8
saving = 23.2
seed = 0
tables = "both constants n=1..12; exhaustive all tables/rows n=1..3; six witnesses/all rows n=4..6"
verdict = "kept: constant queue with four deterministic rules. SR reads a line directly; 0/1 restore R, and LR prints only after every S has gone. Default L=n+35 chars, E=2n+1 rewrites and W=8(n+2)+bl(2n) written bits. Width-limited queues expand one unique named chunk at a time before R appears; this avoids the old narrow path selecting a full-table lookup. The slow verifier was stopped and diagnosed, then completed below one second after this fix. Widths below eight retain the existing seven-column small-tree option through n=3. Owned checks assert one match at every state and every read before output, including two-character expansion names at n=50. n=7 55 -> 42 chars (23.6%); n=8 56 -> 43 (23.2%), 25 -> 17 rewrites, 101 -> 85 written bits; n=12 60 -> 47 chars. Both evaluation arities exceed the declining gate. n=3 corpus 49632 -> 49606 chars. Each language passed 5656 paired old/new row executions; 270 nonconstant defaults through n=3 stay byte-identical. Both constants n=1..12 execute default, width=1 and balanced. Separate 1120-run native probes per language include every row through n=8. All 24 balanced scores per language match or improve, with 72 old balanced row executions per language as controls; all 24 benchmark size/command pins across the batch stay unchanged. No new collected cases."

[ablations.round_queue_direct_read]
arity = 8
saving = 11.681
seed = 1854
tables = "200 random.Random(1847+n) tables per n=7/8; exhaustive tables/rows n=1..3; ten random tables/all rows n=4..6"
verdict = "rejected: plain KR direct reads save 14.634% / 11.681% at n=7/8 (57,400 -> 49,000 / 70,200 -> 62,000 chars), below the 20% declining bar. The fixed saving tends to zero; retaining the old same-class candidate cannot repair admission. Native paired execution covers 3,240 rows through n=6; three random tables/all rows at each judged arity also execute with one rewrite match per state, exactly n reads and a wrong-table control. The n=3 source total falls 49,606 -> 38,144, but rewrites rise 46,848 -> 59,392; no execution admission. No production change."

[ablations.queue_direct_read_all_layouts]
arity = 8
saving = 0.0
seed = 1854
tables = "raw folded singleton state LKRaE; plain direct-reader corpus recorded above"
verdict = "rejected: raw KR::=::: overlaps the retained KRaE::=MRaE fold rule in LKRaE; native matching finds two choices. This violates deterministic generated rewrites. Unfolded queued-only savings cannot justify adding the invalid folded construction; the plain reader itself fails the declining bar. No production change or claimed measured corpus saving."

[ablations.selective_quad_packing]
arity = 8
saving = 0.002849
seed = 1854
tables = "200 random.Random(1847+n) tables per n=7/8; repeated 1,024-row positive control"
verdict = "rejected: aligned quads replace pairs only when frequency exceeds their 11-character rule cost. n=7 saves 0% (57,400 unchanged), n=8 0.002849% (70,200 -> 70,198), far below either bar; zero / two rules fire. Native representative random rows and every generic firing execute with one match per state and exact input consumption. Repeated-table positive control fires two rules and shrinks the packed layout 735 -> 501 chars; all four boundary rows execute. Packing therefore works, but the judged corpus does not benefit. No production change."

