verdict = "kept: canonical constant folding and minimal spelling, exempt. Root constants stage every input on the active stack with the uniform one-character pair 0/backtick, then push and print the answer. Other templates retain their two/three-character pairs. Chars n+2, commands n+3 including frame completion: n=7 16->9 (43.8%), n=8 18->10 (44.4%), n=12 26->14. n=8 commands 19->11, written workspace 158->93 bits. n=3 corpus chars 13338->13332. Executed 1120 candidate runs and 5656 paired old/new row runs; 270 nonconstant n<=3 sources identical. Both constants execute default, width=1 and balanced layouts through n=12; all 24 balanced scores match or improve. All eight benchmark size/command records and global resource caps unchanged. Owned IO/template checks verify input use before output and preserve the following record."


[ablations.trick_prototype_20261102_discard_runs]
arity = 8
saving = 8.657682752390272
seed = "Random(9000+1000n+s).choice"
tables = 200
verdict = "rejected: raw quoted-pop repetition consumes its saved program string in the first nested call, then ! receives an integer and raises HaltError. Direct32-pop control and a full n7 lookup both fail. A valid repair parks the literal on the other stack and evaluates ~;...;~; ^! repeats preserve the parked copy, the last ! consumes it, and a final ~ returns to the table. Native direct runs1..256 from both active stacks preserve the other stack's sentinel. Even the scratch exact arithmetic minimum over block size/repetition count saves only3.5664%/8.6577% at7/8 (61686->59486,106264->97064), failing the fixed10% window. It is an optimistic pricing oracle, not a production search. Later9/10 savings14.2387%/18.7885% cannot move the window. No table grows in the judged corpus or exhaustive4 check. N3 unchanged13332chars/102944commands; nested eval does not improve execution.4040 valid native lookup rows, plus512 direct pop controls; literals wrap intact. No discard compression ships."

[ablations.trick_prototype_20261102_orientation_carry]
arity = 8
saving = 7.914251298652408
seed = "Random(9000+1000n+s).choice"
tables = 200
verdict = "kept by the execution gate: exhaustive three-input commands102944->71264 (30.7740%), with no table slower or larger; source13332->9012. This exceeds both the5% no-regression execution gate and25% command-reduction alternative. Generic7/8 source61686->54427 (11.7677%) and106264->97854 (7.9143%) declines below20%, so it is not admitted by size. Each halving moves its input once with ~=~?*, drops the restoring reversal, and stores table[Gray(i)] at physical i. Carried orientation makes the physical index the prefix XOR of essential inputs; Gray(i)=i^(i>>1) inverts it. One-stack tables get one Gray layout, dual tables one per half; ignored inputs retain their drains. There are no new eval frames, literal programs, setters or old-program min fallback. The dual saving against carried one-stack is R/2-one_runs-2n-1; since one_runs<=R/4, the guard becomes R>=8n+4, not the old8n-20. Keeping the old guard would emit65chars for parity at4 when the carried one-stack needs60. Source worst is2T+7n through5,7T/4+9n+1 from6, reached by full parity. Execution is at most one step per character plus frame completion, and all-one setters reach L+1. Workspace retains the original ceiling but honestly drops exactness for the new one-stack regimes.83280 final native rows include all200 judged tables/all rows and every small table/row, plus4..6 random all rows. Independent ablation reconstructs old/new bytes on736 tables. Undoing only Gray order gives1 instead of0 on table0001,row1. Exhaustive65536 four-input source checks grow no table. Native medians over twenty tables/all rows, three repeats: n7 .693824->.620137s (10.6% faster), n8 2.738011->2.548575s (6.9% faster). Generation medians over twenty tables, eleven repeats, n8/10/12: .001114/.004141/.015901 -> .001412/.005437/.021441s (+26.7/31.3/34.8%). The extra Gray pass remains O(T)."

[ablations.trick_prototype_20261102_upper_half_role]
arity = 8
saving = 0.3961830911691666
seed = "Random(9000+1000n+s).choice"
tables = 200
verdict = "rejected both variants. Swapping halves permits the four-character mirrored selector ;~?~, one shorter than ~;~?~. Always swapping grows47/74 of200 tables at7/8; choosing old/swapped by emitted length saves only0.6241%/0.3962%, declining far below20%. The prototype recognizes the new selector; existing eval_setters alone would wrongly return two-wide pairs. Complementing the upper half can be repaired with ?~~backtick before output: XOR the selected bit with the active stack index. It adds four characters; complemented one-run and zero-run counts differ by at most one, so it always grows by at least three characters when active. All200 judged tables grow; choosing old/complemented changes none. N3 corpus/commands unchanged. Each of the always/choice role variants and complemented/choice variants has4040 correct native rows. No swapped selector, marker detection, upper complement or extra candidate ships; these gains are not bundled with orientation carry."

[ablations.workspace_exactness_repair_20261103]
arity = 6
saving = 0.0
seed = 0
tables = "full-support parity at n=4,6, allrows; retained workspace formula corpus"
verdict = "proof-only repair: restore both old exact workspace rungs4/6. One-stack lookup peaks at R+n Boolean cells, dual at R+2n, R<=T; dual requires R>=8n+4 and is impossible when T<8n+4. Add the changed active-stack bit and one frame's8L+bl(L) peak. Full-support parity attains every term, with one stack at4 and dual at6, and also reaches the exact source maximum. Constants fit below. The old ceiling overcounted n bits in the new one-stack regime; dropping exactness at6 was unnecessary because the dual regime remains. Native parity attainers run all80 rows, preserving correct output; resource maxima507/1421. No generator path/state or emitted bytes change; this restores the original worst-case contract, not a per-program-policy exception."

