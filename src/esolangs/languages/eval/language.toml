[resource_evidence.workspace]
# Full parity attains the frame, Boolean stacks and active-stack bit.
# One-stack lookup peaks at R+n staged cells; dual at R+2n, R<=T.
# Dual requires R>=8n+4, so it cannot occur when T<8n+4.
# Constants need at most n+1 cells and never change the active stack.
# For positive n, T < 8n+4 through n=5 and T >= 8n+4 from n=6.
cases = [
    { through = 5, expression = "8L+T+n+1+bl(L)" },
    { expression = "8L+T+2n+1+bl(L)" },
]
exact = true
arities = [4, 6]
first = 4
unit = "bits"
description = { growth = "linear", claim = "worst", template = "{claim} {formula}, frame and staged Boolean cells" }

[resource_evidence.scaling]
# One-stack through five; the two-stack literal's maximum one-run count.
cases = [
    { through = 5, expression = "2T+7n" },
    { expression = "7T/4+9n+1" },
]
exact = true
arities = [4, 6]
first = 4
unit = "characters"
description = { growth = "linear", claim = "worst", template = "{claim} {formula}, unwrapped" }

