# Language-owned data, one section per dataset; aggregators read
# only their own section and skip this file when it is absent.

[curation]
backlinks = 0

[proof_status]
labels = ["linear lookup"]
qualification = "Horner's rule reads each bit with `??` and doubles by `*`; `[b>` holds exactly when the row is below change point `b`, so writes run from the last change point down and each row keeps the nearest one above it; past 15 inputs `???` puts the high bits in the index slot's string, and a guard per `2^15`-row block reloads the index"
scaling = "linear: worst S characters: a change point costs 7 and its row's digits"
execution = "linear: worst E commands: alternating answers, every conditional true, the first row"
workspace = "poly n: worst 256 + k(k-1) + max(20, 2k-2+[n>15]) + 8(n-k) + bl(tokens) + bl(2k+1) + bl(2n-1) bits: the 256-slot tape"
definitions = ["k = min(n, 15), the low inputs a Horner loop reads", "E = 5T + 6n + 6 to n=15, else T + 2^17 + 2^(n-15) + n + 143", "tokens = 5T + 6n + 6 to n = 15, else 5T + 10·2^(n-15) + n + 134"]

