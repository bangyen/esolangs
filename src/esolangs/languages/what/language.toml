[resource_evidence.sparse]
# Parsing alone takes ~0.8s at n=16 and ~1.8s at n=17 per row.
# The n=17 cases took 11.5s execution and 5.7s workspace.
provider = "esolangs.languages.what.tests.resource_witnesses:sparse_rows"
arities = [16, 17]
columns = ["execution", "workspace"]
bands = { "16" = "medium", "17" = "weekly" }

[resource_evidence.execution]
# Alternating answers, row 0: every test true, 5 a row; other blocks 1.
cases = [
    { through = 15, expression = "5T+6n-5" },
    { expression = "T+2^17+2^(n-15)+n+143" },
]
exact = true
arities = [1, 2, 3, 4, 5]
first = 1
unit = "commands"
description = { growth = "linear", claim = "worst", template = "{claim} {formula}: alternating answers, every conditional true, the first row" }

[resource_evidence.workspace]
# Tape, row-independent string and counters; k = min(n, 15) low inputs.
# Horner's retained prefixes add n(n-1) bits over the zero tape;
# the neighbouring ASCII answer adds five. No index copy remains.
# Above n=15, the fixed cost is 256 + 15·14 + 29 + bl(31) = 500.
cases = [
    { through = 15, expression = "261+n(n-1)+bl(5T+6n-5)+2bl(2n-1)" },
    { expression = "500+8(n-15)+bl(5T+10·2^(n-15)+n+134)+bl(2n-1)" },
]
exact = true
arities = [1, 2, 3, 4, 5, 6]
first = 1
unit = "bits"
description = { growth = "poly n", claim = "worst", template = "{claim} {formula}: tape and cursors" }

[resource_evidence.scaling]
# Every changed row costs seven characters and its decimal address.
# A 15-input block's guard adds 23+h characters. The h=n-15 label
# bits also add three characters each outside the blocks.
cases = [
    { through = 15, expression = "7(T-1)+digits_sum(T)+7n" },
    { expression = "2^(n-15)(7(2^15-1)+digits_sum(2^15)+22+n-15)+164+3(n-15)" },
]
exact = true
arities = [1, 2, 3, 4, 5, 15, 16, 17, 18, 19, 20, 21, 22]
first = 1
unit = "characters"
description = { growth = "T log T", claim = "worst", template = "{claim} {formula}: decimal row addresses and high-block labels" }

