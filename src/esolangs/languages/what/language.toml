[ablations.change_point_runs]
saving = 85.5
arity = 12
verdict = "kept: the chain emits one test per change point, a literal row number, no dash a row. Re-audited 2026-10-29 against a test at every row, 20 random tables per arity: chars -31.2% n=2, -49.5% n=8 (balanced area -51.3% n=2, -74.4% n=8); named at n=8: parity -32.4%, majority -70.5%, thr2 -92.7%, AND -96.9%, OR -97.0% (complements equal; area -54.3%, -91.3%, -99.5%, -99.9%, -99.9%). A test at every row instead costs +84.62% at n=10 and +85.53% at n=12 on random tables (second seed set +84.79 / +85.10%) and at n=10/12: parity, the least run-rich class, +44.05 / +44.33%; OR +13985.26 / +48827.52%; constants +16218.29 / +55453.12%; three ignored inputs +612.51 / +625.39%; sparse +299.55 / +322.46%. The generator has no separate projection or constant fold: a constant table is one block start and no change points"

[ablations.block_reload]
saving = 0.0
arity = 12
verdict = "recorded: past 15 inputs, blocks of 2^15 rows reload the index behind a sentinel 65535 and a guard on the high bits. It never fires at the audited arities (n <= 12), and without it the countdown wraps at 2^15, so there is no correct removal to price. Correctness machinery"

