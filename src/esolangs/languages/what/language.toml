[ablations.constant_table_audit_20261101]
arity = 8
saving = 61.8
seed = 0
tables = "both constants n=1..12; exhaustive all tables/rows n=1..3; six witnesses/all rows n=4..6"
verdict = "kept: canonical fixed-output spelling. Read every numeric input into one cell, overwrite with the answer and print decimal. Spaces separate adjacent ?? tokens; wrapping must preserve the !! decimal-output token. L=3n+2 chars, E=n+2 commands, written workspace at most 256+bl(n+2)+bl(2n-1) bits, attained on an input containing one. n=7 61 -> 23 chars; n=8 68 -> 26 chars, 59 -> 10 commands, 341 -> 264 written bits; n=12 96 -> 38 chars. n=3 corpus 15616 -> 15572 chars. Both constants also execute through n=16, beyond the generic low-index cap. All 24 balanced scores improve or match. Each language passed 5656 paired old/new row executions; all 270 nonconstant default programs through n=3 remain byte-identical (Piet pixel-identical). Both constants n=1..12 execute in default, width=1 and balanced layouts; a separate 1120-run candidate probe per language includes every row through n=8. All eight benchmark size/command pins per language remain unchanged. Owned regressions check resources, all reads before output, no EOF probe and a preserved following record; Piet also executes at scale 3. No new collected cases."

[ablations.trick_prototype_20261102_kill_write_threshold]
arity = 8
saving = 29.9187
verdict = "rejected by the verification gate: parity rungs n=8,10,12 emit1184,4799,21197 chars, giving difference ratio4.53610 above4.4. Baseline passes. Runtime and size gates alone do not establish admissibility; retain the prototype in scratch, do not weaken the growth check. Prototype mechanism: add two to the Horner index; descending [b+1<bit] tests latch the first answer into that slot, disabling later tests. Default [1<bit] handles lower rows, then add48 and print. 200 Random(184700+n) tables per fixed judge arity: n=7 chars128126->89510 (30.14%), n=8 257809->180676 (29.92%), no growth. Declining20% bar clears both. Genuine16-bit low-index boundary remains15 inputs: two seeded tables per n=14/15 save26.46%/25.71%; n=16 is byte-identical to the guarded block construction. Parity14/15 and named single-change boundaries execute too. Decimal b+1 can gain a digit at9,99,etc; costs use its actual digits. Worst low size is4(T-1)+digits(2..T)+7n+8; commands T+6n+4, tokens3T+6n+2. Tape uses256+n(n-1)+max(n,5) bits: prior Horner slots remain, while offset and ASCII-output peaks occur separately. Add token, pointer2n and input2n-1 cursors. Native exact source/command/workspace formulas pass. All tables/rows n<=3 plus16 named/random tables per n=4..6 pass7824 paired executions and324 wrong-table controls, including native caps; n=3 chars15572->11868. Owned tests enforce read-first output and a preserved next numeric token, every three-input table, decimal thresholds and wrapped/balanced layouts. Constants unchanged."

[ablations.trick_prototype_20261102_drop_index_copy]
arity = 3
saving = 27.7623
verdict = "kept by the execution gate: removing the index copy saves eleven commands and chars per nonconstant run. Every row of every three-input table sums80512->58160 commands (27.76%), with no slower row or larger table. The 16-bit boundary remains15 inputs; high-block code is unchanged. Exact low source is7(T-1)+digits(1..T-1)+7n+1, execution/tokens5T+6n-5. Written tape256+n(n-1)+5 plus program and two cursor widths; no copied index remains. Native proofs and read-first/sentinel checks cover it. Every small row and16 named/random tables per n=4..6 pass7824 paired executions plus324 wrong-table controls; source total15572->12778 at n=3. High boundary controls through16 execute; n=16 byte-identical. Same200-table n=7/8 corpus: 128126->125926 (1.72%) and257809->255609 (0.85%), below declining20% size bar. All rows of256 three-input tables and four rows of each judged table execute with baseline controls; n=3 chars15572->12778. No latch fallback: its failed growth check is recorded separately."

