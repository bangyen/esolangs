# Language-owned data, one section per dataset; aggregators read
# only their own section and skip this file when it is absent.

[curation]
backlinks = 3

[proof_status]
labels = ["tree"]
qualification = "each distinct subtable is one named node reached by reference; an Input node sends a 1 through `Subtract 49` and a 0 through `Divide 48`, `Subtract 1`; equal halves and constant chains read their bits unbranched"
scaling = "linear: O(T/n) nodes with O(n)-digit names"
execution = "poly n: worst 4n + 2 steps: four sends a level, root and leaf one each"
workspace = "poly n: at most (n+1)(bl(L)+10) + bl(n) bits: a pending frame for each 1 taken, one sending frame"

