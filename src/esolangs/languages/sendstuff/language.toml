[resource_evidence]
version = 2
construction = "esolangs.languages.sendstuff.generator:sendstuff_request"
witnesses = "esolangs.languages.sendstuff.tests.resource_witnesses:resource_tables"

[resource_evidence.execution]
expression = "U*(n+1+R) + (1-U)*(4n+2)"
source_terms = { names = ["U", "R"], provider = "esolangs.languages.sendstuff.proof_formulas:execution_terms" }
exact = true
arities = [1, 2, 3, 6]
first = 1
unit = "steps"
description = { growth = "poly n", claim = "worst", template = "{claim} {formula} {unit}: unary U adds R sends" }

[resource_evidence.workspace]
# Anonymous roots preserve parser order, so include every other snapshot index.
expression = "U*(10+bl(n+R))+(1-U)*(10n+12+W)+bl(n)"
source_terms = { names = ["U", "R", "W"], provider = "esolangs.languages.sendstuff.proof_formulas:workspace_terms" }
exact = true
arities = [3, 4, 5, 6, 7]
first = 3
unit = "bits"
description = { growth = "poly n", claim = "worst", template = "{claim} {formula} {unit}. U marks unary readers, R counts their extra sends and W sums frame index widths" }

[resource_evidence.scaling]
# The fixed macros and leaves cost 113 plus two read-index widths.
# The root label uses the widest residual id. Definitions and the
# references they carry are priced independently by depth.
expression = "113+2digits(n)+digits(H)+A+J"
source_terms = { names = ["A", "H", "J"], provider = "esolangs.languages.sendstuff.tests.formulas:scaling_terms" }
exact = false
arities = [1, 2, 3, 4, 5, 6, 7]
first = 1
unit = "characters"
description = { growth = "linear", claim = "at most", template = "{claim} {formula} {unit}: distinct subtables and references" }

