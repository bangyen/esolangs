# Language-owned data, one section per dataset; aggregators read
# only their own section and skip this file when it is absent.

[curation]
backlinks = 5
bf_derivative = true
bf_derivative_predates = true

[proof_status]
labels = ["tree"]
qualification = "equal cofactors share one layered DAG node, and an ignored input is read by the next layer's nodes; spatial lookup remains a candidate"
scaling = "linear: O(T/n) nodes with O(n)-digit addresses"
execution = "poly n: worst 4n + 50 commands, one DAG path and a tail"
workspace = "poly n: worst 13 + bl(lines) + bl(n) bits: two cells, a line cursor"

