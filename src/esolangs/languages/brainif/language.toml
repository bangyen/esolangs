[resource_evidence]
version = 2
construction = "esolangs.languages.brainif.generator:brainif_request"
witnesses = "esolangs.languages.brainif.tests.resource_witnesses:resource_tables"

[resource_evidence.execution]
# The ordinary zero tail uses 52 lines. At depth one either the
# chosen residual follows a child or both arcs lead to the first
# depth-two residual, which itself follows a child from n=4.
cases = [
    { through = 1, expression = "55" },
    { through = 2, expression = "58" },
    { through = 3, expression = "62" },
    { expression = "4n+49" },
]
exact = true
arities = [1, 2, 3, 4, 6]
first = 1
unit = "commands"
description = { growth = "poly n", claim = "worst", template = "{claim} {formula} {unit} for the default layout" }

[resource_evidence.workspace]
expression = "C + bl(R) + bl(n)"
source_terms = { names = ["C", "R"], provider = "esolangs.languages.brainif.proof_formulas:workspace_terms" }
exact = true
arities = [1, 2, 3, 6]
first = 1
unit = "bits"
description = { growth = "poly n", claim = "worst", template = "{claim} {formula} {unit}: cell storage C and R lines" }

[resource_evidence.scaling]
# N counts layered nodes, A counts goto-address digits. Each node
# pays 52 characters including line separators; the root saves 17.
# The fixed climb and output tail add 840 plus both done-address widths and a 17-character landing.
expression = "max(28n+770,52N+840+A+2digits(4N+54))"
source_terms = { names = ["A", "N"], provider = "esolangs.languages.brainif.tests.formulas:scaling_terms" }
exact = false
arities = [1, 2, 3, 4, 5]
first = 1
unit = "characters"
description = { growth = "linear", claim = "at most", template = "{claim} {formula} {unit}: layered DAG before fall-through" }

