[ablations.fallthrough_layout]
saving = 14.8
arity = 8
seed = "random.Random(777000 + 100 * n + i)"
tables = 50
verdict = "kept 2026-10-30: a DAG node placed directly before one of its children drops that child's guarded goto (the zero child first, greedy per layer; both gotos when the children coincide), and out_1 ends the program so its goto done goes too. Chars on 50 random tables: n=7 180,312 -> 153,954 (-14.6%), n=8 273,484 -> 233,060 (-14.8%), n=9 445,048 -> 379,693 (-14.7%), flat; balance_score side squared -26.6/-26.8/-26.5%. Named n=8/9: parity -12.8/-13.4%, and -18.7/-19.9%, or -17.8/-19.0%, majority -16.6/-17.3%, threshold 3 -17.2/-18.7%. Executed every row of all tables n<=4 (1,048,576 rows) and 8,344 rows of random and named tables n<=8 plus named and 5 random n=9, each equal to its table; a flipped last bit failed in 5 of 5 control runs"

[ablations.wide_tree_race]
saving = 32.8
arity = 8
seed = "random.Random(1030000 + 100 * n + i)"
tables = 20
verdict = "kept 2026-10-30 (re-audit): width requests past four essential inputs race the pruned tree against the linear lookup (the plain build). Fires only on width requests; balance=True and the default take the residual DAG, byte-identical, so it has no balanced-route effect. Re-measured at widths 40, 80 and 200 (identical sizes, the tree fits all three): 20 random tables a size, chars -27.5..-38.7% at n=5..10 (n=7 30.3%, n=8 32.8%, still growing; every table >= 21.8%), named parity, majority, and, or, nand, nor, threshold n/3 at n=7..12 -61.7..-98.2% (n=8 parity 9,680 -> 2,012; n=12 parity 108,283 -> 2,655); rendered area (balance_score side squared) 74-100% smaller. Executed 24,576 rows at width 80 (n<=8, new and old builds) and 21,504 at widths 40 and 200 (n<=7), each equal to its table; a flipped last bit failed in all 188 and 268 control runs. The lookup stays the narrow fallback"

[ablations.lookup_loops]
saving = 18.9
arity = 8
seed = "random.Random(184700 + n)"
tables = 200
verdict = "kept 2026-10-27: the narrow lookup walks its widest levels by a loop that halts on a marker; at width 13 it is 9.9% at n=7, 18.9% at n=8, 24.7% at n=9 and 29.2% at n=10 on random tables (17.3-20.8% on parity, and, or and majority at n=8), a share still growing past n=8. The plain-rewrite audit retired the tree's leaf trampoline (larger at every n and width, 0.5-5.6%) and the loop rule's odd-n step down (1.9% at n=7, 0.9% at n=9)"

