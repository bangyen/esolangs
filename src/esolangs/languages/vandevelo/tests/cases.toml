language = "Vandevelo"
oldid = 75287

[[examples]]
id = "truth-machine-0"
source = '''
0 -!> Nil?
1 -> Inp? == 0?
2 -> 2?
1? :: 2?'''
stdin = "0"
expected = ""

[[examples]]
id = "truth-machine-1"
source = '''
0 -!> Nil?
1 -> Inp? == 0?
2 -> 2?
1? :: 2?'''
stdin = "1"
expected = ""
stop = "steps"
max_steps = 200

[[spec_triggers]]
program = "x ~> Inp?"
stdin = ""
expect = "InputExhaustedError"
claim = "InputExhaustedError: Inp at EOF"

[[spec_triggers]]
program = "y?"
stdin = ""
expect = "ProgramError"
claim = "ProgramError: a read of an undefined variable"

[[spec_triggers]]
program = "foo"
stdin = ""
expect = "ProgramError"
claim = "ProgramError: an invalid expression"

[[spec_triggers]]
program = "2? -> 2? --Infinite loop"
stdin = ""
expect = "ProgramError"
claim = "ProgramError: the Comments example's ? target is malformed"
