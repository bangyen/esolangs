[deep_arities]
# Vandevelo's registers grow ~sqrt(T) until the n*n cap binds at n=14:
# written bits 2450, 3361, 3872, 4419, 4998 at n=13..17, increments 911,
# 511, 547, 579 -- polynomial -- but n=16 alone costs 34s.
workspace_step_exempt = "registers grow ~sqrt(T) until the n*n cap binds at n=14"

[curation]
