[resource_evidence.execution]
expression = "n+2"
exact = true
arities = [1, 2, 3, 4, 6]
first = 1
unit = "steps"
description = { growth = "poly n", claim = "worst", template = "{claim} {formula} steps; one rewrite per bit, one wrapper removal and one final output step" }

[resource_evidence.scaling]
# Constants reach the first case and conjunction reaches the second.
# At n=2, the only full-support tables with two mixed pairs are parity
# and its complement. From n=3, toggle the last bit on an AND of the rest.
cases = [
    { through = 1, expression = "150" },
    { through = 2, expression = "156" },
    { expression = "146+2T+2n" },
]
exact = true
arities = [1, 2, 3, 4, 6, 10]
first = 1
unit = "characters"
description = { growth = "linear", claim = "worst", template = "{claim} {formula} for the largest emitted tree" }

[resource_evidence.workspace]
# The parity object is just a root, the input and its end marker.
expression = "16T+16n+9"
exact = false
arities = [1, 2, 3, 4]
first = 1
unit = "bits"
description = { growth = "linear", claim = "at most", template = "{claim} {formula} bits; object string and halt flag at step boundaries" }

