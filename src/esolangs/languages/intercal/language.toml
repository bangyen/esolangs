[catalogue]
sharing_local = "_intercal_shared"  # named shared diagram variables
folding_ignored_local = "_diagram"  # equal children replace their selector
folding_constant_local = "_diagram"  # equal-child reduction to a constant id

[ablations]
audited = "2026-10-19"

[ablations.subtree_interning]
saving = 71.5
arity = 12
verdict = "kept: canonical, exempt. Subtables are interned level by level in _diagram, so a repeated subtree is one node: removing the interning costs 64.0% at n=10 and 71.5% at n=12 on random tables (shares of the ablated build), 79.5% / 83.8% on two-block tilings"

[ablations.equal_half_collapse]
saving = 3.7
arity = 12
verdict = "kept: canonical, exempt. A subtable whose halves are the same id is that id -- the constant-span fold and the ignored-input drop of _diagram. 17.4% at n=6 declining to 3.7% at n=12 on random tables as random diagrams stop collapsing; on its classes, 10.1% at n=10 and 5.5% at n=12 with one ignored input, 13.3% / 7.2% on constant-half tables"

[ablations.node_naming]
saving = 70.7
arity = 12
verdict = "historical measurements, now repriced from actual folded expressions: a node read by two or more parents is assigned to a spare variable once, when (count - 1) * inline > statement + count * spelled. Removing the naming costs 62.9% at n=10 and 70.7% at n=12 on random tables, 97.2% / 99.2% on parity, whose diagram is a chain of re-read nodes"

[ablations.negation_naming]
saving = 19.7
arity = 12
verdict = "historical, superseded by coupled mask/negation alias planning 2026-11-02: each level's ~selector is assigned once when per_level * (inline - spelled) > statement. Removing the naming costs 15.3% at n=8, 18.9% at n=10 and 19.7% at n=12 on random tables -- the docstring's 15.4% / 19.0% reproduces. Naming every used level unconditionally is within 0.79% of the rule at n=8 (the docstring's 0.8% reproduces), 0.27% at n=10, 0.12% at n=12"

[ablations.input_order]
saving = 0.0
arity = 12
verdict = "kept: the emitted size is exactly invariant under input permutation -- 0 of 256 tables at n=3 and 0 of 200 at n=5 change by one char under the greedy order, which does fire (94/256 and 124/200 non-identity permutations). The Decisions' greedy-cost figures (+2.14% on three inputs, +1.68% on the five-input sample) do not reproduce; see the stale-figures list"

[ablations.balance_packed_rows]
saving = 31.6
arity = 10
seed = "random.Random(131s + n), s = 0..19"
tables = "20 random per n=7,8 (5 per n=9,10 in a width sweep) plus and/or/nand/nor/parity/majority/threshold-3/threshold-(n-1) at n=7..10"
verdict = "kept: the balanced build kept one statement per row (n=8 random: 63 rows, side 124), so the row count set the side. Statements start at DO or PLEASE and a line break is a token boundary, so consecutive wrapped lines now share a row up to the width. Balanced area (score squared) -26.7% / -31.6% on random tables at n=7 / 8, and still growing in a width sweep (-35.6% / -41.8% at n=9 / 10, 5 tables); named: majority 24.1 / 36.9 / 41.5 / 44.1%, threshold-3 24.9 / 34.1 / 40.8 / 45.9%, and/or 28.4-32.5%, parity 9.9 / 0.0 / 6.2 / 30.9% (n=7..10), threshold-(n-1) 23.1 / 12.9 / 15.5 / 14.6%. No table worse; default byte-identical on all 72 tables. Every balanced program ran on every row (72 tables, n=7..10, 0 bad) and a wrong table failed on each. Widths 1.1 / 1.2 / 1.3 / 1.4 times sqrt(2 chars) stay within 6.9% of the best width of a 10..399 sweep (worst of the 60 n=7..9 tables)"

[audits]
plain_rewrite = 2026-10-22
trick_prototype = 2026-11-02

[ablations.constant_mux_folding]
saving = 5.5
arity = 12
seed = "random.Random(1847+n), 20 per arity"
verdict = "historical: Boolean constant identities remain, but 2026-11-02 actual-frame repricing supersedes this old naming policy and its assignment-preservation claims. At that stage the unfolded policy preserved every target; repricing was deferred: that draft changes the exhaustive n=3 statement maximum 8 -> 6. The emitted-size bound uses the unfolded envelope minus at least 33 characters for every nonconstant table; constants are priced separately. Random size savings n=7/8/10/12: 19.10/15.63/10.20/5.50%; and/or n=12: 732 -> 322 chars, parity 1536 -> 1459. All 256 three-input tables plus sampled random, parity, and/or and worst-witness tables through n=8: 9,160 baseline/candidate executions, no wrong answers; 34 complemented-expectation controls fired. Exhaustive n=3 statement maxima stay 8 -> 8"

[ablations.constant_table_audit_20261101]
arity = 8
saving = 11.0
seed = "both constant values; witnesses(n) at n=4..6"
tables = "every table and row n=1..3; six witnesses per n=4..6; constants n=1..12"
verdict = "kept: canonical whole constants. Every uniform two-character setter overwrites .1, then READ OUT prints #0/#1 directly and GIVE UP halts. Constant READ OUT operands are specified in the C-INTERCAL manual (https://www.catb.org/~esr/intercal/ick.htm). Share the existing one-in-five politeness formatter with the general build. Exactly n+2 commands and 10+bl(n+2) written bits. At n=8 both bits 145 -> 129 chars; n=12 198 -> 181. n=3 corpus 39773 -> 39741 chars; width=1 54524 -> 54492. Generic envelopes and all eight benchmark pins unchanged. Each language passed 5656 paired before/after row executions; all 270 nonconstant programs per language through n=3 stay byte-identical. All 24 old balanced constant scores per language improve or match. Both constants n=1..12 execute in default, width=1 and balanced layouts; owned regressions verify consumption and exact native resources, with sentinel preservation for stream readers."


[ablations.select_mux_20261102]
arity = 8
saving = 51.5
seed = "random.Random(1000*n+i).getrandbits(1<<n)"
tables = "20 random per n7/8; two per n7/8/10/12/14; one per n16/18/20; named families separately"
verdict = "kept: mingle(one,zero) selected by selector$not-selector replaces three unary-logic frames. Inline repair alone saves33.991/37.691% at fixed n7/8. Final actual-expression sharing and coupled aliases give30290/51960 ->16064/25201 chars (46.966/51.499%). Two-table trend47.557/51.738/59.509/61.504/63.325% through n7/8/10/12/14; one-table n16/18/20 65.854/66.016/64.094%, observed peak18 then decline. Conservatively clears20% declining; no later-arity guarantee or favorable cap. Every measured larger program executes sampled rows, including one row of each n16/18/20 baseline/candidate; no giant n27 build. At n7/8 parity779/916 ->528/627, majority748/948 ->509/631, threshold-third491/580 ->378/443; and/or unchanged. Positive-select without per-level complements is correct but superseded:18237/30034 chars, 13.527/19.178% larger than the final policy; no duplicate mux path retained."

[ablations.canonical_aliases_20261102]
arity = 8
saving = 19.1
seed = "random.Random(1000*n+i)"
tables = "same fixed20 n7/8; exhaustive n<=3 plus samples n4..6"
verdict = "kept canonical repeated-subexpression sharing: three fixed LOCAL per-level costs choose inline, negation-only or mask-only. A named mask also beats constant-fold spellings except a bare selector, so its complement is used exactly once and is inlined. Without a mask, folded branches may justify a negation alias. Counts are lower bounds on rendered uses, not a whole-program race. Compared with inline select plus actual node repricing,19009/31157 ->16064/25201 chars (15.493/19.116%). Two ephemeral NamedTuples hold four fold-category counts and local lengths; the mask target namespace is necessary for this coupled choice; no persistent cache or duplicate old policy remains. Constant-time folded size arithmetic reuses one text array instead of recursively rendering subtrees during naming, preserving O(T) construction. Obsolete _negations and _unfolded_mux helpers are removed."

[ablations.folded_frame_repricing_20261102]
arity = 3
saving = 5.2
seed = "all three-input tables; random.Random(1000*n+i)"
tables = "all tables/rows n<=3; fixed200 random plus five named per n4..8"
verdict = "kept independently after canonical alias planning: actual folded pricing reduces n3 commands12960 ->12288 (5.185%), chars35341 ->34795, with no table larger or slower. Net versus original n3 commands12944 ->12288 and source39741 ->34795. Another2050 native executions on1025 fixed n4..8 tables confirm no larger/slower result against the same-alias old-price counterfactual. Raw folded-only source saving3.255/2.346% would fail size; the independent execution route qualifies. Original max8 and new max7 are small-corpus context, not a new n-only maximum formula."

[ablations.exact_route_resources_20261102]
arity = 27
saving = 0.0
seed = "all small tables; random.Random(100*n+i); symbolic emitted routes"
tables = "E runtime3..8,W1..8; exact-route native9140 rows; lowered caps16/32; emitted primitive n13/16/20/21/22/25/26/27"
verdict = "user-approved contract change: exact per-program E counts straight-line DO/PLEASE statements in any wrapping, including GIVE UP. Exact worst-row W prices actual scalar/colon-mask/array writes and final cursor; every input one attains every named mask2 simultaneously, other writes stay Boolean. Separate n-only global ceilings retain old repeated-node caps and at most n-2 masks; they are not claimed maxima. The old global-exact E26/W27 and680MB n27 text measurement are historical old-compiler evidence. Runtime coverage remains bounded; high arities use small emitted primitives and symbolic write-set reasoning, not a giant truth-table build. The source upper-only arities3..24 remain, now a derived unshared-select ceiling U+3, or5(U+3)+DIM with spills; scalar sharing lowers ideal cost, PLEASE rounding adds at most3, spilled references grow at most8 chars. Pins/by-row/last-row and anchors updated; saved example regenerated and executes."

[ablations.constructor_cost_20261102]
arity = 13
saving = 0.0
seed = "random.Random(1000*n+i),i=0..2"
tables = "three tables per n7/10/13, median of three builds each; native three rows per n4/6/8"
verdict = "sum of per-table median CPU old/new:0.822/0.680ms at n7,4.092/3.114ms at n10,24.393/17.695ms at n13; wall0.819/0.679,4.089/3.111,24.395/17.693ms. Source totals4555/2414,24847/10076,141518/54512. Native CPU medians1.158/0.959ms,3.282/2.022ms,8.323/4.406ms at n4/6/8. Explicit n18 and20 representative probes cost2.073 and8.859CPU-s; n20 emits4192599 ->1505391 chars and executes17741 ->5046 statements. No n21/27 extension was launched for this trend."


[interpreter_ablations.speedup_prototype_20261103]
price = -0.3806
workload = "constructor plus step; no snapshots timed"
seed = 0
tables = "pilot: exhaustive n<=2 plus 100 seeded mutations and examples; 400-step cap"
verdict = "prototype only: slotted machine storage. 245 programs, 145 halt cleanly; no structural trace differences, control differs on 145. Step throughput at longest 10/20/40 workload breadths: -0.38%/+0.03%/+0.10%. No production change or global performance conclusion; adoption needs broader validation."

