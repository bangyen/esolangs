# Language-owned data, one section per dataset; aggregators read
# only their own section and skip this file when it is absent.

[curation]
backlinks = 100

[proof_status]
labels = ["parameterized tree"]
qualification = "equal-width inputs feed a reduced diagram; actual folded expressions and coupled selector/mask aliases are shared where shorter"
definitions = ["S = emitted DO/PLEASE statement count, including GIVE UP, independent of wrapping; separate global ceilings are not claimed attained", "W = Boolean scalar keys/values, two-bit named masks, actual array dimensions/written elements, and bl(S)", "F = U+3 without spilling, otherwise 5(U+3)+DIM; U is the full unshared-select template"]

