execution = "poly n: worst 55n + 5 commands, one tree path of eight runs a level"
workspace = "linear: worst 24E - 1214 + bl(E) + bl(n) bits for n ≥ 2: code, stack, variables"
definitions = ["E = 95T - 80, the macro-expanded program with no constant subtree"]

