verdict = "rejected independently of the terminal spelling: factor the common node/pad tail into s, omit n/m aliases where Y/W carries their bodies, and retain the existing constant-root spelling where tail factoring loses. Expanded programs remain identical. Chars 65679 -> 62088 and 95191 -> 91591 (5.468%/3.782%); after terminal spelling 64879 -> 61288 and 94391 -> 90791 (5.535%/3.814%). Named maximum AND/OR 11.25%/10.65%, declining toward zero; fixed prelude savings fail the 20% declining bar. Reserving s eventually costs more names: the two-table n=16 sample grows 0.052%. No tail macro, naming state or alternate construction is retained."

[ablations.terminal_leaf_target]
arity = 8
saving = 0.84
seed = "same fixed corpus"
tables = "all tables/rows n<=3; seeded n=4..6; both constants n=1..12; generic resource witnesses n=2,4"
verdict = "kept as minimal terminal spelling, independent of failed fusion: only leaf (())= becomes ()=; skip targets remain nonempty because another program follows. The empty-name store is dead at halt, with both operands explicit. It adds one dead dictionary entry, necessary for the shortest assignment target, and no construction path/helper/cache. Generic component peaks for E=93T-80 are code E, stack E-78 and variables E-75 bytes; W=24E-1214+bl(E)+bl(n), exact scopes 2/4 retained. Constant E=84n+13, W=2688n-1158+8[n=1]+bl(E)+bl(n); the extra eight bits at n=1 honestly count the terminal entry. Native W=1546 at n=1 constants, 4228/9606 at n=2/4 constants, 5805/32592 at n=2/4 parity. Every nonconstant source loses four chars, constants two; sharing choices and all original source/exactness rungs remain unchanged apart from C-4. n=3 corpus 32096 -> 31076, five-input sample 36687 -> 35887. All eight source pins lose four chars; every row-command pin remains executed and unchanged. Three Size anchors and owned example refreshed. Production 2168 paired native row groups preserve outputs, steps, successful reads and the existing single EOF probe; with a following QR the same Q byte is consumed and R remains. Owned helper checks default/width1/balance, terminal-only mutation, all 8n+1 runs, resources and records without adding a collected case. Uniform probes pass 2186 groups plus forced digram and wrong-table 8/8 controls; native curve endpoints complete through n=16 (source 0.30 CPU-s, native 7.12 CPU-s, stopping further extension after the last arity exceeded its estimate)."

[ablations.constant_table_audit_20261101]
arity = 8
saving = 33.6
seed = 0
tables = "both constants n=1..12; exhaustive all tables/rows n=1..3; six witnesses/all rows n=4..6"
verdict = "kept: canonical whole-constant spelling. Retain only skip/pad and the chosen answer macros; remove the unused node and opposite leaf definitions. Source is 57+3n chars through n=4, 61+2n thereafter; expanded execution stays identical at 55n+5 commands. Native workspace is 2688n-1094+bl(84n+15)+bl(n), including n=1 where the generic bound is out of scope. n=8 116 -> 77 chars; n=12 124 -> 85. n=3 corpus 32174 -> 32096 chars; five-input sample stays 36687. A last-bit terminal prototype reduced commands by 13 and avoided the next-bit probe, but violated the same-read-count contract across tables and left the exact execution ledger unattained: rejected. Existing single EOF probe retained. Each language passed 5656 paired old/new row executions; all 270 nonconstant programs through n=3 stay byte-identical. Both constants n=1..12 execute in default, width=1 and balanced layouts. All 24 balanced scores per language improve or match; all eight benchmark size/command pins remain unchanged. Owned regressions verify exact resources, read-before-output and one EOF probe. No new collected cases."

