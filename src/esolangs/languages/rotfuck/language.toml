[ablations.symmetric_count]
saving = 68.7
arity = 8
seed = "named symmetric tables"
tables = 7
verdict = "kept under the named-function rule: a table depending only on how many essential inputs are 1 sums its bits on the carrier and walks a strip of n + 1 entries, raced by length against the Horner-digit lookup. Parity 65.2% at n=7, 68.7% at n=8, 81.2% at n=10, 92.4% at n=12; majority 65.2/68.1/80.6/92.1%; or and at-least-2 70.3-70.4% at n=8; and 58.6%, exactly-1 63.6% at n=8; a symmetric table with an ignored input 64.4% at n=8. Random tables: 0 of 200 change at n=5..8. Exhaustive n<=3: 38 tables change, none grows, every changed program executed, and under the forward rotation; named tables executed through n=8, parity at n=10. Plain-rewrite audit 2026-10-28 (named fns, n=7..12, balanced within 1-5 points): parity 40.6/53.8/67.2/78.5/86.9/92.4%, majority 40.6/52.5/67.2/77.7/86.9/92.1%, or/nand 44.1/57.5/70.6/81.1/88.7/93.5%, and/nor 24.1/27.5/32.8/39.7/48.3/58.2%, thresholds 2 and 3 42.7-57.3% at n=7/8, not-majority 40.6-92.7%, all rising; 0 of 20 random tables change at n=7..10"

