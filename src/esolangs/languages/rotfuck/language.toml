[resource_evidence.workspace]
# The strip and its two scratch cells peak at 2T+2. Forward constants wrap one extra bit.
cases = [{ through = 6, expression = "C*(16+F+bl(S+80))+(1-C)*(2T+n+8+bl(2T+6)+bl(X))+bl(L)+bl(n)" }, { expression = "C*(16+F+bl(S+80))+(1-C)*(2T+5n+35+bl(2080L)+bl(2T+6))+bl(L)+bl(n)" }]
source_terms = { names = ["C", "F", "S", "X"], provider = "esolangs.languages.rotfuck.proof_formulas:workspace_terms" }
exact = true
arities = [2, 3, 4, 5]
first = 2
unit = "bits"
description = { growth = "linear", claim = "worst", template = "{claim} {formula}. C selects constants, F selects forward, S counts commands, X bounds lookup execution" }

[resource_evidence.scaling]
# The cooked prefix uses one phase through n=6. The raw prefix uses
# full five-input phases plus its leading remainder. The walk strides
# form a geometric series of ratio 32 and alternate parity.
cases = [
    { through = 6, expression = "3T+79n+43" },
    { expression = "3T+48+31n+(97⌊n/5⌋+16floor((⌊n/5⌋+(n%5)%2)/2))/3-5min(1,(n%5))+min((48(2^(n%5)-1)%256),256-(48(2^(n%5)-1)%256))+32(T-2^(n%5))/93" },
]
exact = true
arities = [2, 3, 4, 5, 6, 7, 8, 9, 10]
first = 2
unit = "characters"
description = { growth = "linear", claim = "worst", template = "{claim} {formula}: lone-zero witness n=2..10" }

