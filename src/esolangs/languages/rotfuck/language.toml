[ablations.essential_projection]
saving = 51.0
arity = 10
verdict = "kept: canonical, exempt; the lookup is built over the essential inputs only and ignored inputs land on a dead cell. 0.0% on random tables (nothing to project), 20.0% / 65.5% on tables ignoring one or two inputs of 8, 33.4% / 51.0% at n=10, 79.3% / 89.7% on 16-row tiled tables at n=8/10, 95.8% / 97.4% on constant tables"

[ablations.skip_race]
saving = 0.0
arity = 10
seed = "random.Random(i * 1000 + n), i < 20"
tables = 20
verdict = "retired 2026-10-28 (plain-rewrite audit): the carried-count crossing of zero runs changes 0 of 20 random tables at n=7..10 (0.0%), and no named function at n=7..12 -- parity, majority, and, or, nand, nor, thresholds 2 and 3, not-majority all 0.0%, balanced too, because the symmetric count shadows AND (with it off AND would save 29.9% / 58.6% at n=8/10). What remained was the zero-upper-half class (5.4 / 11.2 / 18.2 / 25.4% at n=7..10, an ad-hoc class that keeps nothing); removed, plain steps only"

[ablations.radix_bits]
saving = 0.0
arity = 10
verdict = "side measurement, not an ablation: _RADIX_BITS swept over 4-8 on 200 random tables per arity, after short_digit_low. Wider digits now win monotonically but narrowly -- 8 bits against the shipped 6 saves 1.2% / 2.0% / 3.0% / 3.6% at n=7/8/9/10 (183,543 / 263,273 / 409,185 / 684,451 against 185,743 / 268,673 / 421,985 / 710,051) and 4.3% at n=12 -- under the bar, and a digit's walk takes count**2 / 2 moves, so the constant stands. Before short_digit_low the total resonated with digit boundaries (a single 7- or 8-bit digit beat the shipped 6 by 42% at n=7)"

[ablations.short_digit_low]
saving = 32.3
arity = 8
seed = "random.Random(184700 + n)"
tables = 200
verdict = "kept: the index's short digit is read lowest, so the top digit's walk strides 2**(short width + 1) cells, not 128. 41.4% at n=7, 32.3% at n=8, 21.9% / 12.6% / 5.0% / 0.0% at n=9/10/11/12, 65.2% at n=13 -- periodic in n mod 6, zero where every digit is full. Identical output through n=6; parity, and, or, majority 0.0% (symmetric, one count walk). No table grew; every changed program run (30 at n=7..9, both rotations) was correct. Plain-rewrite audit 2026-10-28, 20 random tables per n, balanced area too: 41.4/32.3/21.9/12.6% at n=7/8/9/10 (balanced 40.4/34.0/20.5/12.1%), 0 named functions change; the saving falls below the 10% bar after n=10 and returns at n=13, so kept on the n=7..8 bar"

