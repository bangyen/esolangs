verdict = "Kept under independent 25% proved-command route. Uniform five-bit raw digits replace six from the existing raw domain n>=7; normalized digits remain six. No decoder, new state, grouping race or extra family. All-one raw partials maximize each bounded-byte transfer; exact compiled loop spans give global R. ACTUAL old native worst witnesses versus new upper: backward67495->35095 at7 (48.00%),102262->53990 at8 (47.20%); forward89599->43823 (51.09%),125318->63854 (49.05%). No extrapolation of old finite2..6 E. Fixed4 also clears25 but is larger than5 at both arities/cycles: 847/1310 versus831/1262 backward,911/1390 versus903/1334 forward; fixed7's prior source winner is slower. Select size then commands, one fixed5. Fixed20 source totals backward13740->15340/22377->22697, forward15020->16780/23977->24137: source growth admitted explicitly. Endpoint command totals1663320->970520/2403634->1386354 backward,2215480->1229560/2982514->1691154 forward. Alternating native wall medians (five-table endpoints, three alternating passes) .636->.378s/1.196->.695s backward and .869->.483s/1.507->.862s forward. Constructor per-table CPU at4/7/8 approximately .88/1.51/2.44ms old and .88/1.70/2.51ms new. Native82 verification controls plus560 fixed endpoint/timing groups pass; one-short bias mutant fails in both cycles. Ordered complete reads, sentinel and no EOF probing preserved. All eight by-row/last-row pins and example unchanged; source/E/W original exact scopes and flags retained; programs through6 remain byte-identical. Raw V unchanged, smaller byte digits and no new scratch. Existing O(n) symmetric/count and multiplication readers retained. Closed source/walk formulas replace the finite padding table without weakening arities. O(T) build/source, O(T+n) raw execution; n10 random1847 source3165->3341, AND281 unchanged."

