verdict = "removed 2026-10-20 (interpreter candidate I-3): -4.0% traced with overlapping spreads in the audit; the per-cycle dict build is paid per fresh machine while the scans it replaces are short; differential 0 divergences vs main on 5,193 tracediff-corpus programs (2,965 halt cleanly)"

[ablations.symmetric_count]
saving = 68.7
arity = 8
seed = "named symmetric tables"
tables = 7
verdict = "kept under the named-function rule: a table depending only on how many essential inputs are 1 sums its bits on the carrier and walks a strip of n + 1 entries, raced by length against the Horner-digit lookup. Parity 65.2% at n=7, 68.7% at n=8, 81.2% at n=10, 92.4% at n=12; majority 65.2/68.1/80.6/92.1%; or and at-least-2 70.3-70.4% at n=8; and 58.6%, exactly-1 63.6% at n=8; a symmetric table with an ignored input 64.4% at n=8. Random tables: 0 of 200 change at n=5..8. Exhaustive n<=3: 38 tables change, none grows, every changed program executed, and under the forward rotation; named tables executed through n=8, parity at n=10"
