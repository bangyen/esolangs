verdict = "Kept for nonconstant full symmetry under the 20% declining gate. Existing count readers use zero carrier+2 for bias and the zero current carrier for output. Three local spellings: plain, isqrt quotient/remainder, radix16 quotient/remainder; no open seek means a changed global phase cannot change later padding lengths. Backward old source is291+h/361+h at n7/8, forward307+h/377+h, h=1..n weight-table ones; savings are68/108 chars throughout. Thus the entire class saves at least22.82%/29.27% backward and21.66%/28.05% forward, not merely a firing sample. All1528 emitted old/new pairs checked. Parity295→227,365→257,340→272,314→285,391→339,468→390 at n7/8/9/10/12/14: peak8, later decline/oscillation tends0; no arity cap. Named negations also clear fixed7/8. Generic and projected readers retain their old spellings: the generic prototype saves7.41%/9.47% backward and7.85%/9.75% forward, failing both bars on fixed200. Tail multiplication also applies below7; n1 source128→103 and worst E128→183, n3 chars72240→71890 and commands914176→920336. Original exact source/E/W scopes and global n2..6 maxima remain: modified symmetric E is at most8n²+87n+88, below the unchanged generic worst. All8 pins and balanced example updated; n10 AND310→281. Native5124 full-program rows,2600 default symmetric resource rows at n2..5 and7680 byte-addition primitives pass; nonzero-scratch mutant fails. Inputs, byte cells and physical order unchanged; O(T) build/source and existing V after6 retained."

