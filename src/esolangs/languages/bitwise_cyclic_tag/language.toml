# Language-owned data, one section per dataset; aggregators read
# only their own section and skip this file when it is absent.

[curation]
backlinks = 179

[proof_status]
labels = ["parameterized lookup"]
qualification = "the table is the program, one four-bit cell per row; each embedded bit appends two walk zeros per unit of its place value, and a cell consumes exactly two, so the zeros carry the program pointer to the indexed cell and the held-back sentinel arrives there to fire it; the cell's second `0` consumes the answer it just appended, without which a 1 would cascade into the rows below"
scaling = "linear: worst 8T+2n+1 characters: four per row, reads four a unit"
execution = "linear: worst 5T + n commands: input segments, then 3 per walk cell"
workspace = "linear: worst 16T + 8 + bl(8T+n-2) + bl(2T+n+1) bits: a data queue of 2T bits"

