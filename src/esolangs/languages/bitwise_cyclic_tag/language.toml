[ablations.constant_table_audit_20261101]
arity = 8
saving = 0.0
seed = 0
tables = "both constants, n=1..12"
verdict = "retained: one cyclic zero deletes n input bits and the literal answer, then the post-halt step prints that last deletion. Chars n+3, commands n+2 including dump: n=8 11 chars, 10 commands, 84 written bits; n=7 10 chars, n=12 15. Deleting the answer literal makes the opposite-valued input witnesses print the final input rather than the requested constant, for both answers. Owned tests verify initial data contains all inputs followed by the answer, every deletion, and output only after all n+1 deletions. No global optimum claimed. n=3 corpus chars 14492 unchanged. Executed 1120 candidate/native row runs and 5656 paired old/new executions per language; 270 nonconstant n<=3 sources identical. Both constants execute default, width=1 and balanced layouts through n=12; all 24 balanced scores match or improve. All eight benchmark size/command pins and global resource caps unchanged. Owned raw IO/template checks preserve exact input use, following records and no EOF probe."

[ablations.trick_prototype_20261102_four_row_cells]
arity = 2
saving = 0.0000
verdict = "not retained: no complete shorter fixed-stride cell follows from the supplied sketch. Test the concrete short chain1a0b1c0d100 on all16 filled patterns using the real interpreter over walk zeros: it consumes five zeros on12 patterns but three on0110,0111,1110,1111. Thus one input-derived stride cannot select those cells uniformly. Positive control concatenates existing cells1a0b1001c0d100: all16 consume six zeros and grouping them changes no emitted bytes or size. This rejects the tested chain, not every possible four-row encoding; no search or frozen cell table was introduced."

[ablations.trick_prototype_20261102_two_zero_cells]
arity = 1
saving = 0.0000
verdict = "rejected tested construction: remove the last delete from each cell (1a0b10), reduce higher-input strides to two per pair and lowest stride to one. All small tables/rows run against the actual unchanged emitter (4240 paired executions). The mutant already fails table01,row1: program100110100110,11 prints0 instead of1; table10,row1 prints1 instead of0. All baseline controls return their table bits. A shared-delete alternative would need a different complete cell, not a weakened answer/no-cascade invariant."

[ablations.trick_prototype_20261102_amplified_reads]
arity = 1
saving = 0.0000
verdict = "not retained: test10100 as the proposed expansion stage between reads and110, with both original walk zeros and unary one seeds. It reaches the held sentinel before the queued walk payload; on table01,row1 the original-seed stage halts after13 commands and prints0 instead of1. With one seeds, table10,row0 halts after10 and prints0 instead of1. Baseline controls execute all rows of01,10,0001,0110 correctly. The supplied sketch has no separate phase control or complete logarithmic expander; these are failures of the tested stages, not a universal amplification lower bound. No incomplete emitter ships."

