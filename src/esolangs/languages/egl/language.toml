[ablations]
audited = "2026-10-19"

[ablations.constant_fold]
saving = 48938.9
arity = 12
verdict = "kept: canonical, exempt. A constant reads its inputs into a scratch cell and prints a literal cell. Routing constants through the indexed path over the full table instead costs +16018.75 / +21094.12% at n=10 and +48938.89 / +67915.79% at n=12 (all-zero / all-one)"

[ablations.input_projection]
saving = 90.7
arity = 12
verdict = "kept: canonical, exempt. Row 1 is painted with the table read at the essential inputs and each guard walks by its weight in that table; an ignored input is a bare read. Painting the full table with full weights instead costs 0.00% on random tables at every arity; on its classes the deletion costs at n=10/12: one ignored input +75.71 / +90.71%, two +190.45 / +251.55%, three +338.81 / +516.61%, a half-constant table +4077.03 / +14209.21%"
