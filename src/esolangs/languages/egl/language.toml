witnesses = "esolangs.languages.egl.tests.resource_witnesses:resource_tables"

[resource_evidence.execution]
# The worst row paints T-1 ones and takes every guard.
expression = "(1+R)*(3T+85n+5+min(1,max(0,n-3))*(-T+2^min(n,floor((n+3)/2))+5T/2^min(n,floor((n+3)/2))-6))+R"
source_terms = { names = ["R"], provider = "esolangs.languages.egl.proof_formulas:execution_terms" }
exact = true
arities = [1, 2, 3, 5]
first = 1
unit = "commands"
description = { growth = "linear", claim = "worst", template = "{claim} {formula} {unit}. R marks wrapping with additional no-ops" }

[resource_evidence.workspace]
# Small grids retain the original cursor offsets. Large grids use a seven-bit guard allowance.
expression = "(1-G)*(3T+2n+10+bl(L-digits(T)-3)+bl(L-digits(T)-9))+G*(W*H+7+2max(1,bl(W-1))+2max(1,bl(H-1))+2max(1,bl(B)))+2bl(n)"
source_terms = { names = ["G", "W", "H", "B"], provider = "esolangs.languages.egl.proof_formulas:workspace_terms" }
exact = true
arities = [1, 2, 3, 5]
first = 1
unit = "bits"
description = { growth = "linear", claim = "worst", template = "{claim} {formula} {unit}. G marks the grid route, W and H are its dimensions, and B counts body characters" }

[resource_evidence.scaling]
# Every input matters in the off-diagonal zero witness. Ignored reads
# reduce the grid and replace a weighted guard by x.
cases = [
    { through = 3, expression = "3T+25n+digits(T)+8" },
    { expression = "2T+2^⌊(n+3)/2⌋+5·2^(n-⌊(n+3)/2⌋)+25n+digits(2^⌊(n+3)/2⌋)+digits(3·2^(n-⌊(n+3)/2⌋))+1" },
]
exact = true
arities = [1, 2, 3, 4, 5]
first = 1
unit = "characters"
description = { growth = "linear", claim = "worst", template = "{claim} {formula}: T-1 painted ones" }

