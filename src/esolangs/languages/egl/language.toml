qualification = "row 1 is painted with the table and each essential input's `(-...)` guard walks the row-0 pointer right by that input's Horner weight, so `v=` prints the indexed cell"
scaling = "linear: worst 3T + 25n + digits(T) + 8 characters: painted row"
execution = "linear: worst 3T + 85n + 5 commands: paint at most T-1 ones; weights sum to T-1"
workspace = "linear: worst 3T + 2n + 10 + bl(L-d-3) + bl(L-d-9) + 2bl(n) bits, d the digits of T"

