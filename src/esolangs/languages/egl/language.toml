[ablations.symmetric_count]
kind = "archive"
saving = 62.3
arity = 8
seed = "named symmetric tables"
tables = 5
verdict = "kept under the named-function rule: a table depending only on how many essential inputs are 1 walks one cell a 1 over m + 1 painted entries, raced by length against the weighted build. At n=7 / 8 / 10: parity 43.5% / 58.2% / 82.0%, majority 43.5% / 56.7% / 81.2%, and 38.4% / 52.8% / 78.6%, or 47.8% / 62.3% / 84.4%, exactly-2 40.2% / 54.1% / 79.0%; a symmetric table with an ignored input 43.5% at n=8. Random tables: 0 of 200 change at n=5..8. Exhaustive n<=3: 38 tables change, none grows, every changed program executed; named tables executed through n=10"

[ablations.counter_offset]
kind = "archive"
saving = 27.0
arity = 7
seed = "random.Random(n)"
tables = 200
verdict = "kept 2026-10-30 on the named-function clause (random declines, named functions flat; Nandypants read_ladder precedent): the 48 `-` per input that subtract '0' from each read become a 6x8 counter loop on a scratch cell one row below the read cell (`v++++++(-^--------v)^`, 21 chars for 48), grid `size,3` with the table in row 2 and the program ending `vv=`, on every route including the symmetric race. A fixed 27n saving, so random tables fall 27.0 / 20.1 / 13.7 / 8.7% at n=7 / 8 / 9 / 10 (200 tables at n<=8, 100 above: 138,770 -> 101,370 and 213,140 -> 170,340 chars at n=7, 8), 41.5 / 42.9 / 41.3 / 38.1 / 33.3% at n=2..6, while parity, and, or, majority and threshold-2 fall about 48% at every n=7..10 (parity 392 -> 205 / 446 -> 232 / 502 -> 261 / 556 -> 288) and balanced area alike (parity 392 -> 210 / 450 -> 242 at n=7 / 8). 0 of 200 per n=2..8, 0 of 100 at n=9, 10 and 0 of the 276 tables at n<=3 grew. Executed through esolangs.run: every row of every table at n<=3, of the five named functions and of 50 random tables at n=7 and n=8; the wrong-table control (or program against the and table) fails"

