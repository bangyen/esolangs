[ablations]
audited = "2026-10-19"

[ablations.essential_projection]
saving = 72.4
arity = 10
verdict = "kept: canonical, exempt. An ignored input's stage is one inert setter row off the path and the cascade indexes the projected table alone. By area: 44.6% at n=8 and 48.2% at n=10 with one ignored input, 67.4% / 72.4% with two; 0.0% on random tables. The docstring's -46.8% / -70.5% at n=8 measures 44.6-45.0% / 67.4% on every construction tried; see the stale-figures list"

[ablations.constant_tail_fold]
saving = 55.0
arity = 10
verdict = "kept: the cascade's trailing constant span is not drawn -- a 0 tail is dropped (running off the grid halts) and a 1 tail is one drained ring that pops the markers the dropped rows would. On random tables the tails are ~2 entries (1.59% at n=6 falling to 0.11% at n=10 by area); on its class at n=10 a constant last quarter saves 17.4% (0-suffix) / 29.5% (1-suffix) and a constant last half 38.1% / 55.0%"

[ablations.area_default]
saving = 27.6
arity = 10
verdict = "kept: the default is the smaller by area of the unfolded cascade and the four folds (ties keep the cascade; constants keep their direct build). Total area over 200 random tables: 11.2% at n=6, 13.0% at n=7, 18.5% at n=8, 27.6% at n=10. Execution grows past the cascade's 10T + 6n + 26: a folded run adds only corridor cells, none touching the queue. A strip's exit corridor is at most used + 20 cells (1 turn, 4 left, 2 + used up, 11 across, 2 down) and the blocks run as in the cascade, so the corridors add at most the lines T + 6n + 9 plus 20 a non-last strip. At most n + 1 such strips hold a stage or the middle (one block each at worst); the leaf-only ones hold at least cap - 1 of at most T + 1 lines, cap >= 7 the strip height less 3 and cap - 1 >= 8 from n=4. Steps are so at most 11T + 32n + 56 + 20(T + 2)/(cap - 1), which 12T + 32n + 92 covers at every n (tightest at n=5, cap 11; below T from n=8). Workspace: queue and heading bits are the cascade's, and row plus column bits are at most bl(area) + 1 <= bl(3T+6n+5) + 4, one more than the cascade's, hence T + 12"

[ablations.constant_direct_path]
saving = 89.8
arity = 10
verdict = "kept: canonical, exempt. A constant table halts on an empty pop or circulates one right heading instead of cascading, with the input setters off those paths. Area at n=10: 11 vs 108 against the cascade build for the all-zero table (89.8%), 44 vs 120 for the all-one table (63.3%)"
