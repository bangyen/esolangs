[ablations.constant_table_audit_20261101]
arity = 8
saving = 10.6
seed = 0
tables = "both constants n=1..12; exhaustive all tables/rows n=1..3; six witnesses/all rows n=4..6"
verdict = "kept: canonical fixed-output spelling. Push the answer once and duplicate it as each numeric read address; reads alter only the heap, so the original stack literal remains the answer. Exactly L=7n+11+b chars and 2n+3 commands. Written bits at most 5+bl(2n+3)+bl(2n-1), attained when some input is one; all-zero input leaves the sparse heap read-only. n=8 zero/one 75/76 -> 67/68 chars; command count stays 19, workspace 13 -> 14 bits within the unchanged ledger. n=12 107/108 -> 95/96. n=3 corpus 35842 -> 35836 chars. Explicit end and meaningful whitespace remain intact. Each language passed 5656 paired old/new row executions; all 270 nonconstant programs through n=3 stay byte-identical. Both constants n=1..12 execute in default, width=1 and balanced layouts. All 24 balanced scores per language improve or match; all eight benchmark size/command pins remain unchanged. Owned regressions check resources, all reads before output and a preserved following record; bit readers also finish the whole last byte without EOF probes. No new collected cases."

