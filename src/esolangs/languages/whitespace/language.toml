# Language-owned data, one section per dataset; aggregators read
# only their own section and skip this file when it is absent.

[curation]
backlinks = 58

[proof_status]
labels = ["linear lookup"]
qualification = "the inputs form a Horner row index and the table is one binary literal halved once per index step"
scaling = "linear: worst T + 32n + 147 characters: one literal"
execution = "linear: worst 19T + 8n commands: the loop runs once per index step"
workspace = "linear: at most 2T + n + 19 bits: the literal on the stack and in the heap"

[catalogue]
folding_constant = "a constant table prints its bit; any other is one literal, with no subtable to fold"

[schemes]
folds_without_tree = true

