# Language-owned data, one section per dataset; aggregators read
# only their own section and skip this file when it is absent.

[curation]
backlinks = 58

[proof_status]
labels = ["linear lookup"]
qualification = "inputs build 2**index; dividing one packed literal exposes its answer bit"
scaling = "linear: worst S characters: one literal and shared step"
definitions = ["S = 65 at n=1; otherwise T+4n+70"]
execution = "poly n: worst 16 at n=1, otherwise 12n+7 commands: calls never nest"
workspace = "linear: worst 14 at n=1, otherwise 5T-3+bl(n+17)+bl(n+2)+bl(2n-1) bits: stack, sparse heap and cursors"

[catalogue]
folding_constant = "a constant table prints its bit; any other is one literal, with no subtable to fold"

[schemes]
folds_without_tree = true

