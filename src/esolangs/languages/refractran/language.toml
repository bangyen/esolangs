verdict = "kept 2026-11-02 as the named repair of complement_rail_sharing. n=7/8 source 1486 -> 801 / 1757 -> 946 chars (46.10/46.16%) for both polarities. At n=12/16/20 it is 2830 -> 1495 / 3984 -> 2049 / 5196 -> 2665 (47.17/48.57/48.71%). Ordinary pruned parity has 2n-3 internal muxes and two bottom nodes; the complemented chain has n-1 internal muxes and one bottom node. Each internal mux contributes 26*log10(n) denominator characters asymptotically; initial factors contribute 3n*log10(n) versus 2n*log10(n). Total leading costs are 55n*log10(n) versus 28n*log10(n), proving a limiting saving of 27/55 (49.09%). Recognition is an O(T) pass and direct signed-chain construction O(n), with no searched terms or arity cap. Every generic function keeps the canonical pruned DAG. For n=1 negated parity one row costs two more inspections than pruning alone; no such row regression occurs in the larger measured parity corpus. This is source admission, not an execution-gate exception. All input exponent slots stay ordered with the same (0,1) fills."

