verdict = "retired 2026-10-28 (random + named bar): stopping the walk's preload at the last 1 saved 0.00% at n=7 and 0.13% at n=8 on 20 seeded random tables (18,024 -> 18,001 chars) and 0 chars on parity, majority, and, or and a threshold at n=7..12 (their last 1 is the final row or they take the tree); it earned 31.3% only on front-half tables (ones ending early), an ad hoc class. The preload now spans every row; n=10 random 1847 grows 3,235 -> 3,236 chars and the dense n=10 pin 3,251 -> 3,252. The scaling bound already priced a last 1 at the final row, so the formula and class are unchanged; balanced area (max(rows, cols) squared) within 5% across the retiring commit on parity, majority, and, or, thr2, their complements and 10 random tables at n=7, 8, 10"

