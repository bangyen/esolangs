[resource_evidence]
version = 2
construction = "esolangs.languages.s_bleq.generator:s_bleq_request"

[resource_evidence.execution]
# Tree: an entry jump, n reads and at most n tests and n-1 relays, then print and halt.
# Packed global envelope: 8T+(7n+5)(⌊T/n⌋-1)+26n-8, attained with the last full chunk all ones.
expression = "E+(1-K)*(3n+2)"
source_terms = { names = ["K", "E"], provider = "esolangs.languages.s_bleq.proof_formulas:execution_terms" }
exact = true
arities = [1, 2, 3, 4, 5, 6, 7, 8, 9]
first = 1
unit = "instructions"
description = { growth = "linear", claim = "worst", template = "{claim} {formula} {unit} through n=9, at most beyond. Packed route K costs E" }

[resource_evidence.workspace]
# A zero input cell becomes signed 48 or 49, adding six bits.
expression = "B+6n+bl(3R)+bl(n)+1"
source_terms = { names = ["B", "R"], provider = "esolangs.languages.s_bleq.tests.formulas:workspace_terms" }
exact = false
arities = [1, 2, 3, 4, 5, 6]
first = 1
unit = "bits"
description = { growth = "linear", claim = "at most", template = "{claim} {formula} {unit}. B counts signed memory bits and R counts cells" }

[resource_evidence.scaling]
# The packed route adds two separators and the decimal literal
# width for each chunk. At n=5..10 the generator races the tree;
# under five inputs only the tree is available.
cases = [
    { through = 4, expression = "Q" },
    { through = 10, expression = "min(Q,175n+717+2(digits(n)-1)+A+⌊T/n⌋(2+digits(T-1))+min(1,T%n)(2+digits(2^(T%n)-1)))" },
    { expression = "175n+717+2(digits(n)-1)+A+⌊T/n⌋(2+digits(T-1))+min(1,T%n)(2+digits(2^(T%n)-1))" },
]
source_terms = { names = ["A", "Q"], provider = "esolangs.languages.s_bleq.tests.formulas:scaling_terms" }
exact = [11, 12, 13, 19, 20, 21, 22, 23, 24, 25]
arities = [5, 8, 10, 11, 12, 13, 19, 20, 21, 22, 23, 24, 25]
first = 11
unit = "characters"
description = { growth = "linear", claim = "worst", template = "{claim} {formula}; through n=28" }

