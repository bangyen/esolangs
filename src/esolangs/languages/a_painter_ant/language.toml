[ablations.trailing_run_trim]
saving = 790.7
arity = 12
verdict = "kept: the corridor ends where the trailing run of equal answers starts; a walk halts at the corridor's end and every index past it shares that answer. Painting the full corridor instead costs +768.42 / +790.73% at n=10/12 on OR and dense tables and +480.26 / +494.21% on sparse tables; on random tables only +0.08 / +0.02%, since a random trailing run is ~2 rows. The saving is proportional to the trailing run, not a fixed amount. Plain-rewrite audit 2026-10-28 (20 random tables per n, Random(1000n+s).getrandbits(1<<n), plus named tables; plain build = full corridor on both forms): random 0.62% / 0.39% at n=7 / 8 (balanced 1.08% / 0.63%); or/nor 86.4% / 87.5% / 88.5% at n=7 / 8 / 10 (nor 79.8% / 81.4% / 82.8%), popcount>=2 43.3% / 43.9% / 44.3%, popcount>=3 22.2% / 22.4% / 22.4%, majority 11.5% / 7.8% / 4.1%; balanced area or 86.5% / 86.9% / 88.1%; share holds across n, kept for the or/nor and threshold family"

[ablations.flipped_corridor]
saving = 5103.0
arity = 10
verdict = "kept: a table with a long leading run walks the mirror corridor (top index first, a zero input walks the lane east, a white wall cell and lane stopper clamp it), as cheap as the OR-like form. Dropping it costs +476.47 / +762.74% on and / nand at n=10 (6,174 vs 1,071, 9,240 vs 1,071) and 0.00% on parity; thresholds k=7 / 8 / 9 at n=10 +8.4 / +23.9 / +69.0% (+0.9% on majority); random tables at n=7 / 8 +0.31 / +0.16% (20 seeded). Share on and holds across n=7..12 (-79 to -83%, nand -86 to -89%). Plain-rewrite audit 2026-10-28 (same tables): random 0.17% / 0.10% at n=7 / 8 (balanced 0.44% / 0.16%); and 79.0% / 81.0% / 82.7% and nand 85.8% / 87.2% / 88.4% at n=7 / 8 / 10, balanced and 77.4% / 80.1% / 82.4%; majority 0.0% / 1.8% / 0.9%, parity, or, nor and thresholds 0.0%; kept for the and/nand family"

[ablations.westward_build]
