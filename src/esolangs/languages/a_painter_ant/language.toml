verdict = "rejected 2026-11-02: dropping the leading E reset lets wP paint a new west cell on later passes; table00000001/input000 fails the two-pass invariant. Omitting W instead prevents walking an already-white corridor. A valid repair retains both E-to-end and W-return runs, uses wPW for the corridor, and makes the first answer white so later answer sweeps freeze on the corridor. Native4840 rows pass, but source grows n3 12327->14875, n7 166478->194790, n8 332485->387278. No unseen global impossibility is inferred; this repair simply fails admission."

