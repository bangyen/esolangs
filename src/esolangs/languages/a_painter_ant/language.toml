[ablations.eastward_flipped_build]
arity = 16
saving = 14.28
seed = "strict full-input popcount>=n-1 and its negation; generic seed1000*n+i above"
tables = "both named functions through n16; generic200 each n7/8; all tables/rows n<=3"
verdict = "kept 2026-11-02 only for the named all-but-one threshold family. The repaired mirror starts at its wall, plants its lane stopper, then builds westward to the input origin. Later E reaches that wall and exactly C west steps return to the origin; one old W run of C-1 chars disappears. Generic application saves only .208%/.098% at7/8 and AND/NAND only1 char, so none ships there. Named source n7 507/509->442/444 and n8 961/963->832/834, at least12.77%/13.39%, sustained above10%. For n>=5,C=T/2+2: old7T/2+6n+17 and new3T+6n+16, plus2 for the negation. Saving(.5T+1)/(3.5T+6n+17) increases since successive cross-product difference is(3n+2)T-6>0 (negation3n+3), tending1/7=14.2857%; n16 229489/229491->196720/196722. No peak/window workaround or arity cap. Recognition counts the n+1 answers at indices T-1 and T-1-2**i, a direct O(T) rule. Four candidates and the uniform ordered(n,N) fills remain. Other functions retain byte-identical programs; n3 totals12327 chars/197232 commands and all eight pins stay unchanged. Both n10 anchors execute unchanged (parity6684,and1071). Balanced grid_area n7 512->450,n8 968->840 for both polarities; named workspace peaks n7 550->637,n8 1142->1299 bits, within the unchanged cap. Public bytes match the prototype;7936 native rows plus108 resource runs cover every small row, samples, every named row through8 and boundary rows through12, default/width1/balance. Earlier unqualified prototype additionally ran9888 rows and the named curve through16 executes. Wrong-table and membership mutations fire. Source/E caps remain valid since this family only shrinks and reaches a fixed point after one pass. For n>=4 the selected mirror paints C+n+3<=T+1 cells, each <=n+3 bits including negative-coordinate signs, and ant coordinates total<=2(n+1) bits. Then(n+3)(T+1)+2(n+1)<=2(n+1)T+3 since(n-1)T-3n-2>=0; the existing workspace cap including bl(L-1) survives. n2/3 programs remain unchanged."

