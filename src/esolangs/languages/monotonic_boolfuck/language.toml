verdict = "kept: minimal spelling, exempt. Cancel adjacent >< moves; the infinite zero tape is not allocated by moving, and no read/write lies between. Sizes 535666->517514 (3.39%) at n=7 and 1077536->1041524 (3.34%) at n=8 on 200 Random(1234+n) tables each; every small table/row and four rows per priced table pass, no table grows. n=3 total 37970->36526 and command sum 131664->127936. Root constants, parity Size anchors, worst size/step formulas and workspace cap stay valid; actual resource probes n=1..6 pass. Owned nonconstant tests require all reads before output and preserve a following byte."

