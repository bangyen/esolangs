verdict = "rejected: removing unread suffix consumption from table 0001 prints after one read instead of two, caught by a read-first positive control; shipped output consumes both. Omitting only the final two zero output bits is semantically correct with documented halt padding, but on 200 Random(1234+n) tables per n=7,8 saves only 4.03%/4.02% (535666->514060, 1077536->1034240). All small rows and four rows per priced table execute; n=3 command sum 131664->127568 (3.11%), below the execution gate too. No input-consumption weakening."

[ablations.trick_prototype_20261101_opposite_pointer_moves]
