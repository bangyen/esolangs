[ablations.constant_table_audit_20261101]
kind = "archive"
arity = 8
saving = 44.3
seed = 0
tables = "both constants n=1..12; exhaustive all tables/rows n=1..3; six witnesses/all rows n=4..6"
verdict = "kept: canonical whole constants. Plant n ones; the read loop consumes a byte on the current one, steps right and retests until the fresh zero sentinel. No bit is cleared. From n=2: L=3n+19+2b chars, 14n+9+2b commands; one input is a direct 20-char/command path. Written bits 12+bl(L-1)+2bl(n)+sum(bl(i),i=1..n-1) on the unary route; the direct route uses 19. n=8 zero/one 78/80 -> 43/45 chars, commands 78/80 -> 121/123, workspace 24 -> 43 bits within unchanged ledgers. n=12 110/112 -> 55/57. n=3 corpus 37990 -> 37970 chars. Each language passed 5656 paired old/new row executions; all 270 nonconstant programs through n=3 stay byte-identical. Both constants n=1..12 execute in default, width=1 and balanced layouts. All 24 balanced scores per language improve or match; all eight benchmark size/command pins remain unchanged. Owned regressions check resources, all reads before output and a preserved following record; bit readers also finish the whole last byte without EOF probes. No new collected cases."

[ablations.trick_prototype_20261101_halt_elision]
