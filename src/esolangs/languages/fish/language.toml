[ablations.symmetric_count]
saving = 32.5
arity = 8
seed = "named symmetric tables"
tables = 5
verdict = "kept under the named-function rule, by area: a table depending only on how many essential inputs are 1 adds each bit (i68*-+) and indexes m + 1 entries; it replaces the plain two-row candidate, which still races the packed row. Majority, and, or and exactly-2 all 26.7% at n=4, 26.2% at n=6, 23.3% at n=7, 32.5% at n=8, 55.8% at n=10 (parity keeps its table-free path); a symmetric table with an ignored input 20.3% at n=8. Random tables: 0 of 200 change at n=5..8. Exhaustive n<=3: 34 tables change, none grows in area or characters, every changed program executed; named tables executed through n=10"

[catalogue]
folding_constant_local = "input_weights"  # one projected grid cell

[schemes]
folds_without_tree = true

[ablations]
audited = "2026-10-19"

[ablations.input_projection]
saving = 700.0
arity = 12
verdict = "kept: canonical, exempt. The only mechanism on the default path, priced by area (chars agree in direction): the table in the codebox is read on its essential inputs only, an ignored input read and dropped. The program is two rows, header over table, so the area is 2 x 2^k for k essential inputs and the price is 0.00% on random tables and every all-essential class; on its class the deletion costs are exact multiples at n=10 and n=12 — one ignored input +100.00%, two +300.00%, three +700.00%, constant tables +3,431.03% at n=10 and +12,312.12% at n=12"

[ablations.packed_row]
saving = 89.8
arity = 12
seed = "random.Random(184700 + n)"
tables = 200
verdict = "kept, priced by area: one row holding the code, six powers of two and the table packed six entries a printable cell (codes 35-98), against the two-row header over table. Area 4.7% on random tables at n=6, 48.0% at n=7, 67.0% at n=8, 84.8% at n=10, 89.8% at n=12 (20 tables), rising; characters fall too (33.8% at n=7, 72.2% at n=10). Taken whenever smaller in area (characters break ties), so from n=4 (packing saves 5.6-6.6% of area at n=4..5 but costs 17-35% more characters). Majority and and at n=8 halve; parity keeps its column. Exhaustive n<=3 unchanged; random samples executed at n=4..12. Supersedes a plain single row (table after the header, 14.8% at n=7), which packing beats from n=6"

[ablations.balance_packed_fold]
saving = 58.1
arity = 8
seed = "random.Random(131s + n), s = 0..19"
tables = "20 random per n=7,8 (5 per n=9..12) plus and/or/nand/nor/parity/majority/threshold-3/threshold-(n-1) at n=7..10"
verdict = "kept: balance folded only the unpacked table (n=8: side 34), never the packed row (169 cells in 1 row). The packed fold keeps the code as a snake of c columns, the six powers in the row under it and the cells in c-wide rows below, addressed by (i % c, rows + 1 + i // c) at about 19 extra characters; c is 0.9 / 1.0 / 1.1 / 1.2 times sqrt(2 len(packed row)), within 4.2% of the best width of a 4..89 sweep over 71 tables n=3..10. Balanced area (score squared): -55.6% / -58.1% on random tables at n=7 / 8 (side 30 -> 20, 34 -> 22), -64.6% / -82.0% / -76.4% / -88.5% at n=9..12 (5 tables each, still growing); named: and/or/majority/thresholds -55.6 / -58.1 / -64.6 / -82.0% at n=7..10, parity -55.6 / -58.1 / -64.6 / -66.0% (it beats the one-column parity program). The default is byte-identical on all 72 tables. Every balanced program ran on every row (72 tables, n=7..10, 0 bad), a wrong table failed on each; 1,416 tables (all n<=3, sampled n=4..6 with ignored inputs) and the fold at 12 widths 4..64 on 150 tables ran too, 0 bad"

[ablations.balance_unpacked_folds]
saving = 0.0
arity = 8
seed = "random.Random(4242 + n)"
tables = "20 random per n=3..8, every table at n=1,2, plus parity/majority/and/or/nand/nor/threshold-3/threshold-(n-1)"
verdict = "retired 2026-10-28 (plain-rewrite audit): balance also tried the unpacked table folded at every power-of-two width; it never beat the default or the packed fold, so balanced area is identical without it on every table at n=1..8. Every balanced program ran (0 bad), a complemented table failed. _folded still serves explicit widths"

[audits]
trick_prototype = 2026-10-30
plain_rewrite = 2026-10-28
