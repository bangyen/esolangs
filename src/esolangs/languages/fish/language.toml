[proof_status]
labels = ["finite lookup"]
qualification = "the inputs form a Horner index and g fetches its table bit; six-bit packing is used only while float coordinates remain exact"
scaling = "linear: worst F cells from n=2: exact-address packing or plain"
execution = "poly n: worst 9n+9 commands for n = 2, then E: packed literals have c cells"
workspace = "poly n: at most bl(9n+8)+n+13+bl(n) bits for n = 2, then bl(S-1)+bl(n)+1+max(2max(7,n)+3,bl(s)+71)"
definitions = ["c = 3 to n = 45, then 2bl(s)-1: column-literal length", "S = 4n+37+2c; E = max(S,6n+9) to n=55, then 9n+9", "s = 15⌈(4n+43)/15⌉ to n = 45, then the two-pass column"]

