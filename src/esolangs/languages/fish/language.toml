# Language-owned data, one section per dataset; aggregators read
# only their own section and skip this file when it is absent.

[curation]
backlinks = 91

[proof_status]
labels = ["finite lookup"]
qualification = "the inputs form a Horner row index and `g` reads that column from the table row"
scaling = "linear: T table cells, one g at the index"
execution = "poly n: worst 9n + 9 commands, n Horner reads and one `g`"
workspace = "poly n: worst n + 13 + bl(9n+8) + bl(n) bits: one stack, x"

