# Language-owned data, one section per dataset; aggregators read
# only their own section and skip this file when it is absent.

[curation]
backlinks = 91

[proof_status]
labels = ["finite lookup"]
qualification = "the inputs form a Horner row index and `g` reads that column from the table row"
scaling = "linear: worst T + 9n + 10 characters, packed past n = 5"
execution = "poly n: worst 9n + 9 commands to n = 5, then 9n + 33 + 2c: Horner reads, one lookup"
workspace = "poly n: worst bl(9n+8) + n + 13 + bl(n) bits to n = 5, then bl(S-1)+bl(s)+bl(n)+71"
definitions = ["c = 3 to n = 20, then 1 + 2bl(column): the packed column literal's characters", "S = 9n + 33 + 2c commands run; s = the packed column, 15⌈(9n+39)/15⌉ to n = 20"]

