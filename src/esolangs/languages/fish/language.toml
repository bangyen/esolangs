[ablations.constant_table_audit_20261101]
arity = 8
saving = 62.0
seed = 0
tables = "both constants n=1..12; exhaustive all tables/rows n=1..3; six witnesses/all rows n=4..6"
verdict = "kept: canonical read-first fixed output. Each i~ reads and drops one byte; push 0/1, print numerically and halt. Default A=E=2n+3 cells/commands, W=7+bl(2n+3)+bl(n) written bits. A fitting width keeps the exact row; narrow widths use one vertical column below three, otherwise a serpentine fold. Balanced widths follow W(W-2)=2L, and the neighboring candidates match the complete supported-width oracle through n=12. n=7 46 -> 17 cells (63.0%); n=8 50 -> 19 cells (62.0%), 25 -> 19 commands, 23 -> 16 written bits; n=12 66 -> 27 cells. n=3 corpus 17206 -> 17164 cells (10684 -> 10668 chars). Each language passed 5656 paired old/new row executions; all 270 nonconstant defaults through n=3 stay byte-identical. Both constants n=1..12 execute default, width=1 and balanced. Separate 1120-run native probes per language cover every row through n=8. All 24 balanced scores per language match or improve; all 24 benchmark size/command pins across the batch remain unchanged. Owned checks enforce all reads before output, no EOF probe and a preserved following record. No new collected cases."

[ablations.horner_raw_reads_trick]
arity = 8
saving = 26.6
seed = "random.Random(184700+n), sequential choice"
tables = "200 generic tables per n=7/8; exhaustive all tables/rows n<=3; five generic+six named per n=4..6"
n3_grid_cells = 16348
n3_source_units = 15360
n3_commands = 99824
verdict = "kept 2026-11-02 by the20% declining source gate: fixed n7/8 area26600->20600 (22.56%) /33800->24800 (26.63%), no growing default or balanced layout in the small/sample corpus. A=-48 initially and A'=2A+ASCII leaves r-48; ignored i~ leaves it unchanged. Since48 is divisible by6, bit index is unchanged and word quotient is q-8; offset14=6+8 restores the packed coordinate. Packed folds add8 before their existing coordinate split. Column literals, data/powers, input order, canonical projection, parity/constants and uniform char-stream input remain unchanged. No old-source min fallback was added. Existing symmetric_count remains solely to preserve O(n) named source. Balanced grid_area34000->28800 /44000->32400 on the same200 tables. Measured per-table curve n7/8/9/10/12/14:133->103 /169->124 /212->182 /312->267 /839->794 /2902->2842; Exact full-essential area arithmetic enumerates n7..55, including n11/13 and literal transitions21/22/46/47/50: the valid-packed peak is n8 (26.6272%). Emitted packed primitives n3..16 match the formula and execute. At56 the mandatory corrected-old/new precision baselines both use identical integer plain lookup, so all later full-essential savings are exactly0 and no later column-rounding jump exists. The packed arithmetic removes O(n) code/padding against Theta(T) data. n3 area17164->16348 (-4.75%), chars10668->15360 (+43.98%), commands68816->99824 (+45.06%); earlier packed selection is an explicit runtime/text tradeoff. Native default W maxima n3 24->86, n7 88->89, n8 89->90. S=4n+37+2c packed commands; nonsymmetric plain lookup cannot win while exceeding S (then m>=7 and its packed area is below2^(m+1)); symmetric sums give6n+9. Thus default E=max(S,6n+9) through full arity55, then9n+9 at the precision stop. Source F is the packed column plus6+ceil(T/6), then2T from56. Packed stack peak max(2max(7,n)+3,bl(s)+71) covers duplicated signed indices or bit/float/column/14; add ip/input/halt. The same cap dominates plain/parity/constants; it is an upper bound globally and remains exact on all old rungs. Old source/E/W rungs3..7 plus valid n2 coverage retained. 33520 raw-variant small/sample default/balanced rows,4000 judge rows,30720 full larger rows and48 forced-fold resource rows passed;40 wrong-offset controls fail. No new collected test cases."

