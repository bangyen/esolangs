[ablations.symmetric_count]
saving = 32.5
arity = 8
seed = "named symmetric tables"
tables = 5
verdict = "kept under the named-function rule, by area: a table depending only on how many essential inputs are 1 adds each bit (i68*-+) and indexes m + 1 entries; it replaces the plain two-row candidate, which still races the packed row. Majority, and, or and exactly-2 all 26.7% at n=4, 26.2% at n=6, 23.3% at n=7, 32.5% at n=8, 55.8% at n=10 (parity keeps its table-free path); a symmetric table with an ignored input 20.3% at n=8. Random tables: 0 of 200 change at n=5..8. Exhaustive n<=3: 34 tables change, none grows in area or characters, every changed program executed; named tables executed through n=10"

[catalogue]
folding_constant_local = "input_weights"  # one projected grid cell

[schemes]
folds_without_tree = true

[ablations]
audited = "2026-10-19"

[ablations.input_projection]
saving = 700.0
arity = 12
verdict = "kept: canonical, exempt. The only mechanism on the default path, priced by area (chars agree in direction): the table in the codebox is read on its essential inputs only, an ignored input read and dropped. The program is two rows, header over table, so the area is 2 x 2^k for k essential inputs and the price is 0.00% on random tables and every all-essential class; on its class the deletion costs are exact multiples at n=10 and n=12 — one ignored input +100.00%, two +300.00%, three +700.00%, constant tables +3,431.03% at n=10 and +12,312.12% at n=12"

[ablations.packed_row]
saving = 89.8
arity = 12
seed = "random.Random(184700 + n)"
tables = 200
verdict = "kept, priced by area: one row holding the code, six powers of two and the table packed six entries a printable cell (codes 35-98), against the two-row header over table. Area 4.7% on random tables at n=6, 48.0% at n=7, 67.0% at n=8, 84.8% at n=10, 89.8% at n=12 (20 tables), rising; characters fall too (33.8% at n=7, 72.2% at n=10). Taken only when no larger in area and in characters, so n<=5 is unchanged (packing saved 5.6-6.6% of area there but cost 17-35% more characters). Majority and and at n=8 halve; parity keeps its column. Exhaustive n<=3 unchanged; random samples executed at n=4..12. Supersedes a plain single row (table after the header, 14.8% at n=7), which packing beats from n=6"
