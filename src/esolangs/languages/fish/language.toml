[ablations.symmetric_count]
saving = 8.1
arity = 8
seed = "named symmetric tables"
tables = 5
verdict = "kept under the no-size-class-break exception: the count table and reader are O(n), whereas packing alone is O(T). After raw Horner, marginal named area is103->102 (0.97%) /124->114 (8.06%) at fixed n7/8, below10%; balanced grid_area is identical144/162 on all named cases, and totals29664/33372 unchanged on200 generic plus6 named tables. Removing the count would discard its O(n) source class (and eventually balanced class), so it remains. The original named admission before2026-11-02 measured23.3/32.5% at n7/8 and55.8% at n10, 34 changed n<=3 tables and0/200 random changes n5..8; those are historical figures, not current raw-Horner margins. 4608 native no-count named rows verify the ablation."

