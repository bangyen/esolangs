[ablations.reverse_shared_tree_prototype]
saving = 4.1127
arity = 8
seed = "random.Random(1847+n)"
tables = "all tables n=1..3; 20 random plus and/or/parity/majority/threshold-third per n=4..12"
verdict = "near miss, not shipped: race the shared residual tree in reversed test order against the shipped build, permuting the table into that frame while preserving stream read order. Random n=7/8: 14,807 -> 14,474 / 23,926 -> 22,942 chars (2.25% / 4.11%); no random saving at n=9..12. Named functions never reach 10% through n=12; parity saves only 0.15% at n=12. Positive control: 115 corpus programs change. Exhaustive n=3 source 39,372 -> 38,882 chars; commands 29,396 -> 29,252 (0.490%), with four tables slower. 5,110 baseline/candidate output checks correct, exhaustive n<=3 and boundary rows of random/named tables through n=8 plus named through n=12; 2,555 complemented controls rejected. Neither shipping bar passes. Prototype stays in ignored notes; generator, bounds and pins unchanged"

[ablations.constant_table_audit_20261101]
arity = 8
saving = 1.6
seed = 0
tables = "both constants n=1..12; exhaustive all tables/rows n=1..3; six witnesses/all rows n=4..6"
verdict = "kept: minimal fixed-output spelling, exempt from the percentage gate. At n>=3 store the ASCII answer in the first input instruction unused third cell; input always falls through, and every read only overwrites the already executed cell 0. Output reads address 2 rather than a two-digit trailing address. n=1..2 retain their equal-length spelling and balanced layouts; the S*bleq helper remains byte-identical at n=1..100. L=7n+7 chars, E=n+1 commands. Written bits equal the loaded image bits plus 4+bl(3n+3)+bl(n), as in the unchanged registered proof: cell 0 grows from -1 to an ASCII bit. n=7 57 -> 56 chars; n=8 64 -> 63 chars, commands stay 9, written bits 58 -> 55; n=12 92 -> 91 chars. n=3 corpus 39372 -> 39370 chars. Each language passed 5656 paired old/new row executions; all 270 nonconstant default programs through n=3 stay byte-identical. Both constants n=1..12 execute in default, width=1 and balanced layouts. A separate 1120-run native probe per language covers every row through n=8. All 24 balanced scores per language match or improve; all 24 benchmark size/command pins across the batch remain unchanged. Owned regressions check exact resources, every read before output, no EOF probes and a preserved following record. No new collected cases."

[ablations.ignored_io_targets]
arity = 8
saving = 1.001
seed = "Random(1000*n+i)"
tables = "20 random per n7/8; every table/row n<=3; samples4..8; alloriginalsourceexactrungs9..14"
verdict = "kept: canonical minimal spelling. Subleq byte I/O advances unconditionally; its unused third operand is zero. Only the direct tree/packed emitters change, no extra path/state/flags. Constant constructors retain their literal-bearing third cells. Fixed20 n7/8 source15055→14846 /23980→23740 chars; n3 source39370→38100,commands29396unchanged. All8 source pins shrink; last-row/per-row commands unchanged. 4330 paired native outputs/read-first/sentinel checks pass;873 directFalse programs are byte-identical and execute, including S*bleq normal/flipped trees and packed decoder. Packed source bound subtracts only its all-essential nread+output ignored targets; instruction/data injection proves it still bounds projections, with enough full n-bit chunks for every projected partial chunk. Old source exact9..14 and workspace exact3/5/9 scopes/flags retained. FullslowW9 case timed out45s; constructive rows4/8/502/503 plus immutable-image delta proof pass: row503 E8035,W3536→3479 exactly. Both source-worst witnesses also reach their formulas. The timeout is not a passed fullslowcase."

