[ablations.subtree_sharing]
saving = 49.5
arity = 12
seed = "random.Random(184900 + n)"
tables = 30
verdict = "kept: canonical, exempt. A repeated subtree is a block entered through a flag when m * body > body + 5m + 9. 43.3% at n=10 and 49.5% at n=12 on random tables; parity 94.5% / 98.3% (789 chars against 14,283 at n=10); majority 83.6% / 93.7%; AND, OR, NAND and NOR 0.0% (no repeated subtree). Never larger than the plain tree on 253 tables, n=2..12"

[ablations.complement_race]
saving = 28.0
arity = 10
seed = "random.Random(184900 + n)"
tables = "30 random at n<=8, 20 at n=9..10; parity, majority, and, or, thr3 with complements"
verdict = "replaced by a rule, 2026-10-30: the race (min of the plain tree and the complement's, counting down and closing with += 49) saved 0.72% on 200 random tables at n=8, 0.46% at n=10, but 26-29% on OR and NAND at n=10 (410 -> 303, 411 -> 293). Per the bar's named-function clause the race goes and a rule for that family stays: build the complement when ones outnumber zeros. The rule keeps every named gain (OR, NAND, thr2 662 -> 563, thr3 853 -> 779) except !majority at n=9 (859 vs 852), and saves 0.48% at n=8, 0.36% at n=10 on random; it builds one tree instead of two"

