[ablations]
audited = "2026-10-19"

[ablations.input_projection]
saving = 8.4
arity = 12
verdict = "kept: canonical, exempt. Only essential inputs pay the 47-step normalization chain and a tree level; all n inputs are read either way. 0.00% on random tables at n=6..12; with one ignored input 6.1% at n=10 and 2.7% at n=12, with two ignored inputs 16.5% at n=10 and 8.4% at n=12"

[ablations.subtree_sharing]
saving = 353.7
arity = 12
verdict = "kept: canonical, exempt. A repeated subtree is emitted once and later copies jump to it. Its solo price was 0.00% on random tables at every arity in the shipped build, where the lookup leaf absorbed the bottom k levels; with the leaf removed (candidate 25) sharing carries those levels, collapsing them to the few distinct low subtrees. On structured tables it is the build: parity 97.6% at n=10 rising to 353.7% at n=12, majority 73.7% / 280.0%. Jointly with projection, the fold and the leaf removed (plain build), random tables cost 673.0% at n=10 and 1,030.9% at n=12"

[ablations.constant_fold]
saving = 4.2
arity = 12
verdict = "kept: canonical, exempt. A constant subtree jumps to one of the two shared print gadgets instead of an emitted subtree. Solo price 0.00% on random tables; 4.4% / 4.2% on AND and OR at n=10/12, 2.7% / 1.4% on half-constant tables, 2.7% / 4.7% on majority"

[ablations.lookup_leaf]
saving = -34.1
arity = 12
verdict = "removed (retirement candidate 25, 2026-10-20): the tree stopped k levels short (2**k >= 2n) and each leaf carried a 2**k-cell table indexed by an unrolled counter loop. Deleting the stop (k = 0, sharing kept) makes programs smaller on every corpus measured: random tables -15.6% at n=10 and -34.1% at n=12, sparse -30.2% / -51.3%, dense -28.8% / -52.2%, parity -9.1% / -7.7%. The docstring's Theta(T log T) defence priced the unshared tree; with sharing kept, the low levels collapse and the leaf's counter machinery plus printed cells cost more than the branches they replace. The tree now branches on every essential input. See RETIREMENT-CANDIDATES entry 25"

[ablations.routing_race_figures]
saving = 0.0
arity = 4
verdict = "recorded: the comment's routing-race example (0100010011111111 at 1345 vs 1371) half reproduces — 1371 is the shipped essential routing exactly, but 1345 arises under no flag combination of the current emitter; full routing measures 1,763 on this table, so the example's direction has reversed. The race itself is a rejected variant, not shipped, and was not priced. See the stale-figures entry F22"
