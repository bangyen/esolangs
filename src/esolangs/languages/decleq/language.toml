arities = [1, 2, 3, 4]
first = 1
unit = "bits"
description = { growth = "linear", claim = "worst", template = "{claim} {formula} {unit}. B is program bits, R is memory extent and C marks direct constants" }

[resource_evidence.scaling]
# The code header rounds up to a multiple of three. The cells
# include two three-cell read passes and six cells per subtree.
expression = "2(3⌈(n+18)/3⌉)+17n+12residuals_without_constants(n)+16+digits(3⌈(n+18)/3⌉)+2digits(n+17)+(2residuals_without_constants(n)+5)max(2,digits(3⌈(n+18)/3⌉+6n+6residuals_without_constants(n)+9))"
