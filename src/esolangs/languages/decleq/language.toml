[ablations.constant_table_audit_20261101]
kind = "archive"
arity = 8
saving = 34.5
seed = 0
tables = "both constant tables n=1..12; exhaustive all tables/rows n=1..3; six witnesses/all rows n=4..6"
verdict = "kept: canonical whole-constant folding. Reuse one scratch cell for all n reads, print one literal, then decrement a dedicated zero and jump past memory. Every instruction has three operands; I/O c names the next instruction, preserving both fall-through and jump-to-c readings. Exactly n+2 commands and 3n+9 cells. Written bits M+6+bl(3n+9)+bl(n), M the initial cell bits: scratch grows by five and halt zero gains a sign bit. n=8 142 -> 93 chars; n=12 184 -> 129. n=3 corpus 46278 -> 46204 chars. Each language passed 5656 paired before/after row executions; all 270 nonconstant programs through n=3 stay byte-identical. Both constants n=1..12 execute in default, width=1 and balanced layouts. All 24 balanced constant scores improve or match; all eight benchmark size/command pins remain unchanged. Owned regressions check exact resources and every input slot; stream readers preserve an unread sentinel and read before output."

