# Native constants add five scratch bits and one sign bit. Other tables peak on pass 16.
expression = "B+bl(R)+bl(n)+5n+5-C*(5n-1)"
source_terms = { names = ["B", "R", "C"], provider = "esolangs.languages.decleq.proof_formulas:workspace_terms" }
