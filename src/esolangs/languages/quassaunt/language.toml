[ablations.constant_table_audit_20261101]
arity = 12
tables = "both constants at n=1..12, every row through n=3 and four rows thereafter"
verdict = "kept: canonical constant output, percentage gate exempt. Read all inputs then print the literal without definitions or evaluated chains: 12n+20 characters, n+2 commands, and exactly 96n+161+bl(n+1)+bl(n) written bits. At n=8, characters 1272 -> 116, commands 150 -> 10, sampled written peaks 17948 -> 937 bits; warm generation medians 34.83/34.46 -> 2.21/2.17 us for zero/one. At n=12, characters 1858 -> 164, commands 218 -> 14, peaks 26029 -> 1321 bits. Both versions passed 200 executions; all 270 nonconstant programs through n=3 are byte-identical. Sentinel regressions pin n=8 size and every required read. The workspace formula handles direct constant frames separately; generic envelopes and existing size pins remain unchanged."

