# Language-owned data, one section per dataset; aggregators read
# only their own section and skip this file when it is absent.

[curation]
backlinks = 3

[proof_status]
labels = ["tree"]
qualification = "each distinct subtable's code is stored once in a global and run by name; a node tests its character's set {2, c} against {1} with `%%Ifpropersubset`; equal halves and constant chains read their bits unbranched"
scaling = "linear: O(T/n) nodes with O(n)-digit names"
execution = "linear: at most 5⌊L/57⌋ + 21n + 9 steps: five a stored node, 21 a level"
workspace = "linear: at most 24L bits: the running code, the stored code and the stack, each within the source"

