unit = "steps"
description = { growth = "linear", claim = "worst", template = "{claim} {formula} {unit}. C marks shared stores and Q counts concatenations" }

[resource_evidence.workspace]
# The raw frame retains the extra literal words and concatenate commands introduced by cuts.
expression = "8R+(1-C)*(8(n+1)+bl(n+1)+1)+C*(8(26+2B+3A+2H+K)+10+bl(W-1))+bl(n)"
source_terms = { names = ["C", "R", "B", "A", "H", "K", "W"], provider = "esolangs.languages.quassaunt.proof_formulas:workspace_terms" }
exact = true
arities = [1, 2, 3, 4, 5, 6]
first = 1
unit = "bits"
description = { growth = "linear", claim = "worst", template = "{claim} {formula} {unit}. C shared stores, R characters, W words, A names, B bodies, H helper, K longest key" }

[resource_evidence.scaling]
