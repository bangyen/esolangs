[ablations.subtree_sharing]
saving = 483.1
arity = 12
verdict = "kept: canonical, exempt. Every distinct subtable is stored once under its id and evaluated by name. Storing every tree position under its own name instead costs +237.05% at n=8, +339.87% at n=10 and +483.14% at n=12 on random tables, and +23,604.68% on parity at n=12; only +2.80% on constant tables, where the chain collapse still descends a single path"

[ablations.halves_agree_fold]
saving = 0.9
arity = 12
verdict = "kept: canonical, exempt. A node whose halves agree (or whose subtable is constant) takes a chain body that reads the input and evaluates the one child; it is also how an ignored input is absorbed, there being no separate projection step. Deleting the collapse costs +3.32 / +1.71 / +0.92% on random tables at n=8/10/12, but +45.91 / +46.74 / +47.31% on constant tables and +9.25 / +8.24 / +7.41% on majority"

[ablations.disjoint_branch]
saving = 18.5
arity = 8
seed = "random.Random(1000 * n + s)"
tables = 20
verdict = "kept: a branch pushes the two children's names, {c} and a stored {1} and tests with %%Ifdisjoint, then obtains the chosen code once, where it pushed both bodies and {2, c} for %%Ifpropersubset. Reverting costs +21.5% / +22.7% / +23.4% chars on random tables at n=7/8/9 (204,251 / 344,281 / 596,346 against 168,131 / 280,529 / 483,138) and the saving is 10-18% on parity, and, or, majority, threshold-2 at n=8 (3,418 / 2,915 / 5,523 / 4,219 against 2,800 / 2,605 / 4,685 / 3,645). Every n<=9 row of parity, and, or, majority, threshold-2, constants and 3 random tables executes and matches its table, a wrong table fails; balanced area -3.4..34.7% on random n=3..9, named -3.4..21.5% at n=8."

[ablations.balance_cut]
saving = 0.0
arity = 8
seed = "random.Random(100 + n)"
tables = 20
verdict = "retired as a race, kept as a rule for compact programs (2026-10-29 baseline). The balance route raced whole-word layout against bodies cut into %%Concatenate pieces at six limits (16..96), min by rendered side: balanced area (side^2, generic wrap as baseline) 88.5 / 79.4 / 69.0 / 52.9 / 13.8 / 5.3 / 3.4% on random n=3..9, then 43.0 / 0.0 / 33.0% at n=10..12 (an artifact of the generic width choice, 472 against an ideal 326 at n=10, not of the cut); at n=8 11 of 20 tables gained, chars +8.3-18%. On 200 random tables (seed 4100 + n, rows times longest row) the race saves 15.5% at n=7 and 2.7% at n=8, the rule 10.4% and 0.0%; at 20 tables n=9 -3.0%, n=10 23.1%, n=11 0.0%. Fails 10% on random at n=8; named functions (parity, and, or, majority, thr2, complements) gain 35-89% at n=3..10. Replaced by one cut at 64 when isqrt(2 * len) < the longest word (a compact program, which a node body pins at 180 wide), else whole-word: random area saving 87.6 / 79.4 / 69.0 / 50.4 / 1.2 / 0 / 0 / 0% at n=3..10, named 35-88% at n=3..10 (within 5% of the race but n=3 random +8%, n=6 random +5%); random n>=8 now generic. Default programs byte-identical (only the balance hook changed); 552 default+balanced builds n<=3 execute, 65 balanced n=4..8 random+named execute, control fails."

