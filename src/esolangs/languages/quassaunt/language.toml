[proof_status]
labels = ["tree"]
qualification = "each distinct subtable's code is stored once in a global and run by name; a node tests its character's set {c} against the stored {1} with `%%Ifdisjoint` to pick a child's name, then obtains that code once; equal halves and constant chains read their bits unbranched"
scaling = "linear: worst F characters, n = 3..21; at most beyond"
execution = "linear: worst 5N + 15n + 14 steps: five a stored node, 15 a level"
workspace = "linear: worst 16L - 328D - 8r + 8W + bl(5D+6) + bl(n) - 302 bits past n = 2: frames"
definitions = ["N = Σ_h min(2^(n-h), 2^2^h), the most distinct subtables", "D = the program's definitions", "r = the root name's length", "W = the longest word's characters"]

