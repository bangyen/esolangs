[ablations.batched_store_loop]
arity = 8
saving = 12.1
seed = "random.Random(1000*n), sequential choice('01')"
tables = "same corpus as stack_reservoir_fillers; native dictionary equality on all 270 nonconstant tables through n=3"
verdict = "rejected alone 2026-11-02: n=7/8 source 1688993 -> 1499256 / 2802994 -> 2464631 (11.23/12.07%), a finite benefit below the declining 20% bar. The uncompressed duplicated key costs Theta(D log D), eventually exceeding the O(D) fixed-store-word saving, so this cannot be called sustained. No arity cap or old-program race. Exactly n=3 source 289876 -> 300538, 254 tables grow; commands 193280 -> 627216. Kept jointly in word_economy: dense keys make the duplicate affordable. Each real name/body/key triple is stored once; an empty dummy key chooses the root after the last triple. All 270 small nonconstant dictionaries match the unbatched reservoir+dense build exactly after removing only helper [_s] and dummy [_x]."

[ablations.word_economy]
arity = 8
saving = 20.6
seed = "random.Random(1000*n), sequential choice('01')"
tables = "200 random tables per n=7,8, all 76800 rows; 20 random tables each n=9,10,12,14,16, four native rows of the first; all tables/rows n<=3; sampled n=4..6 and named/ignored-input controls"
verdict = "kept 2026-11-02 for source only: the reservoir, dense names and fixed store loop jointly save 20.159/20.608% at n=7/8 (1688993 -> 1348509 / 2802994 -> 2225358 chars), clearing even the declining bar. The measured extension curve is nonmonotone: n=9/10/12/14/16 saves 20.371/20.270/20.275/20.521/20.624%; no global peak claim. If old weighted name cost is A and own-name cost O, every reachable definition is referenced, so O<=A/2. Adding one test key and encoding with base89 costs at most 1.5*ln(10)/ln(89)*A+O(D); fixed words are O(D), while distinct old names force A=Omega(D log D). Thus limiting saving is bounded below by 23.05285%, not zero. Stable frequency sorting costs O(D log D)=O(T), canonical residual construction O(T), and names emit their digits once; no search or fallback. Startup 15+2n+3D words plus 23(D+1) storer words and 13B+6C+2 path words gives exact E=40+15n+26D-7C, B+C=n; D<=N+1 yields 26N+15n+66, attained by native n=3/6 witnesses. Costs are explicit: n=3 source 289876 -> 272196 but six tables grow; n=1/2 totals 836 -> 1112 / 9582 -> 10270 and every nonconstant table grows. n=3 commands 193280 -> 620752 (3.212x); full n=7/8 totals 9458720 -> 37904672 / 27959050 -> 119593666 (old totals analytically derived and validated natively). Generic sampled workspace peaks summed over three tables rise 346609 -> 433599 / 590932 -> 744285 bits at n=7/8, about 25-26%. Warm generation n=8/12/16 takes 0.131/1.387/18.688 -> 0.235/2.429/30.564 ms; native all-row table runs n=4/6/8 take 2.663/22.613/199.149 -> 7.754/77.615/761.142 ms. This is neither an execution nor memory optimization. The workspace formula counts raw cut frames and reconstructed payloads separately; every standalone Concatenate adds two execution steps. Original proof arities remain, all eight pins updated, and the balanced example executes. Full 76800-row prototype run passed in 195.24 seconds; public output matches that frozen prototype byte-for-byte. Balanced grid_area, without stripping trailing lines, falls 2141087 -> 1882202 / 2873246 -> 2532395 on the fixed 200-table n=7/8 corpora (12.09/11.86%); no table grows. Across 70 named/complement builds at n=3,4,6,7,8,10,12, eight areas grow, at most 6.83%, while the largest reduction is 48%; native old/new balanced witnesses execute. Wrong-leaf and wrong-sentinel controls are detected on 4/8 and 8/8 rows; [] uses the ordinary global-name rule."

