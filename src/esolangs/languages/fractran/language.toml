[ablations]
version = 1
archive_revision = "ba52adb67a87307935ae2ae906a72b33afdadc1f"
archive_context = { audited = "2026-10-19" }

[ablations.state_sharing]
kind = "archive"
saving = 84.2
arity = 12
verdict = "kept: canonical, exempt. Equal subtables at one depth share one state prime, making the tree a reduced decision diagram. Removing the sharing costs 58.9% at n=6 rising to 84.2% at n=12 on random tables, 98.9% on parity at n=10"

[ablations.halves_agree_skip]
kind = "archive"
saving = 2.4
arity = 12
verdict = "kept: canonical, exempt. A node whose halves return the same state is that state; the input is never read there. 6.0% at n=6 declining to 2.4% at n=12 on random tables, 3-4% with one ignored input, and 0.0% on parity, AND and constant tables, where it never fires beyond the constant path"

[ablations.constant_fold]
kind = "archive"
saving = -0.9
arity = 12
verdict = "removed 2026-10-20 (retirement candidate #18): the constant_span_test early exit in _tree appended one leaf per depth at which a constant span roots (the walk keys nodes by (depth, subtable id)), while the halves-agree skip collapses a whole span to a single shared leaf. Removing it shrinks or ties every corpus measured: -6.2% at n=6 to -0.9% at n=12 on random tables, -27.0% / -28.5% on AND at n=10/12, 0.0% on parity and constant tables. AND at n=10 built 21 nodes shipped vs 12 without, clear fractions identical. See RETIREMENT-CANDIDATES entry 18"
retirement = { verb = "removed", date = 2026-10-20 }

[ablations.guard_spelling]
kind = "archive"
saving = -7.9
arity = 12
verdict = "kept 2026-10-27: a guard above SMALL_BASE is spelled as its factors (state*bit) so the interpreter's index receives it pre-factored. Spelling the integer product instead is smaller everywhere: -10.6% at n=6, -9.1% at n=10, -7.9% at n=12 on random tables, -7.7% on parity at n=10, and falling with n (6.8% of the shipped size at n=14, five seeds). Literal guards outgrow the index's base cap and fall back to the integer scan, so the swap needs an index that factors guards over the program's own primes; under 10% from n=7, that interpreter change does not pay. See RETIREMENT-CANDIDATES entry 19. Re-priced 2026-10-28 (20 seeded random tables, seed 1000n + i, integer product vs shipped): -9.85% / -9.75% chars at n=7/8 (named -4.4% to -9.2%), but -14.8% / -10.6% balanced area at n=7/8 (named 0.0%): the spelling is a speed-for-size trade, not a size trick. Closed 2026-10-28, kept: chars miss the bar and area falls 4 points per n toward it, which does not pay for an index that factors literal guards on every run"

[ablations.state_prime_order]
kind = "archive"
saving = 4.4
arity = 12
verdict = "kept: states take primes in post-order, so the root -- spelled in the starting value and in no fraction -- takes the largest state prime. Reversing the assignment (the small_root order generalized) costs 4.4-6.0% on random tables at n=10-12 but saves 0.2-3.7% on parity and AND. A numbering choice, not a removable mechanism; the shipped order wins on the random corpus at the largest arities"

[ablations.frequency_prime_assignment]
kind = "archive"
saving = 1.6
arity = 12
seed = "random.Random(1000*n), sequential choice('01')"
tables = "20 random per n=7..12,14,16; and/or/parity/majority/two-thirds threshold separately"
verdict = "rejected 2026-10-31: assign smaller state primes to more frequent references, stable post-order within frequency buckets. Random chars n=7 14990→14914 (0.507%), n=8 26957→26632 (1.206%), peak n=12 310952→305968 (1.603%), n=14/16 1.548%/1.395%; named functions at most 0.578%. Below 10% and declining at the largest arities. Executed 9840 baseline/candidate rows: all n<=3 tables and 20 random plus five named tables per n=4..6; wrong-answer control rejected. n=3 chars 19678→19552; fraction count and input primes unchanged, so no step saving. No generator change retained."

[ablations.constant_table_audit_20261101]
kind = "archive"
arity = 8
saving = 9.9
seed = 0
tables = "both constants n=1..12; exhaustive all tables/rows n=1..3; six witnesses/all rows n=4..6"
verdict = "kept: canonical whole constants. No state prime: start at the product of all input prime powers, multiplied by 2 only for answer one; clear each input with 1/p. Zero may use prime 2 as its first input, while one reserves 2 for its answer. Uniform one-character exponent setters remain in input order. Exactly 1+popcount commands including the halt, at most n+1; workspace at most sum(bl(p), input primes)+n+1+3b, attained by all-one input. n=8 zero/one 81/81 -> 71/75 chars; n=12 121/121 -> 111/115. n=3 corpus 19678 -> 19664 chars; summed commands 9408 -> 9392. Generic bounds and nonconstant programs unchanged. Each language passed 5656 paired old/new row executions; all 270 nonconstant programs through n=3 stay byte-identical. Both constants n=1..12 execute in default, width=1 and balanced layouts. All 24 balanced scores per language improve or match; all eight benchmark size/command pins remain unchanged. Owned regressions check resources and uniform embedded slots or input before output. No new collected cases."

[ablations.leaf_inline]
kind = "archive"
saving = 3.1
arity = 8
seed = "random.Random(1000*n), sequential choice('01')"
tables = "200 random per n=7,8; all tables/rows n=1..3; 20 random per n=4..6, four asymmetric rows each"
verdict = "kept 2026-11-02 for execution: emit 1 or 2 directly on leaf edges, assigning state primes only to internal nodes. Exhaustive n=3 source 19664→15524 chars and commands 9392→7360 (21.64% fewer); no table larger or slower and no row slower. Constants unchanged. Random n=7/8 chars 153229→146114 (4.643%) / 268969→260632 (3.100%), below size bar. Each nonconstant row removes exactly one command; sampled larger arities have no source or command regressions. All 3960 paired native row controls passed, compile_index non-None and zero stdin reads; flipped-answer control rejected. Additional full n=7 execution: 25600 paired rows, commands 219760→194160. Uniform exponent pair and prime inputs unchanged; worst commands n+1 including halt, state cap loses its two leaves."

[ablations.variable_order_search]
kind = "archive"
saving = 4.765
arity = 8
seed = "random.Random(1000*n), sequential choice('01')"
tables = "200 random per n=7,8; all tables/rows n=1..3; 20 random per n=4..6, four asymmetric rows each"
verdict = "rejected 2026-11-02: greedy variable sifting is a search, violating construction policy. Scratch one-pass n*n sifting with identity retained gives n=7/8 chars 153229→141646 (7.559%) / 268969→256152 (4.765%), below both bars and declining. n=3 commands 9392→9312 (0.852%), with row regressions, so execution also fails. 3960 paired native row controls passed with indexed compilation and zero stdin reads; flipped-answer control rejected. No production change."

[ablations.input_prime_by_load]
kind = "archive"
saving = 4.05
arity = 8
seed = "random.Random(1000*n), sequential choice('01')"
tables = "200 random per n=7,8; all tables/rows n=1..3; 20 random per n=4..6, four asymmetric rows each"
verdict = "rejected 2026-11-02: assign input primes by descending node count at each depth, stable depth ties, and map start slots consistently. Standalone n=7/8 chars 153229→146526 (4.374%) / 268969→258077 (4.050%); below both bars, no command saving. Two source regressions across the measured corpus (n=3 00111100/11000011: 64→65); the baseline race has identical n=7/8 totals. Named and/or/parity/majority/two-thirds threshold at n=7/8 save at most 3.041%/2.362%, declining to at most 1.548% at n=12; 80 native named-row controls passed. 3960 paired native row controls passed, all indexed and zero stdin reads; flipped-answer control rejected. No production change."

