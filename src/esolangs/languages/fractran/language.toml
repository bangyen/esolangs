[evidence]
version = 1

[[evidence.anchors]]
arity = 10
rule = "parity"
size = 342
unit = "chars"
scale = 1
construction = "esolangs.languages.fractran.generator:fractran_request"

[[evidence.anchors]]
arity = 10
rule = "random"
seed = 1847
size = 4397
unit = "chars"
scale = 1
construction = "esolangs.languages.fractran.generator:fractran_request"

[resource_evidence]
version = 2
construction = "esolangs.languages.fractran.generator:fractran_request"
witnesses = "esolangs.languages.fractran.tests.resource_witnesses:resource_tables"

[resource_evidence.execution]
# The stated execution bound, evaluated for n and the program.
expression = "n+1"
exact = true
arities = [1, 2, 3, 5]
first = 1
unit = "commands"
description = { growth = "poly n", claim = "worst", template = "{claim} {formula} {unit}, one per level or unread set bit plus the halt" }

[resource_evidence.workspace]
expression = "B+P+n+2+C*(3V-1)"
source_terms = { names = ["B", "P", "C", "V"], provider = "esolangs.languages.fractran.proof_formulas:workspace_terms" }
exact = true
arities = [1, 2, 3, 5, 6]
first = 1
unit = "bits"
description = { growth = "poly n", claim = "worst", template = "{claim} {formula} {unit}. B sums input prime widths, P is state prime width, C selects constants, V their value" }

[resource_evidence.scaling]
qualitative = { growth = "linear", text = "worst C = Σ_{d<n} min(2^d,2^2^(n-d)-2^2^(n-d-1)) states, O(log T) digits" }

[semantic_evidence]
version = 1
kind = "model"
contract = "interpreter/__init__.py"
tests = [
    "src/esolangs/languages/fractran/tests/oracle_checks.py::check_raw_fractran",
    "src/esolangs/languages/fractran/tests/test_fractran.py::test_the_two_fraction_adder",
    "src/esolangs/languages/fractran/tests/test_fractran.py::test_a_value_no_fraction_divides_is_printed_at_once",
    "src/esolangs/languages/fractran/tests/test_fractran.py::test_the_first_matching_fraction_wins",
    "src/esolangs/languages/fractran/tests/test_fractran.py::test_primegame_passes_through_the_primes",
    "src/esolangs/languages/fractran/tests/test_fractran.py::test_a_malformed_program_is_refused",
    "src/esolangs/languages/fractran/tests/test_fractran.py::test_the_pointer_is_the_offset_of_the_fraction_about_to_fire",
    "src/esolangs/languages/fractran/tests/test_fractran.py::test_the_final_print_is_its_own_step",
]
