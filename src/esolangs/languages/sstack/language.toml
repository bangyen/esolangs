[ablations.identity_pair]
saving = 11.8
arity = 10
seed = "random.Random(184700 + n)"
tables = 200
verdict = "kept: a last-level node over \"01\" is the input byte itself, so `;a;:a:~a~` (9 chars) replaces the 27-char two-arm node; the pop keeps the enclosing loop from re-entering. A rule on the node, not a search. 10.9/11.8% at n=7/8 on 200 random tables (12.6/11.6% at n=9/10 on 30; balanced area 10.7/11.8% at n=7/8); named functions parity 12.4% at n=8 and 12.3% at n=10, majority 16.8/59.4%, threshold 12.2/10.7%, and/or 6.2% at n=8 falling to 4.6% at n=10 (one 01 pair); every measured program run on every row, a one-bit wrong table failing"

[ablations.halves_agree_skip]
saving = 54.9
arity = 12
verdict = "kept: canonical, exempt from the bar; one check realizes the essential drop and the constant fold -- 10.4% on random tables at n=10 (flat from n=5), 54.9% on leading-ignored tables at n=12, 78.5% on single-block mosaics at n=10, 8.3% on trailing-ignored tables at n=12"

[ablations.early_constant_leaf]
saving = 0.0
arity = 10
verdict = "kept: canonical fold, exempt; no separate price -- disabling it (leaf only at full depth) reproduces the no-bank totals digit for digit on every corpus measured, since a constant subtree's skip descent emits the same 3*remaining + 3 chars; its price is carried by the halves-agree skip"

