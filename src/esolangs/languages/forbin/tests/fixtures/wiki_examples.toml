[[examples]]
id = "cat"
source = '''
main {
  i, shouldLoop = 0;
  a,b,c,d,e,f,g,h = (in 0);
  out a,b,c,d,e,f,g,h;
  for i:(a,b,c,d,e,f,g,h) {
    for _:!i..i {
      shouldLoop = 1
    }
  }
  for _:!shouldLoop..shouldLoop {
    main 0;
  }
}'''
stdin = "abc"
stop = "eof"
expected = "abc"

