[ablations]
audited = "2026-10-19"

[ablations.essential_projection]
saving = 43.8
arity = 12
verdict = "kept: canonical, exempt. The branch tree is built over the essential inputs only; an ignored input is still read, but its kept bit drops into the scratch name. One ignored input saves 32.3% at n=10 and 43.8% at n=12, two ignored inputs 48.6% / 65.8%, rising. Plain-rewrite 2026-10-28, deleting it (all inputs read as essential; 20 tables per class and arity, seed 1; savings as shares of the plain build's total): 0.0% on random, parity, majority, and/or and constant tables at every n=4..12; dense tables 2.7% / 1.6% / 2.0% at n=4 / 5 / 6 and 0.0% from n=7; half-constant 7.4% at n=4, 1.6% at n=5, 0.0% from n=6; two-block 22.3% / 19.3% / 4.6% at n=5 / 6 / 7 and 0.0% from n=8; mid-ignored tables (inputs 1 and n//2) 44.9% / 49.9% / 59.0% / 67.8% / 54.7% at n=4..8 and 20.3% / 26.9% / 40.0% at n=9 / 10 / 12"

[ablations.constant_fold]
saving = 6.9
arity = 12
verdict = "kept: canonical, exempt. A constant span collapses to a call to one of the two constant printers: 12.4% on constant-half tables at n=10 and 6.9% at n=12 (the share declines as the random half outgrows the folded half, but the absolute saving grows and it never goes negative; 0.0% on random tables). The fold is also the tree builder's base case past the projection, where a constant table has no subtree ids to index, so at that boundary it is correctness machinery, not an optimization. Plain-rewrite 2026-10-28, deleting it everywhere but the whole-table span (20 tables per class and arity, seed 1): 0.0% on random, parity, majority, dense (0.5% / 0.9% at n=9 / 12), two-block, mid-ignored and constant tables at n=4..7; on and/or 13.0% at n=8, 12.1% / 19.8% at n=12 (or / and), half-constant tables 13.0% at n=8, 13.6% / 12.1% / 6.7% at n=9 / 10 / 12 (falling share against the growing random half, absolute saving growing). Kept: canonical"

[ablations.subtree_sharing]
saving = 43.1
arity = 10
verdict = "kept: canonical, exempt. A subtree repeated at its level becomes one shared function. 0.0% on random tables at every arity, as the Decisions say; on tables tiled from two distinct 128-entry blocks with every input essential, 20.1% at n=9 and 43.1% at n=10 — the Decisions' -20.5% / -42.8% reproduces. On periodic tilings it prices 0.0% in the shipped context: after the projection only two blocks remain and nothing repeats. Plain-rewrite 2026-10-28, deleting it (unique ids, 20 tables per random-like class, seed 1): 0.0% on random, dense, mid-ignored, half-constant and constant tables at n=4..12; 20.1% / 43.1% / 78.5% on parity and 10.0% / 28.3% / 66.7% on majority at n=9 / 10 / 12 (one table each, rising); 0.3% / 4.3% on two-block tables at n=10 / 12; and/or 0.0%"

[ablations.painted_block_bits]
saving = 2.1
arity = 12
verdict = "replaced by [ablations.block_width_race]: the fixed _BLOCK_BITS = 7 was a crossover constant, not a win at every arity. Against 5 / 6 bits seven lost on random tables at -59.5% / -39.8% at n=8 and -7.0% / -11.5% at n=10, won only from n=12 (+12.7% / +2.1%), and on parity, majority and two-block tables fewer bits stayed ahead even at n=12. The width is now raced per table over 3..7, seven kept as the widest (at eight the block outgrows the whole table at n = 7, a rung tests/proofs/deep/linearity.py fits a line through)"

[ablations.block_width_race]
saving = 37.1
arity = 8
seed = 1000
tables = 20
verdict = "kept: the shortest of the shift-register widths b = 3..7 per table, seven among them so no table grows (no table grew in size, n=4..14; tables are seed 1000 + n, 20 per class to n=10 and 4 above, one parity and one majority table, shares of main's total). Size, random tables: -12.3% / -21.4% / -36.6% / -50.2% / -37.1% / -21.8% / -10.2% / -2.9% at n=4..11 and 0.0% from n=12 (seven wins there: a share falling to zero on random tables, which meets the bar at n=7..8 and is the old crossover); named functions and structured classes keep their saving at every n: parity -47.6% at n=14, majority -43.0%, or/and -62.4%, dense with 3 zeros -55.2%, two-block -75.0% (rising), mid-ignored -35.1% at n=8 and 0.0% at n=14, half-constant -48.2% at n=8 and 0.0% from n=13, constant 0.0%. Area (balance_score(p)[0] ** 2, the balanced output): random -49.3% / -35.6% / -10.1% at n=7 / 8 / 10 and 0.0% from n=12; parity -54.6% and majority -51.9% at n=14; or/and -62.8%; dense -56.0%; two-block -78.6%; mid-ignored -36.0% at n=8; half-constant -48.2% at n=8. Candidate sets (seed 777 sweep): dropping b = 3 costs up to 11.2 points (mid-ignored, n=6), 3.2 on or/and and 1.9 on dense at n=8, 0.3 on parity; dropping 3 and 4 costs or/and 10.7 / 9.1 points; a fixed 5 grows random tables +14.7% at n=12 and a fixed 6 +2.1%, so no constant wins everywhere and a closed rule would have to predict a crossover that moves with the class (random favors 5 at n=7..9 and 7 from n=12, structured tables 3). Adding b = 2 / 1 saves 0.0% on every class but or/and (4.0% / 4.2% at n=8, 3.3% / 3.5% at n=10), under the bar. The balanced hook needs no race of its own: it builds the token spelling through forbin(table, 1), which races the widths by the wrapped length, and that matches racing five balanced spellings by area (majority 2-3 points better than balancing the unwrapped winner at n=9, 12 and 13; equal on every other class). Execution cost: the narrow winner descends more tree levels, 2 max(n - 3, 0) + 2 commands a row instead of 2 max(n - 7, 0) + 2 (n=4 parity 2 -> 4 commands)"

[ablations.name_ordering]
saving = 1.1
arity = 12
verdict = "retired 2026-10-28 (see the end). Earlier kept: the input bits, the register and the two printers take the one-character names first because they repeat most; the block cells take what is left. Against the inverted allocation (cells first) the ordering saves 2.0% / 1.7% / 1.1% on random tables at n=9/10/12 — positive at every arity but declining in share, while the absolute saving grows (48 / 61 / 119 chars per table). It prices below the generator bar at the largest arity; it is recorded rather than proposed for removal because dropping it deletes no code, only the allocation order inside _Names. Plain-rewrite 2026-10-28: retired. Priced by deleting it (the cells-first allocation, 20 tables per class and arity, seed 1) the frequency order saves 4.5% / 2.2% / 2.2% / 2.0% / 1.7% / 1.1% on random tables at n=6 / 7 / 8 / 9 / 10 / 12 and at most 3.8% on and/or, 3.0% on parity and 2.2% on majority at n=12 (mid-ignored 6.1% at n=8, 2.2% at n=12): under the bar everywhere, declining on random tables. The plain form built instead is the order of first use (scratch name, bits, the register and its cells, then the printers), which is no larger on seed 1 at n=4..12 (0.0% at n<=5 and on and/or at n=12, up to 0.5% smaller at n=6, 0.1% on random tables at n=12); on seed 777 dense tables (three zeros) grow 0.07% / 0.16% at n=11 / 12 and every other class shrinks or holds. Replaced by order of first use"

[ablations.early_returns]
saving = 2.8
arity = 16
seed = 1
tables = 20
verdict = "kept for execution and workspace, below the size bar. The unwrapped tree uses early returns (a leaf is `return(call)`, the lower half unguarded); the wrapped build uses disjoint `for _:1..!b` guards. Priced by deleting it, i.e. building the disjoint-guard tree for the unwrapped program too (20 tables per class, seed 1, 8 at n=16; shares of the plain total): the returns lose at n<=7 (random tables -2.6% at n=4, -0.5% at n=7), break even at n=8 (0.1%) and save 0.7% / 1.4% / 2.3% / 2.6% / 2.7% on random tables at n=9 / 10 / 12 / 14 / 16, a plateau near 2.8% (peak, measured past n=8); named functions at n=12 / 16: and/or 1.9% / 3.3%, majority 1.2% / 1.9%, parity 0.4% / 0.6%; two-block tables 3.9% at n=16; mid-ignored tables 1.4% at n=12; constant tables lose 3.0% at n=12. A constant share far under 10% at every arity and class, so it fails the size bar. Retirement trial 2026-10-28 (seed 1, 20 tables per class): sizes reproduce (-2.5% at n=4, +0.1% at n=8, +2.4% at n=12), area unchanged; but `return(call)` is a tail call, so the disjoint-guard tree runs 9 / 17 / 33 / 38 commands a row at n=1 / 3 / 7 / 8 against 2 / 2 / 2 / 4 at b = 7 (before the width race), and the callee's frame stays live: worst written state 200 / 459 / 5,790 / 5,847 bits against 110 / 176 / 306 / 347. Kept for that, not for the clause's constant"

[ablations.balance_race]
saving = 0.0
arity = 12
seed = 1
tables = 20
verdict = "retired: size-neutral, a dead candidate. The balanced hook raced the unwrapped default against the token-joined spelling on balance_score and the default never won: 0 of 4 + 16 + 256 + 65,536 tables exhaustively at n=1..4 (the joined spelling strictly smaller on all of them), 0 of 300 random tables each at n=5..8, and 0 of 20 on every class at n=4..12 (area, measured against the early-return default) (random, parity, majority, and/or, dense, two-block, mid-ignored, constant, half-constant). Measured on rendered area, balance_score(program)[0] ** 2, the joined spelling is 89-99.5% smaller than the default. Deleting the race changes no output byte, so the patch is size-neutral; the hook now returns the joined spelling"

[ablations.balance_word_spaces]
saving = 43.8
arity = 10
seed = "random.Random(131s + n), s = 0..19"
tables = "20 random per n=7,8 plus and/or/nand/nor/parity/majority/threshold-3/threshold-(n-1) at n=7..10"
verdict = "kept: the balanced spelling put a space between every token (n=8: 1,100 -> 2,096 chars, ratio 3.8 on a 23 x 47 fold). A space now stays only between two adjacent word tokens (identifier, keyword, number or underscore on both sides); a row break separates the rest and a row's trailing space is trimmed. Balanced area (score squared) -43.8% / -45.5% on random tables at n=7 / 8, named functions -37.1% to -47.1% at n=7..10 (parity -42.0 / -42.1 / -39.9 / -40.8%, majority -41.3 / -40.2 / -37.1 / -39.0%, and/or 43.8-45.7%, still ~40% at n=10 so not declining). No table got worse; the default is byte-identical on all 72 tables. Every balanced program ran on every row (72 tables, n=7..10, 0 bad) and a wrong table failed on each"

