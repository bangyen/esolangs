commands a row instead of 2 max(n - 7, 0) + 2 (n=4 parity 2 -> 4 commands)"

[ablations.name_ordering]
kind = "archive"
saving = 1.1
arity = 12
verdict = "retired 2026-10-28 (see the end). Earlier kept: the input bits, the register and the two printers take the one-character names first because they repeat most; the block cells take what is left. Against the inverted allocation (cells first) the ordering saves 2.0% / 1.7% / 1.1% on random tables at n=9/10/12 — positive at every arity but declining in share, while the absolute saving grows (48 / 61 / 119 chars per table). It prices below the generator bar at the largest arity; it is recorded rather than proposed for removal because dropping it deletes no code, only the allocation order inside _Names. Plain-rewrite 2026-10-28: retired. Priced by deleting it (the cells-first allocation, 20 tables per class and arity, seed 1) the frequency order saves 4.5% / 2.2% / 2.2% / 2.0% / 1.7% / 1.1% on random tables at n=6 / 7 / 8 / 9 / 10 / 12 and at most 3.8% on and/or, 3.0% on parity and 2.2% on majority at n=12 (mid-ignored 6.1% at n=8, 2.2% at n=12): under the bar everywhere, declining on random tables. The plain form built instead is the order of first use (scratch name, bits, the register and its cells, then the printers), which is no larger on seed 1 at n=4..12 (0.0% at n<=5 and on and/or at n=12, up to 0.5% smaller at n=6, 0.1% on random tables at n=12); on seed 777 dense tables (three zeros) grow 0.07% / 0.16% at n=11 / 12 and every other class shrinks or holds. Replaced by order of first use; balanced area (max(rows, cols) squared) within 5% across the retiring commit on parity, majority, and, or, thr2, their complements and 10 random tables at n=7, 8, 10"
retirement = { verb = "retired", date = 2026-10-28, balanced = [1412, 1420] }

