[ablations]
audited = "2026-10-19"

[ablations.essential_projection]
saving = 43.8
arity = 12
verdict = "kept: canonical, exempt. The branch tree is built over the essential inputs only; an ignored input is still read, but its kept bit drops into the scratch name. One ignored input saves 32.3% at n=10 and 43.8% at n=12, two ignored inputs 48.6% / 65.8%, rising. Plain-rewrite 2026-10-28, deleting it (all inputs read as essential; 20 tables per class and arity, seed 1; savings as shares of the plain build's total): 0.0% on random, parity, majority, and/or and constant tables at every n=4..12; dense tables 2.7% / 1.6% / 2.0% at n=4 / 5 / 6 and 0.0% from n=7; half-constant 7.4% at n=4, 1.6% at n=5, 0.0% from n=6; two-block 22.3% / 19.3% / 4.6% at n=5 / 6 / 7 and 0.0% from n=8; mid-ignored tables (inputs 1 and n//2) 44.9% / 49.9% / 59.0% / 67.8% / 54.7% at n=4..8 and 20.3% / 26.9% / 40.0% at n=9 / 10 / 12"

[ablations.constant_fold]
saving = 6.9
arity = 12
verdict = "kept: canonical, exempt. A constant span collapses to a call to one of the two constant printers: 12.4% on constant-half tables at n=10 and 6.9% at n=12 (the share declines as the random half outgrows the folded half, but the absolute saving grows and it never goes negative; 0.0% on random tables). The fold is also the tree builder's base case past the projection, where a constant table has no subtree ids to index, so at that boundary it is correctness machinery, not an optimization. Plain-rewrite 2026-10-28, deleting it everywhere but the whole-table span (20 tables per class and arity, seed 1): 0.0% on random, parity, majority, dense (0.5% / 0.9% at n=9 / 12), two-block, mid-ignored and constant tables at n=4..7; on and/or 13.0% at n=8, 12.1% / 19.8% at n=12 (or / and), half-constant tables 13.0% at n=8, 13.6% / 12.1% / 6.7% at n=9 / 10 / 12 (falling share against the growing random half, absolute saving growing). Kept: canonical"

[ablations.subtree_sharing]
saving = 43.1
arity = 10
verdict = "kept: canonical, exempt. A subtree repeated at its level becomes one shared function. 0.0% on random tables at every arity, as the Decisions say; on tables tiled from two distinct 128-entry blocks with every input essential, 20.1% at n=9 and 43.1% at n=10 — the Decisions' -20.5% / -42.8% reproduces. On periodic tilings it prices 0.0% in the shipped context: after the projection only two blocks remain and nothing repeats. Plain-rewrite 2026-10-28, deleting it (unique ids, 20 tables per random-like class, seed 1): 0.0% on random, dense, mid-ignored, half-constant and constant tables at n=4..12; 20.1% / 43.1% / 78.5% on parity and 10.0% / 28.3% / 66.7% on majority at n=9 / 10 / 12 (one table each, rising); 0.3% / 4.3% on two-block tables at n=10 / 12; and/or 0.0%"

[ablations.painted_block_bits]
saving = 2.1
arity = 12
verdict = "kept: _BLOCK_BITS = 7 is a crossover constant, not a win at every arity. On random tables blocks of 5/6 beat 7 by 22.0% / 19.4% at n=9 and 6.6% / 10.3% at n=10, but at n=12 seven wins (+12.7% over 5, +2.1% over 6, as shares of the variants' totals). The comment's per-entry constants (2.78 at five, 2.39 at six, 2.22 at seven) are two-point slopes between n=10 and n=12 and reproduce (2.76 / 2.39 / 2.20 measured): the slope hides the shift register's fixed prologue, which doubles per block bit and is what smaller blocks save at n<=10. The comment also ties seven to the proof's linearity rungs, and some value must be chosen — a per-arity race would be a new mechanism, not a removal. Plain-rewrite 2026-10-28 (20 tables per class, seed 1; savings of seven as shares of the variant's total, negative when seven loses): against 5 / 6 bits seven loses on random tables at -59.5% / -39.8% at n=8, -28.2% / -24.0% at n=9 and -7.0% / -11.5% at n=10, and wins at n=12 (+12.7% / +2.1%; +30.3% over 4 bits, +6.8% over 8); the same shape holds on dense, mid-ignored (n=12: -7.0% / -11.3%) and half-constant tables (n=12: +5.6% over 5, -3.0% against 6), while on parity, majority and two-block tables fewer bits stay ahead even at n=12. Not changed: the constant fixes the ledger's scaling, execution and workspace clauses (two an entry from n = 2, 2 max(n - 7, 0) + 2 commands), so lowering it is a borderline call reported to the caller rather than a retirement here"

[ablations.name_ordering]
saving = 1.1
arity = 12
verdict = "kept: the input bits, the register and the two printers take the one-character names first because they repeat most; the block cells take what is left. Against the inverted allocation (cells first) the ordering saves 2.0% / 1.7% / 1.1% on random tables at n=9/10/12 — positive at every arity but declining in share, while the absolute saving grows (48 / 61 / 119 chars per table). It prices below the generator bar at the largest arity; it is recorded rather than proposed for removal because dropping it deletes no code, only the allocation order inside _Names. Plain-rewrite 2026-10-28: retired. Priced by deleting it (the cells-first allocation, 20 tables per class and arity, seed 1) the frequency order saves 4.5% / 2.2% / 2.2% / 2.0% / 1.7% / 1.1% on random tables at n=6 / 7 / 8 / 9 / 10 / 12 and at most 3.8% on and/or, 3.0% on parity and 2.2% on majority at n=12 (mid-ignored 6.1% at n=8, 2.2% at n=12): under the bar everywhere, declining on random tables. The plain form built instead is the order of first use (scratch name, bits, the register and its cells, then the printers), which is no larger on seed 1 at n=4..12 (0.0% at n<=5 and on and/or at n=12, up to 0.5% smaller at n=6, 0.1% on random tables at n=12); on seed 777 dense tables (three zeros) grow 0.07% / 0.16% at n=11 / 12 and every other class shrinks or holds. Replaced by order of first use"

[ablations.early_returns]
saving = 2.8
arity = 16
seed = 1
tables = 20
verdict = "kept for execution and workspace, below the size bar. The unwrapped tree uses early returns (a leaf is `return(call)`, the lower half unguarded); the wrapped build uses disjoint `for _:1..!b` guards. Priced by deleting it, i.e. building the disjoint-guard tree for the unwrapped program too (20 tables per class, seed 1, 8 at n=16; shares of the plain total): the returns lose at n<=7 (random tables -2.6% at n=4, -0.5% at n=7), break even at n=8 (0.1%) and save 0.7% / 1.4% / 2.3% / 2.6% / 2.7% on random tables at n=9 / 10 / 12 / 14 / 16, a plateau near 2.8% (peak, measured past n=8); named functions at n=12 / 16: and/or 1.9% / 3.3%, majority 1.2% / 1.9%, parity 0.4% / 0.6%; two-block tables 3.9% at n=16; mid-ignored tables 1.4% at n=12; constant tables lose 3.0% at n=12. A constant share far under 10% at every arity and class, so it fails the size bar. Retirement trial 2026-10-28 (seed 1, 20 tables per class): sizes reproduce (-2.5% at n=4, +0.1% at n=8, +2.4% at n=12), area unchanged; but `return(call)` is a tail call, so the disjoint-guard tree runs 9 / 17 / 33 / 38 commands a row at n=1 / 3 / 7 / 8 against 2 / 2 / 2 / 4, and the callee's frame stays live: worst written state 200 / 459 / 5,790 / 5,847 bits against 110 / 176 / 306 / 347. Kept for that, not for the clause's constant"

[ablations.balance_race]
saving = 0.0
arity = 12
seed = 1
tables = 20
verdict = "retired: size-neutral, a dead candidate. The balanced hook raced the unwrapped default against the token-joined spelling on balance_score and the default never won: 0 of 4 + 16 + 256 + 65,536 tables exhaustively at n=1..4 (the joined spelling strictly smaller on all of them), 0 of 300 random tables each at n=5..8, and 0 of 20 on every class at n=4..12 (area, measured against the early-return default) (random, parity, majority, and/or, dense, two-block, mid-ignored, constant, half-constant). Measured on rendered area, balance_score(program)[0] ** 2, the joined spelling is 89-99.5% smaller than the default. Deleting the race changes no output byte, so the patch is size-neutral; the hook now returns the joined spelling"

[audits]
plain_rewrite = 2026-10-28
