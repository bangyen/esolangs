# Plain-rewrite audit record, re-audited in area: each trick's saving
# measured in shipped context at the largest arity where it runs
# (area = rows x longest row; seeded random tables, seed 184700+n,
# 200 per arity).  Prices are contextual -- joint removals were
# measured separately before landing.  Rows for removed tricks stay
# as the record of why they left.  The first audit priced these rows
# in chars; those prices are superseded here and kept in
# EXPERIMENT-laserfuck.md (this audit: EXPERIMENT-laserfuck-reaudit.md).
[ablations]
audited = "2026-10-18"

[ablations.route_switch]
saving = 32.8
arity = 8
verdict = "kept, retuned 2026-10-18: threshold moved to 64 entries per the area crossover (tree serves n=5, 6); execution clause case-split with a derived tree bound"

[ablations.equal_halves_skip]
saving = 11.3
arity = 4
verdict = "kept: canonical, exempt from the bar; priced with the fold restored -- in current code the step chain is both, 35.7 combined"

[ablations.ignored_input_arm_drop]
saving = 45.8
arity = 8
verdict = "kept: canonical, exempt; saving on its own class"

[ablations.sized_leaf_retirement]
saving = 3.5
arity = 4
verdict = "removed: tree route only, weighted route unaffected; 3.5 in area, still under the bar"

[ablations.reader_orientation_search]
saving = 0.0
arity = 4
verdict = "kept: feasibility, not size -- vacuous on the default path, carries width compliance; since the 2026-10-18 retune the width path races its fits by least area (-13.8% at n=3), and the bands property was re-stated coarse to match"

[ablations.constant_folding]
saving = 0.0
arity = 4
verdict = "kept: canonical, exempt; no separate check in current code (dropped as byte-identical) -- the skip chain renders it"

[ablations.width_machinery]
saving = 0.0
verdict = "kept: feasibility -- flip, vertical tree, raise funnel, four-column builder; no default-path effect"
