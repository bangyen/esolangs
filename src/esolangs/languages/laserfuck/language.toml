arity = 6
seed = "random.Random(1847+n)"
tables = "all tables n=1..3; 20 random plus and/or/parity/majority/threshold-third per n=4..12"
verdict = "near miss, not shipped: bootstrap the normalization counter as six groups of eight instead of eight groups of six, keeping 48 and all input reads unchanged. The loop bodies change but total reader length does not. Random n=6 area unchanged at 85,176 cells over 20 tables; exhaustive n=3 area unchanged at 88,849 cells. Above six inputs the default is the weighted lookup, unaffected by reader factors; named functions have no area saving through n=12. Forced candidate command count over every n=3 row: 3,209,432 -> 3,143,896 (2.04%), no larger or slower table, below the 5% execution bar. 5,110 raced baseline/candidate output checks correct with 2,555 complemented controls; forced six-by-eight programs additionally pass all 2,048 n=3 rows and all 120 parity rows at n=3..6, with changed emitted readers as the positive control. Prototype stays in ignored notes; generator, bounds and pins unchanged"

