corpus = "esolangs.languages.laserfuck.tests.resource_witnesses:resource_corpus"

[resource_evidence.execution]
# The constant ring takes ten steps a pass and skips its final reflection.
expression = "C*(n+491+X) + (1-C)*(T+296n+682 + min(1,max(0,n-6))*(10T-240n-680))"
source_terms = { names = ["C", "X"], provider = "esolangs.languages.laserfuck.proof_formulas:execution_terms" }
exact = true
arities = [5, 6, 7]
first = 5
unit = "steps"
description = { growth = "linear", claim = "worst", template = "{claim} {formula} {unit} seed 2. C constant, X +x. Other headings add at most 2" }

[resource_evidence.workspace]
# Tree to n=6; then last-onehot/all-ones attains the 3T-cell peak.
cases = [
    { through = 6, expression = "8n+27" },
    { expression = "12T+n+7+2bl(n)" },
]
exact = true
arities = [5, 6, 7]
first = 5
unit = "bits"
description = { growth = "linear", claim = "worst", template = "{claim} {formula}" }

[resource_evidence.scaling]
# N = max(T, 3)(12n + 32) to n = 6, then 3(11T + 52n + 3).
#
# The tree's worst is parity ending on a one: every node distinct.
cases = [
    { through = 6, expression = "max(T,3)(12n+32)" },
    { expression = "3(11T+52n+3)" },
]
exact = true
arities = [1, 2, 3, 4, 5, 6, 7, 8]
first = 1
unit = "cells"
description = { growth = "linear", claim = "worst", template = "{claim} {formula}; tree then lookup" }

