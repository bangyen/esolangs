# Plain-rewrite audit record, re-audited in area: each trick's saving
# measured in shipped context at the largest arity where it runs
# (area = rows x longest row; seeded random tables, seed 184700+n,
# 200 per arity).  Prices are contextual -- joint removals were
# measured separately before landing.  Rows for removed tricks stay
# as the record of why they left.  The first audit priced these rows
# in chars; those prices are superseded here and kept in
# EXPERIMENT-laserfuck.md (this audit: EXPERIMENT-laserfuck-reaudit.md).
[ablations]
audited = "2026-10-18"

[ablations.route_switch]
saving = 32.8
arity = 8
verdict = "kept, retuned 2026-10-18: threshold moved to 64 entries per the area crossover (tree serves n=5, 6); execution clause case-split with a derived tree bound"

[ablations.equal_halves_skip]
saving = 11.3
arity = 4
verdict = "kept: canonical, exempt from the bar; priced with the fold restored -- in current code the step chain is both, 35.7 combined"

[ablations.ignored_input_arm_drop]
saving = 45.8
arity = 8
verdict = "kept: canonical, exempt; saving on its own class"

[ablations.sized_leaf_retirement]
saving = 19.0
arity = 11
verdict = "kept 2026-10-28: the balanced route uses the tree at every n -- 17-21% area on random tables at n=10..12, 18-19% on parity (seeds 1, 7), 0 at n=7..8; the default route alone fails (3.5% at n=4, peak 4.6% at its n=6 cap)"

[ablations.balance_turned_tree]
saving = 74.7
arity = 8
seed = "random.Random(s), s = 0..19, n = 7, 8"
tables = "20 random per n=7,8 plus and/or/nand/nor/parity/majority/threshold-3/threshold-n/2 at n=7..10"
verdict = "kept, balanced: the balance hook only raced upright fits, whose staircase has one row per one edge (161 x 79 at n=8, side 322). Racing the flat reader with the tree stood on end (52 x 162, side 162) takes balanced area (score squared) off 70.8% / 74.7% on random tables at n=7 / 8; named: parity 74.6 / 76.8 / 77.8 / 76.6%, majority 59.2 / 74.6 / 74.8 / 78.3% at n=7..10, threshold-3 34.3 / 63.4 / 74.6 / 74.7%; and/or/nand/nor 0.0 (they are a line). Flat across n=8..10 at ~75%, not declining. The default is byte-identical on all 72 tables; every balanced program ran on every row (72 tables, n=7..10, 0 bad) and a wrong table failed. Past n=8 the turned block is wider than 2:1 (n=9 58 x 338), a fold would gain more"

[ablations.reader_orientation_search]
saving = 0.0
arity = 4
verdict = "kept: feasibility, not size -- vacuous on the default path, carries width compliance; since the 2026-10-18 retune the width path races its fits by least area (-13.8% at n=3), and the bands property was re-stated coarse to match"

[ablations.constant_folding]
saving = 0.0
arity = 4
verdict = "kept: canonical, exempt; no separate check in current code (dropped as byte-identical) -- the skip chain renders it"

[ablations.width_machinery]
saving = 0.0
verdict = "kept: feasibility -- flip, vertical tree, raise funnel, four-column builder; no default-path effect"

[audits]
plain_rewrite = 2026-10-18

[ablations.tiled_tree]
saving = 71.6
arity = 10
verdict = "kept: balanced area on seed 4242 (25 tables an n, 9 at n=11/12) falls 24.6% at n=9, 71.6% at n=10, 82.8% at n=11, 92.6% at n=12 (area a row 109/109/95 at n=10..12, was 385/637/1275); no table grows at n=1..12, n<=8 unchanged. The upright tree is one row per leaf, so its square is T/2 on a side; cut at depth (n-5)//2 and the subtrees side by side, wires blank. Ink is O(Tn), so area is O(T log n) a row. Default byte-identical (corpus hash n=1..12)"
