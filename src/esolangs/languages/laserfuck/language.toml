# Language-owned data, one section per dataset; aggregators read
# only their own section and skip this file when it is absent.

[deep_arities]
# The weighted route starts at n = 7 (74 -> 1,503 bits on parity), so the
# fit needs n = 7..11 for its five rungs; n = 10, 11 add 1.9 s.
workspace = 11

[curation]
backlinks = 1
bf_derivative = true

[proof_status]
labels = ["finite lookup"]
qualification = "weighted arms select one of `2**n` prewritten cells, cleaned in one sweep"
scaling = "linear: worst N cells: a tree to n = 6, then three rows"
execution = "linear: worst T + 296n + 682 steps for n = 5, 6, then 18T + 56n + 4"
workspace = "linear: worst 8n + 26 bits at n = 5, 6, then 12T + 2n + 11 + 2bl(n)"

