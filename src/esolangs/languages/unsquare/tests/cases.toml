language = "Unsquare"
oldid = 189097

[[examples]]
id = "cat"
source = "iA>PoiA<"
stdin = "abc"
expected = "abc"
stop = "eof"

[[examples]]
id = "truth-machine-0"
source = "ioAx>Io<"
stdin = "\u0000"
expected = "0"
decode = "codes"

[[examples]]
id = "truth-machine-1"
source = "ioAx>Io<"
stdin = "\u0001"
expected = "1111111111"
decode = "codes"
stop = "steps"
max_steps = 200

[[spec_triggers]]
program = ">"
stdin = ""
expect = "HaltError"
claim = "HaltError: a > with no <"

[[spec_triggers]]
program = "S"
stdin = ""
expect = "HaltError"
claim = "HaltError: a swap without enough elements"

[[spec_triggers]]
program = "A"
stdin = ""
expect = "HaltError"
claim = "HaltError: an empty pop"

[[spec_triggers]]
program = "<"
stdin = ""
expect = "HaltError"
claim = "HaltError: an unmatched <"

[[spec_triggers]]
program = "o"
stdin = ""
expect = "HaltError"
claim = "HaltError: o without enough elements"

[[spec_triggers]]
program = "i"
stdin = ""
expect = "InputExhaustedError"
claim = "InputExhaustedError: i at EOF"
