# Language-owned data, one section per dataset; aggregators read
# only their own section and skip this file when it is absent.

[curation]
backlinks = 4

[proof_status]
labels = ["linear lookup"]
qualification = "the table is one `O`/`I` push per row, reversed, and each read pops its bit's weight in cells off the top of it"
scaling = "linear: worst 2T + 10n + 26 characters: two a row"
execution = "linear: worst 4T + 79n + 22 commands past n=5: 12- or 14-cell loops, 76 per read, weight pops"
workspace = "linear: worst T + 12 + bl(L) + bl(max(0,L-33)) + 2bl(n) bits: T + 1 table cells on the stack"

