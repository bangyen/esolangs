[proof_status]
labels = ["linear lookup"]
qualification = "the first (n-3)//2 essential reads branch on a half of the table, each branch pushes one O/I per row, reversed, and the remaining reads pop their bit's weight in cells off the top of it"
definitions = ["d = max(0,⌊(n-3)/2⌋), the reads that branch"]

[catalogue]
folding_constant = "a constant run is one counted Horner loop (_run), log-sized; a constant table is one run"
sharing_exempt = "a stack lookup, one pushed entry per row, with no subtable branch"

[schemes]
