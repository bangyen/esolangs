[resource_evidence.execution]
# A leaf of S cells pushes in at most 3S commands and pops in S.
# Equality needs S=12a+14b; S=16 and S=32 only reach 3S-2.
# Each row pays 79 commands per pop read, 82 per branch read and 27
# for the tail. The generator uses essential arity for its branch depth.
expression = "4T/2^max(0,⌊(n-3)/2⌋)+79n+3max(0,⌊(n-3)/2⌋)+26"
exact = true
arities = [8, 9]
first = 8
unit = "commands"
description = { growth = "linear", claim = "worst", template = "{claim} {formula} {unit} past n={previous}: 12- or 14-cell loops, one half pushed and popped" }

[resource_evidence.workspace]
expression = "T/2^max(0,⌊(n-3)/2⌋)+12+(max(0,⌊(n-3)/2⌋)+1)bl(L)+bl(max(0,L-33))+2bl(n)"
exact = false
arities = [1, 2, 3, 6, 7]
first = 1
unit = "bits"
description = { growth = "linear", claim = "at most", template = "{claim} {formula} {unit}: one half's cells on the stack" }

[resource_evidence.scaling]
expression = "T+T/2^max(0,⌊(n-3)/2⌋)+16·2^max(0,⌊(n-3)/2⌋)+10(n-max(0,⌊(n-3)/2⌋))+10"
exact = [2, 3, 4, 5, 6, 7, 8, 9]
arities = [1, 2, 3, 4, 5, 6, 7, 8, 9]
first = 1
unit = "characters"
description = { growth = "linear", claim = "worst", template = "{claim} {formula} {unit}" }

