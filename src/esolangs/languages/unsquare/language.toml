[catalogue]
folding_constant = "a constant run is one counted Horner loop (_run), log-sized; a constant table is one run"
sharing_exempt = "a stack lookup, one pushed entry per row, with no subtable branch"

[formula_arities]
# Past n = 5: loops of 12 or 14 cells cost 3 a cell (a run of c costs at
# most 3c); two odd runs keep the last input essential, 2 under 3T each.
execution = [6, 7]
workspace = [3, 6]

[schemes]
folds_without_tree = true

[ablations]
audited = "2026-10-19"

[ablations.input_projection]
saving = 495.8
arity = 12
verdict = "kept: canonical, exempt. The table is read on its essential inputs only. 0.00% on random tables at every arity; on the ignored classes at n=10/12, +87.6 / +95.2% (one ignored), +216.3 / +259.0% (two), +389.6 / +495.8% (three); constant tables +2,331.3 / +8,094.2%"

[ablations.run_loops]
saving = 95.2
arity = 12
verdict = "kept: a run of equal entries is pushed by a counted Horner loop when shorter than the literal run. 0.00-0.02% on random tables (runs are shorter than the loop's break-even); on run-rich classes at n=10/12, AND and OR +84.9 / +95.2%, half-constant +29.6 / +32.2%, sparse +13.2 / +13.8%, majority +7.7 / +11.1%. The Decisions figures for the loops do not reproduce on seeded tables (F27)"

[ablations.twin_halves]
saving = 0.0
arity = 8
seed = 20261028
tables = 20
verdict = "retired 2026-10-28 (random + named bar): sharing one counted push body for the first block of two identical halves saved 0.03% at n=7 and 0.02% at n=8 on 20 seeded random tables (12,360 -> 12,358 chars at n=8; 2 of 20 changed) and 0 chars on parity, majority, and, or and a threshold at n=7..12; it earned 10-14% only on deep twins (block half the table), an ad hoc class. The command bound that gated it and the executed-count returns that fed it went with it; n=10 random 1847 grows 2,173 -> 2,174 chars. Execution 4T + 79n + 22 still reached at n=8 (1,678) and never exceeded at n=6..8; balanced area (max(rows, cols) squared) within 5% across the retiring commit on parity, majority, and, or, thr2, their complements and 10 random tables at n=7, 8, 10"
