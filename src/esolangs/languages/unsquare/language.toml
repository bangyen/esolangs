# Language-owned data, one section per dataset; aggregators read
# only their own section and skip this file when it is absent.

[curation]
backlinks = 4
admitted = 2021-05-25T18:40:26-04:00

[proof_status]
labels = ["linear lookup"]
qualification = "the first (n-3)//2 essential reads branch on a half of the table, each branch pushes one O/I per row, reversed, and the remaining reads pop their bit's weight in cells off the top of it"
scaling = "linear: worst T + T/2^d + 16·2^d + 10(n-d) + 10 characters"
execution = "linear: at most 4T/2^d + 82n + 22 commands past n=5: 12- or 14-cell loops, one half pushed and popped"
workspace = "linear: at most T/2^d + 12 + (d+1)bl(L) + bl(max(0,L-33)) + 2bl(n) bits: one half's cells on the stack"
definitions = ["d = max(0,⌊(n-3)/2⌋), the reads that branch"]

[catalogue]
folding_constant = "a constant run is one counted Horner loop (_run), log-sized; a constant table is one run"
sharing_exempt = "a stack lookup, one pushed entry per row, with no subtable branch"

[schemes]
folds_without_tree = true

[ablations]
audited = "2026-10-19"

[ablations.input_projection]
saving = 495.8
arity = 12
verdict = "kept: canonical, exempt. The table is read on its essential inputs only. 0.00% on random tables at every arity; on the ignored classes at n=10/12, +87.6 / +95.2% (one ignored), +216.3 / +259.0% (two), +389.6 / +495.8% (three); constant tables +2,331.3 / +8,094.2%"

[ablations.run_loops]
saving = 95.2
arity = 12
verdict = "kept: a run of equal entries is pushed by a counted Horner loop when shorter than the literal run. 0.00-0.02% on random tables (runs are shorter than the loop's break-even); on run-rich classes at n=10/12, AND and OR +84.9 / +95.2%, half-constant +29.6 / +32.2%, sparse +13.2 / +13.8%, majority +7.7 / +11.1%. The Decisions figures for the loops do not reproduce on seeded tables (F27). Re-audited 2026-10-29 against the plain `entry*count` build (20 seeded random tables, seed 20261029): 0.00-0.02% n=3..9 (22,796 vs 22,800 chars at n=9); named, chars (balanced side^2 area in brackets): and/or and complements -37.9% [-36.0%] n=8, -42.8% [-41.5%] n=9; thr2 -27.8% [-22.5%] n=8, -35.6% [-32.1%] n=9; majority -3.9% n=8 [0] , -4.2% n=9 [0]; parity unchanged. A constant run is a constant subtree: canonical folding, ships at any saving; the plain build differs only here and in branch_reads. All tables n<=3 and priced tables n<=7 (named n<=8) execute, wrong-table control fails"

[ablations.twin_halves]
saving = 0.0
arity = 8
seed = 20261028
tables = 20
verdict = "retired 2026-10-28 (random + named bar): sharing one counted push body for the first block of two identical halves saved 0.03% at n=7 and 0.02% at n=8 on 20 seeded random tables (12,360 -> 12,358 chars at n=8; 2 of 20 changed) and 0 chars on parity, majority, and, or and a threshold at n=7..12; it earned 10-14% only on deep twins (block half the table), an ad hoc class. The command bound that gated it and the executed-count returns that fed it went with it; n=10 random 1847 grows 2,173 -> 2,174 chars. Execution 4T + 79n + 22 still reached at n=8 (1,678) and never exceeded at n=6..8; balanced area (max(rows, cols) squared) within 5% across the retiring commit on parity, majority, and, or, thr2, their complements and 10 random tables at n=7, 8, 10"

[ablations.branch_reads]
saving = 32.1
arity = 9
seed = 20261030
tables = 20
verdict = "kept: the first (m-3)//2 essential reads branch (`iA>-<x>`, push half, `IA<x->`, push other half, `OA<`: 16 chars a node) and push only their half, so their 2^k pops leave the program; level d+1 pays while 2^(m-d-1) + 10 > 16*2^d. Random chars, 20 seeded tables: -19.3% n=7 (7,037 -> 5,677), -26.5% n=8 (12,357 -> 9,077), -32.1% n=9 (22,797 -> 15,477), -12.2% n=6; n=10 (6 tables) -37.5%. Named n=7 / 8 / 9: parity -19.3 / -26.5 / -32.1%, majority -19.5 / -27.6 / -33.5%, and/or -14.8 / -33.6 / -43.1%, thr2 -20.1 / -34.3 / -43.6%. Balanced side^2 area on random -19.9 / -22.6 / -32.2% (n=7 / 8 / 9). Saving grows with n (the pops are half of 2T). Every row of every table n<=3, 20 random n=4..9, 6 at n=10 and named n=4..10 plus complements executes; wrong-table control fails"

