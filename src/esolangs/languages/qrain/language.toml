verdict = "not shipped: reverse decision order after the unchanged input-order reader and permute the table accordingly, admitting candidates only within the existing command budget. Random n=7/8 saving 0/0%; OR 340 -> 320 and 403 -> 379 characters, below the size bar. n=3 totals 34277 -> 33079 characters and 163436 -> 157006 commands, a 3.93 percent command reduction with no slower tables, below the 5 percent execution gate. 7530 correct baseline/raced/raw output checks, exhaustive tables n<=3 and sampled n=4..8; 406 independently generated wrong-table controls rejected, 85 raced programs change"

[ablations.constant_table_audit_20261101]
kind = "archive"
arity = 8
saving = 85.2
seed = 0
tables = "both constants n=1..12; exhaustive all tables/rows n=1..3; six witnesses/all rows n=4..6"
verdict = "kept: canonical whole constants. Keep the first input byte on queue zero and drain later bytes into queue one. Emit a literal bit from queue two, pop the first byte low bit, and print its fixed seven-bit tail. Exactly L=n+10-2b characters and commands. Written bits max(bl(L-4)+2,bl(L)+1)+8n+7-b-[n=1]+bl(n), b the answer: state, queue/index pairs, one pending output bit and input cursor. n=8 zero/one 114/116 -> 18/16 chars; n=12 158/160 -> 22/20. n=3 corpus 34277 -> 34181 chars. Each language passed 5656 paired old/new row executions; all 270 nonconstant programs through n=3 stay byte-identical. Both constants n=1..12 execute in default, width=1 and balanced layouts. All 24 balanced scores per language improve or match; all eight benchmark size/command pins remain unchanged. Owned regressions check resources, every read before output and an unread following record. Existing tests expanded without adding cases."

