[proof_status]
labels = ["tree"]
qualification = "each input byte is read onto its own queue and tested in place by a flag-dispatched decision tree; repeated residuals defer through level flags; the first byte splits into a test bit and a fixed seven-bit tail that completes the answer byte"
scaling = "linear: at most 29T + 10n + 25 characters: the plain tree"
execution = "poly n: at most 36n + 60 commands: reads, split, one tree path, print"
workspace = "poly n: at most bl(L) + (2n + 4)bl(2n + 2) + 9n + bl(n) + 10 bits: queues, indices, flags"

