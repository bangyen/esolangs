[proof_status]
labels = ["linear lookup"]
qualification = "constants read and reset n inputs, then print and halt in 2n + 3 commands; otherwise Horner-reads V = 44T + v with sum, then one rung per row: a print, then a test that is a no-op iff V equals the rung's counter; at the row its two no-ops halt the run right after the print"
scaling = "linear: 5T + 6n + 4 commands, about 41 characters a row"
execution = "linear: worst 5T + 6n + 4 commands"
workspace = "poly n: at most 7n + 72 bits"

[catalogue]
