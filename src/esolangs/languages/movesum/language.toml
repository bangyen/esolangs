[ablations]
audited = "2026-10-29"

[ablations.print_before_test]
saving = 17.3
arity = 8
verdict = "kept: 16.8% at n=7, 17.3% at n=8 on 200 random tables each, identical on parity, and, or, majority and threshold3 (size is table-independent); 6 -> 5 commands a rung, no step grows. Printing before the test lets cell 6, left holding V by the last rung, stand in for the scratch load, so the run halts on the print it names. Executed: every row of 3 random tables at n=7 and 8 and every table to n=3, output equal to the table prefix; a one-bit-wrong table fails. A loop-ful rotating register (table in the seed, one shift a row a pass) saved 29% / 37% at n=7 / 8 but runs T^2 commands, against the linear execution check, and was not built"

[audits]
blind_reimplementation = 2026-10-29
plain_rewrite = 2026-10-29

[ablations.shipped_cost_audit_20261101]
arity = 8
seed = "random.Random(6100+n)"
tables = "2 random plus parity/majority/and/or per n=3,5,7,8"
baseline = "9769362f7^"
verdict = "measured with the interpreter/helpers at 567f2cb18. At n=8: characters 79656 -> 65856, sampled commands 13284 -> 11208, largest sampled written-state peak 121 -> 128 bits. Sum of seven-repeat cold generation medians: 248583 -> 215668 ns. All rows at n=3; rows 0,floor(T/3),T-1 otherwise. 204 correct executions, 24 wrong-table controls. Peaks and timings describe this corpus. The printed value remains live; its peak grows by seven bits. Current resource bounds pass where their stated domains apply"

[ablations.constant_table_fold]
arity = 12
tables = "both constants at n=1..12; every row through n=4, four rows thereafter"
verdict = "kept: canonical constant fold, percentage gate exempt. Constants shrink 10976 -> 179 characters at n=8 and 168627 -> 255 at n=12; worst sampled commands 1332 -> 19 and 20556 -> 27, written-state peaks 128 -> 21 and 157 -> 22 bits. Resetting the input cell to 2 after each read prevents two equal reads from halting before the input ends. Both generators together passed 496 old/new executions; all nonconstant programs through n=3 are byte-identical. Sentinel tests cover both bits and three input patterns at every n=1..12. Existing generic worst-case bounds and eight size pins remain unchanged."
