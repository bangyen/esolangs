language = "Movesum"
oldid = 189501

[[examples]]
id = "hello-world-ascii"
source = '''
0=72 1=101 2=108 3=111 4=32 5=87 6=114 7=100 8=1 9=2
move 0 -1
move 8 10
move 1 -1
move 9 10
move 2 -1
move 8 10
move 2 -1
move 9 10
move 3 -1
move 8 10
move 4 -1
move 9 10
move 5 -1
move 8 10
move 3 -1
move 9 10
move 6 -1
move 8 10
move 2 -1
move 9 10
move 7 -1
move 0 0'''
expected = "72 101 108 108 111 32 87 111 114 108 100"

[[examples]]
id = "infinite-cat"
source = '''
1=2 2=1
move -1 0
move 1 3
move 0 -1
move 2 3'''
stdin = "5\n7\n"
expected = "5 7"
stop = "steps"
max_steps = 40

[[examples]]
id = "cat-until-eof"
source = '''
2=1 3=2
move -1 0
move 2 4
move 3 4
move 0 -1
move 0 5
move 1 5'''
stdin = "5\n7\n"
expected = "5 7 0"

[[examples]]
id = "add-two-inputs"
source = '''
1=42 2=42
sum
move 0 -1
move 0 0'''
stdin = "5\n3\n"
expected = "8"

[[examples]]
id = "truth-machine-0"
source = '''
0=42
move 0 -1
move 0 1
move 2 1'''
stdin = "0\n"
expected = "0"

[[examples]]
id = "truth-machine-1"
source = '''
0=42
move 0 -1
move 0 1
move 2 1'''
stdin = "1\n"
expected = "1 1 1"
stop = "steps"
max_steps = 20

[[spec_triggers]]
program = ""
expect = "ProgramError"
claim = "ProgramError: an empty program"

[[spec_triggers]]
program = "0=0"
expect = "ProgramError"
claim = "ProgramError: no instruction"

[[spec_triggers]]
program = "0=0\nmove 1"
expect = "ProgramError"
claim = "ProgramError: a line that is not ``move A B`` or ``sum``"

[[spec_triggers]]
program = "a\nmove 0 0"
expect = "ProgramError"
claim = "ProgramError: a first line that is not ``Key=Value`` pairs"

[[spec_triggers]]
program = "0=0\nmove -1 1\nmove 1 -1"
stdin = "x\n"
expect = "ArgumentError"
claim = "ArgumentError: an input that is not an integer"

[[spec_triggers]]
program = "0=0\nmove -1 1\nmove 1 -1"
stdin = "-3\n"
expect = "HaltError"
claim = "HaltError: a negative input"
