[resource_evidence.execution]
# All-essential lookup, on every row: a pass over L queued bytes runs L
# dequeues, L/2 kept-byte bodies and about L doubling calls, about 5L/2 +
# O(1), and the passes' L sum to 2T - 2.  An ignored input costs at most
# 3 commands but halves the table; the symmetric route is O(n^2) (192 at
# n=7 against 828; notes/ablations/mc_measure_all.py).
expression = "6T + 9n - 3"
exact = true
arities = [1, 2, 3, 6]
first = 1
unit = "commands"
description = { growth = "linear", claim = "worst", template = "{claim} {formula} {unit}" }

[resource_evidence.workspace]
# Component peaks: T + 1 queued bytes; at most n + 5 definitions of a
# character and a body index below n + 14; at most n + 2 frames, the
# program's indexing at most T + 7n + 16 instructions and the rest at
# most 7.
expression = "8T + (2n + 6)bl(n + 14) + 11n + bl(T + 7n + 16) + 52"
exact = false
arities = [1, 2, 3, 6]
first = 1
unit = "bits"
description = { growth = "linear", claim = "at most", template = "{claim} {formula} {unit}" }

[resource_evidence.scaling]
# 4 characters a queued byte, the bit slot ( $ ), two dispatch
# definitions, a doubling definition and a pass a further input: equal
# from n = 2, 2 over at n = 1.  Ignored inputs and the symmetric route
# only shorten it.
expression = "4T + 22n + 58"
exact = false
arities = [1, 2, 3, 4, 5, 6, 7, 8]
first = 1
unit = "characters"
description = { growth = "linear", claim = "at most", template = "{claim} {formula} {unit}" }

