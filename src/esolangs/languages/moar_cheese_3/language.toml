[resource_evidence]
version = 2
construction = "esolangs.languages.moar_cheese_3.generator:moar_cheese_3_request"

[resource_evidence.execution]
# Each packed pass over two halves of L bytes costs 5L+12 commands.
# With m>=2 essential inputs the full packed run takes 3*2^m+13m-4
# plus at most seven commands per ignored input. The symmetric route
# takes at most 2m^2+11m+17 plus four commands per ignored input.
cases = [
    { through = 1, expression = "12" },
    { through = 3, expression = "2n^2+11n+17" },
    { expression = "3T+13n-4" },
]
exact = true
arities = [1, 2, 3, 6]
first = 1
unit = "commands"
description = { growth = "linear", claim = "worst", template = "{claim} {formula}" }

[resource_evidence.workspace]
# The packed queue holds at most T/2+1 bytes and the symmetric queue n+3.
# There are at most n+7 definitions and n+3 frames. Body IDs are at
# most n+20, and non-root frames index bodies of at most four commands.
expression = "8max(T/2+1,n+3)+(n+7)(8+bl(n+20))+(n+3)(bl(n+20)+3)+bl(max(T/2+6n+4,4n+10))"
exact = false
arities = [1, 2, 3, 6]
first = 1
unit = "bits"
description = { growth = "linear", claim = "at most", template = "{claim} {formula} {unit}" }

[resource_evidence.scaling]
# Each pair takes four chars. At full support the packed form adds
# 20n+104 chars from n=3. A discarded slot takes two chars.
expression = "2T+20n+104"
exact = [3, 4, 5, 6, 7, 8]
arities = [1, 2, 3, 4, 5, 6, 7, 8]
first = 1
unit = "characters"
description = { growth = "linear", claim = "worst", template = "{claim} {formula} {unit}, n=3..10; at most at n=1, 2" }

