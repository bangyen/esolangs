[ablations.complement_runs]
saving = 46.7
arity = 12
seed = 0
tables = "n=12 parity, all ones but the last row, and n=8 random"
verdict = "kept: holding ~V through a run of 1s makes a 1 one shift, not a NOR, dup and inv; 46.7% on all ones but the last row and 10.0% on parity at n=12, about 12% on random tables at n=8; n=4 parity grows 775 to 783 chars"

[ablations.shared_rotations]
saving = 22.3
arity = 12
seed = 0
tables = "n=12 parity, all ones but the last row, and n=8 random"
verdict = "kept: each level's h - 1 smear shifts ride the h half-shifts on one pass round the queue, not a pass each; 22.3% on parity and 28.9% on all ones but the last row at n=12, about 17% on random tables at n=8"
