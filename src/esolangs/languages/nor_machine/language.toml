# Language-owned data, one section per dataset; aggregators read
# only their own section and skip this file when it is absent.

[curation]
backlinks = 1

[catalogue]
folding_constant_local = "essential_inputs"  # no essential input: the constant's bit alone

[schemes]
folds_without_tree = true

[proof_status]
labels = ["linear lookup"]
qualification = "the table read at its essential inputs is one integer built by Horner's rule; each essential bit, smeared over a half-width mask, keeps V or V >> h by NORs, and the lone final V prints the low bit"
scaling = "linear: 9T + 12r + O(n^2) characters for r runs of 1s"
execution = "linear: at most 15T + 12n^2 + 93n - 20 commands past n = 1, each run once"
workspace = "linear: at most 3T + 4n + bl(L) + 24 bits: V, its copy and three half-width masks"

[ablations]
audited = "2026-10-27"

[ablations.essential_inputs]
saving = 88.0
arity = 10
seed = 2026
tables = "20 random and 20 with a random proper subset of inputs essential, n=8 and n=10"
verdict = "kept: a table ignoring inputs packs only the essential-input table; 76.7% at n=8 and 88.0% at n=10 on those tables, 0.0% on random ones"

