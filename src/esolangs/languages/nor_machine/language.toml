admitted = 2026-10-27T13:04:04-04:00

[catalogue]
folding_constant_local = "essential_inputs"  # no essential input: the constant's bit alone

[schemes]
folds_without_tree = true

[proof_status]
labels = ["linear lookup"]
qualification = "the table read at its essential inputs is one integer built by Horner's rule; each essential bit, smeared over a half-width mask, keeps V or V >> h by NORs, and the lone final V prints the low bit"
scaling = "linear: 8T + O(r + n^2) characters for r runs of 1s"
execution = "linear: at most 15T + 12n^2 + 93n - 20 commands past n = 1, each run once"
workspace = "linear: at most 3T + 4n + bl(L) + 24 bits: V, its copy and three half-width masks"

