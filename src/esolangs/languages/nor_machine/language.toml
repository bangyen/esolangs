[ablations.constant_table_audit_20261101]
arity = 8
saving = 94.6
seed = "both constant values; witnesses(n) at n=4..6"
tables = "every table and row n=1..3; six witnesses per n=4..6; constants n=1..12"
verdict = "kept: canonical whole constants. n-1 NORs collapse the preloaded queue, AAVV maps x to x NOR complement(x), zero, then V prints; AVLAVV instead builds one via complement, shift and NOR before printing. Exactly n+4+5bit chars/commands; workspace at most max(3n,9)+bl(L-1)+1+bl(2n), since values remain in {-2,-1,0,1} and normalization copies at most thrice. At n=8 zero/one 266/274 -> 12/17 chars; n=12 456/464 -> 16/21. All 24 balanced scores improve or match; generic envelopes and eight benchmark pins unchanged. n=3 corpus 99874 -> 99693 chars. Each language passed 5656 paired before/after row executions; all 270 nonconstant programs through n=3 are byte-identical. Both constants n=1..12 execute in default, width=1 and balanced layouts within their resource bounds."

[ablations.single_accumulator_20261102]
seed = 2026
arity = 8
saving = 17.33
tables = "one supplied raw proposal; every table/row n=1..3, sampled n=4..6; 200 seeded generic tables each n=7,8"
verdict = "kept coherent single-accumulator plus low rematerialization, judged against independently admitted four-NOR mux: 444592/746752 -> 375192/617352 chars at n=7/8 (15.61/17.33%); balanced area 448253/750967 -> 377649/621695. Rolling accumulator alone and raw low rebuild alone fail 10%; no per-table source race. Local h>=16 singleton factory costs 15 commands; constants and ordered whole-stream preload are unchanged. Four-NOR mux independently reduces exhaustive n=3 99693/797544 chars/commands to 84107/672856, no larger table or slower row; joint 83041/664328. Old late-constant/shared-rotation/run rules remain inside the new construction, not competing fallback programs. Source series 6T+8r+O(n^2), versus independent baseline 8T+8r+O(n^2): random limit 20%, all-essential limit at least 1/6. Twenty emitted tables per n=9/10/11/12/14 give 18.45/19.14/19.52/19.75/19.92%, with native boundary controls; no favorable arity cap. Existing numerical E/W caps retained; E also valid n=1. Native field/liveness assertions cover 2213 rows and 8728 checkpoints, plus wrong-low and omitted-shift mutants."

