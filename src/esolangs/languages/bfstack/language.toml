[ablations.input_projection]
saving = 27.3
arity = 12
verdict = "kept: canonical, exempt. Each block packs over its essential inputs only (input_weights); an ignored input is read and popped. 0.00% on random tables at n=8/10/12; with one ignored input 34.4% at n=8, 27.4% at n=10 and 27.3% at n=12, and 13.5% on two-block tables at n=8 whose blocks ignore inputs"

[ablations.decoder_value_race]
saving = 2.7
arity = 12
seed = "random.Random(20261028000 + 7n)"
tables = "20 random per n=7,8 plus parity/majority/and/or/one-third threshold at n=7..12"
verdict = "retired 2026-10-28 (random + named bar): always listing the zero rows (the rarer-value race of the inverted form, which listed ones and preset the result cell, deleted) costs +0.67% of chars at n=7 and +1.31% at n=8 on 20 random tables (balanced area +1.94% / +2.51%, no table smaller) and on named functions at most 2.7% of chars (and, n=12: 736 -> 756; 2.2% at n=7), 0.3-0.4% on parity at n=8/10/12 (n=10: 631 -> 633) and 0.0% on majority, or and the threshold at n=7..12; balanced area at most 6.2% (and, n=7). Only sparse tables (10% ones) moved, 28% at n=8..12 (n=10 sparse: 6,135 -> 7,842 chars), an ad-hoc class that keeps nothing. Code deleted: the inverted cascade, the preset flag of the encoder. The n=3 total grows 58,758 -> 59,249 characters (+0.84%), and the worst execution and size bounds are re-derived (worst seven-input block 1,079 commands, 948 characters with its closing <; worst workspace lists 127 rows, not 77): same growth classes. Every program ran on all rows (n<=3 exhaustive, 20 random + named n=4..8, 0 mismatches)"

