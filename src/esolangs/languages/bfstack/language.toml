corpus = "esolangs.languages.bfstack.tests.resource_witnesses:resource_corpus"

[resource_evidence.execution]
# At most 64 commands per input outside of weight additions and decoding.
# Weight additions total at most 255. At most 255 decoder decrements
# execute, each with up to four control commands and three answer updates.
expression = "64n+2300"
exact = false
arities = [8, 9, 10]
first = 9
unit = "commands"
description = { growth = "poly n", claim = "at most", template = "{claim} {formula}" }

[resource_evidence.workspace]
# Prefix branch sentinels, an ASCII answer, a byte index and the current
# input are live. Up to 256 decoder loops nest below the prefix branches.
expression = "2n+32+bl(n)+(n+258)bl(L)"
exact = false
arities = [3, 5, 6, 9, 10, 11]
first = 5
unit = "bits"
description = { growth = "poly n", claim = "at most", template = "{claim} {formula}" }

[resource_evidence.scaling]
# A block of S = 2^k rows over k essential of w remaining inputs costs
# 51 + 2(w-k) + 54k + (S-1) for the encoder, 3c + 3m + 3 for the decoder
# (c the last change, m changes; m <= S-2 once k >= 2) and 2 to print:
# at most 7S + 54k + 2(w-k) + 46, the worst block at k = w. A branch costs
# 62 and a block under one 1 more, so from n = 9 the full tree of
# 256-row blocks gives 2^(n-8)(2270 + 1 + 62) - 62. Alternating rows with
# one repeat reach both (tests/proofs/_witness_builders.py:_bfs_chars).
cases = [
    { through = 8, expression = "7T + 54n + 46" },
    { expression = "2333T/256 - 62" },
]
exact = true
arities = [3, 4, 5, 6, 7, 8, 9]
first = 3
unit = "characters"
description = { growth = "linear", claim = "worst", template = "{claim} {formula}" }

