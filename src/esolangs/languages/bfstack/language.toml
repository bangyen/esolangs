[resource_evidence.execution]
# The stated execution bound, evaluated for n and the program.
#
# A one arm costs 60 commands a wide level (a zero arm 59) over the worst
# eight-input block's 1,769 commands, one more under a tree (the closing
# ``<``).
# A projected identity costs only 2n, with the same branch-only pop.
cases = [
    { through = 8, expression = "60n + 1289" },
    { expression = "60n + 1290" },
]
exact = true
arities = [8, 9, 10]
first = 9
unit = "commands"
description = { growth = "poly n", claim = "worst", template = "{claim} {formula}" }

[resource_evidence.workspace]
# Past seven inputs the root is a zero arm (stack peak ``n + 6``) or a one
# arm (loop at position 51: six bits, not ``bl(L)``): never both at full
# width.  At n = 9 the zero arm's loop sits below 2^11 (a one arm of a
# 1,510-character block), one bit short.
#
# An identity has no loops and at most two six-bit input bytes. Inside a
# tree it replaces a block of at least eight remaining reads: its twelve
# data bits plus the ancestor sentinels fit n+6. The cursor and loop
# positions use the emitted L, so shortening a block preserves the bound.
# Alone it uses at most 12+bl(n)+bl(L) bits (six data bits when n=1),
# below this formula also for n<8.
# At n=9 an identity one arm puts the zero-arm loop below 128; an identity
# zero arm has no decoder loops, while the one-arm loop stays at 51.
# Thus the one-bit n=9 correction survives either shortened arm.
cases = [
    { through = 7, expression = "n+7+bl(n)+(max(n-8,0)+min(T,255)+2)bl(L)" },
    { through = 8, expression = "n+6+bl(n)+(max(n-8,0)+min(T,255)+2)bl(L)" },
    { through = 9, expression = "n+5+bl(n)+(max(n-8,0)+min(T,255)+2)bl(L)" },
    { expression = "n+6+bl(n)+(max(n-8,0)+min(T,255)+2)bl(L)" },
]
exact = [5, 9, 10, 11]
arities = [3, 5, 6, 9, 10, 11]
first = 5
unit = "bits"
description = { growth = "poly n", claim = "worst", template = "{claim} {formula} (attained at n = 5 and past n = 8)" }

[resource_evidence.scaling]
# Past n = 8 a tree of 256-row blocks: one 1,511 (start 1, a one at row 0),
# the rest 1,510 (start 0, a one past row 1), 62 a split.  A block is the
# encoder's ``2 + 54*8 + 255``, a cascade over 254 zero rows ending at 255
# (``255 + 2*254 + 7``) and the printing 50.
cases = [
    { through = 7, expression = "4T+54n+57" },
    { through = 8, expression = "1509" },
    { expression = "393T/64-61" },
]
exact = true
arities = [3, 4, 5, 6, 7, 8, 9]
first = 3
unit = "characters"
description = { growth = "linear", claim = "worst", template = "{claim} {formula}: zero-row walk telescopes" }

