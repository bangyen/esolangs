[ablations]
audited = "2026-10-19"

[ablations.input_projection]
saving = 27.3
arity = 12
verdict = "kept: canonical, exempt. Each block packs over its essential inputs only (input_weights); an ignored input is read and popped. 0.00% on random tables at n=8/10/12; with one ignored input 34.4% at n=8, 27.4% at n=10 and 27.3% at n=12, and 13.5% on two-block tables at n=8 whose blocks ignore inputs"

[ablations.decoder_value_race]
saving = 21.6
arity = 12
verdict = "kept: each block's decoder lists the rarer value's rows in its subtraction cascade (the inverted form lists ones and presets the result cell). Priced by deletion: always listing zeros costs 1.0% on random tables at n=8/10/12, 7.5% / 8.6% / 8.7% on majority, and on sparse tables (10% ones) 22.4% at n=8, 21.7% at n=10 and 21.6% at n=12; 0.00% on dense tables, where the direct form is the winner the race picks anyway. Plain-rewrite audit 2026-10-27: kept as a class rule on sparse tables (10% ones, 200 tables): +29.7 / +28.5% off at n=7/8 and 28.0 / 27.8 / 27.8% at n=9/10/12 (20 tables), flat across arity; random tables +0.96 / +0.97 / +0.75 / +0.92 / +1.00% at n=7/8/9/10/12 (fails 10%); named functions, now shadowed by the symmetric rule, at most +2.7% (AND, n=12), 0.0% on OR and majority, +0.3% on parity, so the majority figure above predates the symmetric rule. The tie (`<` vs `<=`) is size-neutral: 0.00% off, programs differ only by equal-length polarity. Every changed program run on all rows through n=8"

[ablations.two_block_classifier]
saving = 0.0
arity = 12
seed = "random.Random(20261028000 + 7n)"
tables = "20 random per n=7,8 plus parity/majority/and/or/one-third threshold at n=7..12"
verdict = "retired 2026-10-28 (random + named bar): deleting the two-block classifier changes no program on 20 random tables at n=7 and n=8 (0.0% of chars and of balanced area) nor on parity, majority, and, or and a one-third threshold at n=7..12 (0.0%, both metrics; the symmetric rule takes the named functions first). Only two-block tables moved (random blocks: n=10 2,657 -> 3,461 chars, +30.3%; n=8 unchanged on the table tried) and an ad-hoc class keeps nothing. It also cost executed commands: its worst row ran 146 commands per two levels against 120 for two branches, so the execution bound falls from 73n + 371 + 13(n mod 2) to 60n + 475. Code deleted: the classifier node and _bfstack_class folded into _bfstack_small. Every program ran on all rows; generator sizes unchanged"

[ablations.halves_agree_skip]
saving = 0.6
arity = 10
verdict = "kept: canonical family, exempt. A wide node whose halves agree reads and pops the split input and builds one half. Its solo price is 0.00% on random tables and at most 0.6% (leading-ignored tables at n=10): where halves agree the quarters repeat too, so the two-block classifier wins the same tables, and constant halves are folded first. Jointly with the classifier and constant spans removed, leading-ignored tables cost 50.9% at n=10 and 50.6% at n=12"

[ablations.constant_spans]
saving = 0.8
arity = 8
verdict = "kept: canonical, exempt. A constant span inside the wide build folds to a constant leaf. Its solo price is 0.8% at n=8 declining to 0.1% at n=12 on half-constant tables: the halves-agree skip and the block projection absorb a constant span almost as cheaply. Jointly (plain build) half-constant tables cost 42.7% at n=8 rising to 48.2% at n=12"

[ablations.decoder_figures]
saving = 0.0
arity = 12
verdict = "recorded: the decoder docstring's listing figures (17,091 chars at twelve inputs for a mostly-zero table, 4,801 for the all-one table) reproduce under no reading tried: the shipped programs for the n=12 AND and OR tables are 1,135 and 1,072 chars, the decoder's own cascades on those tables are 12,292 / 4,105 and 10 / 12,293, and the decoder never sees twelve inputs (blocks cap at seven essential inputs). See the stale-figures entry F20"

[ablations.symmetric_count]
saving = 60.0
arity = 8
seed = "named symmetric tables"
tables = 7
verdict = "kept under the named-function rule: a table depending only on how many essential inputs are 1 takes the byte-indexed decoder over that count (1 + count fits the byte at any width, so the seven-input block limit does not bind), raced by length against the shipped build. Parity 43.9% at n=7, 60.0% at n=8, 76.9% at n=10, 86.7% at n=12; majority 43.3% / 68.2% / 90.4% / 97.1%; at-least-2 and exactly-1 60.3% at n=8; and 28.4%, or 23.1% at n=8; a symmetric table with an ignored input 36.9% at n=8. Random tables: 0 of 200 change at n=5..8. Exhaustive n<=3: 38 tables change, none grows, every changed program executed; named tables executed through n=10. Plain-rewrite audit 2026-10-27: kept; the race against the plain build is removed because the count form always wins: all 12,596 symmetric tables at n=8 (every subset of 2..8 essential inputs, all count vectors; 4,106 / 1,320 / 414 / 124 / 34 / 8 at n=7..2) ship byte-identical programs without it. Random tables: 0 of 200 change at n=4..8, 0 of 20 at n=9..12; random symmetric tables (200) cost +67.3 / +208.9% at n=7/8, +32.4% at n=6 (10 tables), and at n=10/12 (100) +941.7 / +3478.1%; symmetric over a random essential subset (100) +16.8 / +23.0 / +208.6 / +796.6% at n=7/8/10/12; named at n=8: parity +150.1%, AND +39.6%, OR +30.0%, majority +215.0%. Every changed program run on all rows through n=8"

