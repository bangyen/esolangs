# Language-owned data, one section per dataset; aggregators read
# only their own section and skip this file when it is absent.

[deep_arities]
execution = 8
workspace = 7

[curation]
backlinks = 8

[proof_status]
labels = ["finite lookup"]
qualification = "a pair of answers per deque, and the input walks the deque cursor to the pair it wants"
scaling = "linear: T pushes, `T/2 - 1` cursor steps, two rows"
execution = "linear: at most 3T + 9n + 4 nodes: preload T plus runs, then 8n of selection reads"
workspace = "T log T: at most (7T+20n+100)(bl(L)+4) + Σ_{j<T/2}(bl(j)+2) + 2bl(L) + n + 2bl(n) + 32 bits: exit-memory keys, deques"

