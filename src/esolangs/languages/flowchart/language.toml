[resource_evidence.execution]
expression = "2T+2·2^⌊n/2⌋+2^⌈n/2⌉+9n+1"
exact = true
arities = [2, 3, 5]
first = 2
unit = "nodes"
description = { growth = "linear", claim = "worst", template = "{claim} {formula} {unit} past n = {previous}: preload T plus T - 1 runs" }

[resource_evidence.workspace]
# Each exit-memory entry uses four heading bits and its column's
# bit width. Deque keys fill the power-of-two range, with zero one bit.
expression = "4E+C+31+⌊n/2⌋+T+(⌊n/2⌋-1)·2^⌊n/2⌋+2bl(n)"
source_terms = { names = ["C", "E"], provider = "esolangs.languages.flowchart.proof_formulas:workspace_terms" }
exact = true
arities = [3, 4, 5]
first = 3
unit = "bits"
description = { growth = "T log T", claim = "worst", template = "{claim} {formula} {unit} past n = {previous}: exit memory, deques and counters" }

[resource_evidence.scaling]
# 20T + 16 * 2^floor(n/2) + 12 * 2^ceil(n/2) + 72n + 14 = 2 * row.
#
# A row is 4 a set (R = T - 1 runs), 6 a push, 4 a ``[ >`` and 4 a cursor
# rail (2^floor(n/2) - 1 each: deques of 2^ceil(n/2) entries), 12 a pop
# pair (2^(ceil(n/2) - 1) - 1), 4 a ``/ /`` (8n - 7) and a switch (n).
expression = "20T+16·2^⌊n/2⌋+12·2^⌈n/2⌉+72n+14"
exact = true
arities = [2, 3, 4, 5, 6, 7, 8]
first = 2
unit = "cells"
description = { growth = "linear", claim = "worst", template = "{claim} {formula} {unit} past n = {previous}: two rows" }

