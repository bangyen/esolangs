[ablations.free_merge_preload_prototype]
saving = 7.8447
arity = 8
seed = "random.Random(4242), restarted at each arity; sequential choice('01')"
tables = "200 fixed generic tables each n=7/8; all276 small tables/allrows,10 samples each4..6 and20 each7/8; named families separately"
verdict = "rejected 2026-11-02: raw DP has Theta(T*2^deep) states across the deques (Theta(T^(3/2)) at current depth), violating O(T)/no-search. Executable linear refinement drains both current-bit runs, then toggles, preserving each end's order and carrying R across cursor steps. Actual grid_area579640 ->539728 /1028568 ->947880 at fixed7/8 (6.8857/7.8447%), below10%. Parity and negation each3070 ->2774 /5486 ->4894 (9.6417/10.7911%), so fixed7 fails; majority3.5529/3.4203%, and/or0%, thresholds2/3 below2.5%. Stronger depth1 repair makes its first even push prepend (equivalent on the empty deque), permitting free pair merge; simply swapping the original two top pushes is invalid. Stronger exhaustive n3 cells110958 ->109166, chars91806 ->90910, commands95648 ->93856 (1.8735%), no larger table or slower row, below5%. The exact new worst-command bound is3T/2+2D+K+9n+3 versus old2T+2D+K+9n+1 (D=2^(n-k),K=2^k), attained by derived all-essential witnesses. Reduction(T/2-2)/old is strictly below25% at every finite n (17.6136/19.9052% at7/8), limit25% from below, so no25% alternative. Guarded original-depth variant and all larger selected layouts execute9600 rows with2372 full deque snapshots before first pop equal to baseline; stronger repair4240 rows/2092 snapshots pass. No production merge/search/state added."

[ablations.shared_answer_tail_prototype]
saving = 0.0
arity = 8
seed = "random.Random(4242), restarted per arity"
tables = "200 generic source tables each7/8; exhaustive allsmall and ignored-trailing classes; old W witnesses3/4/5"
verdict = "not shipped 2026-11-02: identical _ANSWER continuation is eligible for canonical repeated-tail sharing, but the actual two-row canvas loses no area or characters: fixed200 totals579640/1028568 cells and first20 totals36632/60568 chars remain ties. Removed upper answer nodes become leading blanks because the lower answer fixes width. A valid join must use top-left corner┌ (raw westbound┐ cannot be entered), and must retain trailing ignored reads BEFORE each pop; moving reads after it overwrites the answer register (native0011,row01 returns1 instead of0). Repaired shared tail executes all small/ignored controls and leaves node commands unchanged. Native W on existing worst controls rises1237 ->1256 /2040 ->2059 /3445 ->3464 at3/4/5 (+19bits) due the join/lower-row path. No measured source/execution benefit justifies a new path and larger written state, so retain the current layout; this is not a percentage rejection of canonical sharing. Generator/proofs/pins unchanged."

