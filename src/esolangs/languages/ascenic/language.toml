[ablations.change_point_scan]
saving = 0.0
arity = 12
verdict = "recorded: an LT/ADDS pair is emitted only where the answer changes. The dense removal (a pair at every row boundary) computes the wrong function — 120 mismatches in 256 gated runs at n=6 — because a pair at a non-change boundary flips the parity the extraction reads; there is no correct denser scan in this architecture. The placement is the encoding. Correctness machinery"

[ablations.argument_floor]
saving = 0.62
arity = 12
verdict = "recorded: every emitted argument is the smallest its constraint allows (LT thresholds exact, the rest the running minimum, parity-adjusted where required). Taking the free choices (each -2 build's start, base) 2 higher instead costs +2.00% at n=10 and +0.62% at n=12 on random tables, declining — the bumps are O(n) against Theta(T^2) chars. Nothing to remove: the minimum is the default, not a device"

[ablations.mirror_scan]
saving = 90.4
arity = 11
verdict = "kept: the scan is also built on the reversed table with the Horner signs flipped and a first-line SUB 2 (weight 2T after the last MULS) standing in for the 2T shift, rows read T-1-r; the shorter is emitted. and/nand 53.4% / 64.7% / 76.2% / 84.3% / 90.4% at n=7 / 8 / 9 / 10 / 11 (8,399 -> 2,965 chars at n=8), majority 16.6% / 17.6% at n=8 / 10, random 0.95% / 1.76% at n=7 / 8 (20 seeded); or, nor, parity, thresholds unchanged. Measured 2026-10-28 chars, every program executed (n<=3 exhaustive, 300 samples at n=4, named + 20 random at n=5..8)"

[ablations.ignored_input_drop]
saving = 76.8
arity = 6
verdict = "kept: canonical, exempt from the bar. An input the table ignores is read and popped (INPUT, POP) outside the Horner code, so it no longer doubles the row count (and the mirror is forward-only when input 0 is ignored). 13,160 -> 2,715 chars with 2 of 6 inputs ignored (4-row core); 1,500 seeded tables with random ignored subsets at n=3..7 never grew (8.52M -> 1.98M chars); random, parity, and/or, majority and thresholds unchanged at n=7 / 8. Every program executed (n<=3 exhaustive, 80 ignored-subset tables at n=4,5, one at n=6)"

