qualification = "Horner's rule by built `-2` constants makes each row's code `base + 2r`; `LT t`, `ADDS` at every change point adds 1 to codes below `t`, so the parity answers; straight-line code, no jump; named parity sums retained bits instead"
definitions = ["L = 2T+6n+5-(n mod 2), a = 8n-5, c = 8n+3: the mirrored scan's lines, last push, base"]

