[proof_status]
labels = ["tree"]
qualification = "Horner's rule by built `-2` constants makes each row's code `base + 2r`; `LT t`, `ADDS` at every change point adds 1 to codes below `t`, so the parity answers; straight-line code, no jump"
scaling = "lower bound: worst N characters: generated Θ(T**2), N the alternating table's size ([summary](#ascenic-bound))"
execution = "linear: worst 2T + 7n + 3 - 2⌊n/2⌋ commands: alternating answers, two lines a change"
workspace = "poly n: worst bl(L) + max(bl(a)+bl(a+2)+n+2, bl((c+2T-2)(c+2T-1))) + bl(2n-1) bits from n = 3: index, stack, cursor"
definitions = ["L = 2T+6n+5-(n mod 2), a = 8n-5, c = 8n+3: the mirrored scan's lines, last push, base"]

