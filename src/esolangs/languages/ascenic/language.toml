# Language-owned data, one section per dataset; aggregators read
# only their own section and skip this file when it is absent.

[curation]
backlinks = 0

[proof_status]
labels = ["tree"]
qualification = "Horner's rule by built `-2` constants makes each row's code `base + 2r`; `LT t`, `ADDS` at every change point adds 1 to codes below `t`, so the parity answers; straight-line code, no jump"
scaling = "lower bound: tight language and generated Theta(T**2) ([summary](#ascenic-bound))"
execution = "linear: worst 2T + 7n + 3 - 2⌊n/2⌋ commands: alternating answers, two lines a change"
workspace = "poly n: at most 3n + bl(n) + 15 bits: line index, scale times code, input cursor"

[proof_status.audit]
totality = "Total"
generation_time = "Language lower bound"
output_size = "Language lower bound"
evidence = "docs/proofs/index.md#ascenic-bound"

