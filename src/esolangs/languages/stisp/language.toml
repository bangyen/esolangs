[ablations]
audited = "2026-10-21"

[ablations.subtree_sharing]
saving = 76.1
arity = 12
seed = "random.Random(184700 + n)"
tables = 200
verdict = "kept: canonical, exempt; equations per reduced-diagram node against per tree position: 60.3% on random tables at n=8 rising to 76.1% at n=12, 72.6-84.8% one-ignored, 88.5-98.8% on parity/majority/and. Plain-rewrite audit: no bespoke tricks; the drain equation is how a leaf answers, not a device"

[ablations.halves_agree_skip]
saving = 0.9
arity = 12
seed = "random.Random(184700 + n)"
tables = 200
verdict = "kept: canonical, exempt; one equation over a variable where a node's halves agree, against one per bit: 2.3% on random tables at n=8 declining to 0.9% at n=12, 5.2-7.8% one-ignored, 0.0% on constants (the drain answers them) and on parity/majority/and; never larger"
