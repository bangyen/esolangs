[ablations.constant_table_audit_20261101]
arity = 8
saving = 63.5
seed = "both constant values; witnesses(n) for n=4..6"
tables = "every table and row n=1..3; six witnesses per n=4..6; constants n=1..12"
verdict = "kept: canonical whole constants. Read n characters into cell 0, = clears the last digit through untouched cell 48/49, ! seeds one, >+ fills cells 1..49, then 47+bit increments and output. Exactly n+148+bit chars/commands; workspace 408+bl(L)+bl(n) bits. At n=8 zero/one 430/428 -> 156/157 chars; n=12 490/488 -> 160/161. The n=3 corpus shrinks 121956 -> 121551 chars. All 270 nonconstant programs through n=3 remain byte-identical; generic envelopes and all eight benchmark pins remain unchanged. Each language passed 5656 paired before/after row executions. Both constants n=1..12 execute in default, width=1 and balanced layouts; sentinel regressions require all input before output."

[ablations.trick_prototype_20261102_no_return_after_print]
arity = 8
saving = 11.3087910812
verdict = "rejected as proposed: the extra3n parking moves are unnecessary, grow158 pilot tables and slow2406 row pairs. Over200 seeded Random(1000*n+k).choice tables, n7 source315186->286024 (9.2523%),n8 473605->420046 (11.3088%): n7 misses10%. Both baseline and candidate execute all small tables/rows and sampled random4..8 correctly (5040 native runs); unchanged workspace bounds hold."

[ablations.trick_prototype_20261102_no_return_lean]
arity = 18
saving = 16.2287073898
verdict = "rejected after extending the growing size curve. Removing all return moves needs no extra parking: the existing leaf return reaches X_n=52+2n, beyond the initialized tape, and post-print guards only move right over zeros; tape[0]=0 makes their indirect tests false. Source never grows and no pilot row slows. 200 seeded tables n7/8 save11.9174%/13.3358%;200 per7..12, then20 per13..18. Highest measured saving16.4803% at16, then16.4548%/16.2287% at17/18: both declining endpoints miss20%; no artificial n8 cap where saving merely diminishes. n3 chars121551->116635. 5040 native pilot runs check all tables/rows<=3 and sampled random4..8; named controls additionally trace zero-valued guard positions and monotone post-print motion. Actual larger-program rows at15..18 also pass. This changes the return convention and final pointer, rather than deleting state-identical no-ops, so it uses the ordinary gate."

[ablations.trick_prototype_20261102_short_names]
arity = 8
saving = 5.7913239936
verdict = "rejected: bounded variants rename declared functions after inlining, or rename the DAG once before the inlining decision. Assign the empty name first, then shortest visible-ASCII names in descending static use count; quotes protect every name. On200 seeded tables, post-inlining n7/8 saves5.9511%/5.7660%; pre-inlining5.9762%/5.7913%, all below10%. Through14 neither reaches7%. Each variant passes2520 native runs over all small tables/rows and sampled random4..8; empty names actually fire on276/326 tables, and a missing-name positive control fails parsing. No length growth or small workspace violations. The raw unbounded fixed-point retry is not admitted as a loop-less construction; the two bounded, executable variants do not meet the size gate."

[ablations.trick_prototype_20261102_adjacent_digit_cells]
arity = 8
saving = 5.1067873017
verdict = "rejected generic move: digits at top+1/top+2, with Boolean mapping cells48/49 unchanged, save7.2675%/5.1068% over200 seeded n7/8 tables, below10% and declining. 5040 native pilot runs compute every tested answer with full read-first/sentinel consumption and small workspace bounds. AND/OR and their complements save11.23..12.43% at7 and11.98..13.09% at8, but extending this growing named curve through20 gives13.32..14.06% at19 and12.78..13.50% at20, declining below20%; no favorable arity cap. All four named tables execute every row at7/8 under baseline and all five prototype variants (9216 native runs total), including explicit tail-guard traces. A wrong table and a removed print both fire output controls. No generic or named admission and no bundle of subthreshold rules."

