arity = 12
verdict = "kept: canonical family, exempt. Equal halves read the character and call the one child without the branch test. 2.9% at n=6 declining to 1.5% at n=12 on random tables, 2.4-3.6% on the ignored-input classes; 0.00% on parity, AND, OR, majority and constant tables, whose agreeing nodes sit over constant subtables. Re-measured 2026-10-29, 20 random tables per n: 2.6% n=3, 3.2% n=7, 2.1% n=10; 0.00% on every named function and complement n=3..10"

[ablations.inline_race]
saving = 35.4
arity = 12
verdict = "kept: each function is pasted into its callers unless declaring it wins the cost model (uses times size against declaration plus call costs). 18.5% at n=6 rising to 36.0% at n=10 and 35.4% at n=12 on random tables; the docstring's 26% share at n=10 and its 8,558-char declaring-everything anchor both reproduce. Re-measured 2026-10-29 against declaring every function, 20 random tables per n: 10.3% n=3, 18.5% n=7, 27.0% n=10; named functions (AND/OR/majority/threshold-2 and complements) 9.5-15.3% n=3..10 (majority 9.7% at n=10), parity 6.0% at n=3 falling to 2.8% at n=10 (its tables share every level, so little is pasted); a rule on usage count, not a race, so no build is duplicated"

