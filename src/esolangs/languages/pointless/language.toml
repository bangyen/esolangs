# Language-owned data, one section per dataset; aggregators read
# only their own section and skip this file when it is absent.

[curation]
backlinks = 0

[proof_status]
labels = ["tree"]
qualification = "each distinct subtable is one function, pasted in where that is shorter; `,=` maps a character to its bit through the cells 48 and 49, and `[` tests the bit's cell; the one `!` seeds the 1s that make `+` an increment"
scaling = "linear: O(T/n) nodes with O(n)-digit names"
execution = "poly n: at most 26n + 311 steps: setup, then 26 a level; a pasted call saves one"
workspace = "poly n: at most (n+1)(2bl(L)+4) + 16n + 430 bits: a frame a level, the tape"

