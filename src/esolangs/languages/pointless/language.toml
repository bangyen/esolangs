[resource_evidence.execution]
expression = "C*L + (1-C)*(26n+309)"
source_terms = { names = ["C"], provider = "esolangs.languages.pointless.proof_formulas:source_terms" }
exact = true
arities = [3, 6]
first = 3
unit = "steps"
description = { growth = "poly n", claim = "worst", template = "{claim} {formula} {unit}: C marks a straight-line constant" }

[resource_evidence.workspace]
expression = "C*(408+bl(L)+bl(n)) + (1-C)*((n+1)*(2bl(L)+4)+16n+430)"
source_terms = { names = ["C"], provider = "esolangs.languages.pointless.proof_formulas:source_terms" }
exact = false
arities = [1, 2, 3, 6]
first = 1
unit = "bits"
description = { growth = "poly n", claim = "at most", template = "{claim} {formula} {unit}: C marks a straight-line constant" }

[resource_evidence.scaling]
# P is the largest root identifier and A prices declarations and
# references by layer. The header and two constant leaves contribute
# the remaining terms. Costed inlining only shrinks this envelope.
expression = "329+14n+digits(P)+2digits(n)+A"
source_terms = { names = ["A", "P"], provider = "esolangs.languages.pointless.tests.formulas:scaling_terms" }
exact = false
arities = [1, 2, 3, 4, 5, 6, 7, 8]
first = 1
unit = "characters"
description = { growth = "linear", claim = "at most", template = "{claim} {formula} {unit}: every function declared" }

