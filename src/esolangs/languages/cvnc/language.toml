[ablations.subtree_sharing]
kind = "archive"
saving = 86.7
arity = 10
verdict = "kept: canonical sharing, exempt; a repeated subtree is entered by climbing to its first copy's syllable and jumping, where shorter. 17.5% / 19.6% on random tables at n=9/10 and rising, 82.4% / 86.7% on two-block 16-row tables, 96.1% / 98.4% on parity at n=10/12. Plain-rewrite audit 2026-10-27, deleting it (200 random tables per arity, seed 1000+n; 40 per class, 20 at n=9): +11.75 / +14.37 / +16.97% at n=7 / 8 / 9, rising; two-ignored +6.8 / +9.4 / +13.6%, mid-ignored +8.8 / +11.9 / +15.7%, half-constant +7.2 / +9.8 / +12.2%, parity +80.3 / +88.5 / +93.3%, OR 0.00% (size-neutral); 3 of 40 two-ignored tables at n=7 are smaller without it"

[ablations.climb]
kind = "archive"
saving = 19.7
arity = 10
verdict = "kept: the accumulator reaches a jump target by a closed form (nearer square root, square, step the rest) instead of one increment per syllable; 17.6% / 19.7% on random tables at n=9/10, 75.4% on two-block tables at n=10, 70.8% / 70.4% on parity at n=10/12. Its price overlaps subtree sharing's: each is measured with the other in place. Plain-rewrite audit 2026-10-27, one increment per syllable instead (same corpora): +11.87 / +14.54 / +17.16% on random tables at n=7 / 8 / 9, rising; two-ignored +6.7 / +9.7 / +13.8%, mid-ignored +8.7 / +11.9 / +15.9%, half-constant +7.6 / +10.3 / +12.6%, parity +54.9 / +62.2 / +67.4%, OR 0.00% (size-neutral); no table grows"

[ablations.spelling_dp]
kind = "archive"
saving = 18.9
arity = 10
verdict = "kept: commands are spelled as the fewest syllables by dynamic programming over the syllable options, against 19.8% / 18.9% on random tables at n=9/10 for a greedy first-option spelling, flat across arities, and 26.6% / 23.1% on parity at n=8/10. Plain-rewrite audit 2026-10-27, first-option spelling instead (same corpora): +17.22 / +17.07 / +17.99% on random tables at n=7 / 8 / 9, flat; every class 15.8-20.4%, parity 17.2 / 26.6 / 24.9%, OR 18.8 / 19.4 / 19.7%; no table grows"

