[ablations.leaf_accumulator_reuse]
kind = "archive"
saving = 19.0
arity = 8
verdict = "kept for the parity family only: a leaf with no reads left reuses the accumulator's known value instead of flooring it. Re-audit 2026-10-30, always flooring (_leaf given None), default / balanced area, the delete cost: parity +20.3 / +18.3 / +18.8 / +19.2 / +13.6 / -6.5% default and +20.0 / +19.0 / +17.4 / +16.0 / +14.8 / 0.0% balanced at n=7 / 8 / 9 / 10 / 11 / 12, so it clears the 10% bar at n=7..8 on a named function but is a cliff at n=12 (default only). Every other named function (majority, and, or, nand, nor, thresholds at n/4 and 3n/4) -2.4..+4.5% default at n=7..12, and 0.0% balanced except majority 6.2 / 5.5 / 8.9% at n=9 / 10 / 12, and / nor 12.9% at n=8, nor 10.8% at n=10, thr 3n/4 5.1% at n=12 (isolated cells, no trend). Random tables (20 each, seed 4300 + 1000n + i, i < 20), default / balanced: +3.23 / +3.88% at n=7, +0.37 / +1.00% at n=8, +1.81 / +1.75% at n=9, +5.53 / +5.75% at n=10, the plain build smaller on 8 / 9 / 8 / 2 of 20 default tables: sub-bar and flat, so it keeps on parity alone. Executed on all rows: 20 random tables at n=7 and at n=8, both builds and both routes, and the 8 named functions at n=7 and n=8, every program equals its table; a table with its last bit flipped fails on each. Plain-rewrite audit 2026-10-27, deleting it: +4.25 / +4.18 / +3.76 / +1.79% on 200 random tables at n=5..8 (seed 4242), +1.71% at n=9, +4.73% at n=10, +4.07% at n=12, flat; deleting it loosens the scaling bound to 19T/2 + 13 (a pair spelled alone costs 14, not 12)"

[ablations.constant_table_audit_20261101]
kind = "archive"
arity = 8
saving = 54.5
seed = 0
tables = "both constants, n=1..12"
verdict = "kept: canonical constant folding and minimal spelling, exempt. Native constants read every line, floor the final bit to zero, increment for one, print numerically and fall off the end. Nested leaves retain the shared halt gadget. Default chars and commands floor(3n/2)+2+2b: n=7 30/32->12/14 (58.1%), n=8 32/34->14/16 (54.5%), n=12 38/40->20/22. n=8 commands 28/30->14/16, written workspace 26/27->9/10 bits. n=3 corpus chars 14893->14857. Executed 1120 candidate runs and 5656 paired old/new row runs; 270 nonconstant n<=3 sources identical. Both constants execute default, width=1 and balanced layouts through n=12; all 24 balanced scores match or improve. All eight benchmark size/command pins unchanged and global resource caps unchanged. Owned raw read-first checks verify exact read count and preserve the following input record."

[ablations.tricks_20261102]
kind = "archive"
arity = 8
