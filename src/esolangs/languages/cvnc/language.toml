# Language-owned data, one section per dataset; aggregators read
# only their own section and skip this file when it is absent.

[curation]
backlinks = 8

[proof_status]
labels = ["tree"]
qualification = "the halting goto squares once more whenever the program is not shorter than its reach, so every finite tree halts, and a subtree already emitted at its level is entered by climbing the accumulator to its syllable and `j`, where shorter"
scaling = "linear: at most 17T/2 + 13 characters: pair 12, node 5, prologue 18"
execution = "linear: at most 17 + 4n + (n-1)(3 + sqrt(2L)) tokens: the path plus shared-subtree climbs"
workspace = "poly n: worst 17 + bl(2n-1) + bl(L) bits, n in 4..13"

