verdict = "retired 2026-10-30: superseded by signed_sum, which has no last-level forms (a `dip` / `(1+di-)p` pair costs 3 / 8 against 0 / 12, and a 0 pair is no branch). The forms saved 20.7% at n=7..10 against the root-style conditional at every level (re-measured 2026-10-29); signed_sum is 15.03% (n=7) to 16.51% (n=10) under the build that kept them, balanced area 14.87 to 16.57%"

[ablations.complement_rule]
saving = 0.0
arity = 10
verdict = "retired 2026-10-30: the complement is now chosen by ones above zeros (signed_sum), not 10 pairs above 01 pairs plus a closing flip. The pair rule saved 1.58% / 1.23% / 0.64% on random tables at n=7 / 8 / 10 under the previous build; the ones rule costs 2 chars for the closing `(1+i-)` and `i`, and dropping it from signed_sum costs +1.57 / +1.32 / +0.72% on random tables at n=7 / 8 / 10, balanced area within 0.1 point"
