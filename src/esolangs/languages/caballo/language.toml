[proof_status]
labels = ["tree"]
qualification = "the inputs are the initial stack; selectors `dp` (keeps a 1 and pops it), `(p+dp-)` (keeps a 0 and pops it) build a tree leaving an empty stack of weight 1 on each 1 row, a 0 subtable no branch and a constant 1 its pops; `(i+-)` beside n pops makes that `[1]` and the 0 rows `[]`; more ones than zeros builds the complement; equal halves pop untested"
scaling = "linear: worst 33T/4 + n - 4 characters past n = 1: parity"
execution = "poly n: worst n^2 + 12n + 6 commands past n = 2: a skipped dp chain, 2 a level"
workspace = "poly n: at most (n+1)(n+2)/2 + 51n + 82 + bl(n) + (3n+3) bl(⌊2L/5⌋) + (n+1) bl(n+3) bits: nested frames"

