[proof_status]
labels = ["tree"]
qualification = "the inputs are the initial stack; selectors `di` (keeps a 1), `(1+di-)` (keeps a 0) and `p` build a tree leaving an empty stack of weight 1 on each 1 row, a 0 subtable no branch and a constant 1 its pops; `(i+-)` beside n pops makes that `[1]` and the 0 rows `[]`; more ones than zeros builds the complement; equal halves pop untested"
scaling = "linear: worst 39T/4 + n - 6 characters past n = 1: parity"
execution = "poly n: worst (3n^2 + 27n + 10)/2 commands past n = 2: a skipped dip chain, 3 a level"
workspace = "poly n: at most (n+1)(n+2)/2 + 51n + 82 + bl(n) + (3n+3) bl(⌊2L/5⌋) + (n+1) bl(n+3) bits: nested frames"

