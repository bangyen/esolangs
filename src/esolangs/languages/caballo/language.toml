[ablations.constant_table_audit_20261101]
arity = 8
saving = 0.0
seed = 0
tables = "both constants, n=1..12"
verdict = "retained: n pops consume the initial stack, optionally followed by i. Chars n+b, commands n+1+b including completion/dump; n=8 8/9 chars, 9/10 commands and 39 written bits. Removing one pop on eight one inputs leaves [1] for requested zero and [2] for requested one, both wrong. Native positive controls pass; no universal optimum claim. Whole-stream input loading precedes the program; owned tests verify one complete input read and output only after loading. n=3 corpus chars 11410 unchanged. 1120 native/candidate row runs and 5656 paired old/new executions per language; 270 nonconstant n<=3 sources identical. Both constants execute or prove their termination answer in default, width=1 and balanced layouts through n=12; all 24 balanced scores match or improve. All eight benchmark size/command records and global resource caps unchanged. No added collected cases."

[ablations.trick_prototype_20261101_drop_restore_selectors]
arity = 8
saving = 14.8995
verdict = "kept: dp keeps a positive top and pops it; (p+dp-) subtracts those rows from p to retain zero rows. Restore-then-pop is unnecessary; signed weights make cancellation exact, including the empty stack and implicit zeros. On 200 Random(184700+n) tables per n=7,8: chars 160283->136583 (14.79%), 320775->272981 (14.90%), no table grows. Twenty-table extensions n=9..12: 14.99,14.98,15.00,15.00%. All tables/rows n<=3 plus four rows per priced table: 8080 paired executions, 756 wrong-table controls. n=3 total 11410->10072. Another 3080 resource executions cover all small tables, named functions, random tables and the skipped-chain witness n=1..8. Worst size 39T/4+n-6->33T/4+n-4 for n>=2, reached by parity. Worst execution (3n^2+27n+10)/2->n^2+12n+6 for n>=3: a skipped dp chain costs two items a level; E(3)=51 and E(n)-E(n-1)=2n+11. Existing written-workspace cap remains valid on that corpus. n=10 AND 48->38 chars, Random(1847).getrandbits parity-independent table 6531->5541. Constants and input-stack convention unchanged."

