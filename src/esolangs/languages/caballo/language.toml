[ablations.equal_halves_skip]
saving = 12.44
arity = 12
verdict = "kept: canonical, exempt. A node whose halves agree pops its input untested and recurses once. Branching to both children instead costs +12.51% at n=10 and +12.44% at n=12 on random tables (second seed set +12.47 / +12.38%), and at n=10/12: one ignored input +17.36 / +13.90%, two +8.19 / +11.80%, three +4.85 / +10.22%, half-constant +9.60 / +12.66%. Parity, AND, OR and the constants measure 0.00% (their agreeing nodes are constant subtables, taken by the fold)"

[ablations.constant_fold]
saving = 0.0
arity = 12
verdict = "recorded: canonical, exempt, with no separable price in the shipped context. Removing the fold while the skip stays is byte-identical on every table tried (124 seeded and named tables at n=6/10): a constant subtable's skip chain emits the fold's own string, one p per level plus the answer char. The fold's value is joint with the skip: the plain build (neither) costs +53.10% at n=10 and +53.07% at n=12 on random tables, and on constant tables +143,120.00 / +477,650.00%, AND +7,600.54 / +24,296.17%, majority +110.29 / +125.83%"

[ablations.last_level_forms]
saving = 20.1
arity = 12
seed = "random.Random(184700 + n)"
tables = 200
verdict = "kept: a last level with leaves 01 emits nothing, since the bit is the stack ([1], or a 0 the strip empties), and with 10 emits (d+(1+di-)i), against the 15-char conditional: 22.3% on random tables at n=4, 20.4% at n=5, 19.9-20.1% at n=6..12 (20 tables at 12), flat; parity 31.2%, majority 27.8%, and 10.6% at n=8. Exhaustive n<=3: 252 tables change (the root keeps its conditional, so n=1 never empties), none grows, every changed program executed; random samples executed at n=4..10"
