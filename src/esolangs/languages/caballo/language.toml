[ablations.equal_halves_skip]
saving = 11.45
arity = 10
verdict = "kept: canonical, exempt. A node whose halves agree pops its input untested and recurses once. Branching to both children instead costs +12.02 / +11.99 / +12.27 / +11.45% on random tables at n=7 / 8 / 9 / 10 (seed 184700 + n, 200 / 200 / 50 / 20 tables) in the signed-sum build, and 0.00% on parity, AND, OR, majority and thr3 (their agreeing nodes are constants, taken by the fold). Re-measured 2026-10-30; the earlier 12.44% was against the previous build"

[ablations.constant_fold]
saving = 0.0
arity = 10
verdict = "recorded: canonical, exempt, with no separable price in the shipped context. Expanding a constant 1 subtable into its equal-halves skips is byte-identical on every table tried (random 200 / 200 / 50 / 20 at n=7 / 8 / 9 / 10 and five named functions): the skip chain emits the fold's own p per level. A constant 0 subtable is no branch, which is the construction itself. Re-measured 2026-10-30 against the signed-sum build"

[ablations.signed_sum]
saving = 16.08
arity = 8
seed = "random.Random(184700 + n)"
tables = 200
verdict = "kept: a rule. The tree leaves an empty stack of weight 1 on each 1 row and nothing on a 0 row, so a 0 subtable is no branch (a node with one live child drops its sum: `dip` or `(1+di-)p`) and a 1 leaf is its pops; one `(i+-)` and a sibling `p`*n turn it into `[1]` / `[]` after the tree, against `i` at every 1 leaf, and a table with more ones than zeros builds the complement's tree ending `(1+i-)` beside `p`*n`i` (+2 chars). Against the previous build (last-level forms and the 10-pair complement): 15.03% at n=7 (200 tables, seed 184700 + n), 16.08% at n=8, 16.17% at n=9 (50), 16.51% at n=10 (20), rising; balanced area 14.87 / 16.04 / 16.23 / 16.57%. Named functions at n=7 / 8 / 9 / 10: and 65.7 / 68.3 / 70.3 / 71.9%, nand 69.1 / 71.0 / 72.6 / 74.0, nor 39.3 / 42.0 / 44.4 / 46.5, or 34.2 / 38.4 / 41.7 / 44.4, thr2 21.7 / 27.5 / 31.9 / 35.6, majority 17.0 / 25.0 / 19.2 / 25.2, thr3 6.1 / 13.2 / 18.8 / 23.4, parity 1.3 / 1.9 / 2.2 / 2.3 (every node stays full). Dropping the complement costs +1.57 / +1.32 / +1.32 / +0.72% on random tables, or +68 to +92% and thr3 up to +26%; dropping the equal-halves skip +12.02 / +11.99 / +12.27 / +11.45% on random tables and 0.00% on every named function. Executed through esolangs.run on every row: all 276 tables at n<=3, all 65,536 tables at n=4, 45 tables at n=4..7 and 30 at n=8 (named functions, constants, random and 5%/30%/50%/70%/95% densities), every program equals its table; a table with its last bit flipped fails on 1 row and an OR program against AND on 30 of 32. Bounds re-derived: exhaustive max over all 65,534 non-constant tables at n=4 is 83 commands, a path-model max over live rows 36 / 59 / 83 / 110 / 140 at n=2..6 matches (3n^2 + 27n + 10)/2 from n=3"

