[ablations.constant_table_audit_20261101]
kind = "archive"
arity = 8
saving = 70.6
seed = 0
tables = "both constants n=1..12; exhaustive all tables/rows n=1..3; six witnesses/all rows n=4..6"
verdict = "kept: canonical whole constants. A zero-register decrement jumps past all slots; constant one first sets register one and restores the pointer. Every embedded PAIR slot remains, separated by an unreachable swap so runs stay distinct. Compact length 3n+1+3b+digits(3n+1+3b), command count 2+3b including the post-halt dump, written bits bl(3n+3b)+3b. RMSN expansion preserves all targets; its swap-leading one path selects the existing uniform short setter pair. n=8 zero/one 97/97 -> 27/30 chars; n=12 137/137 -> 39/42. n=3 corpus 19664 -> 19597 chars, area 20016 -> 19950. Saved plain-string templates and all equal-width fills execute. Each language passed 5656 paired old/new row executions; all 270 nonconstant programs through n=3 stay byte-identical. Both constants n=1..12 execute in default, width=1 and balanced layouts. All 24 balanced scores per language improve or match; all eight benchmark size/command pins remain unchanged. Owned regressions check resources, uniform embedded setters or all reads before output, and stream sentinels. No new collected cases."

[ablations.low_bit_leaf_split]
kind = "archive"
saving = 39.809
arity = 8
seed = "random.Random(1000*n), sequential choice('01')"
tables = "200 random per n=7,8; 20 per n=4..6,9..12,14; exhaustive n<=3; symmetric reader unchanged"
verdict = "kept 2026-11-02 under source gate: hold the last essential input at 0/2, halve higher essential weights and route pairs to four fixed leaves. Targets 2/4/9/13 include a two-digit target, contrary to the raw estimate. Each trailing ignored input uses a fixed 16-command macro that preserves held 0/2 and the index, without an old-build race or cutoff. Random n=7/8 chars 124600→80567 (35.339%) / 230200→138559 (39.809%); extended n=9/10/11/12/14 savings 42.837/44.634/45.526/46.094/46.664%, approaching the 46.875% random limit from below (no finite expected peak). n=3 chars 19597→21396 (+9.180%, 222 tables grow); n=1/2 +44.304%/+26.361%, explicitly falsifying raw no-growth expectation. Governing source gate permits these regressions. Native controls: every table/row n<=3, four asymmetric rows per other table, plus all 25600/51200 random rows at n=7/8; all correct, zero stdin reads, wrong-answer mutant rejected. Execution is not the admission route: 117 of 2048 n=3 rows slow by at most 23 commands; sampled n=7/8 likewise have 60/61 slower rows out of 800 each, maximum +2 (row zero on a 10 pair). n=3 native commands before dump 49680→42260; n=7/8 all-row commands 4185560→2527190 / 15155070→8563270. Source remains O(T), all leaf addresses independent of T, uniform setters and symmetric path unchanged. Raw dump may now be 2 0 instead of 0 0 on a 00 pair with held input one; the second register is still zero. The committed minsky-swap.txt RMSN example and its 1 0 dump stay unchanged. Exact worst native commands max(T+6n+5,16n-3); post-halt dump is additional. Workspace at most n+3+bl(max(T+6n+12,16n+4)). The global source ceiling includes O(n) variable-address jumps and constant-address cascade leaves. Native tail controls exhaust all small tables in compact and RMSN and lifted ignored tails through n=8; both canonical folding catalogue probes pass. Macro controls preserve arbitrary index values in 16 cases; a wrong target mutant fails."

