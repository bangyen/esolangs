[ablations.span_labeling]
saving = 24.5
arity = 8
verdict = "kept: bespoke; on random tables, share rising at every arity (18.4% at n=4 to 23.1% at n=7; second seed set confirms 22.9% at n=7)"

[ablations.essential_reductions]
saving = 78.5
arity = 8
verdict = "kept: canonical, exempt from the bar; saving on the trailing-ignored class (35.6% on the leading-ignored class; 0.0% on scattered-ignored tables, which the reductions cannot cut, and 0.0% on random tables)"

[ablations.root_store_removal]
saving = 0.0
arity = 8
seed = 20261028
tables = 20
verdict = "retired 2026-10-28 (random + named bar): omitting the park store when a constant leaf is the root saved 0.00% on 20 seeded random tables at n=7, 8 (33,129,623 chars at n=8 either way) and 0.00% on parity, majority, and, or and a threshold at n=7..12, since only a constant table has a leaf at the root; it earned 13.5% on constants alone (750 -> 649 chars at n=8), a constant-only class. Constants now carry the store (750 chars at n=8, 217-218 at n=3; commands n + 3, was n + 2); 8 constants n=1..8 executed, 0 mismatches"

[ablations.tree_constant_fold]
saving = 12.1
arity = 8
verdict = "kept: canonical, exempt; saving on the constant-first-half span class (16.0% at n=7); 0.0% on random tables -- the fold fires on structure, not noise"

[ablations.prime_sharing]
saving = 8.9
arity = 8
verdict = "kept 2026-10-28, one uniform encoding for every table (never grows one; a parity/or/and-only gate is more code than the trick): random tables alone are under the bar, 9.9% at n=7 and 8.9% at n=8 (100-200 tables, seeds 1 and 7, executed, 0 wrong); named functions clear it, parity 14.6%/14.1% at n=7/8 (13.4% at n=10), or 15.2%/14.7%, and 14.5%/14.1%, majority 11.4%/10.8%"

