[ablations.direct_constant_output_round_two]
kind = "archive"
saving = 57.5472
arity = 8
source = "https://esolangs.org/w/index.php?title=HQ9%2B_with_headers&oldid=129344#Examples"
seed = "random.Random(2847+n)"
tables = "all n<=3; 20 random plus parity/majority/and/or/zero/one per n=4..8"
verdict = "kept: canonical constant folding. Replace the read arithmetic by one read and the parity lookup by direct output, using the wiki examples' explicit p() STARTUP. At n=8, zero 347 -> 180 characters and one 424 -> 180; commands n+2 instead of up to 4n+9. Nonconstant programs and existing size/command pins stay byte-identical. n=3 totals 85138 -> 84802 characters, 41984 -> 41736 commands; no table slower. 7530 baseline/raced/raw output checks pass, exhaustive n<=3 and sampled n=4..8, including constant tables; 406 independently generated wrong-table controls reject the original answer. All inputs remain consumed, with a sentinel regression. At n=8 one, sampled worst commands 41 -> 10 and written-state peak 783 -> 10 bits; zero peak 274 -> 10. Nonconstant programs retain the exact worst execution/workspace bounds"

[ablations.constant_table_audit_20261101]
kind = "archive"
arity = 8
saving = 0.0
seed = "both constant values; witnesses(n) at n=4..6"
tables = "every table and row n=1..3; six witnesses per n=4..6; constants n=1..12"
verdict = "retained: the existing constant header keeps only one numeric read per input and a literal print, with the required flow, semantics, startup and checksum sections. At n=8 both bits remain 180 chars; n=12 195; exactly n+2 commands. No new construction accepted. All 276 default programs through n=3 stay byte-identical; n=3 corpus 84802 chars. All eight benchmark pins unchanged. Each language passed 5656 paired before/after row executions. All 270 nonconstant programs per language through n=3 remain byte-identical; Bitdeque and Forbin also retain all 540 nonconstant narrow/balanced programs each. All 24 old balanced constant scores per changed language improve or match. Both constants n=1..12 execute in default, width=1 and balanced layouts; owned regressions cover complete input consumption and resource bounds, with sentinel preservation for stream readers."

