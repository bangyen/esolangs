[proof_status]
labels = ["linear lookup"]
qualification = "constant tables consume every input and print directly in n+2 commands; otherwise the table is one decimal literal, divided by the power of two the reads square up, and `[~::]` tests the quotient's parity"

[catalogue]
folding_ignored = "nonconstant tables retain the full literal and read/square ignored inputs; constants only consume them"
