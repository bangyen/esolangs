[formula_arities]
# Every word and register is below 3^10 < 2^16; measured ~394k bits.
workspace = [2, 3]

# Plain-rewrite audit record: each trick's saving measured in shipped
# context at the largest arity where it runs (chars; seeded random
# tables, seed 184700+n, 200 per arity).  Prices are contextual --
# joint removals were measured separately before landing.  Rows for
# removed tricks stay as the record of why they left.  The emitted
# size is one constant per arity (13,340 to n = 13, 19,683 at 14, 52,480
# at 15, the full 59,049-cell store at 16), so every per-table trick prices at 0.0% by construction.
[ablations]
audited = "2026-10-18"

[ablations.full_store_render]
saving = 0.0
arity = 16
verdict = "kept: n = 16 is the whole memory image (its tables reach 59,039); n <= 15 ends at its highest live cell, 13,340 characters to n = 13, 19,683 at 14, 52,480 at 15 (59,049 before the short layout, 2026-10-30). The 2026-10-29 tail and prefix figures describe the 59,049-character build and no longer apply below n = 16"

[ablations.tier_constructions]
saving = 0.0
verdict = "kept: one positional build serves every arity; size is 13,340 to n = 13, 19,683 at 14, 52,480 at 15 and 59,049 above"

[ablations.shortest_path_planner]
saving = 0.0
verdict = "kept: not separately priceable -- typed into the build's emission, and no walker variant of it exists"

[ablations.searched_constants]
saving = 0.0
verdict = "kept: no frozen table remains -- the labels, gadget outputs, gadget values, seeds, hubs, stubs and operands are closed forms above n = 15; the n <= 15 seeds and stubs are a construction (canonical actions, limitations); navigation is a deterministic bounded heuristic whose chains were fitted on the breadth-first search it replaced, no closed form known (limitations)"

[ablations.constant_folding]
