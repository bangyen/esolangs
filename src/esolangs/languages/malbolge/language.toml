# Language-owned data, one section per dataset; aggregators read
# only their own section and skip this file when it is absent.

[curation]
backlinks = 130

[proof_status]
labels = ["exception"]
qualification = "finite source space rules out some 18-input tables; the shipped build folds the first n - 1 inputs into a positional address, three input bits per two-trit digit, so no row collides, and the answer stub reads the last; at seventeen it also builds tables constant on Hamming-weight classes, whose first fold group reads four inputs into a popcount digit; below sixteen the unused reads are held at 0; the cap is sixteen for general tables, and seventeen is open ([summary](#malbolge-bound))"
scaling = "measured: worst 13340 characters to n = 13, 19683 at 14, 52480 at 15, then 59049: the 3^10-cell store whole"
execution = "unmeasured: worst 6,486 commands at n=1 to 5,686 at n=16: main code through closing i, then the longest stub (199..200)"
workspace = "poly n: at most B + E + 10(P+S) + 49 + bl(n) bits: a bit a step, ten a write"
definitions = ["B = the initial memory's bits, the source's cells then the fill", "E = the Execution bound", "P = the `*` and `p` cells before the main code's closing i", "S = the longest stub, 199 commands (200 at fourteen inputs)"]

[proof_status.audit]
totality = "Exception"
generation_time = "Open"
output_size = "Linear"
evidence = "docs/proofs/index.md#malbolge-bound"

