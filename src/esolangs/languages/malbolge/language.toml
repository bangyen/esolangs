[proof_status]
labels = ["exception"]
qualification = "constants read every input before building ASCII 48/49; finite source space rules out some 18-input tables; the shipped build folds the first n - 1 inputs into a positional address, three input bits per two-trit digit, so no row collides, and the answer stub reads the last; at seventeen it also builds tables constant on Hamming-weight classes, whose first fold group reads four inputs into a popcount digit; below sixteen the unused reads are held at 0; the cap is sixteen for general tables, and seventeen is open ([summary](#malbolge-bound))"
definitions = ["B = the initial memory's bits, the source's cells then the fill", "E = the Execution bound", "P = the `*` and `p` cells before closing i, or in all constant code", "S = zero for constants; otherwise the longest stub, 199 commands (200 at fourteen inputs)"]

[proof_status.audit]
totality = "Exception"
generation_time = "Open"
output_size = "Linear"
evidence = "docs/proofs/index.md#malbolge-bound"

