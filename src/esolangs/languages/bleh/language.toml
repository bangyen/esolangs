[ablations]
audited = "2026-10-21"

[ablations.subtree_sharing]
saving = 74.2
arity = 12
seed = "random.Random(184700 + n)"
tables = 200
verdict = "kept: canonical, exempt; one function per reduced-diagram node against one per tree position: 57.9% on random tables at n=8 rising to 74.2% at n=12, 70.8-83.6% one-ignored, 87.2-98.6% on parity/majority/and; 0.0% on constants, which the skip carries. Plain-rewrite audit: no bespoke tricks"

[ablations.halves_agree_skip]
saving = 4.8
arity = 12
seed = "random.Random(184700 + n)"
tables = 200
verdict = "kept: canonical, exempt; a node whose halves agree reads its input as a statement and goes on (also how a constant above the last input reads the rest) instead of matching both bits to one child: 10.1% on random tables at n=8 declining to 4.8% at n=12, 9.9-16.9% one-ignored, 39.7-40.8% on constants, 13.4-14.2% on parity/majority/and; never larger"
