language = "NB"
oldid = 154398

[[examples]]
id = "xkcd"
source = "NBN NBNBNBNB"
expected = "4"

[[examples]]
id = "truth-machine-zero"
source = "BNB NN\nNBN NN\nBB NN\nNBN NN\nBN"
stdin = "0"
expected = "0"

[[examples]]
id = "truth-machine-one"
source = "BNB NN\nNBN NN\nBB NN\nNBN NN\nBN"
stdin = "1"
expected = "1111"
stop = "steps"
max_steps = 10

[[spec_triggers]]
program = "NBB NB NBN NB"
expect = "ProgramError"
claim = "an if needs a closing delimiter"

[[spec_triggers]]
program = "B NN"
expect = "InputExhaustedError"
claim = "character input at EOF"

[[spec_triggers]]
program = "B NN"
stdin = "é"
expect = "ArgumentError"
claim = "character input is ASCII"

[[spec_triggers]]
program = "BNB NN"
stdin = "q"
expect = "ArgumentError"
claim = "integer input requires a decimal token"

[[spec_triggers]]
program = "NN BBBBB NB N NN"
expect = "HaltError"
claim = "character output rejects a negative integer"
