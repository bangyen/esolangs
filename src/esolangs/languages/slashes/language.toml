# Language-owned data, one section per dataset; aggregators read
# only their own section and skip this file when it is absent.

[curation]
backlinks = 86

[proof_status]
labels = ["parameterized lookup"]
qualification = "binary-to-unary substitutions form the row index; T escaped sweeps consume indexed entries before decoding one answer and deleting the suffix"
scaling = "linear: worst 20T + n + 35 characters: T sweeps, 2T table"
execution = "linear: worst 6T + n + 15 steps: rule parses, failed searches and substitutions"
workspace = "linear: worst 8L + 56 + 8max(0,T-15) bits: the program string, rewritten in place"

