[ablations]
audited = "2026-10-19"

[ablations.constant_fold]
saving = 409.5
arity = 12
verdict = "kept: canonical, exempt. A constant table deletes its input letters and prints the literal answer, n + 9 chars. Routing constants through the general path instead costs +442.1% at n=10 and +409.5% at n=12 (19 to 103 and 21 to 107 chars)"

[ablations.projection]
saving = 99.8
arity = 12
verdict = "kept: canonical, exempt. The table is read at the essential inputs only; an ignored input's slot is X-marked and its bit deleted by the _IGNORE rule before the unary sweep. Emitting the full table over all inputs costs +99.18% at n=10 and +99.79% at n=12 on one-ignored tables, +295.44 / +298.82% on two-ignored tables, and 0.00% on random tables, where every input is essential"

[ablations.balance_newline_rule]
saving = 100.0
arity = 8
seed = "random.Random(131s + n), s = 0..19"
tables = "20 random per n=7,8 plus and/or/nand/nor/parity/majority/threshold-3/threshold-(n-1) at n=7,8"
verdict = "kept: the balanced build was a no-op (one line, no wrapper), 1 x 2,620 and 1 x 5,181 chars at n=7 / 8. A leading rule /<newline>// deletes every later newline before the next rule is read, so the rest folds at any column, inside a rule too; the 4-char prefix and template runs kept whole fold it to side 74 / 104 (balance_score(p)[0]), balanced area (score squared) -99.9% / -100.0% on random tables and on every named function (sizes were table-independent before [ablations.sweep_count]; 6,864,400 -> 5,476 and 26,842,761 -> 10,816). The default is byte-identical on all 56 tables. Every balanced program ran on every row (56 tables, 0 bad) and a wrong table failed on each; a constant, an ignored-input and full tables at n<=4 ran too (test)"

[ablations.sweep_count]
saving = 22.1
arity = 9
seed = "random.Random(131s + n), s = 0..19"
tables = "20 random per n=7,8,9 plus parity/and/or/majority/threshold-3/threshold-(n-1) at n=7,8,9"
verdict = "superseded 2026-11-02 by run counting and macros; historical measurements: emits only the sweeps that clear the first T-1 entries, not T: a sweep deletes two when a qA is followed by a qB, so a random table needs ~0.78T. Random totals 52,400 -> 41,168 (-21.4%) at n=7, 103,620 -> 80,760 (-22.1%) at n=8, 206,040 -> 160,464 (-22.1%) at n=9, a share that holds with n; named: parity 2,620 -> 1,846 / 5,181 -> 3,633 / 10,302 -> 7,224 (-29.5%, -29.9%, -29.9%), majority -14.4 / -12.5 / -12.4%, threshold-3 -11.0 / -7.6 / -5.1%, and/or -0.7% (all-qA prefix, one entry per sweep). Balanced area at n=7 / 8 (seed 131*3+n): side 74 -> 68 / 104 -> 92, area -15.6% / -21.7%. Every program ran on every row (n=2,3 all 276 tables; 26 tables at n=4,5,7,8,9, 0 bad) and a wrong table failed on each"

[audits]
trick_prototype = 2026-11-02
plain_rewrite = 2026-10-28

[ablations.constant_table_audit_20261101]
arity = 8
saving = 29.4
seed = 0
tables = "both constants, n=1..12"
verdict = "kept: canonical constant folding, exempt. Inputs fill one nonempty a/b pattern in /pattern// followed by the literal digit. Parsing consumes every slot, the pattern cannot match the answer, and the digit prints. Chars n+4, commands 3: n=7 16->11 (31.2%), n=8 17->12 (29.4%), n=12 21->16. Native workspace bound 16n+32 bits; n=8 rises 144->160 bits while commands fall 13->3, within unchanged global caps. Recognize these unfilled/partially filled templates and retain recognition of old templates. n=3 corpus chars 41316->41306. Executed 1120 candidate runs and 5656 paired old/new row runs; 270 nonconstant n<=3 sources identical. Both constants execute default, width=1 and balanced layouts through n=12; all 24 balanced scores match or improve. All eight benchmark size/command records and global resource caps unchanged. Owned IO/template checks verify input use before output and preserve the following record."

[ablations.sweep_macro_20261102]
arity = 8
saving = 80.23
seed = "random.Random(1847+n), successive getrandbits(1<<n)"
tables = "200 per fixed n7/8; all tables/rows through3; native named/ignored/sample4..14"
verdict = "kept: one fixed /S/escaped-sweep/ definition expands one S per sweep. Exact quoting preserves the backslash shielding future sweep patterns; S appears in no later rule, slot or data cell. A named local spelling rule uses the macro only when30+c<18c, hence from two sweeps; this is no search or whole-source fallback. Independent fixed200 n7/8 chars406892->88294 (78.30%),803640->158880 (80.23%). No table grows. All8480 small native variant rows and4800 fixed-judge rows pass. Macro expansion adds2+c commands, explicitly accepted by the source gate. Generic expected source tends2.75T versus15.5T, saving51/62; ignored-input probability tends0. Actual sources/native last rows extend through14, with no moved cap."

[ablations.sweep_macro_runs_20261102]
arity = 8
saving = 15.96
seed = "random.Random(1847+n), successive getrandbits(1<<n)"
tables = "200 per fixed n7/8; all tables/rows through3; native named/ignored/sample4..14"
verdict = "kept: independently admitted run counting after macro spelling. A sweep repeats its zero rule across the zero run, then its one rule across the one run; only10 transitions among the first T-1 entries need another sweep. Exactly1+count10 sweeps, at mostT/2, while positive tiny diagnostic tables can use zero/one sweeps without a macro. Fixed200 n7/8 marginal chars88294->75690 (14.27%),158880->133515 (15.96%); standalone406892->180020 (55.75%),803640->347070 (56.81%). Joint savings81.40%/83.39%. IID expected prefix counts: old3T/4-1/2, newT/4+1/2, so marginal expected saving tends2/11>10%; actual source/native extensions through14 rise toward that limit. No source race, arity cap, reordered reads, searched table or widened cell. Both constants byte-identical; input projection and a/b template pair/order unchanged. Native8480 small variant rows,4800 fixed-judge rows,5314 extended rows (including balanced and ignored controls),110 exact workspace runs pass. A wrong expected bit fails. n3 chars41306->26199, commands110168->96848. Worst source76/95/107 at n1/2/3 then5T/2+n+83; n3 maximum is one ignored input with four-entry core1011. Full modified alternating tail1011 reaches the larger-arity bound. Default worst E28 at1, then9T/2+n+21: row+T+n+4c+20, plus macro2+c; ignored inputs add4 and reduce T. Old source/E/W proof rungs1/2/3/5 retained. Workspace includes expansion, not compressed length alone: constants16n+32; otherwise8(L+max(0,M-15-P-2k,M-1-m-P-2k+17c-48 if macro))+32+(144 if macro else24), M=2^m reduced entries,k ignored inputs,P=10 iff k>0. Initial/unary/macro source peaks and separate4-byte pattern/18-byte macro replacement peaks yield this exact all-row bound; last row reaches it. It is O(T), conservatively<=96T+8n+848. All8 pins/Size anchors/balanced example updated and n3 corpus remeasured. No new collected language cases."

[ablations.digit_entries_20261102]
arity = 8
saving = 0.0
seed = "random.Random(1847+n), successive getrandbits(1<<n)"
tables = "200 per fixed n7/8; all tables/rows through3; native named/ignored/sample4..14"
verdict = "rejected: raw digit table destroys its own decoder. /0// also deletes the0 in later /C/0/, and /1// deletes1 in /D/1/, so the chosen marker is deleted rather than printed. Actual programs for01,10,0110,00110110 print the empty string on all16 rows, failing every expected bit. No size/equivalence claim or incomplete-rule halt workaround ships. The native failure is the positive control; the general interpreter remains unchanged."
