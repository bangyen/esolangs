[resource_evidence]
version = 2
construction = "esolangs.languages.slashes.generator:slashes_request"
witnesses = "esolangs.languages.slashes.tests.resource_witnesses:resource_tables"

[resource_evidence.execution]
#
# One sweep at n=1 is shorter without the macro; otherwise c<=T/2.
cases = [
    { through = 1, expression = "28" },
    { expression = "9T/2+n+21" },
]
exact = true
arities = [1, 2, 3, 5]
first = 1
unit = "steps"
description = { growth = "linear", claim = "worst", template = "{claim} {formula}" }

[resource_evidence.workspace]
# The last row reaches the longest unary string and every macro expansion.
expression = "(1-D)*(16n+32)+D*(8(L+max(0,S-15-P-2X,M*(S-bl(S)-P-2X+17K-48)))+56+120M)"
source_terms = { names = ["D", "S", "P", "X", "M", "K"], provider = "esolangs.languages.slashes.proof_formulas:workspace_terms" }
exact = true
arities = [1, 2, 3, 5]
first = 1
unit = "bits"
description = { growth = "linear", claim = "worst", template = "{claim} {formula} {unit}" }

[resource_evidence.scaling]
#
# At n=3 a one-ignored-input four-entry table costs one extra character.
cases = [
    { through = 1, expression = "76" },
    { through = 2, expression = "95" },
    { through = 3, expression = "107" },
    { expression = "5T/2+n+83" },
]
exact = true
arities = [1, 2, 3, 5]
first = 1
unit = "characters"
description = { growth = "linear", claim = "worst", template = "{claim} {formula}" }

[semantic_evidence]
version = 1
kind = "model"
contract = "interpreter.py"
tests = [
    "src/esolangs/languages/slashes/tests/oracle_checks.py::check_raw_slashes",
]

[ablations.ignored_slot_recognition_20261104]
kind = "measurement"
audited = 2026-11-05
witness = { arity = 3, rule = "random", seed = 1847 }
source = { unit = "chars", value = 93 }
scale = 1
budget = 10
band = "fast"
construction = "esolangs.languages.slashes.generator:slashes_request"
notes = "Rebased construction smoke measurement only; original repair evidence is scoped in its commit: Require an ignored X marker to prefix its own filled or unfilled slot. XX$$ formerly passed the canonical-template recognizer despite having no valid slot ordering. Ordinary emitted bytes, source/command/workspace bounds, size pins and Size anchors remain unchanged. All-ignored legacy templates remain recognized."
