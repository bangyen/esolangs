verdict = "kept: canonical family, exempt. A node whose halves agree is spelled ! plus the half instead of a branch over both. Flat on random tables (7.2% at n=6, 7.4% at n=12), 20.1-26.5% on half-constant tables, 4.7-9.6% on the ignored-input classes; exactly 0.00% on parity, AND, OR, majority and threshold-3, whose agreeing nodes the reduced diagram has already collapsed"

[ablations.carried_subtrees]
saving = 12.5
arity = 12
verdict = "kept: a repeated subtree within four levels is pushed once as (X) and carried on top, its copies spelled ^; the per-node race keeps the carry only where it shortens the node. 11.6% at n=6 rising to 12.5% at n=12 on random tables; parity 104.0% at n=8 rising to 281.5% at n=12, majority 88.0% / 152.6% / 240.8%, threshold-3 68.6% / 94.3% / 118.4%. The in-code race figures (33% on majority, 11-15% on threshold-3, 2% on random) reproduce under no reading tried — every measured price is larger; see the stale-figures entry F23"

