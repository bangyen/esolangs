[ablations.constant_table_audit_20261101]
arity = 8
saving = 49.3
seed = 0
tables = "both constants n=1..12; exhaustive all tables/rows n=1..3; six witnesses/all rows n=4..6"
verdict = "kept: canonical fixed-output spelling. Push the answer, push every input as a uniform three-character literal pair (0)/(1), drop all input literals, then print. Exactly 4n+4 chars, 2n+2 commands and 8(n+1)+bl(4n+4) written bits. n=7 63 -> 32 chars; n=8 71 -> 36 chars, 20 -> 18 commands, 1071 -> 78 written bits; n=12 103 -> 52 chars. n=3 corpus 17850 -> 17820 chars. Slot detection and token-preserving wrapping keep every input and reject newlines inside output literals. Each language passed 5656 paired old/new row executions; 270 nonconstant programs through n=3 remain byte-identical. Both constants n=1..12 execute in default, width=1 and balanced layouts; a separate 1120-run probe includes every row through n=8. All 24 balanced scores improve or match; all eight benchmark size/command pins remain unchanged."

[ablations.trick_prototype_20261102_named_terminal_drops]
arity = 20
saving = 32.239382239382245
verdict = "kept only for AND/OR, threshold-2, their Hamming duals and output complements. Count the minority rows, then recognize endpoint or weight<=1/weight>=n-1 index sets in O(T); all inputs still push the same seven-character selectors before tree execution. Leave unused selectors/carried strings beneath the final bit. One-character intermediate markers preserve original carry prices/ties, then erase before emission; no old-program race. AND/OR source7:147->126 (14.2857%),8:171->143 (16.3743%); threshold-2 and its dual7:264->237 (10.2273%),8:326->285 (12.5767%). All output complements have identical source costs. Rising curves measured with native boundary controls through20: AND/OR537->347 (35.3818%), threshold-2 1554->1053 (32.2394%). No finite global peak: AND/OR has exactly n(n-1)/2 deleted drops from17n+7+n(n-1)/2 source. Threshold-2 is a single threshold spine with AND/OR side chains; reach4 can carry only a side chain at most4 levels down. Thus each at-most4-level segment contains a side chain with quadratic constant-leaf cleanup; old source is Theta(n\u00b3), cleaned source O(n\u00b2), so savings tend100%. Shape/choice coupling leaves execution bounded by the unchanged12n+3+2floor((n-1)/2); parity still reaches it. Stack peak is at most old+8 bits, code/cursor only shrink. At mostT/2 unused-selector drops and T missing-carry leaf drops occur in the unfolded tree; sharing only removes copies, so D<=2T deleted source chars. Substituting L_old=L_new+D in the old written bound gives24L+168T+32n-168+bl(2L+14T+6n-14), still linear in T. Source F is unchanged and generation retains the existing O(T*n) text-copy construction.8692 native runs per prototype (seven variants), including every small table/row, random4..8 boundary rows and all named7/8 rows, check output, unread following7, full-state caps and positive controls.776 independent old/default ablation comparisons pass; live4592 native runs plus312 width1/4/balanced controls;400 generic7/8 tables remain byte-identical. N3 source17820->17800 and commands61152->61096; width1 source43660->43620. Three-run median eight-family/all-row times7:0.072983->0.063843s,8:0.167313->0.146011s (~13% faster). Eleven-build generation medians eight families7:1.135->1.158ms,8:1.988->1.898ms. Named snapshot peaks7:9034->8114bits,8:11883->10403bits. Default and narrow routes share the same terminal deletion; constants remain unchanged."

