[ablations.trick_prototype_20261102_last_level_bare_bits]
arity = 8
saving = 8.600105380848955
verdict = "rejected raw selector placement: native0001 row0 prints!(0), not0. Inputs are pushed in order but consumed LIFO; the bottom selector belongs to input0, not the last input. Repairing that placement computes all8692 tested native rows correctly and saves8.5585%/8.6001% on200 generic7/8 tables, below10%. It also violates the mandatory uniform pair within a template: one four-character non-running selector versus seven-character running selectors. No per-input pair exception or wrapper changes ship."

[ablations.trick_prototype_20261102_space_padded_selectors]
arity = 8
saving = 1.028105843496585
verdict = "historical audit; conforming duplicate repair is now kept below: rejected raw padding: the five-character ( !^)/(~!^) pair computes8692 tested native rows but embeds padding spaces, forbidden by the input convention. It saves only2n characters:1.7558%/1.0281% on200 generic7/8 tables, declining below20%. A conforming (!^:)/(~!^) repair duplicates the returned bit instead of padding; it also passes8692 native rows and has the same source counts. That repair misses the generic bar. It qualifies separately on projection families (best19.4444%/20.0% at7/8), but is not stacked onto the selected terminal-drop rule in this one-rule audit; it is not rejected on its named-family percentages."

