[resource_evidence.execution]
# With m essential inputs, the Horner assignment takes 4m+1 steps.
# Interior discards add four each and edge discards add two each.
# The store and decoder take 33 steps. Constants take 2n+3.
expression = "4n+34"
exact = true
arities = [1, 2, 3, 4, 5]
first = 1
unit = "steps"
description = { growth = "poly n", claim = "worst", template = "{claim} {formula} steps; all inputs essential" }

[resource_evidence.workspace]
# P=ceil(T/4) packed cells. Memory peaks at 25+7P+bit_sum(P+4) bits
# and the literal and address on the stack peak at 26+7P. Variables
# peak at 23 bits for n<=2 and 29+2n from n=3, reached at row T-4.
cases = [
    { through = 2, expression = "74+14ceil(T/4)+bit_sum(ceil(T/4)+4)+bl(4n+34)+bl(n)" },
    { expression = "80+2n+14ceil(T/4)+bit_sum(ceil(T/4)+4)+bl(4n+34)+bl(n)" },
]
exact = true
arities = [1, 2, 3, 4]
first = 1
unit = "bits"
description = { growth = "T log T", claim = "worst", template = "{claim} {formula}, including packed cells, addresses and decoder state" }

[resource_evidence.scaling]
# At full support the reader uses 11n chars plus the bias digits.
# The store and decoder use one char per packed cell and 58 fixed chars.
# Ignored inputs cost at most nine chars each and reduce the packed table.
expression = "ceil(T/4)+11n+digits(48(T-1))+58"
exact = true
arities = [1, 2, 3, 4, 6, 8]
first = 1
unit = "characters"
description = { growth = "linear", claim = "worst", template = "{claim} {formula} characters; one packed lookup literal" }

