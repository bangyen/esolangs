[resource_evidence.execution]
# Five operations for the first bit, nine for each later bit, and eight
# for storing and reading the table. A discarded read takes two.
expression = "9n+4"
exact = true
arities = [1, 2, 3, 4, 5]
first = 1
unit = "steps"
description = { growth = "poly n", claim = "worst", template = "{claim} {formula} steps; all inputs essential" }

[resource_evidence.workspace]
# Full tables write 6T+nT-T+2 bits to the addressed cells. The operand
# stack peaks at 6T+2 before the store; the index uses 8+n bits.
expression = "(n+11)T+n+12+bl(9n+4)+bl(n)"
exact = true
arities = [1, 2, 3, 4]
first = 1
unit = "bits"
description = { growth = "T log T", claim = "worst", template = "{claim} {formula} bits, including integer addresses and ASCII cells" }

[resource_evidence.scaling]
# The full-essential form has T literal digits, 17 characters per input
# and 12 fixed characters. Projected reads and constants are shorter.
expression = "T+17n+12"
exact = true
arities = [1, 2, 3, 4, 6, 8]
first = 1
unit = "characters"
description = { growth = "linear", claim = "worst", template = "{claim} {formula} characters; one lookup literal" }

