[[spec_triggers]]
program = "tt et tt"
stdin = ""
expect = "InputExhaustedError"
claim = "InputExhaustedError: input exhausted when a read is needed."

[[spec_triggers]]
program = "tt"
stdin = ""
expect = "ProgramError"
claim = "ProgramError: a malformed expression."

[[spec_triggers]]
program = "tt e ry e ry e tt"
stdin = ""
expect = "ProgramError"
claim = "ProgramError: unrecognized operator."

[[spec_triggers]]
program = "tt et tt"
stdin = "A"
expect = "output"
output = "A"
claim = "Positive control: et reads a character and tt prints it."
