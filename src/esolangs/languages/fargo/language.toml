# Language-owned data, one section per dataset; aggregators read
# only their own section and skip this file when it is absent.

[curation]
backlinks = 3

[proof_status]
labels = ["tree"]
qualification = "finite folded layout"
scaling = "linear: word-packed transform and emission"
execution = "linear: at most 5T + 1 commands past n = 5, else 15T/2 - 4: each token runs once"
workspace = "linear: at most 16(L - 3) + bl(L) + 11 bits past n = 5: one frame's tokens, pending calls"

