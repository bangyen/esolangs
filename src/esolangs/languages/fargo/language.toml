[resource_evidence.execution]
# The stated execution bound, evaluated for n and the program.
#
# Commands = 7 + expanded tokens + 2 per executed shared-name reference
# (reference token and frame finish).  A block of size s >= 2 costs at most
# 4 + 2c(s/2) tokens with its four references named, so c(s) <= 9s - 12.
expression = "9T - 5"
exact = false
arities = [1, 2, 3, 7]
first = 1
unit = "commands"
description = { growth = "linear", claim = "at most", template = "{claim} {formula} {unit}: each expanded token runs once, plus 2 per executed shared-name reference" }

[resource_evidence.workspace]
expression = "18D + (1-D)*(16(L-3)+bl(L)+11)"
