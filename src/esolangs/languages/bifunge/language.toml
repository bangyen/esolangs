[resource_evidence]
version = 2
construction = "esolangs.languages.bifunge.generator:bifunge_request"

[resource_evidence.execution]
# The input walk reaches the root at distance p+X+Y. Horizontal hops
# total X-1. Vertical hops and the 17 leaf commands total Y.
# Adding an essential input decreases p by one and doubles one radius.
expression = "15n+2*2^⌊n/2⌋+18*2^⌈n/2⌉-1"
exact = true
arities = [1, 2, 3, 4, 5]
first = 1
unit = "steps"
description = { growth = "sqrt T", claim = "worst", template = "{claim} {formula}; the same distance to each leaf" }

[resource_evidence.workspace]
# Coordinates and cursor, n+7 stack bits, two partial bytes, heading and halt flag.
# With even n, dropping one essential input keeps the same y radius
# and lengthens the reader by one. The next omission reduces the radius.
expression = "n+bl(2*2^⌊n/2⌋-1)+bl(15n+18*2^⌈n/2⌉)+bl(n)+40"
exact = false
arities = [1, 2, 3, 4]
first = 1
unit = "bits"
description = { growth = "poly n", claim = "at most", template = "{claim} {formula}" }

[resource_evidence.scaling]
# Each command occupies four text cells. Newlines do not count toward grid area.
expression = "8*2^⌊n/2⌋*(15n+18*2^⌈n/2⌉)"
exact = true
arities = [1, 2, 3, 4, 6]
first = 1
unit = "cells"
description = { growth = "linear", claim = "worst", template = "{claim} {formula} text cells; one rectangular tree and an input strip" }

[semantic_evidence]
version = 1
kind = "model"
contract = "interpreter.py"
tests = [
