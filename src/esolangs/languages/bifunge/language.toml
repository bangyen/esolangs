scale = 1
audited = 2026-11-15
construction = "esolangs.languages.bifunge.generator:bifunge_request"
notes = "Reverse-order routing leaves room for the output tail on only the vertical axis."

[resource_evidence]
version = 2
construction = "esolangs.languages.bifunge.generator:bifunge_request"

[resource_evidence.execution]
# Initial east/down walk, then radius minus leaf spacing on each axis, then 17 leaf commands.
expression = "15n+2*2^⌊n/2⌋+34*2^⌈n/2⌉-1"
exact = true
arities = [1, 2, 3, 4, 5]
first = 1
unit = "steps"
description = { growth = "linear", claim = "worst", template = "{claim} {formula}; the same distance to each leaf" }

[resource_evidence.workspace]
# Coordinates and cursor, n+7 stack bits, two partial bytes, heading and halt flag.
# A leading ignored digit leaves at most the one slot it had under empty-pop semantics.
expression = "n+bl(2*2^⌊n/2⌋-1)+bl(15n+34*2^⌈n/2⌉-1)+bl(n)+40"
exact = false
arities = [1, 2, 3, 4]
first = 1
unit = "bits"
description = { growth = "poly n", claim = "at most", template = "{claim} {formula}" }

[resource_evidence.scaling]
# Each command occupies four text cells. Newlines do not count toward grid area.
expression = "8*2^⌊n/2⌋*(15n+34*2^⌈n/2⌉)"
exact = true
arities = [1, 2, 3, 4, 6]
first = 1
unit = "cells"
description = { growth = "linear", claim = "worst", template = "{claim} {formula} text cells; one rectangular tree and an input strip" }

[semantic_evidence]
version = 1
kind = "model"
contract = "interpreter.py"
tests = [
    "src/esolangs/languages/bifunge/tests/test_bifunge.py::test_bifunge_reference_model",
]

