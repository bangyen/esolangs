[ablations.constant_table_audit_20261101]
arity = 8
saving = 82.5
seed = 0
tables = "both constants n=1..12; exhaustive all tables/rows n=1..3; six witnesses/all rows n=4..6"
verdict = "kept: canonical whole-constant folding. The initial zero arm defines fresh answer a and reads all inputs into _. The next case selects a at zero and prints it, incremented once for constant one. No existing variable is redefined and no jump is needed. Exactly n+15+2b chars and n+6+b commands, b the answer; written bits 25+bl(n+1)+bl(n), including both variable names. n=8 zero/one 137/137 -> 23/25 chars; n=12 177/177 -> 27/29. n=3 corpus 70352 -> 70218 chars; area 161740 -> 161416. Each language passed 5656 paired before/after row executions; all 270 nonconstant programs through n=3 stay byte-identical. Both constants n=1..12 execute in default, width=1 and balanced layouts. All 24 balanced constant scores per language improve or match; all eight benchmark size/command pins remain unchanged. Owned regressions verify exact resources, every read before output and an unread sentinel."

