[resource_evidence]
version = 2
construction = "esolangs.languages.switchcase.generator:switchcase_request"

[resource_evidence.execution]
# Every read, at most n dispatches, and a printing leaf; parity attains it.
expression = "6n+8"
exact = true
arities = [1, 2, 3, 5]
first = 1
unit = "commands"
description = { growth = "poly n", claim = "worst", template = "{claim} {formula} {unit}: define buffers, read all inputs, at most n binary branches, print" }

[resource_evidence.workspace]
# Each buffer uses six value bits plus its name. The default arm
# adds the branch key, cursor and case index. Ignored reads need
# no buffer, leaving room for their longer discard cursor.
expression = "14n+8digits_sum(n)+27+bl(n+residuals(n))+bl(n)"
exact = [1, 2, 3, 5]
arities = [1, 2, 3, 5]
first = 1
unit = "bits"
description = { growth = "poly n", claim = "at most", template = "{claim} {formula} {unit}; equality at n=1,2,3,5: buffers and branch" }

[resource_evidence.scaling]
# The longest name is x plus the decimal index n-1. The maximum
# case address is bounded by the buffered inputs and residual count.
expression = "34+n(12+2digits(n-1))+residuals(n)(11+digits(n-1)+2digits(n+residuals(n)+4))+digits(n+residuals(n)+4)"
exact = false
arities = [1, 2, 3, 4, 5, 6, 8, 9, 10, 12]
first = 1
unit = "characters"
description = { growth = "linear", claim = "at most", template = "{claim} {formula} {unit}: O(T/log T) shared residuals, O(log T) address digits" }

