arity = 8
seed = "random.Random(184700+n), sequential choice('01')"
tables = "200 random per n=7,8; all tables/rows n<=3; 20 random per n=4..6,9..16"
verdict = "rejected 2026-11-02: empty minority arms fall into an adjacent printer and the default jumps over it. Author spec https://esolangs.org/wiki/SwitchCase#Control_flow requires a question-mark part, with no command-count minimum; native empty arms work. Fixed n=7/8 source 193647→168133 (13.176%) / 296224→245838 (17.009%) misses the 20% declining bar: per-arm saving 2/(digits+4) tends to zero. Extension peaks at 24.626% at n=13, then 23.641/22.898/22.549% at n=14/15/16; moving the fixed window cannot qualify it. Nonempty +0 control saves only 0.826%/0.540%. n=3 source 70218→66890, commands 113616→114628 (+0.891%); no execution admission. All 3960 paired native controls passed with all reads before output and sentinel untouched; flipped-answer mutant rejected. No empty-arm production path retained."

[ablations.split_switch_on_top_bit]
saving = 57.4
arity = 3
seed = "random.Random(184700+n), sequential choice('01')"
tables = "all tables/rows n<=3; 20 random per n=4..6; 200 random per n=7,8; named functions n=7,8,10,12,16"
verdict = "kept 2026-11-02 as full-split repair under the 5% execution gate: buffer inputs in stream order, share equal residuals by subtree IDs, collapse equal children and constant residuals, then jump to two printing leaves. Raw bounded digit-drop split j<=4 is correct but rejected: source remains Theta(T log T), even though sampled n=7/8 commands fall 43.043%/68.748% and chars save 5.538%/10.875%; forced split controls cover 1728 asymmetric n=3 rows. Full splitting plus mandatory canonical sharing gives O(T/log T) residuals with O(log T) addresses, hence O(T) source/build, no old-build race. Exhaustive n=3 source 70218→31572, commands 113616→48400 (57.400% fewer), no table larger or row slower. Generic n=7/8 chars 193647→157528 (18.652%) / 296224→258576 (12.709%); source alone misses declining20%. All 76800 new n=7/8 rows run natively: old analytic totals 14564714/55703186 commands become 1225691/2757749. Baseline formula T*(4T+7n+7)+2*minor_count was validated against 12 complete native pilot tables n=3..8. Native public/prototype and resource/IO controls cover 808 tables and 4268 rows, including every sole-essential-input position. Old symmetric reader marginal savings versus the DAG at n=7/8: parity -19.315%/-17.582%, AND/OR -63.556%/-63.889%, majority/threshold -3.794%/3.604%; none clears the fixed corpus, so no old reader remains. All-positive one leaf on parity attains 6n+8 commands. Explicit at-most source/workspace ceilings include names, address widths, selected arm and IO cursor. New proof also removes the old false 8T+7n+3 bound: native 00100001,row7 took 90, not 88. Fresh zero-buffer read arms define the next buffer in sequence, moving definitions out of the header and removing the redundant default read arm: exactly 3m fewer characters, with the same command count. Generic balanced area n=7/8 is 405570→209293 / 567930→341831; named balanced areas are recorded beside the retired count reader. Later generic controls (20 tables per n=10/12/14/16, same seed rule) save -0.125%/20.161%/33.003%/40.469% source: n=10 grows 86060→86168 chars, nine tables grow; all 320 new sampled rows execute and source ceilings hold. Named n=16 majority grows 815→1397 chars while balanced area falls 1940→1799; the retired reader misses the fixed n=7/8 marginal gate. Constants and input convention unchanged; wrong-answer and wrong-input-order mutants detected."

