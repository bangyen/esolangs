# Language-owned data, one section per dataset; aggregators read
# only their own section and skip this file when it is absent.

[curation]
backlinks = 2

[proof_status]
labels = ["finite lookup"]
qualification = "loops build the row index from the essential inputs, and a switch a hundred rows turns its own rows' index into the bit"
scaling = "linear: one arm a row, two jump loops an essential input"
execution = "linear: worst 8T + 4⌈T/100⌉ + 7n steps: the index loops, four a block"
workspace = "poly n: worst 2n + bl(7n - 4) + bl(n) + 46 bits past n = 2: the last doubling loop"

[ablations]
audited = "2026-10-21"

[ablations.essential_projection]
saving = 48.6
arity = 12
seed = "random.Random(184700 + n)"
tables = 200
verdict = "kept: canonical, exempt; index loops and blocks over the essential inputs against every input: 0.0% on random tables, 39.5-48.6% one-ignored at n=8-12, 95.3-99.5% on constants; never larger. Plain-rewrite audit: the one bespoke trick, leaving out an arm where the index already is the bit, saved 5.1-6.6% at n=8-12 and was retired under the 10% bar; the per-row countdown cascade (14.0 chars a row) was not shipped"

[ablations.symmetric_count]
saving = 82.1
arity = 8
seed = "named symmetric tables"
tables = 5
verdict = "kept under the named-function rule: a table depending only on how many essential inputs are 1 adds each bit into one index without doubling and switches over m + 1 rows, raced by length against the doubling build. Parity, majority, and, or and exactly-2 all 45.8-45.9% at n=4, 63.8% at n=6, 73.5% at n=7, 82.1% at n=8, 93.3% at n=10; a symmetric table with an ignored input 73.0% at n=8. Random tables: 0 of 200 change at n=5..8. Exhaustive n<=3: 38 tables change, none grows, every changed program executed; named tables executed through n=10"

[catalogue]
folding_constant_local = "_blocks"  # no essential input: one block over the one-row table

