verdict = "kept: canonical, exempt; index loops and blocks over the essential inputs against every input: 0.0% on random tables, 39.5-48.6% one-ignored at n=8-12, 95.3-99.5% on constants; never larger. Plain-rewrite audit: the one bespoke trick, leaving out an arm where the index already is the bit, saved 5.1-6.6% at n=8-12 and was retired under the 10% bar; the per-row countdown cascade (14.0 chars a row) was not shipped"

[ablations.symmetric_count]
saving = 82.1
arity = 8
seed = "named symmetric tables"
tables = 5
verdict = "kept under the named-function rule: a table depending only on how many essential inputs are 1 adds each bit into one index without doubling and switches over m + 1 rows, a rule, not a race: the count build is never longer (byte-identical to the former length race on all 65,812 tables n<=4 and 112 tables n=5..8). Parity, majority, and, or and exactly-2 all 45.8-45.9% at n=4, 63.8% at n=6, 73.5% at n=7, 82.1% at n=8, 93.3% at n=10; a symmetric table with an ignored input 73.0% at n=8. Random tables: 0 of 200 change at n=5..8. Exhaustive n<=3: 38 tables change, none grows, every changed program executed; named tables executed through n=10"

[ablations.minority_arms]
saving = 39.4
arity = 8
seed = "random.Random(184700 + n)"
tables = 200
verdict = "kept: one switch with an arm `k?'2` only for the rows of the minority bit, a default printing the majority bit, and case 2 (jumped over at the start) printing the minority bit and jumping to a last no-op case, replacing blocks of a hundred arms that each turn the index into the bit. Random tables 33.9% at n=7, 39.4% at n=8; n=8 parity 2.3%, majority 2.3%, threshold-3 3.4%, and 5.7%, or 5.7% (the symmetric count build already switches over m + 1 rows). Every row run through esolangs.run: n<=3 exhaustive, 3,000 tables at n=4, 100 each at n=7 and n=8, named at n=8; a wrong table fails"

