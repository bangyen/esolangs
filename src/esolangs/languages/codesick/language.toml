[catalogue]
folding_ignored_read = "a bit is exposed only by deleting the one read before it, so an ignored one costs a delete node per residual below it"

[ablations]
audited = "2026-10-20"

[ablations.subtree_sharing]
saving = 319.11
arity = 12
verdict = "kept: canonical, exempt. subtree_ids interns every distinct subtable of the bit-reversed table as one node, defined once. Expanding every occurrence into its own node costs +208.57% at n=10 and +319.11% at n=12 on random tables (second seed set +207.67 / +318.81%), and at n=10/12: parity +5,879.09 / +21,084.01%, majority +1,572.18 / +4,567.55%, one ignored input (random in the rest) +468.46 / +630.41%, half-constant +419.74 / +592.90%"

[ablations.constant_fold]
saving = 0.93
arity = 12
verdict = "kept: canonical, exempt. A constant subtable collapses to its value id and prints in one instruction. Expanding constant subtables into branching nodes instead costs +2.26% at n=10 and +0.93% at n=12 on random tables (few constant subtables arise there), and on the classes that have them at n=10/12: constant tables +1,897.56 / +2,326.83%, AND and OR +94.17 / +95.56%, majority +30.56 / +26.60%. The plain build (no sharing, no fold) costs +333.43% at n=10 and +488.64% at n=12 on random tables"
