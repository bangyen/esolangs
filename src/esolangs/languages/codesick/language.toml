verdict = "kept: canonical constant folding, exempt. A single output instruction uses in as its dereference argument, so loading consumes the whole input before output; the dereference writes no changed mapping. 41->22 chars (46.3%) at n=7/8/12, 2->1 commands, workspace unchanged at 1 written bit. Whole-stream input convention unchanged. n=3 corpus chars 59184->59146. Executed 5656 paired old/new row runs; 270 nonconstant n<=3 sources identical. Default, width=1 and balanced constants execute through n=12; all 24 balanced scores match or improve. All eight benchmark size/command pins unchanged; global resource caps unchanged. Owned read-first checks cover both constant answers and following-record preservation (whole-stream loading for Codesick)."


[ablations.trick_prototype_20261102_dense_names]
arity = 8
saving = 18.123193069804056
seed = "random.Random(9000+n).choice"
tables = 200
verdict = "kept: name nodes by reference frequency in bijective base88, using non-bit printable ASCII words, excluding #,*,semicolon,quote and the keywords in/out/codesick. Markers need no # separator because no name contains0/1; bit+name labels cannot collide with node names or constants. Linear frequency buckets replace the proposal's comparison sort; no search or whole-old min fallback. Generic7/8 totals585975->485164 (17.2040%) and1045627->856126 (18.1232%), no sampled growth. Sustained10% gate: neither tending to zero nor declining across7/8; name-width savings scale with log(C), with asymptotic width ratio log(10)/log(88), rather than a fixed saving. Extended twenty native-checked tables per9..18 oscillate17.51-23.61%; local peak16=23.6139%,17=22.4438%,18=22.8340%. Do not call the fluctuations a uniform lower bound or hide the later decline. Original source ceiling depended on decimal id order; replace it by (68+10digits(C+1))C+43, at most three instructions per node and ten label occurrences. Base88 names skipping three keywords fit the old digits(C+1) width and preserve the workspace ceiling; native7/8 peaks143/160->127/144 bits. Commands are unchanged: true exhaustive n3 corpus59146->54896 chars,9360->9360 steps.80800 selected native row runs and1536 fresh-parser controls pass; four other variants each pass4096 rows. A missing-marker mutant fails table01,row0. Another2320 native extension/named/wrapped controls pass, and120000 direct names are unique and skip in/out. Short input is outside the exact-n Boolean contract: table0010100111001111 with empty input runs the old PC12 repeatedly, its string growing7,11,19,35,...; the new program prints1 in six steps. No claim of arbitrary-input equivalence. Whole-stream loading still consumes input once before output, including EOF, without an EOF error. Generation medians over twenty tables, eleven repeats, n8/10/12: .005803/.020446/.072131s -> .006055/.021786/.077837s (+4.3/6.6/7.9%)."

