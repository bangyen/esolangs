[proof_status]
labels = ["tree"]
qualification = "each distinct subtable is one labelled node; it appends its marker to the unread bits, and a substring test for `0` before the marker reads the last bit, deleting it on a hit; a miss deletes `1` and the marker by a self-jump"
scaling = "linear: at most W characters, n = 2..132"
execution = "poly n: worst 3n - 1 steps: three a level, two at the last"
workspace = "poly n: at most 16n + 8 + 8·digits(C+1) + bl(3C+1) bits: the input as key, the unread bits, the ip"
definitions = ["C = Σ_{d<n} min(2^d, 2^2^(n-d) - 2), the most non-constant nodes; digits counts decimal digits"]

