verdict = "kept as canonical repeated-subtree sharing2026-11-02: CONTRIBUTING explicitly lists repeated subtrees and limitations Sharing repeated subtables applies the canonical piece. Keys are exact chosen truth residuals plus ordered remaining positions, not arbitrary text or a reordered family. Original-formula generic source6322/11669 is unchanged at fixed7/8; named n=8 >=3 source310->254 and majority338->298 before the new mux/packet changes provide firing controls. Added state is the chosen DAG, free-name map and current expanded source counts; these are needed to charge actual reused bodies after earlier extraction. A second fixed root-multiplicity map supplies constant-time runtime increments. Each admitted store must save source and stay within the inherited execution cap; rejected trials are O(1), at most 26 stores reprice the DAG. Removed the eager text cache and all-alternative materialization; no old/unshared-expression fallback candidate remains. Definitions are stored deepest first after all inputs, and free names exclude input variables. Bare a/b reference constants are unaffected by assigned values. New formula workspace accounts for nested conditional plus call frames; old W arities remain3/4/5/6/8/9."

