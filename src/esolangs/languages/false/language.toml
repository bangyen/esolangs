[ablations]
audited = "2026-10-19"

[ablations.subtree_sharing]
saving = 55.8
arity = 12
verdict = "kept: canonical, exempt. A repeated half is stored once in a variable and fetched as x; wherever it repeats, under a gain test (k uses save k * len(text) against len(text) + 4; 26 variables, deepest first). Removing the stores costs 43.0% at n=8 rising to 53.5% at n=10 and 55.8% at n=12 on random tables, 96.8% / 99.0% on parity at n=10/12, 91.1% / 96.4% on majority"

[ablations.halves_agree_fold]
saving = 1.9
arity = 12
verdict = "kept: canonical family, exempt. A node whose halves agree drops its bit with ^% and runs the half bare. 2.5% at n=8 declining to 1.9% at n=12 on random tables, 3.0% / 1.9% with one ignored input; 0.0% on parity, AND, OR and majority, whose agreeing tests sit over constant spans the tree already folds to leaves"

[ablations.root_drain]
saving = 46.2
arity = 12
verdict = "kept: a leaf reached from the root through folds only reads the remaining inputs with bare ^ before printing instead of ^%, so a constant table costs n+2 instead of 2n+2 (44.4% / 45.5% / 46.2% at n=8/10/12, two constant tables). 0.00% on every other corpus: the drain fires only when a root fold chain ends at a leaf, i.e. constant tables"

[ablations.expression_form]
saving = 30.4
arity = 12
verdict = "kept, landed 2026-10-21: a second build raced per table against the diagram -- the essential inputs are stored, the rest drained, and a Boolean formula built by memoized Shannon decomposition is evaluated whole and printed masked to the bit (1&.). Removing it costs 33.3% / 33.4% at n=10 and 30.4% / 30.4% at n=12 on random tables (seeds 184700 / 777000), 35.8% / 31.8% on structured+named; every random table wins at both arities and no table grows. Priced from the superoptimizer pilot's FALSE review: the miner's finds were hypotheses until this construction priced them"

[ablations.expression_complement]
saving = 18.6
arity = 10
seed = "random.Random(1000 * n + i).getrandbits(1 << n), i < 20; named parity, majority, and, or, nand, nor, thresholds >= 2, 3, n-1 and their negations"
tables = 20
verdict = "kept for the negated-threshold family (named-function rule): the formula is built for the complement and closed with ~, whose low bit is the complement's. NAND/NOR 18.1 / 18.3 / 18.5 / 18.6% fewer chars at n=7/8/9/10 (n=8 82 -> 67; balanced area 0.0 / 26.5 / 13.8 / 12.9%), negated >=2 and >=n-1 thresholds 22.4 / 23.7 / 24.7 / 23.5% (n=8 241 -> 184; area 19.0 / 17.4 / 22.6 / 21.0%); parity, majority, AND, OR, >=2, >=3 and their other negations unchanged. Random tables: 0.41% / 0.41% chars, 0.39% / 0.29% area at n=7/8 (6115 -> 6090, 11195 -> 11149), 4 / 7 of 20 tables win -- under the bar there"

[ablations.expression_xor_collapse]
saving = 13.3
arity = 8
seed = "random.Random(1000 * n + i).getrandbits(1 << n), i < 20; named as expression_complement"
tables = 20
verdict = "kept: complementary halves collapse to a sum's parity (+b&, 5 chars) instead of a mux. 13.7% / 13.3% chars (11.8% / 12.7% area) at n=7/8 on random tables; parity 65.7 / 66.1 / 66.4 / 66.7% at n=7/8/9/10 (70 vs 204 at n=7)"

[ablations.low_bit_complemented_leaves]
saving = 3.158
arity = 11
seed = 1847
tables = "all n=1..3; four random n=4..6; 20 random n=7,8; four n=9; two n=10,11; parity/majority/and/or/threshold-3 n=7..10"
verdict = "rejected: a negated formula leaf uses x;~ (3 chars) instead of 1x;- (4); all combines preserve the low bit and the final 1& normalizes. Upside one character per negated literal. Random emitted characters: n=7 6,372 -> 6,189 (2.872%), n=8 11,968 -> 11,612 (2.975%), n=9 4,495 -> 4,350 (3.226%), n=10 4,472 -> 4,338 (2.996%), n=11 9,026 -> 8,741 (3.158%); under 10%. Balanced area (balance_score squared) saves 0.367% / 2.815% / 1.031% / 4.358% / 3.098%, also under the bar. Named functions unchanged in text and area at n=7..10. Executed both builds on all 2,568 rows of 288 tables through n=6, and four rows per larger measured table: exact output, all inputs consumed, no EOF reads, bounded steps. n=3 total 7,995 -> 7,841 chars. Positive control 0010: 20 -> 19 chars, ^1&a:^1&b:1b;-a;&1&. -> ^1&a:^1&b:b;~a;&1&.; deleting ~ fails output. No generator change"

