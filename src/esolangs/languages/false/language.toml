arity = 3
seed = "exhaustive n=3; random.Random(1000*n+s).getrandbits(1<<n) at fixed7/8"
tables = "all 256 three-input tables and 2048 rows;20 fixed random per n=7/8; all small/sample4..6"
verdict = "kept by execution admission2026-11-02: replaces the existing ten-character parity mux with six-character A x;[%B]?; adds no candidate or persistent state. The superseded mux spelling is removed. Against the final literal+canonical-sharing baseline without this replacement, exhaustive n=3 source7995->7523 and commands63960->56722 (11.32%); zero larger tables and zero slower rows. Literal alone wins no n=3 table, so this marginal does not inherit packet savings. Inside packet lookup the same conditional selects full integers, not merely low bits. Generic marginal source after packet admission is0% at fixed7/8; the separate exhaustive execution gate admits it. False flags retain A, true flags drop A and evaluate B; lambda nesting and read-before-output controls pass. Existing source and command numeric caps/scopes remain unchanged."

[ablations.formula_subtree_sharing_trick_20261102]
