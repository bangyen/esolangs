[ablations.constant_table_audit_20261101]
arity = 8
saving = 0.0
seed = 0
tables = "both constants, n=1..12"
verdict = "retained: already canonical read-then-literal paths. Bare ^ reads retain each ASCII bit, then a numeric literal and dot print the answer. Chars and commands n+2: n=7 9, n=8 10 with 61 written bits, n=12 14. Removing the literal prints ASCII codes 49 or 48 on the opposite-valued witnesses, not the requested digit. Native read-first controls pass. n=3 corpus chars 7995 unchanged. These controls reject the stripped candidates, not every possible construction. 1120 native row runs and 5656 paired old/new executions per language; 270 nonconstant n<=3 sources identical. Both constants execute default, width=1 and balanced layouts through n=12; all 24 balanced scores and eight benchmark size/command pins unchanged. Global resource caps unchanged. Extend existing raw IO/template cases to verify exact reads, following records and no EOF probe without adding cases."

[ablations.literal_lookup_build_trick_20261102]
saving = 53.7350
arity = 8
seed = "random.Random(1000*n+s).getrandbits(1<<n)"
tables = "20 fixed random per n=7/8; all tables/rows n=1..3; five random plus ignored-middle n=4..6; named n=7/8; one fixed random per n=9..14"
verdict = "kept 2026-11-02: one added direct 32-bit packet lookup candidate, no search/frozen table or copied old generator. Fixed 7/8 source versus the stronger conditional-mux/shared-formula route5061->2859 (43.51%) and9154->4235 (53.74%); versus original6322/11669,54.78%/63.71%. Both clear even20%; no200 escalation. Full 15360 paired stronger-baseline/lookup row executions pass. Their command totals288892->237152 and813352->560192. New state is the packet list, standard subtree IDs and one append-only output buffer; IDs are necessary to drop equal selector halves without quadratic span scans. No uniform-span table or recursive ancestor-text cache remains; constant roots skip the unused stored-input builds. Existing diagram/formula candidates protect constants, alphabet failure and structured source classes: parity n=8/n=10 is80/100 chars versus packet216/622. Stored-input routes stop only at the real 26-letter limit. The emitted marginal curve grows60.28/63.44/67.25/67.52/67.69/68.23% at n=9..14; conservative uniform-table whole-route grammar bounds give a 17.40% positive bulk floor and at least 14.69% mean saving at each n=14..26, without giant builds. This is a lower bound, not an exact measured peak; outside the alphabet domain the existing diagram remains. Pointwise packet upper17T/32+5n+44 from five essential inputs, with separately aligned shorter packets. Generic row0 written bits rise40->75 at n=7 and46->75 at n=8. Final warm three-build median old/public seconds n=8 .14890/.06519, n=10 1.04786/.46583, n=12 3.75867/1.76663 after eager-text removal. These pilots describe this corpus, not a universal timing guarantee."

[ablations.conditional_mux_trick_20261102]
