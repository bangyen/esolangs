[ablations]
audited = "2026-10-19"

[ablations.subtree_sharing]
saving = 55.8
arity = 12
verdict = "kept: canonical, exempt. A repeated half is stored once in a variable and fetched as x; wherever it repeats, under a gain test (k uses save k * len(text) against len(text) + 4; 26 variables, deepest first). Removing the stores costs 43.0% at n=8 rising to 53.5% at n=10 and 55.8% at n=12 on random tables, 96.8% / 99.0% on parity at n=10/12, 91.1% / 96.4% on majority"

[ablations.halves_agree_fold]
saving = 1.9
arity = 12
verdict = "kept: canonical family, exempt. A node whose halves agree drops its bit with ^% and runs the half bare. 2.5% at n=8 declining to 1.9% at n=12 on random tables, 3.0% / 1.9% with one ignored input; 0.0% on parity, AND, OR and majority, whose agreeing tests sit over constant spans the tree already folds to leaves"

[ablations.literal_pairs]
saving = 0.4
arity = 12
verdict = "removed 2026-10-20 (retirement candidate #23): a node over two constant halves was spelled directly as its recovering read (^1& for identity, ^'0=_ for negation) instead of a split over the two leaves. 3.3% at n=8 declining to 1.1% at n=10 and 0.4% at n=12 on random tables, 9.3% / 7.3% / 6.0% on parity, 7.1% / 5.2% / 4.0% on AND and OR: under the bar at both verdict arities on every corpus and declining on each. Restored 2026-10-20 capped at n <= 3: 57.9% / 42.5% / 30.9% at n=1/2/3, in clear decline on exhaustive small tables, and reverted the same day: a cap chosen where a trick still pays is judged at n=7..8 (CONTRIBUTING)"

[ablations.root_drain]
saving = 46.2
arity = 12
verdict = "kept: a leaf reached from the root through folds only prints first and reads the remaining inputs with bare ^ instead of ^%, so a constant table costs n+2 instead of 2n+2 (44.4% / 45.5% / 46.2% at n=8/10/12, two constant tables). 0.00% on every other corpus: the drain fires only when a root fold chain ends at a leaf, i.e. constant tables"

[ablations.expression_form]
saving = 30.4
arity = 12
verdict = "kept, landed 2026-10-21: a second build raced per table against the diagram -- the essential inputs are stored, the rest drained, and a Boolean formula built by memoized Shannon decomposition is evaluated whole and printed masked to the bit (1&.). Removing it costs 33.3% / 33.4% at n=10 and 30.4% / 30.4% at n=12 on random tables (seeds 184700 / 777000), 35.8% / 31.8% on structured+named; every random table wins at both arities and no table grows. Priced from the superoptimizer pilot's FALSE review: the miner's finds were hypotheses until this construction priced them"
