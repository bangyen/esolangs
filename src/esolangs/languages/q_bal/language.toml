witnesses = "esolangs.languages.q_bal.tests.resource_witnesses:resource_tables"

[resource_evidence.execution]
# One attachment, run once.
expression = "1"
exact = true
arities = [1, 2, 3, 6]
first = 1
unit = "commands"
description = { growth = "poly n", claim = "worst", template = "{claim} {formula} {unit}" }

[resource_evidence.workspace]
# The program counter, {2} after the step, and the input cursor; the table
# integer lives only inside the statement.
expression = "bl(n) + 4"
exact = true
arities = [1, 2, 3, 6]
first = 1
unit = "bits"
description = { growth = "poly n", claim = "worst", template = "{claim} {formula} {unit}" }

[resource_evidence.scaling]
# At n=1 a constant and complemented parity each take 13 characters.
# From n=2, OR has every input essential and N = 2^T - 2, as wide as
# 2^T - 1.  Weights 2^1..2^(n-1) cost "in\" and their digits, plus "in",
# n - 1 "+" and the 12 characters of "/2^(" and ")|2->out".
cases = [
    { through = 1, expression = "13" },
    { expression = "digits(2^T-1)+power2_digits_sum(n)+4n+9" },
]
exact = true
arities = [1, 2, 3, 4, 5, 6, 7, 8]
first = 1
unit = "characters"
description = { growth = "linear", claim = "worst", template = "{claim} {formula}, attained by OR from n=2" }

