notes = "Test the projected table for parity or its complement. A sum gives the parity modulo two, and the bias adds one for the complement. Zero weights consume ignored inputs. Both forms use one attachment. Full parity falls from 86 to 29 chars at n=7 and from 131 to 32 at n=8. The 64 random tables at each arity use the integer lookup, with seed 1847 + arity. Arity-3 source totals fall from 6743 to 6677 chars."

