qualification = "five-byte prints paged 128 rows by 16 blocks from column 0; row 0 doubles and adds each input character into three counters; a self-written left jump and strip of down jumps land on the print, and page headers compare and carry the page counter; a short-hop binary tree covers page headers wider than eight bytes"

