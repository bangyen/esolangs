[proof_status]
labels = ["linear lookup"]
qualification = "answer bytes are paged 128 rows by 16 columns. A one-column strip prints down. Wider strips patch the selected row's print with the left offset to its answer byte. Page headers decrement and carry the counters. A short-hop binary tree covers headers wider than eight bytes"

