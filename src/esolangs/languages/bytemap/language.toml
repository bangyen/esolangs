[resource_evidence.execution]
# At most 3 commands per input, 4 fixups, 9 per passed 2,048-entry page
# and 12 for the chosen page. There are at most 1 + 20n/168 reader
# segments and 1 + (25n + 94)/230 return relays, two commands apiece.
# On the tree, both axis distances sum geometrically; each relay
# splits a distance into jumps of at most 220.
cases = [
    { through = 59, expression = "4n + T/200 + 30" },
    { expression = "4n+T/200+40+8*2^⌈n/2⌉+10n+16" },
]
exact = false
arities = [1, 2, 3, 6]
first = 1
unit = "commands"
description = { growth = "linear", claim = "at most", template = "{claim} {formula}" }

[resource_evidence.workspace]
# Written cells: the counters and their scratch, at most five bytes
# for the chosen strip and print. A passed page zeroes its header.
# The tree writes one byte at each read site's coordinate.
cases = [
    { through = 59, expression = "60n + 40" },
    { expression = "60n+40+16(n+2)^2+1024" },
]
exact = false
arities = [1, 2, 3, 6]
first = 1
unit = "bits"
description = { growth = "poly n", claim = "at most", template = "{claim} {formula}" }

[resource_evidence.scaling]
# The reader and return are at most 25n + 94 and 25n + 104 bytes.
# A one-column row uses 3 chars with its newline. At B >= 2 columns
# a row uses 2B + 9 chars, at most 13B/2. A single strip adds at most
# 117 chars. Multiple pages have B = 16 and at most 418 chars of
# overhead per page, covered by the slack between 13B/2 and 2B + 9.
# The tree lies in a box below 2rx by 2ry bytes. Each byte takes two
# characters, and rx*ry = 48^2*T.
cases = [
    { through = 59, expression = "13T/2 + 100n + 520" },
    { expression = "20000T" },
]
exact = false
arities = [1, 2, 3, 4, 5, 6, 7, 8]
first = 1
unit = "characters"
description = { growth = "linear", claim = "at most", template = "{claim} {formula}" }

