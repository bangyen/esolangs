[resource_evidence.execution]
# 3 commands an input (1 for its part's first), 4 fix-ups, 9 a passed page
# (9/2048 <= 1/200 a row), the chosen page's 16 strip writes and 10 more;
# a long row 0 adds a copy a segment and two a return hop.
# On the tree, both axis distances sum geometrically; each relay
# splits a distance into jumps of at most 220.
cases = [
    { through = 59, expression = "4n + T/200 + 40" },
    { expression = "4n+T/200+40+8*2^⌈n/2⌉+10n+16" },
]
exact = false
arities = [1, 2, 3, 6]
first = 1
unit = "commands"
description = { growth = "linear", claim = "at most", template = "{claim} {formula}" }

[resource_evidence.workspace]
# Written cells: the counters and their scratch, the chosen page's strip;
# a passed page zeroes its header, so pages add only a row number's bits.
# The tree writes one byte at each read site's coordinate.
cases = [
    { through = 59, expression = "60n + 40" },
    { expression = "60n+40+16(n+2)^2+1024" },
]
exact = false
arities = [1, 2, 3, 6]
first = 1
unit = "bits"
description = { growth = "poly n", claim = "at most", template = "{claim} {formula}" }

[resource_evidence.scaling]
# 10 chars a table row; ~530 a 2,048-row page; O(n) reading, worst over
# 21T/2 at n = 9 (572); from n = 12 the 0.24T slack outgrows the reading.
# The tree lies in a box below 2rx by 2ry bytes. Each byte takes two
# characters, and rx*ry = 48^2*T.
cases = [
    { through = 59, expression = "21T/2 + 576" },
    { expression = "20000T" },
]
exact = false
arities = [1, 2, 3, 4, 5, 6, 7, 8]
first = 1
unit = "characters"
description = { growth = "linear", claim = "at most", template = "{claim} {formula}" }

