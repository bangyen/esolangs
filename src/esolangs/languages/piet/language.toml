[ablations.sum_form_and_flipped_table]
kind = "archive"
saving = 46.2
arity = 12
seed = "random.Random(5) and named tables"
tables = 20
verdict = "kept under the named-function rule: a literal product also races its sum form (add the literals that fail, then not: a literal is 2 codels where the product spends 3, so nor/or and a conjunction of zeros stop paying a not per input), and a lookup also races the complement stored with a not on the selected entry (a 0 entry is 2 codels, a 1 entry 1). The smaller by codels is kept. Area: and/or/nor/nand 26-29% off the dearer polarity at n=7..12 (nor 78 -> 57 at n=8, 114 -> 81 at n=12), at-least-2 complement 23.5% / 32.3% / 38.0% / 41.6% / 44.6% / 46.2% at n=7..12, majority 9.6% at n=8, 11.3% at n=10, 13.5% at n=12; random tables 0.8% at n=7, 1.6% at n=8 (the n=3 exhaustive total 34,224 -> 33,882). Balancing the strip and packed seeds and each candidate list too was priced and dropped (balanced side^2, 20 random tables: -25.7% at n=7, -15.6% at n=8, -3.7% at n=10, parity/majority 25.7%/22.8% at n=7/8 and 0 at n=10; a decline past n=8, and 4x the balance time, 3.1 s -> 13.2 s at n=10). Executed: balanced and default rasters on 20 random tables per arity at n=7,8 and named functions with complements and reversals through n=9"

[ablations.majority_count]
kind = "archive"
seed = 0
arity = 8
saving = 88.54
tables = "strict majority and complement independently at fixed n=7,8; exhaustive tables/rows n<=3; native projected/layout/scale controls"
verdict = "kept: sum essential bits, seed from the first read, drain ignored reads, subtract floor(m/2) using push1/subtract pairs, push zero and compare greater; invert only for the complement. Actual scale-1 codel areas majority 522 -> 75 and 759 -> 87 (85.632%/88.538%), complement 522 -> 78 and 759 -> 90 (85.057%/88.142%). Independently against the already qualifying DUP reader the savings are 83.660%/87.054% and 83.007%/86.607%. A strip has A=3(2n+2floor(m/2)+5+b), commands 2n+2floor(m/2)+4+b; from n=7, saving >=1-(9n+18)/2^n increases toward 1 against either lookup. Added construction is one O(T) projected-family recognition/count helper and the existing greater opcode; transient seeded/invert flags and an O(log n)-bit runtime accumulator replace the T-entry stack. No new integer builder, cache, layout, source race or per-render family flag. The old majority lookup and new DUP implementation are superseded. Other functions keep their existing path. Generic exact proof witnesses and all scopes/coefficients, eight pins, AND example and parity/AND anchors stay unchanged. New n=8 majority anchor 87 codels. n=3 default corpus 33870 -> 33633, balanced 40244 -> 39965. Native checks cover both biases, physical input order and drain, PNG/default/narrow/balance/scale3, resources and following record; no large count run is needed for the elementary increasing lower bound."

[ablations.chunked_entry_push]
kind = "archive"
arity = 8
saving = -150.85
seed = "random.Random(184700 + n)"
tables = "historical200 source; revised20 fixed per7/8,4 per4..6,exhaustive<=3;2 tables/allrows/3 timing passes per7/8"
verdict = "kept 2026-11-03 by the 25% command alternative. Historical area-selected triples grew34.061/34.912%; their extra binary integer builder is rejected. Instead one three-row strip pushes each0..7 chunk directly, preserves the row below the stack, selects floor(row/3), divides by q(q+1)/2+1 then mod2. Choose source-min polarity, commands only on a source tie. No pair route, bounded builder, whole-old source comparison or runtime decision state. Constants/products/majority keep O(n) layouts. From m4 essential inputs the worst-command bound crosses: old n3 maximum40 versus triple upper58 (native00011111 loses39->56), old n4 maximum96 versus triple68 (-29.167%). Old n5/6/7 maxima131/200/317 become82/108/154 (-37.405/46.000/51.420%); n8 bound244. Small projections and named readers remain below these global bounds. All old source/E/W exact scopes and flags are retained, with constructive new n4..7 maxima source333/468/723/1218 and W43/62/95/157. Some n4 tables slow (0111100111100011:54->64 on all16 rows); this is not the 5% no-table-regression route. Nevertheless native whole-table batch wall medians4..6 improve .02241->.02046 / .06592->.05000 / .19771->.13182s. Fixed20 actual scale1 codel area7/8 grows10393->21825 /15638->39228 (109.997/150.850%); four asymmetric rows per table commands24980->9476 /42772->13664 (-62.066/68.054%), zero slower rows there. Whole-table wall medians7/8 .3161->.1980s /1.0970->.6814s. Every table/row1..3 and four fixed all-row tables4..6 pass ordered reads, sole output, following record and halt; n3 source33633/E68104 unchanged. Command schedules are input-independent. From n8 old parity takes at least3T/2+4n+16, while new global bound2ceil(T/3)+4n+40 improves it by at least25%, approaching at least55.556%. Six pins and AND example unchanged; both four-input pins refreshed (parity96->63 commands,asymmetric54->62) with last-row/by-row counts; native anchors n10 parity6477 (was2226), AND66 and n8 majority87. Added state is one retained row and extraction operands replacing the T-entry stack, O(T) source/build, fixed byte-valued RGB palette. Existing narrow/balance feasibility remains; no source admission claim."

