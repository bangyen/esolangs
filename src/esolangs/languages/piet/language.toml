[catalogue]
sharing_exempt = "a strip has no jump, so a repeated subtable cannot be shared"
folding_constant = "literal products collapse a constant"

[ablations]
audited = "2026-10-20"

[ablations.literal_product]
saving = 25753.12
arity = 12
verdict = "kept: a one-hot or one-cold table is a product of literals, returned as the sole candidate instead of a lookup. Deleting it costs +25,753.12% on one-hot and +19,990.32% on one-cold tables at n=12, +31,715.38% on AND (a one-hot table) and +15,871.79% on OR, and +50.00 / +51.72% on constant tables, which reach it after projection to one entry"

[ablations.halved_lookup]
saving = 56.55
arity = 12
verdict = "kept: the race contestant for a table whose one half is constant — the stored half is looked up and the first essential bit rolled back in. Deleting it costs +56.55% on half-constant, +56.31% on second-half-constant and +28.05% on first-half-one tables at n=12; it is 0.00% on random tables at every arity, as its docstring says"

[ablations.input_projection]
saving = 664.76
arity = 12
verdict = "kept: canonical, exempt. Only the essential inputs index the table; an ignored input is read and popped, and the stored table is projected onto the rest. Removing projection costs +98.61% on one-ignored, +292.04% on two-ignored and +664.76% on three-ignored tables at n=12, and +27,480.00 / +21,375.86% on constant tables, whose projected form is a single entry"

[ablations.area_default]
saving = 71.5
arity = 10
seed = "random.Random(184700 + n)"
tables = 200
verdict = "kept: the default is the strip or the least-area of a fold and nine packed layouts, with no black ceiling (the strip on a tie); that dropped the ceiling and cut total area on 54-260 seeded random tables a size by 0.2-3.5% (n=4 exhaustive 1.0%, never larger on any of 65,536), at up to 40 more steps on n=4 parity. The fold is drawn once at the balance path's dense width isqrt(2C - 1) + 9, C the operations' codels, and packed: the same totals as balance's width sweep, which grew superlinearly (n=14: 3.3 s against 0.68 s), so no sweep. Total area over 200 random tables falls 38.3% at n=6, 51.8% at n=7, 61.7% at n=8 and 71.5% at n=10 (22.0% at n=5, 1.2% at n=4, none at n=3, where no fold is smaller); every program is executed, exhaustively through n=3 and sampled through n=7. Execution bound, derived: steps = blocks entered, one per operation of the bounded list (at most 2T+6n+14 blocks, push(T) rebuilt by doubling; the half-lookup is shorter past n=3) plus 2 for the halt, plus a turn gadget per extra lane, 6 blocks emitted and 5 packed (four gadget blocks and the landing; white is crossed in the step that leaves the landing). Lanes: a folded image is strictly smaller than the strip (width at most 3T+5n+16, 3 rows), every extra lane costs one row packed and two emitted, and a multi-lane image is 16 (packed) or 11 (emitted) wide, because the first lane stops within 2 cells of its room. So lanes less one are at most H-5 packed and (H-3)/2 emitted for height H < 3(3T+5n+16)/W, and the extra steps are below 15(3T+5n+16)/16, giving 5T+11n+31. Measured worst steps 7, 30, 42, 107, 158, 290, 404 against 2T+4n+14 of the old strip bound (n=1..7), all within the new bound. Workspace: the same stack plus at most 4 bits of gadget operands, the position bl(x)+bl(y) with x < the strip width and y < 3/11 of it, dp 2 and cc 2 bits"
