[resource_evidence.execution]
# Triple commands dominate the checked projections at n=4..6. From n=7
# they exceed 71+11n, with each added input increasing the gap.
cases = [
    { through = 3, expression = "P" },
    { expression = "2ceil(T/3)+4n+40" },
]
source_terms = { names = ["P"], provider = "esolangs.languages.piet.tests.formulas:execution_terms" }
exact = [3, 4, 5, 6, 7]
arities = [2, 3, 4, 5, 6, 7, 8]
first = 2
unit = "steps"
description = { growth = "linear", claim = "worst", template = "{claim} {formula}. small-layout walk P. Exact at n=3..7" }

[resource_evidence.workspace]
cases = [
    { through = 3, expression = "B" },
    { expression = "floor((11ceil(T/3)-5+2(n-2floor(n/2)))/4)+3n+bl(3ceil(T/3)+5n+48+3T/2+n-2floor(n/2))+bl(2n-1)+bl(n)+3" },
]
source_terms = { names = ["B"], provider = "esolangs.languages.piet.tests.formulas:workspace_terms" }
exact = [3, 4, 5, 6, 7]
arities = [2, 3, 4, 5, 6, 7, 8]
first = 2
unit = "bits"
description = { growth = "linear", claim = "worst", template = "{claim} {formula}. small-layout stack and cursor B. Exact at n=3..7" }

