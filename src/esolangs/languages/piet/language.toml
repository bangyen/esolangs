[ablations.area_default]
kind = "archive"
saving = 71.5
arity = 10
seed = "random.Random(184700 + n)"
tables = 200
verdict = "kept: the default is the strip or the least-area of three short-bridge packed layouts (2026-10-28 plain-rewrite audit: the fold as packing ceiling and the plain and duplicated lane kinds never won, area and balanced side identical on every table at n=1..10, seed 4242), with no black ceiling (the strip on a tie); that dropped the ceiling and cut total area on 54-260 seeded random tables a size by 0.2-3.5% (n=4 exhaustive 1.0%, never larger on any of 65,536), at up to 40 more steps on n=4 parity. Total area over 200 random tables falls 38.3% at n=6, 51.8% at n=7, 61.7% at n=8 and 71.5% at n=10 (22.0% at n=5, 1.2% at n=4, none at n=3, where no fold is smaller); every program is executed, exhaustively through n=3 and sampled through n=7. Execution bound, derived: steps = blocks entered, one per operation of the bounded list (at most 2T+6n+14 blocks, push(T) rebuilt by doubling) plus 2 for the halt, plus a turn gadget per extra lane, 6 blocks emitted and 5 packed (four gadget blocks and the landing; white is crossed in the step that leaves the landing). Lanes: a folded image is strictly smaller than the strip (width at most 3T+5n+16, 3 rows), every extra lane costs one row packed and two emitted, and a multi-lane image is 16 (packed) or 11 (emitted) wide, because the first lane stops within 2 cells of its room. So lanes less one are at most H-5 packed and (H-3)/2 emitted for height H < 3(3T+5n+16)/W, and the extra steps are below 15(3T+5n+16)/16, giving 5T+11n+31. Measured worst steps 7, 30, 42, 107, 158, 290, 404 against 2T+4n+14 of the old strip bound (n=1..7), all within the new bound. Workspace: the same stack plus at most 4 bits of gadget operands, the position bl(x)+bl(y) with x < the strip width and y < 3/11 of it, dp 2 and cc 2 bits"

