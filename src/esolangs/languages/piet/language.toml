# Language-owned data, one section per dataset; aggregators read
# only their own section and skip this file when it is absent.

[curation]
backlinks = 65

[proof_status]
labels = ["finite lookup"]
qualification = "each table entry is pushed and an input index selects its output; literal products replace conjunction tables"
scaling = "linear: worst F codels for n = 2..7, then at most F"
execution = "linear: worst F steps for n = 2..7, then at most 5T + 11n + 31: blocks plus turns"
workspace = "linear: worst F bits for n = 2..7, then at most S: the stack"
definitions = ["S = T + 2n + 12 + 2bl(3T+5n+15) + bl(2n-1) + bl(n)"]

