kind = "archive"
saving = 0.0
arity = 8
tables = "parity, majority, and, or, threshold-2, threshold-(n-1), and complements at n=7..10"
verdict = "Named functions only here; seeded random tables are in [ablations.wider_balance_random_20261101]. Not reinstated: balance both strip and packed seeds for each literal-product/sum or direct/complement lookup candidate, retaining the current balanced output. Actual area savings are 0% on all 48 tables, including both gate arities n=7,8. Ran both outputs on six rows per table: 576 correct executions. Positive control: existing strip seeding improves n=7 parity's balance score from (29,522,29) to (25,550,25), with 12 correct executions; its area grows 522 -> 550 codels, so the control shows the probe detects balance, not an area saving. The earlier 25.7%/22.8% figures measured enclosing side squared, not actual area or a current marginal gain."

[ablations.wider_balance_random_20261101]
kind = "archive"
saving = 0.0
arity = 8
seed = "random.Random(4242 + n)"
tables = 200
verdict = "Not shipped: the same candidate (balance strip and packed seed of each direct/complement or product/sum lookup, keeping the current balanced output) on 200 random tables at n=7 and n=8. Actual area changes -0.83% / -4.51% (it grows: 15 of 200 tables larger at n=7, 165 larger and 8 smaller at n=8); enclosing side^2 saves 2.22% / 16.83% (15 / 165 tables better, none worse), so it trades area for squareness. The n=8 side^2 figure is a one-arity spike, not a trend: 60 tables at n=9 / 10 give 2.45% / 1.96% side^2 and -1.33% / -0.67% area (16 / 11 changed, 864 correct baseline rows, wrong-table control 144 of 144), so side^2 misses the 10% bar at every arity but n=8 and area never saves. The 24 named tables at n=7,8 are unchanged, matching the recheck. Ran every baseline program on up to six rows per table (424 tables, 2528 correct) and every differing candidate (188 tables, 1124 correct); 0 wrong. Wrong-table control: the complemented table fails on all 424 programs (2528 of 2528 rows). Area-probe control: strip -> least-area default saves 52.98% / 62.34% at n=7 / 8 on the same tables (cf. [ablations.area_default])"

[ablations.constant_table_audit_20261101]
kind = "archive"
arity = 8
saving = 9.3
seed = 0
tables = "both constants n=1..12; exhaustive all tables/rows n=1..3; six witnesses/all rows n=4..6"
verdict = "kept: canonical constant folding, exempt from the percentage gate. Start with an input read so the entry block supplies it; pop earlier inputs. For zero duplicate/subtract the final bit; for one push a literal over it, leaving one unused bit at halt. Stack peak remains two bits. Default strips use 6n+12-3b codels, 2n+3-b steps and 4+bl(2n+3-b)+bl(2n-1)+bl(n) written bits, scale 1. n=7 zero/one 60/57 -> 54/51 codels; n=8 66/63 -> 60/57 codels, 21/20 -> 19/18 steps, written bits stay 17; n=12 90/87 -> 84/81 codels. n=3 corpus 33882 -> 33870 codels; balanced corpus 40256 -> 40244. One of 24 balanced shape scores worsens: n=6 one is 15x3 (45 codels) rather than 13x8 (104); the unchanged area ceiling selects the smaller strip. The other 23 match or improve. Each language passed 5656 paired old/new row executions; all 270 nonconstant default programs through n=3 remain byte-identical (Piet pixel-identical). Both constants n=1..12 execute in default, width=1 and balanced layouts; a separate 1120-run candidate probe per language includes every row through n=8. All eight benchmark size/command pins per language remain unchanged. Owned regressions check resources, all reads before output, no EOF probe and a preserved following record; Piet also executes at scale 3. No new collected cases."

