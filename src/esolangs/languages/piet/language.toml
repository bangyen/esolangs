[ablations]
audited = "2026-10-20"

[ablations.literal_product]
saving = 25753.12
arity = 12
verdict = "kept: a one-hot or one-cold table is a product of literals, returned as the sole candidate instead of a lookup. Deleting it costs +25,753.12% on one-hot and +19,990.32% on one-cold tables at n=12, +31,715.38% on AND (a one-hot table) and +15,871.79% on OR, and +50.00 / +51.72% on constant tables, which reach it after projection to one entry"

[ablations.halved_lookup]
saving = 0.0
arity = 12
verdict = "retired 2026-10-28 (random + named bar): 0.00% by area and by balanced side^2 on 20 seeded random tables and on parity, majority, and, or and a threshold at n=7..10 (and/or take the literal product, so the half never races); it won only on a class drawn to show it (+56.55% on half-constant, +56.31% on second-half-constant, +28.05% on first-half-one tables at n=12; 36% at n=8 on a zero-upper-half random table). Priced by deleting it, joint with the strip, fold and packed races; the n=3 exhaustive total moves 34,062 -> 34,224 codels"

[ablations.input_projection]
saving = 664.76
arity = 12
verdict = "kept: canonical, exempt. Only the essential inputs index the table; an ignored input is read and popped, and the stored table is projected onto the rest. Removing projection costs +98.61% on one-ignored, +292.04% on two-ignored and +664.76% on three-ignored tables at n=12, and +27,480.00 / +21,375.86% on constant tables, whose projected form is a single entry"

[ablations.area_default]
saving = 71.5
arity = 10
seed = "random.Random(184700 + n)"
tables = 200
verdict = "kept: the default is the strip or the least-area of three short-bridge packed layouts (2026-10-28 plain-rewrite audit: the fold as packing ceiling and the plain and duplicated lane kinds never won, area and balanced side identical on every table at n=1..10, seed 4242), with no black ceiling (the strip on a tie); that dropped the ceiling and cut total area on 54-260 seeded random tables a size by 0.2-3.5% (n=4 exhaustive 1.0%, never larger on any of 65,536), at up to 40 more steps on n=4 parity. Total area over 200 random tables falls 38.3% at n=6, 51.8% at n=7, 61.7% at n=8 and 71.5% at n=10 (22.0% at n=5, 1.2% at n=4, none at n=3, where no fold is smaller); every program is executed, exhaustively through n=3 and sampled through n=7. Execution bound, derived: steps = blocks entered, one per operation of the bounded list (at most 2T+6n+14 blocks, push(T) rebuilt by doubling) plus 2 for the halt, plus a turn gadget per extra lane, 6 blocks emitted and 5 packed (four gadget blocks and the landing; white is crossed in the step that leaves the landing). Lanes: a folded image is strictly smaller than the strip (width at most 3T+5n+16, 3 rows), every extra lane costs one row packed and two emitted, and a multi-lane image is 16 (packed) or 11 (emitted) wide, because the first lane stops within 2 cells of its room. So lanes less one are at most H-5 packed and (H-3)/2 emitted for height H < 3(3T+5n+16)/W, and the extra steps are below 15(3T+5n+16)/16, giving 5T+11n+31. Measured worst steps 7, 30, 42, 107, 158, 290, 404 against 2T+4n+14 of the old strip bound (n=1..7), all within the new bound. Workspace: the same stack plus at most 4 bits of gadget operands, the position bl(x)+bl(y) with x < the strip width and y < 3/11 of it, dp 2 and cc 2 bits"

[ablations.balance_dense_and_repack]
saving = 0.0
arity = 10
seed = "random.Random(4242 + n)"
tables = "20 random per n=3..8, 6 at n=9..10, every table at n=1,2, plus parity/majority/and/or/nand/nor/threshold-2/threshold-(n-1)"
verdict = "retired 2026-10-28 (plain-rewrite audit): balance's dense two-row-bend plan and its closing repack of the default never changed the balanced side on any table at n=1..10; the default is already packed. Every program ran (0 bad)"

[ablations.balance_strip_seed]
saving = 24.4
arity = 7
seed = "random.Random(4242 + n)"
tables = "20 random per n=3..8, 5 at n=9..12, every table at n=1,2, plus parity/majority/and/or/threshold-2/threshold-(n-1)"
verdict = "kept 2026-10-28 for parity and majority: balance seeded with the strip instead of the packed default (the packed default stays a candidate). Balanced area (side^2) on random tables -8.3 / -20.5 / -26.6 / -24.4 / 0.0 / -3.2 / -2.5 / -1.8 / -3.9% at n=4..12, so random tables alone miss the bar at n=8; parity -27 / -39 / 0 / -26 / 0 / -14% at n=4..9, majority -39 / -15 / -26 / -23 / -14 / 0 / -9% at n=5..11; and/or unchanged; no table larger. The packed-seeded call was redundant beside the default (identical on 128 tables). Every changed program ran (0 bad)"

[ablations.sum_form_and_flipped_table]
saving = 46.2
arity = 12
seed = "random.Random(5) and named tables"
tables = 20
verdict = "kept under the named-function rule: a literal product also races its sum form (add the literals that fail, then not: a literal is 2 codels where the product spends 3, so nor/or and a conjunction of zeros stop paying a not per input), and a lookup also races the complement stored with a not on the selected entry (a 0 entry is 2 codels, a 1 entry 1). The smaller by codels is kept. Area: and/or/nor/nand 26-29% off the dearer polarity at n=7..12 (nor 78 -> 57 at n=8, 114 -> 81 at n=12), at-least-2 complement 23.5% / 32.3% / 38.0% / 41.6% / 44.6% / 46.2% at n=7..12, majority 9.6% at n=8, 11.3% at n=10, 13.5% at n=12; random tables 0.8% at n=7, 1.6% at n=8 (the n=3 exhaustive total 34,224 -> 33,882). Balancing the strip and packed seeds and each candidate list too was priced and dropped (balanced side^2, 20 random tables: -25.7% at n=7, -15.6% at n=8, -3.7% at n=10, parity/majority 25.7%/22.8% at n=7/8 and 0 at n=10; a decline past n=8, and 4x the balance time, 3.1 s -> 13.2 s at n=10). Executed: balanced and default rasters on 20 random tables per arity at n=7,8 and named functions with complements and reversals through n=9"

[audits]
plain_rewrite = 2026-10-28
