# Language-owned data, one section per dataset; aggregators read
# only their own section and skip this file when it is absent.

[curation]
backlinks = 3

[proof_status]
labels = ["linear lookup"]
qualification = "the write row puts the essential inputs' table on the tape, one cell an entry, then each essential input's gadget tests its dequeued bit and a 0 walks the tape pointer left by that bit's weight, leaving it beside the indexed entry; an ignored input is read and never enqueued"
scaling = "linear: five rows of about T + zeros + 9n columns"
execution = "linear: at most 5T + 80n + 210 commands: the write row, each unary move out and back, the band"
workspace = "linear: at most T + 10n + 56 bits: the tape, one bit a cell"

