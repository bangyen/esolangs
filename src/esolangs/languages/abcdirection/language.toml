[catalogue]
folding_constant_local = "_layout"  # no essential input: one table cell, no select gadget

[ablations]
audited = "2026-10-19"

[ablations.essential_projection]
saving = 46.9
arity = 10
verdict = "kept: canonical, exempt; projecting the table onto its essential inputs earns 35.7% with one ignored input at n=8 and 46.9% at n=10 (position-independent: lead, mid and trailing totals identical), 65.7% / 87.5% with half the inputs ignored, 51.3% / 70.4% with two scattered, and 78.6% / 92.4% on constants, which collapse to one cell through it; 0.0% on random tables, where it has nothing to act on"

[ablations.tooth_packing]
saving = 1.5
arity = 12
verdict = "retirement candidate (batch 8): packing two reads per tooth prices 19.6% on random tables at n=5 in clear decline to 2.6% at n=11 and 1.5% at n=12 — the read block is O(n) columns against an O(2^n) table, so the share tends to zero. The absolute saving still grows (~484 cells a program at n=12) and on half-ignored tables, where the reads dominate, it earns 26.9-28.2%; the dispute is recorded in the candidates file"

[interpreter_ablations]
audited = "2026-10-18"
benchmark = "interp-audit-2026-10-18/tracediff-n3"

[interpreter_ablations.repeat_key]
price = 8.1
workload = "traced"
verdict = "candidate: real but under the bar; carries the write-bump invariant the cycle detector depends on"

[interpreter_ablations.view_cache]
price = 59.4
workload = "traced"
verdict = "kept: snapshot per step is O(1) once the table is written"
