[ablations]
audited = "2026-10-19"

[ablations.sqrt_width_layout]
saving = 22.4
arity = 2
verdict = "kept, capped at projected count <= 2 (restored 2026-10-20 after retirement candidate #20's removal was re-priced at small arities): the natural sqrt-width layout returns on the default path for tables whose projection onto their essential inputs has at most two entries, saving 37.5% at count 1 and 22.4% at count 2 per affected table by area (totals +31.8% at n=1, +9.6% at n=2 and +0.7% at n=3 over the exhaustive small tables), no table growing; at counts 4 and 8 it loses 19.6% and 36.1%, and the audit priced it at area 1,224 per random table at n=8 against the wide layout's 400 (603 vs 240 at n=7, 522 vs 128 at n=6) — 2.5-4.1x the area — so every larger table keeps the grid's width 80. Explicit widths and the balance walk are untouched. See RETIREMENT-CANDIDATES entry 20"

[ablations.header_folding]
saving = -7.1
arity = 10
verdict = "removed 2026-10-20 (fix phase), scoped as written: the folded construction emits the header on one row whenever it fits the chosen columns and folds only when it does not. The audit priced the fold at area 1,200 against the unfolded 1,120 at n=10 and 720 against 640 at n=9 (-12.5% / -7.1% by area, -1.2% / -0.2% by chars) on the default path, where the header fits one row (78 cells at n=10 against 80 columns); candidate 20's fix has since taken the default path off the folded construction, so the unfold now serves explicit-width calls. Folding remains the only route for widths narrower than the header. The natural build restored the same day for projected count <= 2 (see sqrt_width_layout) carries its own folded header for over-wide cases, which never occurs inside that class at n <= 13, where its plain layout always fits; this entry's scoped form is unaffected. See RETIREMENT-CANDIDATES entry 21"

[ablations.essential_projection]
saving = 36.4
arity = 12
verdict = "kept: canonical, exempt. Ignored inputs weigh 0 in the Horner fold and the table is read at its essential inputs: 94.0% by area on constant tables at n=10, 40.0% / 36.4% by area with one ignored input at n=10/12. The measured price flips sign at layout-regime boundaries (two ignored inputs at n=12: -36.4% by area, -40.4% by chars) because projection moves the table out of the six-bit packed regime into the folded text regime; the flips belong to the regimes, not the projection"

[ablations.six_bit_packing]
saving = 0.0
arity = 13
verdict = "kept: cap machinery, not priced. Above 2^10 cells the table is packed six bits per printable-ASCII cell (at n=13, 8,192 cells ship as ~1,366 data cells, area 1,600). The unpacked table cannot fit the fixed 80x25 torus at all, so no valid ablated build exists to price against"
