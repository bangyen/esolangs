kind = "archive"
saving = 0.0
arity = 8
seed = "random.Random(4242 + n); 777 + n for the n<=10 diff"
tables = "20 random per n=3..8, every table at n=1,2, plus parity/xnor/majority/and/or; 15 random plus parity/majority/and/constant per n=3..10"
verdict = "retired 2026-10-28 (plain-rewrite audit): balance's single-digit-column candidates (widths 4-9) won only at n=1 (32.5% balanced area) and n=2 (4.0%) and on constant tables to n=6 (side 12 -> 15), none of them a judged class; 0% on random and named tables at n=3..10. Every balanced program ran (0 bad), a complemented table failed. The narrow bound stays for explicit widths. The one-column parity candidate was priced with it and kept: 0% at n<=8 but side 48 against 51 at n=10 (12.9% area on parity)"
retirement = { verb = "retired", date = 2026-10-28, balanced = [119, 127] }

[ablations.constant_table_audit_20261101]
kind = "archive"
arity = 8
saving = 70.3
seed = 0
tables = "both constants n=1..12; exhaustive all tables/rows n=1..3; six witnesses/all rows n=4..6"
verdict = "kept: canonical fixed-output spelling. Read/pop each numeric input, push the fixed bit, print decimal and halt. Default A=E=2n+3 cells/commands; W=2+bl(2n+2)+bl(2n-1) written bits. Width requests keep a fitting row, use one vertical column only when its initial turn and commands fit 25 rows, otherwise use the existing serpentine fold at a four-column floor. The balanced width follows W(W-2)=2L; its neighboring widths match the full supported-width oracle at every n=1..13. The thirteen-input cap remains. n=7 60 -> 17 cells; n=8 64 -> 19 cells, 32 -> 19 commands, 24 -> 11 written bits; n=12 80 -> 27 cells. n=3 corpus 21584 -> 21514 cells (12926 -> 12896 chars). A separate 1120-run native probe covers every row through n=8; owned regressions cover through the n=13 cap. Each language passed 5656 paired old/new row executions; 270 nonconstant default programs through n=3 stay byte-identical. Both constants n=1..12 execute in default, width=1 and balanced layouts. All 24 balanced scores per language match or improve; all 26 benchmark size/command pins across the batch remain unchanged. Owned regressions check reads before output, no EOF probes and a preserved following record, without adding collected cases."

[ablations.trick_prototype_20261102_one_row_nibbles]
kind = "archive"
arity = 8
saving = 46.666666666666664
verdict = "kept: two earliest essential inputs build f=(1+b0)(1+3b1); later inputs index one data row with g at literal y=1. Store32+v with exponent b0+2b1, permuting the high table bits while retaining input-order reads and &$ discards. Direct low-bit Horner reads need no initial index zero except at two essential inputs. Projected4..320 entries fit a single80-cell data row; power-of-two tables therefore stop at256 entries/eight essential inputs. Header is at most52 cells at total n<=13; data at most64. Ninth-essential-input parity physically emits128 nonspace data cells and the native VM rejects its row. This cap belongs to the fixed-y one-row constructor, not to four-bit packing in general: a tested 2D extension saves25% at9, ties at10 and loses14.2857%/27.2727% at11/12, so no favorable declining window is claimed. Existing general layouts remain only outside row/requested-width feasibility, with no new-vs-old size race. The global13-input cap and O(T) generation/source stay unchanged; default execution O(n), workspace poly n.200 Random(100+n).choice tables plus parity/and/or/majority/threshold3 at7/8 all run every row.243420 fresh-machine executions across old/Horner/nibble prototypes; separate wrong-plane-order, flipped-entry and physical-cap controls fire. Default area7:240->76 cells (68.3333%),8:240->128 (46.6667%); chars193->71,205->107. Declining savings clear20% at both largest construction arities. Even the new lookup with longer old-style index reads qualifies independently:94/128 cells, native every7/8 parity row. Commands63->38 and107->42; n3 corpus area21514->11398,chars12896->6440,commands86128->45664.827 independent default/disabled comparisons,3308 live rows with full snapshots and bounds,1164 width1/5/20/40/80 and balanced rows pass, including gapped projections through13. Exact low-arity worsts are now projections through6; update shared witness and pins. W7/8 measured34/43->28/28bits. Stack peaks17bits at[f,cell,4,8], f<=8 andcell32..47; only column, done and input cursor write on this straight header. Bounds and source anchors updated together; n4parity65->31chars, n10/n13random335/1545 unchanged. Three-run medians for20table/all-row native batches7:0.34217->0.22974s,8:1.06408->0.54165s; generation11-build medians0.491/0.742ms->0.482/0.891ms (~20% slower at8). Parity balanced areas unchanged2..8; narrow/general layouts remain available. Native output follows all reads, no EOF probes, following7 preserved."

[ablations.trick_prototype_20261102_header_row_inline_data]
kind = "archive"
arity = 7
saving = 67.5
verdict = "rejected raw eight-bit inlining: byte200 survives UTF8 roundtrip and native all-row execution and still counts one grid cell, but a CR leaf changes grid structure and computes the wrong bit. High bytes are not the failure; structural line separators are. A seven-bit alphabet cannot represent all256 eight-bit leaves under the same three-selector decoder. A conforming printable-nibble inline repair runs every parity row through7 and fits78 cells at7, but the separate-row keeper takes76. Its improvement over the keeper declines:23.3333%/14.7059% at5/6, then loses2.6316% at7. Judging the two largest arities before that loss misses the declining20% bar, so do not stack it. At8 its114-cell single row exceeds80; the raw byte row is82 cells. Against the old baseline the nibble repair can qualify, but it is superseded by the selected construction at the verdict arities, not bundled as a second gain."

[ablations.trick_prototype_20261102_horner_shift_first_reads]
kind = "archive"
arity = 8
saving = 0.0
verdict = "unselected as an additional rule. Standalone 2*&+ in place of &\\2*+ computes the same Horner recurrence and is correct in81140 native rows for this variant (243420 combined old/Horner/nibble rows). By itself default area remains240 at7/8 (positive area change occurs at smaller arities, so this is not a vacuous probe). Standalone n3 area21514->20074,chars12896->12176,commands86128->80368 (6.6877%), with no growing/slower default cases in explicit small-table controls and273 arity/projected-count row controls. That clears the separate5% execution gate before nibble packing. Once the chosen lookup is installed, an additional global rewrite changes only natural projections in the n3 corpus:4096 paired native rows measure45664->45616commands (0.1051%), below5%. Keep existing natural/general/requested-width readers; no global Horner rule is stacked. The new lookup uses its own direct index arithmetic and still clears its source gate without that shortening, as separately executed94/128-cell controls show."

