[ablations.shared_ascii_counter]
kind = "archive"
saving = 22.1
arity = 16
seed = 20261031
tables = "all n<=3; all literal products/sums n=4; sampled products/sums and 20 random per n=4..6; named n=7,8,10,12,14,16"
verdict = "kept for literal conjunctions/disjunctions (one-hot/one-cold tables, n>=2): read ASCII into cells 2i and use flag cell 1 as counter 2 to subtract 24 from every input twice. Header 51n-2 -> 35n-7 chars, 51n-2 -> 63n-9 commands; preserve the original tree-body budget. AND n=7/8/10/16: 541->424 / 612->479 / 754->589 / 1180->919 chars (21.627/21.732/21.883/22.119%); OR n=8 622->489 (21.383%). Both are linear-size families, so the 16n+5 saving retains a nonzero share; sampled random tables outside the family remain byte-identical. NAND attains 81n+47 commands: old 69n+54 plus 12n-7. Header tape peak 7n bits (6n ASCII, n-1 flags, one extra counter bit); after normalization the old 2n+7 tape bound applies. Global workspace is max(7n,2n+7)+bl(2n)+bl(n)+bl(L), retaining n=1 unchanged. n=8 NAND worst commands 606->695, written bits 42->74. Executed both builds on every n<=3 table and sampled n=4..6, including every n=4 literal product/sum; 6408 new-program rows, output/cursor/bounds checked. Named n=7/8 all rows, larger n<=16 boundary rows also pass; missing-print control fires. n=3 total 71420->70572 chars, 476488->480200 commands. The unrestricted prototype remains rejected: random savings decline below 10%; revised construction bounds admit only the qualifying named families."

