benchmark = "interp-audit-2026-10-18/tracediff-n3"

[interpreter_ablations.dirty_write_buffer]
price = -9.4
workload = "traced"
verdict = "removed 2026-10-20 (interpreter candidate I-1): -9.4 traced, +17.5 run-to-halt in the audit; snapshot() commits the cell every step on the traced workload. Re-measured at removal on the tracediff corpus (interleaved A/B, median of 7 rounds, two runs): traced -19.4%/-18.7% (removal faster), run-to-halt +2.9%/+8.3% (removal slower); differential 0 divergences on 2,706 digest programs and 5,206 tracediff programs vs main"

[interpreter_ablations.compiled_peepholes]
