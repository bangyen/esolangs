baseline = "2976d5d22^"
verdict = "measured with the interpreter/helpers at 567f2cb18. At n=8: characters 8888 -> 8622, sampled commands 9825 -> 10359, largest sampled written-state peak 43 -> 74 bits. Sum of seven-repeat cold generation medians: 15670542 -> 15688541 ns. All rows at n=3; rows 0,floor(T/3),T-1 otherwise. 204 correct executions, 24 wrong-table controls. Peaks and timings describe this corpus. The shared ASCII counter spends commands and workspace on the qualifying literal families. Current resource bounds pass where their stated domains apply"

[ablations.constant_table_audit_20261101]
kind = "archive"
arity = 8
saving = 71.6
seed = 0
tables = "both constants n=1..12; exhaustive all tables/rows n=1..3; six witnesses/all rows n=4..6"
verdict = "kept: canonical whole constants from n=2. Reuse one read cell, then use a fresh counter and output cell for 48=6*8, plus the answer bit. Exactly n+22+b chars, n+82+b commands, 16+bl(n+22+b)+bl(n) written bits. The three-cell path fits the workspace ledger from n=2. At n=1 it exceeds the ledger; a measured two-cell clear variant uses 25/26 chars but 181/182 commands versus 99/102, so the existing one-input route stays byte-identical. n=8 zero/one 106/109 -> 30/31 chars; n=12 110/113 -> 34/35. Native n=8 workspace is 25 bits (six more than the old path), within the unchanged ledger. n=3 corpus 70572 -> 70418 chars. Each language passed 5656 paired old/new row executions; all 270 nonconstant programs through n=3 stay byte-identical. Both constants n=1..12 execute in default, width=1 and balanced layouts. All 24 balanced scores per language improve or match; all eight benchmark size/command pins remain unchanged. Owned regressions check resources, every read before output and an unread following record. Existing tests expanded without adding cases."

[ablations.zero_arms]
kind = "archive"
arity = 8
saving = 10.11
seed = "random.Random(1000*n+k).choices('01',k=1<<n), k=0..19"
tables = "all tables/rows n<=3; ten random and named/ignored cases n=4..8; fixed20 each n=7/8; literal endpoints through n=16"
verdict = "kept canonical zero-subtree pruning and minimal movement, exempt: plain bodies reuse the costed deferred-body emitter, removing the second generator implementation and redundant initial root detour. Zero-side-only byte guards use -[+ side]: 0 wraps to255, 1 becomes0, and + clears255 before descent. Positive guards remain [- side]. One optional immutable dialect spelling declares this native capability; other dialects opt out and remain byte/cost-identical on828 small body comparisons. No runtime cell/register/cache/order/candidate or old-program fallback is added. Existing shared/affine class constructions remain. Fixed7/8 source32617/58038->29608/52171 (-9.23/-10.11%); n3 source70418->64098 and commands479928->462650. Public size selection makes136 n3 rows slower; no execution admission is claimed. All old source/W proof scopes and the unchanged max(7n,2n+7) tape allowance remain: at most one transient255 adds7bits before the output leaf. Global exact E tightens81n+47 to75n+49 for n>=3, attained by OR/all-zero; add that witness without removing NAND. Ordinary trees cost at most69n+54; shared/affine keep69n+44. Literal hot chains cost74n+z+39/49 commands, z the exceptional row's zero count. Their cold-direct source minus hot-flipped is2n^2+10n-26-z+b, positive for n>=3, so the fast hot chain wins; all1008 matching rows/patterns n=3..8 execute with the derived exact counts. Native4276 WrittenState rows include1776 forced-bank rows and2325 inverse visits; all bounds/read-first/next-record checks pass. Anchors, all eight source/last-row/by-row pins and saved example are refreshed together. Formatted constant tests now execute actual text, count native commands, and use its actual L in the exact PC term; no production constant bound changes. Private byte-bank tests count the transient extra bit with2n+7 instead of2n+6; the public max(7n,2n+7) ledger is unchanged. Three-size generation timings retain linear growth; n13 CPU rises17.8% from the reused continuation-cost accounting, avoiding a second no-cost emitter."

