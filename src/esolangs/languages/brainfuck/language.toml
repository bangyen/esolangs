[ablations.shared_flag_tree]
saving = 16.7
arity = 12
verdict = "kept: canonical sharing, exempt from the bar; saving on random tables, flat from n=8 (49.5-52.3% on tiled tables to n=16, 53.2% on majority at n=8); the multiple form's marginal over the single form is 20.6% on majority at n=8 and 0.9-1.5% on random tables"

[ablations.binary_bank]
saving = 0.0
arity = 16
verdict = "removed 2026-10-20 (retirement candidate #8): 0.0% race marginal on every corpus measured (random, affine, majority, mosaic, tiled to n=16) -- the in-code 14.8%/13.9% figures priced its share of the shared tree's core on tiled tables, not what deleting it costs the shipped generator"

[ablations.larger_suffix_bank]
saving = 0.0
arity = 16
verdict = "removed 2026-10-20 (retirement candidate #8): 0.0% race marginal on every corpus measured, jointly with the binary bank and individually (in-code core prices 10.3%/12.1% at n=14/16, 18.1%/15.9% with both banks off)"

[ablations.complement_print]
saving = 24.1
arity = 12
seed = "random.Random(i * 1000 + n), i < 20"
tables = 20
verdict = "kept under the named-function rule (plain-rewrite audit 2026-10-28; added the same day): the tree of the complement table with a complementing print races the direct tree. Random tables 0.48% / 0.06% at n=7/8 (2 and 1 of 20 change), balanced 0.51% / 0.00%; or and nand 14.3/16.5/18.6/20.5/22.3/24.1% at n=7..12 (balanced 10.8/19.0/18.1/17.4/20.1/22.6%), not-majority 13.3/20.2/19.1/25.3/22.0/27.2% (balanced 14.8/20.4/18.1/23.4/22.0/26.5%), rising; and, nor, parity, majority, thresholds unchanged. 136 programs n=3..10 executed on every row, a wrong table fails"

[ablations.affine_stream]
saving = 97.9
arity = 12
verdict = "kept: parity (named, affine) 69.0/80.3/88.1/93.2/96.2/97.9% at n=7..12, balanced 67.9/79.8/87.6/92.9/96.0/97.8%, rising; 0 of 20 random tables change at n=7/8; plain-rewrite audit 2026-10-28, every program executed"

[ablations.plain_tree_merge]
saving = 54.4
arity = 12
verdict = "kept: canonical, exempt; the equal-halves merge's saving within the plain build on leading-ignored tables (48.9% at n=8; ~9% on trailing-ignored, where the shared tree absorbs the repeats)"

[ablations.plain_tree_fold]
saving = 2.3
arity = 12
verdict = "kept: canonical, exempt; the constant-span fold's saving within the plain build on half-constant tables (flat at n=8..12; up to 7.7% on trailing-ignored tables)"

[ablations.bare_read_header]
