arity = 12
verdict = "removed 2026-10-20 (retirement candidate #9): a fixed saving per ignored input -- 2.9% at n=8 and 0.9% at n=10 for one ignored input, 4.5% at n=8 for two -- whose share tends to zero; fails the genuine-percentage stipulation at the judged arities"

