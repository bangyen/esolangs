# Remaining generator gaps are unreachable under the invariants below.
# Reachable guards have owned witnesses; no coverage exclusions were added.

# itertools.count() never exhausts; consumers close the name generator.
"container/generator.py" = [
    "arm: for index in count(): -> <exit>",
]

# _shared assigns only _Fold or _Split to nodes; render matches both variants.
# The alphabet-limit guard is tested with isolated high-position metadata.
"false/generator.py" = [
    "arm: case _Split(zero, one): -> <exit>",
]

# itertools.count() never exhausts; consumers close the name generator.
"forbin/generator.py" = [
    "arm: for candidate in count(): -> <exit>",
]

# count(1) never exhausts. Owned tests exhaust shorter products and skip main.
"object_disoriented/generator.py" = [
    "arm: for size in count(1): -> <exit>",
]

# repeated_bank caps len(blocks) at n-depth; this caller requires len > 1.
# On 64-bit Python a string truth table has n <= 62 (len <= sys.maxsize),
# so 2 <= len(blocks) <= 62. _sstack_shared returns None only outside 1..63.
"sstack/generator/__init__.py" = [
    "arm: if result is not None: -> for blocks in dict.fromkeys(banks):",
]

# Euler's sieve visits primes through least[value], then breaks there or at
# prime*value > bound. The list contains least[value], so it never exhausts.
"refractran/generator.py" = [
    "arm: for prime in primes: -> for value in range(2, bound + 1):",
]

# bounds yields at least one strip; its final iteration always breaks.
"streetcode/generator.py" = [
    "arm: for i, segment in enumerate(segments): -> return canvas, origin",
]
